  // ---------------- build / fence-upgrade panel ----------------
  /**
   * Construction panel for a staged farm (see js/construction.js): where the
   * player is in the build sequence, what the next purchase is, what it
   * costs and what it unlocks — plus the live fence tier and animal count
   * once the fence exists. The action button reuses the Figma upgrade-button
   * component states (default / disabled / max-level / pressed).
   */
  function drawBuild(ctx, px, py, pw, ph) {
    const id = popup.farmId;
    const scene = Game.farm && Game.farm.farmId === id ? Game.farm : null;
    const inf = Construction.info(id, scene ? scene.animals.length : 0);
    const cx = px + pw / 2;
    popupTitle(ctx, 'BUILD ' + CONFIG.FARMS[id].name, px, py, pw, { size: 10, top: py - 2 });

    // parchment card
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 26, pw - 36, 154);
    ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 28, pw - 40, 150);
    ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 28, pw - 40, 3);

    // where we are in the sequence, and what comes next
    drawText(ctx, 'STEP ' + inf.step + ' OF ' + inf.steps, cx, py + 38, 5.5, '#7d5027', 'center');
    drawText(ctx, inf.title, cx, py + 50, 10, '#5c3a1d', 'center', false, false, pw - 52);
    PixelFont.drawWrapped(ctx, inf.unlocks, cx, py + 68, 5.5, '#7d5027', 'center', pw - 56, 2);

    // live fence status (only meaningful once the fence stands)
    ctx.fillStyle = 'rgba(124,80,39,0.25)';
    ctx.fillRect(px + 30, py + 92, pw - 60, 1);
    let ry = py + 100;
    if (inf.fenceBuilt) {
      statRow(ctx, px, pw, ry, 'FENCE TIER', inf.level + ' / ' + inf.maxLevel);
      ry += 14;
      statRow(ctx, px, pw, ry, 'ANIMALS', inf.animals + ' / ' + inf.capacity);
      ry += 14;
      if (inf.nextCapacity) {
        statRow(ctx, px, pw, ry, 'NEXT CAPACITY', inf.capacity + ' > ' + inf.nextCapacity, '#3f7d1e');
        ry += 14;
      }
    } else {
      statRow(ctx, px, pw, ry, 'FENCE', 'NOT BUILT');
      ry += 14;
      statRow(ctx, px, pw, ry, 'ANIMALS', inf.capacity > 0 ? 'ESCAPING!' : 'NONE YET', '#b0442f');
      ry += 14;
    }

    // price
    const afford = !inf.maxed && SaveManager.data.coins >= inf.cost;
    if (!inf.maxed) {
      const txt = U.fmt(inf.cost);
      const tw = measure(txt, 13);
      ctx.drawImage(SPRITES.coin(2), cx - tw / 2 - 20, py + 150, 16, 16);
      drawText(ctx, txt, cx - tw / 2, py + 152, 13, afford ? '#58972a' : '#b0442f', 'left');
    } else {
      drawText(ctx, 'NOTHING LEFT TO BUILD', cx, py + 154, 6.5, '#58972a', 'center', false, false, pw - 52);
    }

    // action button (Figma upgrade-button component geometry: 96x28)
    popup.fx = Math.max(0, (popup.fx || 0) - Game.dt * 2);
    popup.okRect = { x: cx - 48, y: py + 200, w: 96, h: 28 };
    const state = inf.maxed ? 'max-level'
                : popup.fx > 0.85 ? 'pressed'
                : afford ? 'default' : 'disabled';
    drawStateButton(ctx, { ...popup.okRect, state, label: inf.stage === 'upgrade' ? 'UPGRADE' : 'BUILD' });
    drawPanelFx(ctx);
  }

  /** One label/value row inside the build panel's parchment card. */
  function statRow(ctx, px, pw, y, label, value, col = '#7d5027') {
    drawText(ctx, label, px + 34, y, 6.5, '#8a6a3c', 'left');
    drawText(ctx, value, px + pw - 34, y, 6.5, col, 'right');
  }

  // ---------------- popups ----------------
  function drawPopup(ctx) {
    if (!popup) return;

    // simulated reward ad: full-screen placeholder, auto-completes
    if (popup.type === 'adPlaying') {
      popup.t += Game.dt;
      ctx.fillStyle = 'rgba(8,8,12,0.94)';
      ctx.fillRect(0, 0, W, H);
      // values from Figma E11 (25:56..25:67), Figma px / 2
      drawText(ctx, 'REWARD AD', W / 2, 237.5, SIZE.TITLE, '#fff6e8', 'center');
      drawText(ctx, 'SIMULATED AD PLACEHOLDER', W / 2, 268.25, 4.5, '#8c8678', 'center');
      // silly ad: pigeon on a bombing run across the screen
      const t = Math.min(popup.t / popup.dur, 1);
      const bx = U.lerp(40, W - 40, t);
      const by = H / 2 + 4 + Math.sin(popup.t * 6) * 6;
      const frame = Math.floor(popup.t * 10) % 2 ? 'flapUp' : 'flapDn';
      PIXEL.blit(ctx, SPRITES.poop(0), bx - 14, by + 26 + Math.sin(popup.t * 3) * 8, 2);
      PIXEL.blit(ctx, SPRITES.pigeon(frame, false), bx, by, 3);
      // progress bar
      inset(ctx, W / 2 - 80, H / 2 + 60, 160, 14);
      ctx.fillStyle = '#7dbb4a';
      ctx.fillRect(W / 2 - 78, H / 2 + 62, Math.max(0, Math.round(156 * t)), 10);
      drawText(ctx, 'REWARD IN ' + Math.ceil(popup.dur - popup.t) + 'S', W / 2, 408.25, 4.5, '#c8b088', 'center');
      if (popup.t >= popup.dur) { const done = popup.onDone; popup = null; done(); }
      return;
    }

    ctx.fillStyle = popup.type === 'discovery' ? 'rgba(16,10,6,0.75)' : 'rgba(16,10,6,0.55)';
    ctx.fillRect(0, 0, W, H);

    const pw = popup.type === 'upgrades' ? 324 : popup.type === 'discovery' ? 280
             : popup.type === 'build' ? 260 : 240;
    const ph = popup.type === 'upgrades' ? 528
             : popup.type === 'discovery' ? 344
             : popup.type === 'unlock' ? 210
             : popup.type === 'build' ? 258
             : popup.type === 'pigeonAd' ? 254
             : popup.type === 'tornadoAd' ? 270.5
             : popup.type === 'welcomeBack' ? welcomeMetrics(popup.rep).ph : 190;
    // upgrades panel sits lower so the HUD coin counter stays visible;
    // the tornado panel sits higher than the centering formula (Figma 25:4)
    const px = (W - pw) / 2;
    const py = popup.type === 'tornadoAd' ? 152
             : (H - ph) / 2 - (popup.type === 'upgrades' ? 0 : 20);
    popup.rect = { x: px, y: py, w: pw, h: ph };
    // Figma: only the confirm-reset panel (21:4) shows plank seams
    woodPanel(ctx, px, py, pw, ph, { gold: true, flecks: false, seams: popup.type === 'confirm-reset' });

    // close X (discovery must be dismissed with CONTINUE); drawn after the
    // branch so the title bar never paints over it
    popup.closeRect = popup.type === 'discovery' ? null
      : { x: px + pw - 16, y: py - 16, w: 28, h: 26 };

    if (popup.type === 'unlock') {
      const f = CONFIG.FARMS[popup.farmId];
      // construction farms buy bare land here and build the rest in-scene
      const build = Construction.required(popup.farmId);
      const unlockCost = Construction.landCost(popup.farmId);
      // values from Figma E12 (26:2..26:47), Figma px / 2
      popupTitle(ctx, (build ? 'BUY LAND: ' : 'UNLOCK ') + f.name, px, py, pw, { size: 10, top: py - 2 });
      // inner parchment card
      ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 28, pw - 36, 104);
      ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 30, pw - 40, 100);
      ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 30, pw - 40, 3);
      // animal preview (26:35: bottom-center at 116.75, py+110.5)
      const img = SPRITES.animal(f.species, 1, 'idle', false);
      PIXEL.blit(ctx, img, px + 56.75, py + 110.5, 3.0);
      drawText(ctx, f.label.replace(/S$/, '') + ' FARM', px + 120, py + 52.25, 8.5, '#5c3a1d', 'left', false, false, 96);
      drawText(ctx, build ? 'LAND COST:' : 'UNLOCK COST:', px + 138.5, py + 72.75, 4.5, '#7d5027', 'left');
      const cost = U.fmt(unlockCost);
      ctx.drawImage(SPRITES.coin(2), px + 121.5, py + 88.5, 16, 16);
      drawText(ctx, cost, px + 141.5, py + 92.25, 8.5, '#000000', 'left');
      if (build) {
        drawText(ctx, 'EMPTY PLOT - BUILD IT YOURSELF!', px + pw / 2, py + 138, 5.5, '#ffe98a', 'center', false, false, pw - 32);
      }
      // unlock button
      const can = SaveManager.data.coins >= unlockCost;
      popup.okRect = { x: px + 40, y: py + ph - 60, w: pw - 80, h: 40 };
      drawButton(ctx, { ...popup.okRect, color: 'green', label: build ? 'BUY LAND' : 'UNLOCK', disabled: !can,
        layout: { labelY: 19, labelPx: 10, center: true } });
    } else if (popup.type === 'build') {
      drawBuild(ctx, px, py, pw, ph);
    } else if (popup.type === 'upgrades') {
      const f = CONFIG.FARMS[popup.farmId];
      popupTitle(ctx, 'UPGRADES!', px, py, pw, { tall: true });
      popup.cards = [];
      // section labels + card rows from Figma 19:70/19:86/19:71/19:106..30:84
      drawText(ctx, 'FARM', px + 10, py + 21.75, SIZE.CAPTION, '#e0cfa8');
      upgradeCard(ctx, popup, px + 12, py + 32, pw - 24, 76, Upgrades.info(popup.farmId, 'spawn'));
      drawText(ctx, f.label, px + 10, py + 119.75, SIZE.CAPTION, '#e0cfa8');
      for (let s = 0; s < CONFIG.UPGRADES.STAGES.length; s++) {
        upgradeCard(ctx, popup, px + 12, py + 130 + s * 98, pw - 24, 88, Upgrades.info(popup.farmId, s));
      }
      drawPanelFx(ctx);
    } else if (popup.type === 'discovery') {
      drawDiscovery(ctx, px, py, pw, ph);
    } else if (popup.type === 'pigeonAd') {
      const inf = Pigeon.info();
      // values from Figma E09 (24:2..24:51), Figma px / 2
      popupTitle(ctx, 'POOP RAIN!', px, py, pw, { size: 10, top: py - 2 });
      // parchment card
      ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 26, pw - 36, 132);
      ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 28, pw - 40, 128);
      ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 28, pw - 40, 3);
      // the messenger, gently bobbing, with a COO! beside its head
      popup.fxT = (popup.fxT || 0) + Game.dt;
      const bob = Math.sin(popup.fxT * 3) * 2;
      PIXEL.blit(ctx, SPRITES.pigeon('idle', false), px + 58, py + 92 + bob, 3);
      drawText(ctx, 'COO!', px + 87.5, py + 36.75, 4.5, '#7d5027', 'left');
      // reward explanation (24:37 / 30:38)
      drawText(ctx, 'WATCH AN AD', px + 97, py + 72.5, 10, '#5c3a1d', 'left', false, false, 110);
      drawText(ctx, 'POOP MEANS MONEY', px + 97, py + 88.5, 7, '#7d5027', 'left', false, false, 115);
      // scattered poop cluster (30:33..30:36, 24:40 — bottom-center anchors)
      for (const [bx2, by2] of [[73.5, 116.5], [39.25, 109], [56.5, 125], [67, 146], [39.5, 140]]) {
        PIXEL.blit(ctx, SPRITES.poop(0), px + bx2, py + by2, 1.25);
      }
      // payout: coin + big value (30:39 / 24:43)
      ctx.drawImage(SPRITES.coin(2), px + 115, py + 111, 22.5, 22.5);
      drawText(ctx, '+' + U.fmt(inf.value), px + 140.5, py + 116.5, 15, '#000000', 'left', false, false, 56);
      // watch button + note below it
      popup.okRect = { x: px + 40, y: py + 175, w: pw - 80, h: 40 };
      drawButton(ctx, { ...popup.okRect, color: 'green', icon: () => SPRITES.adPlay(), label: 'REWARD AD',
        layout: { iconX: 11, iconY: 9, iconW: 32, iconH: 24, labelX: 52.5, labelY: 17, labelPx: 10 } });
      drawText(ctx, 'COINS COLLECT AUTOMATICALLY!', px + pw / 2, py + 223.75, 4.5, '#ffffff', 'center', false, false, pw - 44);
    } else if (popup.type === 'tornadoAd') {
      // values from Figma E10 (25:2..25:48), Figma px / 2
      popupTitle(ctx, 'TORNADO ALERT!', px, py, pw, { size: 10, top: py - 2 });
      // parchment card
      ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 26, pw - 36, 132);
      ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 28, pw - 40, 128);
      ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 28, pw - 40, 3);
      // the storm itself, spinning and swaying (25:35: 72x84, bottom-center 116, py+127)
      popup.fxT = (popup.fxT || 0) + Game.dt;
      const frame = Math.floor(popup.fxT * 10) % 3;
      const sway = Math.sin(popup.fxT * 4) * 2;
      const timg = SPRITES.tornado(frame);
      PIXEL.blit(ctx, timg, px + 56 + sway, py + 127, 72 / timg.width);
      // reward explanation
      drawText(ctx, 'WATCH AN AD', px + 112.5, py + 60.75, 8.5, '#5c3a1d', 'left', false, false, 100);
      drawText(ctx, 'TO UNLEASH A', px + 132, py + 80.25, 4.5, '#7d5027', 'left');
      drawText(ctx, 'MERGE STORM!', px + 96.5, py + 106.5, 10, '#b8860b', 'left', false, false, 120);
      // mutants feed the UFO only where it has been unlocked
      const ufoReady = SaveManager.data.ufo[SaveManager.data.currentFarm].landed;
      drawText(ctx, ufoReady ? 'MUTANTS BECOME MUTANT 2!' : 'MERGES ALL THE WAY TO MUTANTS!',
        px + pw / 2, py + 144.25, 4.5, '#7d5027', 'center', false, false, pw - 44);
      // single watch button (dismiss via the close X)
      popup.okRect = { x: px + 40, y: py + 192, w: pw - 80, h: 40 };
      popup.cancelRect = null;
      drawButton(ctx, { ...popup.okRect, color: 'green', icon: () => SPRITES.adPlay(), label: 'REWARD AD',
        layout: { iconX: 13, iconY: 10, iconW: 32, iconH: 24, labelX: 53, labelY: 17, labelPx: 10 } });
    } else if (popup.type === 'welcomeBack') {
      drawWelcome(ctx, px, py, pw);
    } else if (popup.type === 'settings') {
      popupTitle(ctx, 'SETTINGS', px, py, pw);
      popup.musicRect = { x: px + 30, y: py + 34, w: pw - 60, h: 34 };
      popup.sfxRect = { x: px + 30, y: py + 78, w: pw - 60, h: 34 };
      popup.resetRect = { x: px + 30, y: py + 128, w: pw - 60, h: 34 };
      const lay = { labelY: 14, labelPx: 10, center: true };
      drawButton(ctx, { ...popup.musicRect, color: 'wood', label: 'MUSIC: ' + (AudioManager.musicOn ? 'ON' : 'OFF'), layout: lay });
      drawButton(ctx, { ...popup.sfxRect, color: 'wood', label: 'SOUND: ' + (AudioManager.sfxOn ? 'ON' : 'OFF'), layout: lay });
      drawButton(ctx, { ...popup.resetRect, color: 'red', label: 'RESET SAVE', layout: lay });
    } else if (popup.type === 'confirm-reset') {
      popupTitle(ctx, 'RESET GAME?', px, py, pw);
      drawText(ctx, 'ALL PROGRESS WILL BE LOST!', px + pw / 2, py + 42.5, 7.5, '#f4e8cc', 'center', false, false, pw - 40);
      popup.okRect = { x: px + 30, y: py + 84, w: pw - 60, h: 36 };
      popup.cancelRect = { x: px + 30, y: py + 130, w: pw - 60, h: 36 };
      drawButton(ctx, { ...popup.okRect, color: 'red', label: 'YES, RESET', layout: { labelY: 17, labelPx: 10, center: true } });
      drawButton(ctx, { ...popup.cancelRect, color: 'gray', label: 'CANCEL', layout: { labelY: 15, labelPx: 10, center: true } });
    }

    if (popup.closeRect) {
      drawButton(ctx, { ...popup.closeRect, color: 'red', icon: () => SPRITES.xIcon(), pressed: false,
        layout: { iconX: 6, iconY: 5, iconW: 20, iconH: 20 } });
    }
  }

  function inRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  // ---------------- first-upgrade tutorial overlay ----------------
  /** Pixel-style pointing hand, fingertip at (x, y). */
  function drawHand(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#2b2116';
    ctx.fillRect(-3, -2, 8, 14);   // finger outline
    ctx.fillRect(-7, 8, 16, 10);   // palm outline
    ctx.fillStyle = '#fff4e0';
    ctx.fillRect(-2, -1, 6, 12);   // finger
    ctx.fillRect(-6, 9, 14, 8);    // palm
    ctx.restore();
  }

  /**
   * Spotlight for the first-upgrade tutorial: pulsing glow + hand + label on
   * the UPGRADE button, then on the cheapest affordable BUY button inside
   * the upgrade panel. Drawn above HUD and popup.
   */
  function drawUpgradeTutorial(ctx, t) {
    let target = null, label = null;
    if (!popup) {
      target = buttons.find(b => b.id === 'upgrade');
      label = 'UPGRADE YOUR FARM!';
    } else if (popup.type === 'upgrades') {
      let best = Infinity;
      for (const c of popup.cards || []) {
        const inf = Upgrades.info(popup.farmId, c.key);
        if (!inf.maxed && SaveManager.data.coins >= inf.cost && inf.cost < best) {
          best = inf.cost;
          target = c.btn;
        }
      }
      label = 'TAP BUY!';
    }
    if (!target) return;

    // pulsing golden glow around the target
    const pulse = (Math.sin(t * 6) + 1) / 2;
    const g = 4 + pulse * 4;
    ctx.save();
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    ctx.strokeStyle = '#ffe98a';
    ctx.lineWidth = 3;
    ctx.strokeRect(target.x - g, target.y - g, target.w + g * 2, target.h + g * 2);
    ctx.globalAlpha = 0.25 + pulse * 0.2;
    ctx.fillStyle = '#ffe98a';
    ctx.fillRect(target.x - 2, target.y - 2, target.w + 4, target.h + 4);
    ctx.restore();

    // bobbing hand pointing at the target
    drawHand(ctx, target.x + target.w / 2 + 10, target.y + target.h / 2 + 8 + Math.sin(t * 4) * 4);

    // instruction label (kept fully on screen)
    const lw = measure(label, SIZE.BUTTON);
    const lx = U.clamp(target.x + target.w / 2, lw / 2 + 6, W - lw / 2 - 6);
    drawText(ctx, label, lx, target.y - g - 22, SIZE.BUTTON, '#ffe98a', 'center', true, false, W - 12);
  }

  /** Returns true if the tap was consumed by UI. */
  function tap(x, y) {
    if (popup) {
      if (popup.type === 'welcomeBack') {
        // every way out pays at least the base amount (claim is idempotent)
        if (inRect(x, y, popup.closeRect) || inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          Game.claimWelcome(1);
        } else if (inRect(x, y, popup.adRect)) {
          // ad popup replaces this one, blocking further taps until it ends
          AudioManager.play('click');
          popup = { type: 'adPlaying', t: 0, dur: CONFIG.IDLE.WELCOME_AD_DURATION, onDone: Game.onWelcomeAdDone };
        }
        return true;
      }
      if (inRect(x, y, popup.closeRect)) {
        if (Game.upgradeTutorialActive) return true; // tutorial: must buy before closing
        AudioManager.play('click'); popup = null; panelFx = []; return true;
      }
      if (popup.type === 'upgrades') {
        for (const c of popup.cards || []) {
          if (inRect(x, y, c.btn)) {
            const r = Upgrades.buy(popup.farmId, c.key);
            if (r.ok) {
              AudioManager.play('buy');
              popup.fx[c.key] = 1;
              spawnPanelFx(c.btn.x + c.btn.w / 2, c.btn.y + c.btn.h / 2);
              Game.onUpgradePurchased();
            } else {
              AudioManager.play('error');
              toast = { text: r.reason, t: 1.6 };
            }
            return true;
          }
        }
        return true;
      }
      if (popup.type === 'discovery') {
        if (inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          popup = null;
          Game.endCelebration();
        }
        return true; // no other way out — gameplay stays paused until CONTINUE
      }
      if (popup.type === 'adPlaying') return true; // no skipping the ad
      if (popup.type === 'pigeonAd') {
        if (inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          popup = { type: 'adPlaying', t: 0, dur: Pigeon.info().adDur, onDone: Pigeon.adCompleted };
        }
        return true;
      }
      if (popup.type === 'tornadoAd') {
        if (inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          popup = { type: 'adPlaying', t: 0, dur: Tornado.info().adDur, onDone: Tornado.adCompleted };
        } else if (inRect(x, y, popup.cancelRect)) {
          AudioManager.play('click');
          popup = null;
        }
        return true;
      }
      if (popup.type === 'build') {
        if (inRect(x, y, popup.okRect)) {
          const r = Construction.buyNext(popup.farmId);
          if (r.ok) {
            AudioManager.play('buy');
            popup.fx = 1;
            spawnPanelFx(popup.okRect.x + popup.okRect.w / 2, popup.okRect.y + popup.okRect.h / 2);
            Game.onConstructionBuilt(popup.farmId);
          } else {
            AudioManager.play('error');
            toast = { text: r.reason, t: 1.6 };
          }
        }
        return true;
      }
      if (popup.type === 'unlock' && inRect(x, y, popup.okRect)) {
        Game.tryUnlock(popup.farmId);
        return true;
      }
      if (popup.type === 'settings') {
        if (inRect(x, y, popup.musicRect)) { AudioManager.setMusic(!AudioManager.musicOn); SaveManager.data.settings.music = AudioManager.musicOn; SaveManager.save(); AudioManager.play('click'); return true; }
        if (inRect(x, y, popup.sfxRect)) { AudioManager.setSfx(!AudioManager.sfxOn); SaveManager.data.settings.sfx = AudioManager.sfxOn; SaveManager.save(); AudioManager.play('click'); return true; }
        if (inRect(x, y, popup.resetRect)) { AudioManager.play('click'); popup = { type: 'confirm-reset' }; return true; }
      }
      if (popup.type === 'confirm-reset') {
        if (inRect(x, y, popup.okRect)) { AudioManager.play('click'); popup = null; Game.resetAll(); return true; }
        if (inRect(x, y, popup.cancelRect)) { AudioManager.play('click'); popup = null; return true; }
      }
      return true; // modal swallows all taps
    }
    for (const b of buttons) {
      if (b.scene !== 'both' && b.scene !== Game.scene) continue;
      if (Game.upgradeTutorialActive && b.id !== 'upgrade') continue; // tutorial: only UPGRADE works
      if (inRect(x, y, b)) {
        AudioManager.play('click');
        Game.onButton(b.id);
        return true;
      }
    }
    return false;
  }

  // ---------------- loading screen ----------------
  function drawLoading(ctx, t) {
    // values from Figma E01 (14:27), all Figma px / 2
    ctx.fillStyle = '#2e2416';
    ctx.fillRect(0, 0, W, H);
    // decorative fence strip
    const f = SPRITES.fenceH(24);
    for (let x = 0; x < W; x += 44) ctx.drawImage(f, x, 380, 44, 26);
    drawText(ctx, 'FARM EVOLUTION', W / 2, 255.5, SIZE.TITLE, '#ffe98a', 'center', false, false, W - 24);
    const img = SPRITES.animal('chicken', 1, (t * 3 | 0) % 2 ? 'walk' : 'idle');
    PIXEL.blit(ctx, img, W / 2, 350, 3);
    const dots = '.'.repeat(1 + ((t * 2) | 0) % 3);
    drawText(ctx, 'TAP TO START', W / 2, 590.5, 12, '#f4e8cc', 'center');
    drawText(ctx, 'LOADING' + dots, W / 2, 420.75, 7.5, '#c8b088', 'center');
  }

  return {
    SIZE, drawText, measure, woodPanel, woodSign, drawButton, drawHUD, drawPopup, drawLoading,
    drawHand, drawUpgradeTutorial, drawBadge, safeArea,
    tap, coinTarget,
    pulseCoin() { coinPulse = 1; },
    showToast(text) { toast = { text, t: 1.6 }; },
    openPopup(p) { popup = p; },
    closePopup() { popup = null; panelFx = []; },
    get popup() { return popup; },
    syncCoins() { displayedCoins = SaveManager.data.coins; },
  };
})();
</script>
<script>
/**
 * GameManager — owns the canvas, main loop, scene switching
 * (loading / farm / map), global economy, unlock flow and autosave.
 */
const Game = (() => {
  const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
  let canvas, ctx, scale = 1, offX = 0, offY = 0;
  let scene = 'loading';         // 'loading' | 'farm' | 'map'
  let farmScene = null;
  let mapScene = null;
  let lastT = 0, dt = 0, elapsed = 0, autosaveT = 0, idleT = 0;
  let started = false;
  let celebration = null;        // active discovery celebration, see startCelebration()
  let upgradeTutorial = null;    // active first-upgrade tutorial: {t}, see maybeStartUpgradeTutorial()

  // ---------------- setup ----------------
  function init() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    SaveManager.load();
    // apply capped offline production to every farm before scenes build,
    // recording time away + earnings for the welcome-back popup
    Idle.launchTick();
    AudioManager.setMusic(SaveManager.data.settings.music);
    AudioManager.setSfx(SaveManager.data.settings.sfx);
    resize();
    window.addEventListener('resize', resize);
    bindInput();
    mapScene = new MapScene();
    farmScene = new FarmScene(SaveManager.data.currentFarm);
    UI.syncCoins();
    scheduleFrame(loop);
  }

  /**
   * rAF normally, with a timer watchdog so the idle sim keeps running when
   * the tab is hidden (rAF stops firing there, even for pending frames).
   * Whichever fires first runs the frame; the loser is a no-op.
   */
  function scheduleFrame(fn) {
    let done = false;
    const run = t => { if (done) return; done = true; fn(t); };
    requestAnimationFrame(run);
    setTimeout(() => run(performance.now()), 50);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const sw = window.innerWidth, sh = window.innerHeight;
    scale = Math.min(sw / W, sh / H);
    canvas.style.width = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const rect = { w: Math.round(W * scale), h: Math.round(H * scale) };
    offX = (sw - rect.w) / 2; offY = (sh - rect.h) / 2;
  }

  // ---------------- input ----------------
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? (e.touches[0] || e.changedTouches[0]).clientX : e.clientX) - r.left;
    const cy = (e.touches ? (e.touches[0] || e.changedTouches[0]).clientY : e.clientY) - r.top;
    return { x: cx / scale, y: cy / scale };
  }

  function bindInput() {
    const down = e => {
      e.preventDefault();
      AudioManager.ensure();
      const p = toGame(e);
      if (scene === 'loading') { start(); return; }
      if (UFO.cinematicActive) return;                   // abduction cinematic blocks all input
      if (Tornado.active) return;                        // tornado sweep blocks all input
      if (celebration && !celebration.popupOpen) return; // sequence plays untouched
      if (UI.tap(p.x, p.y)) return;
      if (celebration) return;                           // popup swallows farm taps
      if (upgradeTutorial) return;                       // tutorial: only the upgrade flow is tappable
      if (scene === 'farm' && Tornado.tap(p.x, p.y)) return;
      if (scene === 'farm' && Pigeon.tap(p.x, p.y)) return;
      if (scene === 'farm') farmScene.pointerDown(p.x, p.y);
      else if (scene === 'map' && !mapScene.unlockAnim) {
        const id = mapScene.tappedFarm(p.x, p.y);
        if (id >= 0) onMapFarmTap(id);
      }
    };
    const move = e => {
      e.preventDefault();
      if (UFO.cinematicActive || Tornado.active) return;
      const p = toGame(e);
      if (scene === 'farm') farmScene.pointerMove(p.x, p.y);
    };
    const up = e => {
      e.preventDefault();
      if (UFO.cinematicActive || Tornado.active) return;
      if (scene === 'farm') farmScene.pointerUp();
    };
    canvas.addEventListener('mousedown', down);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    canvas.addEventListener('touchstart', down, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', up, { passive: false });
  }

  function start() {
    if (started) return;
    started = true;
    // the map is the default entry point after a launch, whatever farm the
    // player was in when they left
    scene = 'map';
    AudioManager.play('click');
    const rep = Idle.takeLaunchReport();
    if (rep && rep.awaySec >= CONFIG.IDLE.WELCOME_MIN_AWAY && Math.floor(rep.total) >= 1) {
      // once per launch, only after a real absence with something to show;
      // openT lets the map render a beat before the popup layers over it
      welcome = { rep, claimed: false, openT: 0.5 };
    } else {
      mapScene.queuePendingCollect();
    }
  }

  // ---------------- welcome-back offline earnings ----------------
  let welcome = null;   // {rep, claimed, openT} while the welcome-back popup is pending/up

  /**
   * Grant the welcome-back earnings exactly once. mult=2 after a completed
   * reward ad doubles the offline part; every dismissal path (COLLECT, the
   * X, an ad that fails or is skipped) grants mult=1 so the player can
   * never lose the base amount. The claimed flag makes any second call
   * (double-tap, stray ad callback) a no-op.
   */
  function claimWelcome(mult = 1) {
    if (!welcome || welcome.claimed) return;
    welcome.claimed = true;
    const rep = welcome.rep;
    UI.closePopup();
    // coins fly to the wallet from each farm's map node, staggered like the
    // regular map collection, the counter ticking up as each lands
    let delay = 0.25, granted = 0;
    for (const f of CONFIG.FARMS) {
      const amt = Idle.collect(f.id)
                + Math.floor(rep.perFarm[f.id]) * (mult - 1); // ad bonus: the offline part again
      if (amt <= 0) continue;
      granted += amt;
      mapScene.queueBurst(f.id, amt, delay);
      delay += CONFIG.IDLE.MAP_STAGGER;
    }
    if (granted > 0 && mult > 1) {
      VFXManager.burst(W / 2, H / 2 - 60, ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'], 26, 130);
      VFXManager.sparkle(W / 2, H / 2 - 70, 14, 40);
      AudioManager.play('unlock');
    }
    SaveManager.save();
    welcome = null;
  }

  /** Rewarded ad completed successfully: double the offline earnings. */
  function onWelcomeAdDone() { claimWelcome(2); }

  /**
   * Rewarded ad failed, was unavailable, or was skipped: collection never
   * blocks on the ad — the base amount is granted with a short non-blocking
   * note. A real ad SDK should call this from its failure/skip callbacks
   * (the built-in simulated ad always completes).
   */
  function onWelcomeAdFailed() {
    UI.showToast('AD NOT AVAILABLE - COINS COLLECTED!');
    claimWelcome(1);
  }

  /** Deliver a farm's accumulated background earnings as flying coins. */
  function collectFarmPending(farmId) {
    const amt = Idle.collect(farmId);
    if (amt <= 0) return;
    const b = farmScene.bounds;
    VFXManager.coinPayout(b.x + b.w / 2, b.y + b.h / 2, amt, 40, 25);
  }

  // ---------------- discovery celebration ----------------
  /**
   * Interrupt gameplay for a first-time evolution: zoom toward the merge
   * point, flash, golden sparkles, then open the discovery popup.
   * Gameplay resumes when the player presses CONTINUE (endCelebration).
   */
  function startCelebration(animal, x, y) {
    celebration = {
      t: 0, x, y,
      species: animal.species,
      stage: animal.stage,
      animal,
      sparkleT: 0,
      popupOpen: false,
    };
    AudioManager.play('unlock');
  }

  function updateCelebration() {
    const c = celebration, D = CONFIG.DISCOVERY;
    c.t += dt;
    // let the new animal finish its spawn pop, then hold it still
    if (c.animal.state === 'spawning') c.animal.update(dt, farmScene.bounds, farmScene);
    // golden sparkles raining around the merge point
    c.sparkleT -= dt;
    if (c.sparkleT <= 0 && !c.popupOpen) {
      c.sparkleT = D.SPARKLE_RATE;
      VFXManager.sparkle(c.x, c.y - 16, 5, 26);
      if (Math.random() < 0.5) {
        VFXManager.burst(c.x, c.y - 14, ['#ffe98a', '#f4c437', '#fff6d0'], 4, 70);
      }
    }
    if (!c.popupOpen && c.t >= D.PRE_POPUP_TIME) {
      c.popupOpen = true;
      UI.openPopup({ type: 'discovery', species: c.species, stage: c.stage, fxT: 0, confetti: [] });
    }
  }

  /** Camera zoom factor toward the merge point during the celebration. */
  function celebrationZoom() {
    const c = celebration, D = CONFIG.DISCOVERY;
    const t = Math.min(c.t / D.ZOOM_TIME, 1);
    return 1 + D.ZOOM_AMOUNT * (1 - Math.pow(1 - t, 3)); // ease-out cubic
  }

  /** White flash alpha, peaking right after the zoom lands. */
  function celebrationFlash() {
    const c = celebration, D = CONFIG.DISCOVERY;
    const ft = c.t - D.ZOOM_TIME * 0.55;
    if (ft < 0 || ft > D.FLASH_TIME) return 0;
    return Math.sin((ft / D.FLASH_TIME) * Math.PI) * 0.85;
  }

  function endCelebration() {
    celebration = null;
    farmScene.persist();
  }

  // ---------------- first-upgrade tutorial ----------------
  /** Cheapest non-maxed upgrade cost on the current farm. */
  function cheapestUpgradeCost() {
    const id = SaveManager.data.currentFarm;
    const keys = ['spawn'];
    for (let s = 0; s < CONFIG.UPGRADES.STAGES.length; s++) keys.push(s);
    let min = Infinity;
    for (const k of keys) {
      if (!Upgrades.isMaxed(id, k)) min = Math.min(min, Upgrades.cost(id, k));
    }
    return min;
  }

  /**
   * First time the player can afford an upgrade: freeze gameplay, spotlight
   * the UPGRADE button, then the BUY button, until the purchase completes.
   */
  function maybeStartUpgradeTutorial() {
    if (upgradeTutorial || SaveManager.data.upgradeTutorialDone) return;
    if (farmScene.tutorial || UI.popup) return;
    // a farm still under construction points at its build CTA, not upgrades
    if (!Construction.fenceBuilt(farmScene.farmId)) return;
    if (SaveManager.data.coins < cheapestUpgradeCost()) return;
    farmScene.pointerUp(); // settle any in-progress drag
    upgradeTutorial = { t: 0 };
    AudioManager.play('pop');
  }

  /** Any successful upgrade purchase completes the tutorial for good. */
  function onUpgradePurchased() {
    if (!SaveManager.data.upgradeTutorialDone) {
      SaveManager.data.upgradeTutorialDone = true;
      SaveManager.save();
    }
    upgradeTutorial = null;
  }

  // ---------------- economy ----------------
  function addCoins(n) {
    SaveManager.data.coins += n;
    UI.pulseCoin();
  }

  // ---------------- buttons ----------------
  /** Open the build/upgrade panel of a construction farm. */
  function openBuild(farmId) {
    UI.openPopup({ type: 'build', farmId, fx: 0 });
  }

  /**
   * A construction step was purchased: the scene re-bakes for the new stage
   * (house, fence footprint + art) and the map redraws its plot.
   */
  function onConstructionBuilt(farmId) {
    if (farmScene && farmScene.farmId === farmId) farmScene.refresh();
    SaveManager.save();
  }

  function onButton(id) {
    if (id === 'settings') {
      UI.openPopup({ type: 'settings' });
    } else if (id === 'upgrade') {
      UI.openPopup({ type: 'upgrades', farmId: SaveManager.data.currentFarm, fx: {} });
    } else if (id === 'map') {
      goToMap();
    }
  }

  function onMapFarmTap(id) {
    if (welcome) return; // welcome-back popup pending/up: claim it first
    AudioManager.play('click');
    if (SaveManager.data.unlocked[id]) {
      // switch farm: load that farm's own animals, upgrades and UFO state
      Idle.tick(); // reconcile so the board matches what accumulated offscreen
      Pigeon.reset(); // pays out any rain still falling, keeps saved perch state
      Tornado.reset();
      SaveManager.data.currentFarm = id;
      SaveManager.save();
      UFO.reset();
      farmScene = new FarmScene(id);
      scene = 'farm';
      collectFarmPending(id);
    } else {
      UI.openPopup({ type: 'unlock', farmId: id });
    }
  }

  // ---------------- unlock flow ----------------
  function tryUnlock(farmId) {
    // construction farms buy the bare land here; everything else is built
    // in-scene (see js/construction.js)
    const cost = Construction.landCost(farmId);
    if (SaveManager.data.coins < cost) {
      UI.showToast('NOT ENOUGH COINS!');
      AudioManager.play('error');
      return;
    }
    SaveManager.data.coins -= cost;
    SaveManager.save();
    UI.closePopup();
    // move to map & play the golden path animation
    goToMap();
    mapScene.playUnlock(farmId);
  }

  function onUnlockAnimDone(farmId) {
    SaveManager.data.unlocked[farmId] = true;
    SaveManager.data.currentFarm = farmId;
    Construction.grantLand(farmId);
    SaveManager.save();
    // brief pause then enter the new farm
    setTimeout(() => {
      UFO.reset();
      Pigeon.reset();
      Tornado.reset();
      farmScene = new FarmScene(farmId);
      scene = 'farm';
      AudioManager.play('pop');
    }, 900);
  }

  function goToMap() {
    farmScene.persist();
    // stamp the live farm's clock before it goes background, accrue the rest
    Idle.tick(SaveManager.data.currentFarm);
    scene = 'map';
    mapScene.queuePendingCollect();
  }

  function resetAll() {
    Pigeon.reset(true); // discard any in-flight rain, no payout into the fresh save
    Tornado.reset();
    SaveManager.reset();
    celebration = null;
    upgradeTutorial = null;
    welcome = null;
    UFO.reset();
    UI.syncCoins();
    mapScene = new MapScene();
    farmScene = new FarmScene(0);
    scene = 'farm';
  }

  // ---------------- main loop ----------------
  function loop(t) {
    dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    elapsed += dt;
    Game.dt = dt;

    if (scene === 'loading') {
      UI.drawLoading(ctx, elapsed);
      scheduleFrame(loop);
      return;
    }

    // welcome-back popup: opens over the map once it has rendered a beat
    // (and never clobbers another popup — it waits for the slot instead)
    if (welcome && !welcome.claimed) {
      welcome.openT -= dt;
      if (welcome.openT <= 0 && !UI.popup) {
        UI.openPopup({ type: 'welcomeBack', rep: welcome.rep });
      }
    }

    // update (gameplay pauses during a celebration, the upgrade tutorial,
    // or the UFO abduction cinematic — the cinematic itself keeps animating)
    if (celebration) updateCelebration();
    else if (scene === 'farm') {
      if (UFO.cinematicActive) UFO.update(dt);
      // tornado sweep: gameplay paused, only the storm + UFO collects animate
      else if (Tornado.active) { Tornado.updateRun(dt); UFO.update(dt); }
      else {
        maybeStartUpgradeTutorial();
        if (upgradeTutorial) upgradeTutorial.t += dt;
        else {
          // reward events wait for a working farm: no tutorial pending and
          // (on construction farms) a fence for the pigeon to perch on
          const paused = !!farmScene.tutorial || !Construction.fenceBuilt(farmScene.farmId);
          farmScene.update(dt); UFO.update(dt);
          Pigeon.update(dt, paused);
          Tornado.update(dt, paused);
        }
      }
    }
    else mapScene.update(dt);
    VFXManager.update(dt);

    // background farms: reconcile elapsed production on a coarse tick
    idleT += dt;
    if (idleT >= CONFIG.IDLE.TICK_INTERVAL) {
      idleT = 0;
      Idle.tick(scene === 'farm' ? SaveManager.data.currentFarm : -1);
      // while watching the map, freshly accrued coins keep flying in
      // (paused while the welcome-back popup is pending/up: that pending
      // balance belongs to the popup's COLLECT, not the ambient sweep)
      if (scene === 'map' && !mapScene.unlockAnim && !welcome) mapScene.queuePendingCollect();
    }

    // autosave
    autosaveT += dt;
    if (autosaveT >= CONFIG.AUTOSAVE_INTERVAL) {
      autosaveT = 0;
      if (scene === 'farm') farmScene.persist();
      else SaveManager.save();
    }

    // draw
    ctx.fillStyle = '#1a140e';
    ctx.fillRect(0, 0, W, H);
    if (scene === 'farm') {
      if (celebration) {
        // zoom the camera toward the merge location
        const z = celebrationZoom();
        ctx.save();
        ctx.translate(celebration.x, celebration.y);
        ctx.scale(z, z);
        ctx.translate(-celebration.x, -celebration.y);
        farmScene.draw(ctx);
        VFXManager.draw(ctx);
        ctx.restore();
        const flash = celebrationFlash();
        if (flash > 0) {
          ctx.globalAlpha = flash;
          ctx.fillStyle = '#fff9e0';
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      } else {
        // subtle screen shake while poops are hitting the ground
        const sh = Pigeon.shakeOffset();
        ctx.save();
        ctx.translate(sh.x, sh.y);
        farmScene.draw(ctx);
        VFXManager.draw(ctx);
        ctx.restore();
      }
    } else {
      mapScene.draw(ctx);
      VFXManager.draw(ctx);
    }
    UI.drawHUD(ctx, scene);
    UI.drawPopup(ctx);
    if (upgradeTutorial && scene === 'farm') UI.drawUpgradeTutorial(ctx, upgradeTutorial.t);

    scheduleFrame(loop);
  }

  window.addEventListener('load', init);
  window.addEventListener('beforeunload', () => {
    Idle.tick(scene === 'farm' ? SaveManager.data.currentFarm : -1);
    if (farmScene) farmScene.persist();
    SaveManager.save();
  });

  return {
    addCoins, onButton, tryUnlock, onUnlockAnimDone, resetAll,
    openBuild, onConstructionBuilt,
    startCelebration, endCelebration, onUpgradePurchased,
    claimWelcome, onWelcomeAdDone, onWelcomeAdFailed,
    get scene() { return scene; },
    get farm() { return farmScene; },
    get celebrating() { return !!celebration; },
    get upgradeTutorialActive() { return !!upgradeTutorial; },
    dt: 1 / 60,
  };
})();
</script>
</body>
</html>
