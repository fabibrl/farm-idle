<script>
/**
 * MapScene — world map with three farm nodes, locked icons, map pins,
 * wooden name signs, and the rewarding golden unlock-path animation.
 */
class MapScene {
  constructor() {
    this.bg = ENVIRONMENT.worldMap();
    this.unlockAnim = null;   // {seg, t, farmId, phase}
    this.pinBob = 0;
    this.time = 0;
    this.smoke = [];          // rising chimney puffs {x,y,age,life,drift}
    this.smokeT = 0;
    this.collectQueue = [];   // staggered pending-coin collections {farmId, amount, delay}
  }

  /**
   * Auto-collect every farm's accumulated background earnings: queue one
   * coins-fly-to-wallet burst per farm, staggered so they don't all fire
   * at once. Each farm's pending balance resets as it is queued.
   */
  queuePendingCollect() {
    let delay = 0.25;
    for (const f of CONFIG.FARMS) {
      const amt = Idle.collect(f.id);
      if (amt <= 0) continue;
      this.collectQueue.push({ farmId: f.id, amount: amt, delay });
      delay += CONFIG.IDLE.MAP_STAGGER;
    }
  }

  /** Begin glowing-path unlock animation toward farmId. */
  playUnlock(farmId) {
    this.unlockAnim = {
      farmId,
      seg: farmId - 1,          // path segment leading to this farm
      t: 0,
      phase: 'pause',           // pause -> path -> burst -> done
      pauseT: CONFIG.UNLOCK_CAMERA_PAUSE,
    };
    AudioManager.play('unlock');
  }

  update(dt) {
    this.pinBob += dt * 4;
    this.time += dt;

    // chimney smoke from unlocked farms
    this.smokeT -= dt;
    if (this.smokeT <= 0) {
      this.smokeT = 0.9 + Math.random() * 0.5;
      for (let i = 0; i < 3; i++) {
        const ch = ENVIRONMENT.THEME[i].chimney;
        if (ch && SaveManager.data.unlocked[i]) {
          this.smoke.push({ x: ch.x, y: ch.y, age: 0, life: 2.2 + Math.random(), drift: 4 + Math.random() * 6 });
        }
      }
    }
    for (const p of this.smoke) { p.age += dt; }
    this.smoke = this.smoke.filter(p => p.age < p.life);

    // fire queued pending-coin collections once their stagger delay elapses
    for (let i = this.collectQueue.length - 1; i >= 0; i--) {
      const c = this.collectQueue[i];
      c.delay -= dt;
      if (c.delay > 0) continue;
      this.collectQueue.splice(i, 1);
      const n = ENVIRONMENT.MAP_NODES[c.farmId];
      VFXManager.coinPayout(n.x, n.y - 6, c.amount);
      AudioManager.play('pop');
    }

    const a = this.unlockAnim;
    if (!a) return;
    if (a.phase === 'pause') {
      a.pauseT -= dt;
      if (a.pauseT <= 0) a.phase = 'path';
    } else if (a.phase === 'path') {
      a.t += dt / CONFIG.UNLOCK_PATH_TIME;
      // sprinkle sparkles along the advancing head of the path
      const pts = ENVIRONMENT.roadPoints(a.seg);
      const head = pts[Math.min(pts.length - 1, Math.floor(a.t * pts.length))];
      if (Math.random() < 0.8) VFXManager.sparkle(head.x, head.y, 2, 8);
      if (a.t >= 1) {
        a.phase = 'burst';
        a.burstT = 0;
        const n = ENVIRONMENT.MAP_NODES[a.farmId];
        VFXManager.burst(n.x, n.y - 10, ['#ffe98a', '#f4c437', '#ffffff', '#a07cc0'], 26, 130);
        VFXManager.sparkle(n.x, n.y - 16, 16, 34);
      }
    } else if (a.phase === 'burst') {
      a.burstT += dt;
      if (a.burstT > 1.1) {
        this.unlockAnim = null;
        Game.onUnlockAnimDone(a.farmId);
      }
    }
  }

  draw(ctx) {
    ctx.drawImage(this.bg, 0, 0);
    const save = SaveManager.data;
    const a = this.unlockAnim;

    // glowing unlock path
    if (a && (a.phase === 'path' || a.phase === 'burst')) {
      const pts = ENVIRONMENT.roadPoints(a.seg);
      const upTo = a.phase === 'burst' ? pts.length : Math.floor(a.t * pts.length);
      ctx.save();
      ctx.strokeStyle = '#ffe98a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#f4c437';
      ctx.shadowBlur = 12;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < upTo; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.restore();
      // dotted gold core
      ctx.fillStyle = '#fff6d0';
      for (let i = 0; i < upTo; i += 4) ctx.fillRect(pts[i].x - 1, pts[i].y - 1, 3, 3);
    }

    // nodes: themed idle animations, pin (unlocked) or chains+lock (locked), sign
    for (let i = 0; i < 3; i++) {
      const n = ENVIRONMENT.MAP_NODES[i];
      const theme = ENVIRONMENT.THEME[i];
      const unlocked = save.unlocked[i];
      const hideLock = a && a.farmId === i && (a.phase === 'burst');

      // waving grass tufts (static when locked)
      for (let t = 0; t < theme.grass.length; t++) {
        const gp = theme.grass[t];
        const sway = unlocked ? Math.round(Math.sin(this.time * 2.2 + t * 1.7 + i) * 2) : 0;
        ctx.fillStyle = '#8ab656';
        ctx.fillRect(gp.x + sway, gp.y - 8, 2, 4); ctx.fillRect(gp.x, gp.y - 4, 2, 4);
        ctx.fillRect(gp.x + 5, gp.y - 5, 2, 5);
        ctx.fillStyle = '#6a9840';
        ctx.fillRect(gp.x + 9 + sway, gp.y - 7, 2, 3); ctx.fillRect(gp.x + 9, gp.y - 4, 2, 4);
      }

      // spinning windmill blades (frozen when locked)
      if (theme.windmill) {
        const frame = unlocked ? Math.floor(this.time * 7) % 4 : 0;
        const bl = SPRITES.windmillBlades(frame);
        ctx.drawImage(bl, theme.windmill.x - 28, theme.windmill.y - 28, 56, 56);
      }

      // species mascot next to the farmhouse — readable before entering
      // (animated when unlocked, standing still on locked previews)
      const species = CONFIG.FARMS[i].species;
      const frame = unlocked && Math.sin(this.time * 1.6 + i * 2.1) > 0.55 ? 'peck' : 'idle';
      const blink = unlocked && Math.sin(this.time * 3 + i) > 0.96;
      PIXEL.blit(ctx, SPRITES.animal(species, 1, frame, blink), theme.animal.x, theme.animal.y, 2, i === 1);

      if (unlocked) {
        const pin = SPRITES.mapPin();
        const bob = Math.sin(this.pinBob + i) * 3;
        const isCurrent = save.currentFarm === i;
        PIXEL.blit(ctx, pin, n.x, n.y - 8 + bob, isCurrent ? 2.4 : 2);
        if (isCurrent) {
          ctx.globalAlpha = 0.5 + Math.sin(this.pinBob * 1.5) * 0.25;
          ctx.strokeStyle = '#ffe98a'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(n.x, n.y + 4, 18, 8, 0, 0, 7); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else if (!hideLock) {
        // locked: just a lock icon centered over the themed plot — the farm
        // itself stays fully visible as a preview
        PIXEL.blit(ctx, SPRITES.lock(), n.x, n.y + 16, 2);
      }

      // wooden sign with farm name
      UI.woodSign(ctx, n.x, n.y + 40, CONFIG.FARMS[i].name, CONFIG.FARMS[i].label,
        unlocked ? null : U.fmtCost(CONFIG.UNLOCK_COSTS[i]));
    }

    // chimney smoke puffs (spawned only for unlocked farms)
    for (const p of this.smoke) {
      const k = p.age / p.life;
      const size = 4 + k * 8;
      ctx.globalAlpha = 0.45 * (1 - k);
      ctx.fillStyle = '#d8d2c8';
      ctx.fillRect(
        Math.round(p.x + Math.sin(p.age * 3) * 2 + k * p.drift - size / 2),
        Math.round(p.y - k * 26 - size / 2),
        Math.round(size), Math.round(size));
    }
    ctx.globalAlpha = 1;
  }

  /** Hit-test: returns farm id or -1. */
  tappedFarm(x, y) {
    for (let i = 0; i < 3; i++) {
      const n = ENVIRONMENT.MAP_NODES[i];
      if (U.dist(x, y, n.x, n.y) < 52) return i;
    }
    return -1;
  }
}
</script>
<script>
/**
 * UIManager — HUD, buttons, popups and wooden panels. All typography
 * renders through the global 'pixel-art-font' engine (js/font.js).
 */
const UI = (() => {
  const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
  const P = () => SPRITES.P;

  // ---------------- typography ('pixel-art-font') ----------------
  // SIZE is the hierarchy scale (TITLE 20 / SUBTITLE 15 / BUTTON+BODY 10 /
  // CAPTION 5). drawText/measure keep the historical signature so every
  // module (farm, ufo, pigeon, tornado, vfx) shares this one text path.
  const SIZE = PixelFont.SIZE;

  function measure(text, size) { return PixelFont.measure(text, size); }

  function drawText(ctx, text, x, y, size = SIZE.BODY, col = '#fff', align = 'left', outline = false, shadow = false, maxWidth = 0) {
    return PixelFont.draw(ctx, text, x, y, size, col, align, outline, shadow, maxWidth);
  }

  /** Popup title: auto-fitted to the bar width and vertically centered. */
  function popupTitle(ctx, text, px, py, pw) {
    const maxW = pw - 76;
    const ts = PixelFont.fit(text, SIZE.SUBTITLE, maxW);
    drawText(ctx, text, px + pw / 2, py - 10 + Math.round((26 - ts) / 2), ts, '#ffe98a', 'center', true, false, maxW);
  }

  // ---------------- wooden panels ----------------
  function woodPanel(ctx, x, y, w, h, opts = {}) {
    const p = P();
    // outline
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    // base
    ctx.fillStyle = opts.dark ? p.woodDk : p.wood;
    ctx.fillRect(x, y, w, h);
    // top light bevel, bottom dark bevel
    ctx.fillStyle = opts.dark ? p.wood : p.woodHi;
    ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = p.woodDkr;
    ctx.fillRect(x, y + h - 3, w, 3);
    // plank seams
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let py = y + 12; py < y + h - 6; py += 14) ctx.fillRect(x, py, w, 1);
    // wood grain flecks
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (let i = 0; i < w * h / 260; i++) {
      ctx.fillRect(x + ((i * 53) % (w - 8)) + 4, y + ((i * 37) % (h - 10)) + 5, 4, 1);
    }
    if (opts.gold) {
      // gold corner studs
      ctx.fillStyle = p.gold;
      for (const [cx, cy] of [[x + 4, y + 4], [x + w - 7, y + 4], [x + 4, y + h - 7], [x + w - 7, y + h - 7]]) {
        ctx.fillRect(cx, cy, 3, 3);
        ctx.fillStyle = p.goldHi; ctx.fillRect(cx, cy, 1, 1); ctx.fillStyle = p.gold;
      }
    }
  }

  /** Dark inset capsule (coin counter background). */
  function inset(ctx, x, y, w, h) {
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#3a2817';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#2e1f10';
    ctx.fillRect(x, y, w, 2);
  }

  /** Colored button (green/gray/red) with bevel + icon + label. */
  function drawButton(ctx, b) {
    const p = P();
    const cols = {
      green: ['#5e9c31', '#7dbb4a', '#41701f'],
      gray: ['#8c8678', '#aaa596', '#635e52'],
      red: ['#c0453a', '#dd6a56', '#8e2f27'],
      wood: [p.wood, p.woodHi, p.woodDk],
    }[b.color];
    const pr = b.pressed ? 2 : 0;
    const y = b.y + pr;
    // outline + drop
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
    ctx.fillStyle = cols[2];
    ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
    // face
    ctx.fillStyle = cols[0];
    ctx.fillRect(b.x, y, b.w, b.h - 4 - pr + 2);
    ctx.fillStyle = cols[1];
    ctx.fillRect(b.x, y, b.w, 3);
    ctx.fillRect(b.x, y, 3, b.h - 6);
    if (b.disabled) {
      ctx.fillStyle = 'rgba(40,30,20,0.45)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    // content
    let tx = b.x + b.w / 2;
    const ty = y + (b.h - 4) / 2;
    if (b.icon) {
      const img = b.icon();
      const iw = img.width * 2, ih = img.height * 2;
      if (b.label) {
        const availW = b.w - iw - 8;
        const fs = PixelFont.fit(b.label, SIZE.BUTTON, availW);
        const lw = Math.min(measure(b.label, fs), availW);
        const total = iw + 6 + lw;
        ctx.drawImage(img, Math.round(tx - total / 2), Math.round(ty - ih / 2), iw, ih);
        drawText(ctx, b.label, tx - total / 2 + iw + 6, ty - fs / 2, fs, '#fff6e8', 'left', true, false, availW);
      } else {
        ctx.drawImage(img, Math.round(tx - iw / 2), Math.round(ty - ih / 2), iw, ih);
      }
    } else if (b.label) {
      const availW = b.w - 8;
      const fs = PixelFont.fit(b.label, SIZE.BUTTON, availW);
      drawText(ctx, b.label, tx, ty - fs / 2, fs, '#fff6e8', 'center', true, false, availW);
    }
  }

  /** Small wooden sign with 1-2 lines (used on world map). */
  function woodSign(ctx, cx, cy, line1, line2, cost) {
    const w = Math.max(measure(line1, SIZE.BUTTON), line2 ? measure(line2, SIZE.CAPTION) : 0,
                       cost ? measure(cost, SIZE.CAPTION) + 12 : 0) + 18;
    const h = 18 + (line2 ? 9 : 0) + (cost ? 11 : 0);
    woodPanel(ctx, cx - w / 2, cy, w, h, {});
    drawText(ctx, line1, cx, cy + 5, SIZE.BUTTON, '#f4e8cc', 'center', true);
    let yy = cy + 17;
    if (line2) { drawText(ctx, line2, cx, yy, SIZE.CAPTION, '#e0cfa8', 'center'); yy += 10; }
    if (cost) {
      const img = SPRITES.coin(1);
      const tw = measure(cost, SIZE.CAPTION);
      ctx.drawImage(img, cx - tw / 2 - 12, yy - 3, 10, 10);
      drawText(ctx, cost, cx - tw / 2, yy, SIZE.CAPTION, '#ffe98a', 'left');
    }
    // legs
    ctx.fillStyle = P().woodDk;
    ctx.fillRect(cx - w / 2 + 4, cy + h, 3, 5);
    ctx.fillRect(cx + w / 2 - 7, cy + h, 3, 5);
  }

  // ---------------- upgrade panel cards ----------------
  /**
   * One parchment card in the upgrade panel, laid out COST > BENEFIT > ACTION:
   * the right column leads with a big coin+cost (gold when affordable, red
   * with a NEED hint when not) above the UPGRADE button; the left column has
   * the upgrade name and per-stat "cur > next" improvement rows. Registers
   * its hit rect on popup.cards and applies the purchase flash from popup.fx.
   * Returns the card's bottom y.
   */
  function upgradeCard(ctx, popup, x, y, w, h, inf) {
    // parchment card
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#e8d8b4'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#f2e6c8'; ctx.fillRect(x, y, w, 3);

    const afford = !inf.maxed && SaveManager.data.coins >= inf.cost;

    // ---- right column: cost (most prominent), NEED hint, UPGRADE button ----
    const colW = 104;
    const colX = x + w - colW;
    const ccx = colX + colW / 2;
    if (!inf.maxed) {
      const costTxt = U.fmt(inf.cost);
      const costSize = PixelFont.fit(costTxt, SIZE.SUBTITLE, colW - 28);
      const cw = measure(costTxt, costSize);
      const coinS = 16;
      const cx0 = Math.round(ccx - (coinS + 4 + cw) / 2);
      ctx.drawImage(SPRITES.coin(2), cx0, y + 7, coinS, coinS);
      drawText(ctx, costTxt, cx0 + coinS + 4, y + 8, costSize, afford ? '#b8860b' : '#b0442f', 'left');
      if (!afford) {
        drawText(ctx, 'NEED ' + U.fmt(inf.cost - SaveManager.data.coins), ccx, y + 28,
                 SIZE.CAPTION, '#b0442f', 'center', false, false, colW - 6);
      }
    }
    const fx = popup.fx[inf.key] || 0;
    const bh = 28;
    const btn = { x: colX + 4, y: y + h - bh - 8, w: colW - 8, h: bh };
    drawButton(ctx, {
      ...btn, color: afford ? 'green' : 'gray',
      label: inf.maxed ? 'MAX' : 'UPGRADE',
      disabled: inf.maxed || !afford,
      pressed: fx > 0.85,
    });

    // ---- left column: name, then "cur > next" improvement rows ----
    const textW = colX - x - 18;
    drawText(ctx, inf.label + ' LV ' + inf.level, x + 10, y + 8, SIZE.BODY, '#5c3a1d', 'left', false, false, textW);
    let ly = y + 26;
    for (const st of inf.stats) {
      drawText(ctx, st.name, x + 10, ly + 4, SIZE.CAPTION, '#8a6a3c');
      let vx = x + 56;
      vx += drawText(ctx, st.cur, vx, ly, SIZE.BODY, '#7d5027') + 6;
      if (st.next && st.next !== st.cur) {
        vx += drawText(ctx, '>', vx, ly, SIZE.BODY, '#4a8f2c') + 6;
        drawText(ctx, st.next, vx, ly, SIZE.BODY, '#3f7d1e');
      }
      ly += 17;
    }

    // purchase highlight flash
    if (fx > 0) {
      popup.fx[inf.key] = Math.max(0, fx - Game.dt * 2);
      ctx.globalAlpha = fx * 0.45;
      ctx.fillStyle = '#ffe98a';
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = 1;
    }

    popup.cards.push({ key: inf.key, btn });
    return y + h;
  }

  // sparkle particles drawn above the popup (VFXManager renders below it)
  let panelFx = [];
  function spawnPanelFx(x, y) {
    for (let i = 0; i < 12; i++) {
      panelFx.push({
        x: x + U.rand(-16, 16), y: y + U.rand(-8, 8),
        vx: U.rand(-30, 30), vy: U.rand(-70, -20),
        t: U.rand(0.35, 0.6), max: 0.6,
        col: U.pick(['#ffe98a', '#f4c437', '#fff6d0', '#ffffff']),
      });
    }
  }
  function drawPanelFx(ctx) {
    for (let i = panelFx.length - 1; i >= 0; i--) {
      const p = panelFx[i];
      p.t -= Game.dt;
      if (p.t <= 0) { panelFx.splice(i, 1); continue; }
      p.x += p.vx * Game.dt; p.y += p.vy * Game.dt;
      ctx.globalAlpha = Math.min(1, p.t / p.max * 2);
      ctx.fillStyle = p.col;
      const s = p.t > p.max * 0.5 ? 3 : 2;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s);
      ctx.globalAlpha = 1;
    }
  }

  // ---------------- state ----------------
  let buttons = [];
  let popup = null;         // {type:'unlock'|'settings'|'confirm-reset', ...}
  let toast = null;         // {text, t}
  let displayedCoins = 0;
  let coinPulse = 0;

  const COIN_POS = { x: 30, y: 27 };
  function coinTarget() { return { x: COIN_POS.x, y: COIN_POS.y }; }

  function makeButtons() {
    const bw = 100, bh = 40, gap = 10, y = H - bh - 14;
    const total = bw * 2 + gap;
    const x0 = (W - total) / 2;
    buttons = [
      { id: 'upgrade', color: 'green', x: x0, y, w: bw, h: bh, label: 'UPGRADE', icon: () => SPRITES.arrowUp(), scene: 'farm' },
      { id: 'map', color: 'red', x: x0 + bw + gap, y, w: bw, h: bh, label: 'MAP', icon: () => SPRITES.mapPin(), scene: 'farm' },
      { id: 'settings', color: 'wood', x: W - 46, y: 12, w: 34, h: 32, icon: () => SPRITES.gear(), scene: 'both' },
    ];
  }
  makeButtons();

  /** Red notification badge with a white "!", centered at (cx, cy). */
  function drawBadge(ctx, cx, cy) {
    const pulse = 1 + Math.sin(performance.now() / 220) * 0.08;
    const r = Math.round(8 * pulse);
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.beginPath(); ctx.arc(cx, cy, r + 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#c0453a';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#dd6a56';
    ctx.beginPath(); ctx.arc(cx - 1, cy - 1, r - 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#c0453a';
    ctx.beginPath(); ctx.arc(cx, cy + 1, r - 2, 0, 7); ctx.fill();
    drawText(ctx, '!', cx, cy - 5, SIZE.BODY, '#fff6e8', 'center');
  }

  // ---------------- HUD ----------------
  function drawHUD(ctx, scene) {
    const p = P();
    // top bar backdrop
    ctx.fillStyle = 'rgba(26,20,14,0.35)';
    ctx.fillRect(0, 0, W, 56);

    // coin capsule
    displayedCoins = U.lerp(displayedCoins, SaveManager.data.coins, Math.min(1, CONFIG.COIN_COUNT_LERP * Game.dt));
    if (Math.abs(displayedCoins - SaveManager.data.coins) < 1) displayedCoins = SaveManager.data.coins;
    inset(ctx, 14, 12, 118, 30);
    const coinImg = SPRITES.coin(3);
    coinPulse = Math.max(0, coinPulse - Game.dt * 4);
    const cs = 26 + coinPulse * 8;
    ctx.drawImage(coinImg, COIN_POS.x - cs / 2, COIN_POS.y - cs / 2, cs, cs);
    drawText(ctx, U.fmt(displayedCoins), 48, 22, SIZE.BODY, '#fff6e8', 'left', false, true, 78);

    // farm name plaque — auto-fits between the coin capsule and settings button
    const name = scene === 'map' ? 'WORLD MAP' : CONFIG.FARMS[SaveManager.data.currentFarm].name;
    const plaqueMax = 132;
    const ts = PixelFont.fit(name, SIZE.SUBTITLE, plaqueMax - 28);
    const nw = Math.min(measure(name, ts) + 28, plaqueMax);
    woodPanel(ctx, Math.round(W / 2 - nw / 2) + 20, 12, nw, 30, { gold: true });
    drawText(ctx, name, W / 2 + 20, 12 + Math.round((30 - ts) / 2), ts, '#f4e8cc', 'center', true, false, plaqueMax - 28);

    // buttons for this scene
    for (const b of buttons) {
      if (b.scene !== 'both' && b.scene !== scene) continue;
      drawButton(ctx, b);
      // red "!" badge on UPGRADE while an upgrade is affordable
      // (only after the first-upgrade tutorial has been completed)
      if (b.id === 'upgrade' && SaveManager.data.upgradeTutorialDone &&
          Upgrades.anyAffordable(SaveManager.data.currentFarm)) {
        drawBadge(ctx, b.x + b.w - 2, b.y - 2);
      }
    }

    // toast
    if (toast) {
      toast.t -= Game.dt;
      if (toast.t <= 0) toast = null;
      else {
        const a = Math.min(1, toast.t * 2);
        ctx.globalAlpha = a;
        const tt = PixelFont.truncate(toast.text, SIZE.BODY, W - 52);
        const tw2 = measure(tt, SIZE.BODY) + 24;
        inset(ctx, W / 2 - tw2 / 2, 84, tw2, 22);
        drawText(ctx, tt, W / 2, 90, SIZE.BODY, '#ffb0a0', 'center');
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------------- discovery celebration popup ----------------
  /**
   * Full-screen celebration for a first-time evolution: golden frame around
   * big animal art, sparkles + confetti, name, stage, flavor and CONTINUE.
   */
  function drawDiscovery(ctx, px, py, pw, ph) {
    const p = P();
    popup.fxT += Game.dt;
    const t = popup.fxT;
    const cx = px + pw / 2;

    popupTitle(ctx, 'NEW EVOLUTION', px, py, pw);
    drawText(ctx, 'DISCOVERED!', cx, py + 22, SIZE.TITLE, '#ffe98a', 'center', true, false, pw - 24);

    // golden frame
    const fs = 150, fx = cx - fs / 2, fy = py + 48;
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(fx - 4, fy - 4, fs + 8, fs + 8);
    ctx.fillStyle = p.gold;        ctx.fillRect(fx - 2, fy - 2, fs + 4, fs + 4);
    ctx.fillStyle = p.goldHi;      ctx.fillRect(fx - 2, fy - 2, fs + 4, 2);
    ctx.fillStyle = p.goldDk;      ctx.fillRect(fx - 2, fy + fs, fs + 4, 2);
    ctx.fillStyle = '#3a2c1c';     ctx.fillRect(fx + 2, fy + 2, fs - 4, fs - 4);
    // corner studs
    ctx.fillStyle = p.goldHi;
    for (const [sx, sy] of [[fx - 2, fy - 2], [fx + fs - 2, fy - 2], [fx - 2, fy + fs - 2], [fx + fs - 2, fy + fs - 2]]) {
      ctx.fillRect(sx, sy, 4, 4);
    }

    // magical glow behind the animal
    ctx.save();
    ctx.beginPath(); ctx.rect(fx + 2, fy + 2, fs - 4, fs - 4); ctx.clip();
    const pulse = 0.30 + Math.sin(t * 4) * 0.12;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.arc(cx, fy + fs / 2 + 8, 56, 0, 7); ctx.fill();
    ctx.globalAlpha = pulse * 0.7;
    ctx.beginPath(); ctx.arc(cx, fy + fs / 2 + 8, 34, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // rotating god-rays
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#fff6d0';
    for (let i = 0; i < 6; i++) {
      const a = t * 0.6 + (i / 6) * Math.PI * 2;
      ctx.save();
      ctx.translate(cx, fy + fs / 2 + 8);
      ctx.rotate(a);
      ctx.fillRect(-7, -fs, 14, fs * 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // the star of the show, gently bobbing
    const img = SPRITES.animal(popup.species, popup.stage, 'idle', false);
    const bob = Math.sin(t * 3) * 2;
    const sc = Math.min(3.4, (fs - 34) / img.height);
    PIXEL.blit(ctx, img, cx, fy + fs - 18 + bob, sc * Math.min(1, U.easeOutBack(Math.min(t * 2.5, 1))));
    // sparkles twinkling inside the frame
    ctx.fillStyle = '#fff6d0';
    for (let i = 0; i < 7; i++) {
      const tw = (Math.sin(t * 5 + i * 2.1) + 1) / 2;
      if (tw < 0.55) continue;
      const sx = fx + 12 + ((i * 47) % (fs - 24));
      const sy = fy + 12 + ((i * 71) % (fs - 24));
      const ss = tw > 0.8 ? 2 : 1;
      ctx.fillRect(sx - ss, sy, ss * 2 + 1, 1);
      ctx.fillRect(sx, sy - ss, 1, ss * 2 + 1);
    }
    ctx.restore();

    // name, stage, flavor (flavor auto-wraps inside the panel)
    drawText(ctx, Discovery.displayName(popup.species, popup.stage), cx, fy + fs + 14, SIZE.BODY, '#ffe98a', 'center', true, false, pw - 24);
    drawText(ctx, 'STAGE ' + (popup.stage + 1) + ' - ' + CONFIG.STAGE_NAMES[popup.stage], cx, fy + fs + 32, SIZE.CAPTION, '#f4e8cc', 'center');
    PixelFont.drawWrapped(ctx, Discovery.flavor(popup.species, popup.stage), cx, fy + fs + 46, SIZE.CAPTION, '#e0cfa8', 'center', pw - 28, 2);

    // CONTINUE
    popup.okRect = { x: px + 50, y: py + ph - 56, w: pw - 100, h: 40 };
    drawButton(ctx, { ...popup.okRect, color: 'green', label: 'CONTINUE' });

    // confetti raining over the whole popup
    if (popup.confetti.length < 60 && Math.random() < 0.5) {
      popup.confetti.push({
        x: px + Math.random() * pw, y: py - 14,
        vx: U.rand(-14, 14), vy: U.rand(36, 70),
        sway: Math.random() * Math.PI * 2,
        col: U.pick(['#ffe98a', '#f4c437', '#dd6a56', '#7dbb4a', '#a07cc0', '#7ec8e0']),
        s: U.randInt(2, 4),
      });
    }
    for (let i = popup.confetti.length - 1; i >= 0; i--) {
      const c = popup.confetti[i];
      c.sway += Game.dt * 4;
      c.x += (c.vx + Math.sin(c.sway) * 16) * Game.dt;
      c.y += c.vy * Game.dt;
      if (c.y > py + ph + 10) { popup.confetti.splice(i, 1); continue; }
      ctx.fillStyle = c.col;
      const wob = Math.abs(Math.sin(c.sway));
      ctx.fillRect(Math.round(c.x), Math.round(c.y), c.s, Math.max(1, Math.round(c.s * wob)));
    }
  }

  // ---------------- popups ----------------
  function drawPopup(ctx) {
    if (!popup) return;

    // simulated reward ad: full-screen placeholder, auto-completes
    if (popup.type === 'adPlaying') {
      popup.t += Game.dt;
      ctx.fillStyle = 'rgba(8,8,12,0.94)';
      ctx.fillRect(0, 0, W, H);
      drawText(ctx, 'REWARD AD', W / 2, H / 2 - 84, SIZE.TITLE, '#fff6e8', 'center', true);
      drawText(ctx, 'SIMULATED AD PLACEHOLDER', W / 2, H / 2 - 52, SIZE.CAPTION, '#8c8678', 'center');
      // silly ad: pigeon on a bombing run across the screen
      const t = Math.min(popup.t / popup.dur, 1);
      const bx = U.lerp(40, W - 40, t);
      const by = H / 2 + 4 + Math.sin(popup.t * 6) * 6;
      const frame = Math.floor(popup.t * 10) % 2 ? 'flapUp' : 'flapDn';
      PIXEL.blit(ctx, SPRITES.poop(0), bx - 14, by + 26 + Math.sin(popup.t * 3) * 8, 2);
      PIXEL.blit(ctx, SPRITES.pigeon(frame, false), bx, by, 3);
      // progress bar
      inset(ctx, W / 2 - 80, H / 2 + 60, 160, 14);
      ctx.fillStyle = '#7dbb4a';
      ctx.fillRect(W / 2 - 78, H / 2 + 62, Math.max(0, Math.round(156 * t)), 10);
      drawText(ctx, 'REWARD IN ' + Math.ceil(popup.dur - popup.t) + 'S', W / 2, H / 2 + 88, SIZE.CAPTION, '#c8b088', 'center');
      if (popup.t >= popup.dur) { const done = popup.onDone; popup = null; done(); }
      return;
    }

    ctx.fillStyle = popup.type === 'discovery' ? 'rgba(16,10,6,0.75)' : 'rgba(16,10,6,0.55)';
    ctx.fillRect(0, 0, W, H);

    const pw = popup.type === 'upgrades' ? 324 : popup.type === 'discovery' ? 280 : 240;
    const ph = popup.type === 'upgrades' ? 528
             : popup.type === 'discovery' ? 344
             : popup.type === 'unlock' ? 210
             : popup.type === 'pigeonAd' ? 254
             : popup.type === 'tornadoAd' ? 296 : 190;
    // upgrades panel sits lower so the HUD coin counter stays visible
    const px = (W - pw) / 2, py = (H - ph) / 2 - (popup.type === 'upgrades' ? 0 : 20);
    popup.rect = { x: px, y: py, w: pw, h: ph };
    woodPanel(ctx, px, py, pw, ph, { gold: true });
    // title bar
    woodPanel(ctx, px + 10, py - 10, pw - 20, 26, { dark: true });

    // close X (discovery must be dismissed with CONTINUE)
    if (popup.type === 'discovery') {
      popup.closeRect = null;
    } else {
      popup.closeRect = { x: px + pw - 16, y: py - 16, w: 28, h: 26 };
      drawButton(ctx, { ...popup.closeRect, color: 'red', icon: () => SPRITES.xIcon(), pressed: false });
    }

    if (popup.type === 'unlock') {
      const f = CONFIG.FARMS[popup.farmId];
      popupTitle(ctx, 'UNLOCK ' + f.name, px, py, pw);
      // inner parchment card
      ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 28, pw - 36, 104);
      ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 30, pw - 40, 100);
      ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 30, pw - 40, 3);
      // animal preview
      const img = SPRITES.animal(f.species, 1, 'idle', false);
      PIXEL.blit(ctx, img, px + 58, py + 116, 2.6);
      drawText(ctx, f.label.replace(/S$/, '') + ' FARM', px + 144, py + 48, SIZE.BODY, '#5c3a1d', 'center', false, false, 136);
      drawText(ctx, 'UNLOCK COST:', px + 144, py + 72, SIZE.CAPTION, '#7d5027', 'center');
      const cost = U.fmt(CONFIG.UNLOCK_COSTS[popup.farmId]);
      const cw = measure(cost, SIZE.BODY);
      ctx.drawImage(SPRITES.coin(2), px + 144 - cw / 2 - 20, py + 84, 16, 16);
      drawText(ctx, cost, px + 144 - cw / 2, py + 88, SIZE.BODY, '#b8860b', 'left');
      // unlock button
      const can = SaveManager.data.coins >= CONFIG.UNLOCK_COSTS[popup.farmId];
      popup.okRect = { x: px + 40, y: py + ph - 60, w: pw - 80, h: 40 };
      drawButton(ctx, { ...popup.okRect, color: 'green', label: 'UNLOCK', disabled: !can });
    } else if (popup.type === 'upgrades') {
      const f = CONFIG.FARMS[popup.farmId];
      popupTitle(ctx, f.name + ' UPGRADES', px, py, pw);
      popup.cards = [];
      let yy = py + 20;
      drawText(ctx, 'FARM', px + 14, yy, SIZE.CAPTION, '#e0cfa8'); yy += 12;
      yy = upgradeCard(ctx, popup, px + 12, yy, pw - 24, 76, Upgrades.info(popup.farmId, 'spawn')) + 10;
      drawText(ctx, f.label, px + 14, yy, SIZE.CAPTION, '#e0cfa8'); yy += 12;
      for (let s = 0; s < CONFIG.UPGRADES.STAGES.length; s++) {
        yy = upgradeCard(ctx, popup, px + 12, yy, pw - 24, 88, Upgrades.info(popup.farmId, s)) + 8;
      }
      drawPanelFx(ctx);
    } else if (popup.type === 'discovery') {
      drawDiscovery(ctx, px, py, pw, ph);
    } else if (popup.type === 'pigeonAd') {
      const inf = Pigeon.info();
      popupTitle(ctx, 'SPECIAL DELIVERY!', px, py, pw);
      // parchment card
      ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 26, pw - 36, 132);
      ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 28, pw - 40, 128);
      ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 28, pw - 40, 3);
      // the messenger, gently bobbing
      popup.fxT = (popup.fxT || 0) + Game.dt;
      const bob = Math.sin(popup.fxT * 3) * 2;
      PIXEL.blit(ctx, SPRITES.pigeon('idle', false), px + 58, py + 92 + bob, 3);
      drawText(ctx, 'COO!', px + 58, py + 104, SIZE.CAPTION, '#7d5027', 'center');
      // reward explanation
      drawText(ctx, 'WATCH AN AD', px + 152, py + 44, SIZE.BODY, '#5c3a1d', 'center', false, false, 132);
      drawText(ctx, 'TO GET A', px + 152, py + 64, SIZE.CAPTION, '#7d5027', 'center');
      drawText(ctx, 'POOP RAIN!', px + 152, py + 78, SIZE.BODY, '#b8860b', 'center', false, false, 132);
      // payout breakdown
      PIXEL.blit(ctx, SPRITES.poop(0), px + 104, py + 138, 2);
      drawText(ctx, 'X' + inf.count, px + 124, py + 118, SIZE.BODY, '#5c3a1d', 'left');
      ctx.drawImage(SPRITES.coin(1), px + 150, py + 118, 12, 12);
      drawText(ctx, '+' + U.fmt(inf.value) + ' EACH', px + 166, py + 120, SIZE.CAPTION, '#b8860b', 'left');
      drawText(ctx, 'COINS COLLECT AUTOMATICALLY!', px + pw / 2, py + 144, SIZE.CAPTION, '#7d5027', 'center', false, false, pw - 44);
      // watch button
      popup.okRect = { x: px + 40, y: py + ph - 62, w: pw - 80, h: 40 };
      drawButton(ctx, { ...popup.okRect, color: 'green', label: '> WATCH AD' });
    } else if (popup.type === 'tornadoAd') {
      popupTitle(ctx, 'TORNADO ALERT!', px, py, pw);
      // parchment card
      ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(px + 18, py + 26, pw - 36, 132);
      ctx.fillStyle = '#e8d8b4'; ctx.fillRect(px + 20, py + 28, pw - 40, 128);
      ctx.fillStyle = '#f2e6c8'; ctx.fillRect(px + 20, py + 28, pw - 40, 3);
      // the storm itself, spinning and swaying
      popup.fxT = (popup.fxT || 0) + Game.dt;
      const frame = Math.floor(popup.fxT * 10) % 3;
      const sway = Math.sin(popup.fxT * 4) * 2;
      PIXEL.blit(ctx, SPRITES.tornado(frame), px + 58 + sway, py + 122, 2);
      // reward explanation
      drawText(ctx, 'WATCH AN AD', px + 152, py + 44, SIZE.BODY, '#5c3a1d', 'center', false, false, 132);
      drawText(ctx, 'TO UNLEASH A', px + 152, py + 64, SIZE.CAPTION, '#7d5027', 'center');
      drawText(ctx, 'MERGE STORM!', px + 152, py + 78, SIZE.BODY, '#b8860b', 'center', false, false, 132);
      drawText(ctx, 'AUTO-MERGES EVERY', px + 152, py + 100, SIZE.CAPTION, '#7d5027', 'center');
      drawText(ctx, 'POSSIBLE ANIMAL!', px + 152, py + 112, SIZE.CAPTION, '#7d5027', 'center');
      // mutants feed the UFO only where it has been unlocked
      const ufoReady = SaveManager.data.ufo[SaveManager.data.currentFarm].landed;
      drawText(ctx, ufoReady ? 'MUTANTS BECOME MUTANT 2!' : 'MERGES ALL THE WAY TO MUTANTS!',
        px + pw / 2, py + 144, SIZE.CAPTION, '#7d5027', 'center', false, false, pw - 44);
      // watch + cancel buttons
      popup.okRect = { x: px + 40, y: py + ph - 104, w: pw - 80, h: 40 };
      popup.cancelRect = { x: px + 60, y: py + ph - 54, w: pw - 120, h: 32 };
      drawButton(ctx, { ...popup.okRect, color: 'green', label: '> WATCH AD' });
      drawButton(ctx, { ...popup.cancelRect, color: 'gray', label: 'CANCEL' });
    } else if (popup.type === 'settings') {
      popupTitle(ctx, 'SETTINGS', px, py, pw);
      popup.musicRect = { x: px + 30, y: py + 34, w: pw - 60, h: 34 };
      popup.sfxRect = { x: px + 30, y: py + 78, w: pw - 60, h: 34 };
      popup.resetRect = { x: px + 30, y: py + 128, w: pw - 60, h: 34 };
      drawButton(ctx, { ...popup.musicRect, color: 'wood', label: 'MUSIC: ' + (AudioManager.musicOn ? 'ON' : 'OFF') });
      drawButton(ctx, { ...popup.sfxRect, color: 'wood', label: 'SOUND: ' + (AudioManager.sfxOn ? 'ON' : 'OFF') });
      drawButton(ctx, { ...popup.resetRect, color: 'red', label: 'RESET SAVE' });
    } else if (popup.type === 'confirm-reset') {
      popupTitle(ctx, 'RESET GAME?', px, py, pw);
      PixelFont.drawWrapped(ctx, 'ALL PROGRESS WILL BE LOST!', px + pw / 2, py + 44, SIZE.CAPTION, '#f4e8cc', 'center', pw - 60, 2);
      popup.okRect = { x: px + 30, y: py + 84, w: pw - 60, h: 36 };
      popup.cancelRect = { x: px + 30, y: py + 130, w: pw - 60, h: 36 };
      drawButton(ctx, { ...popup.okRect, color: 'red', label: 'YES, RESET' });
      drawButton(ctx, { ...popup.cancelRect, color: 'gray', label: 'CANCEL' });
    }
  }

  function inRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  // ---------------- first-upgrade tutorial overlay ----------------
  /** Pixel-style pointing hand, fingertip at (x, y). */
  function drawHand(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#2b2116';
    ctx.fillRect(-3, -2, 8, 14);   // finger outline
    ctx.fillRect(-7, 8, 16, 10);   // palm outline
    ctx.fillStyle = '#fff4e0';
    ctx.fillRect(-2, -1, 6, 12);   // finger
    ctx.fillRect(-6, 9, 14, 8);    // palm
    ctx.restore();
  }

  /**
   * Spotlight for the first-upgrade tutorial: pulsing glow + hand + label on
   * the UPGRADE button, then on the cheapest affordable BUY button inside
   * the upgrade panel. Drawn above HUD and popup.
   */
  function drawUpgradeTutorial(ctx, t) {
    let target = null, label = null;
    if (!popup) {
      target = buttons.find(b => b.id === 'upgrade');
      label = 'UPGRADE YOUR FARM!';
    } else if (popup.type === 'upgrades') {
      let best = Infinity;
      for (const c of popup.cards || []) {
        const inf = Upgrades.info(popup.farmId, c.key);
        if (!inf.maxed && SaveManager.data.coins >= inf.cost && inf.cost < best) {
          best = inf.cost;
          target = c.btn;
        }
      }
      label = 'TAP BUY!';
    }
    if (!target) return;

    // pulsing golden glow around the target
    const pulse = (Math.sin(t * 6) + 1) / 2;
    const g = 4 + pulse * 4;
    ctx.save();
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    ctx.strokeStyle = '#ffe98a';
    ctx.lineWidth = 3;
    ctx.strokeRect(target.x - g, target.y - g, target.w + g * 2, target.h + g * 2);
    ctx.globalAlpha = 0.25 + pulse * 0.2;
    ctx.fillStyle = '#ffe98a';
    ctx.fillRect(target.x - 2, target.y - 2, target.w + 4, target.h + 4);
    ctx.restore();

    // bobbing hand pointing at the target
    drawHand(ctx, target.x + target.w / 2 + 10, target.y + target.h / 2 + 8 + Math.sin(t * 4) * 4);

    // instruction label (kept fully on screen)
    const lw = measure(label, SIZE.BUTTON);
    const lx = U.clamp(target.x + target.w / 2, lw / 2 + 6, W - lw / 2 - 6);
    drawText(ctx, label, lx, target.y - g - 22, SIZE.BUTTON, '#ffe98a', 'center', true, false, W - 12);
  }

  /** Returns true if the tap was consumed by UI. */
  function tap(x, y) {
    if (popup) {
      if (inRect(x, y, popup.closeRect)) {
        if (Game.upgradeTutorialActive) return true; // tutorial: must buy before closing
        AudioManager.play('click'); popup = null; panelFx = []; return true;
      }
      if (popup.type === 'upgrades') {
        for (const c of popup.cards || []) {
          if (inRect(x, y, c.btn)) {
            const r = Upgrades.buy(popup.farmId, c.key);
            if (r.ok) {
              AudioManager.play('buy');
              popup.fx[c.key] = 1;
              spawnPanelFx(c.btn.x + c.btn.w / 2, c.btn.y + c.btn.h / 2);
              Game.onUpgradePurchased();
            } else {
              AudioManager.play('error');
              toast = { text: r.reason, t: 1.6 };
            }
            return true;
          }
        }
        return true;
      }
      if (popup.type === 'discovery') {
        if (inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          popup = null;
          Game.endCelebration();
        }
        return true; // no other way out — gameplay stays paused until CONTINUE
      }
      if (popup.type === 'adPlaying') return true; // no skipping the ad
      if (popup.type === 'pigeonAd') {
        if (inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          popup = { type: 'adPlaying', t: 0, dur: Pigeon.info().adDur, onDone: Pigeon.adCompleted };
        }
        return true;
      }
      if (popup.type === 'tornadoAd') {
        if (inRect(x, y, popup.okRect)) {
          AudioManager.play('click');
          popup = { type: 'adPlaying', t: 0, dur: Tornado.info().adDur, onDone: Tornado.adCompleted };
        } else if (inRect(x, y, popup.cancelRect)) {
          AudioManager.play('click');
          popup = null;
        }
        return true;
      }
      if (popup.type === 'unlock' && inRect(x, y, popup.okRect)) {
        Game.tryUnlock(popup.farmId);
        return true;
      }
      if (popup.type === 'settings') {
        if (inRect(x, y, popup.musicRect)) { AudioManager.setMusic(!AudioManager.musicOn); SaveManager.data.settings.music = AudioManager.musicOn; SaveManager.save(); AudioManager.play('click'); return true; }
        if (inRect(x, y, popup.sfxRect)) { AudioManager.setSfx(!AudioManager.sfxOn); SaveManager.data.settings.sfx = AudioManager.sfxOn; SaveManager.save(); AudioManager.play('click'); return true; }
        if (inRect(x, y, popup.resetRect)) { AudioManager.play('click'); popup = { type: 'confirm-reset' }; return true; }
      }
      if (popup.type === 'confirm-reset') {
        if (inRect(x, y, popup.okRect)) { AudioManager.play('click'); popup = null; Game.resetAll(); return true; }
        if (inRect(x, y, popup.cancelRect)) { AudioManager.play('click'); popup = null; return true; }
      }
      return true; // modal swallows all taps
    }
    for (const b of buttons) {
      if (b.scene !== 'both' && b.scene !== Game.scene) continue;
      if (Game.upgradeTutorialActive && b.id !== 'upgrade') continue; // tutorial: only UPGRADE works
      if (inRect(x, y, b)) {
        AudioManager.play('click');
        Game.onButton(b.id);
        return true;
      }
    }
    return false;
  }

  // ---------------- loading screen ----------------
  function drawLoading(ctx, t) {
    ctx.fillStyle = '#2e2416';
    ctx.fillRect(0, 0, W, H);
    // decorative fence strip
    const f = SPRITES.fenceH(24);
    for (let x = 0; x < W; x += 44) ctx.drawImage(f, x, H / 2 + 60, 44, 26);
    drawText(ctx, 'FARM EVOLUTION', W / 2, H / 2 - 66, SIZE.TITLE, '#ffe98a', 'center', true, false, W - 24);
    const img = SPRITES.animal('chicken', 1, (t * 3 | 0) % 2 ? 'walk' : 'idle');
    PIXEL.blit(ctx, img, W / 2, H / 2 + 30, 3);
    const dots = '.'.repeat(1 + ((t * 2) | 0) % 3);
    drawText(ctx, 'TAP TO START' , W / 2, H / 2 + 100, SIZE.BUTTON, '#f4e8cc', 'center', true);
    drawText(ctx, 'LOADING' + dots, W / 2, H / 2 + 124, SIZE.CAPTION, '#c8b088', 'center');
  }

  return {
    SIZE, drawText, measure, woodPanel, woodSign, drawButton, drawHUD, drawPopup, drawLoading,
    drawHand, drawUpgradeTutorial,
    tap, coinTarget,
    pulseCoin() { coinPulse = 1; },
    showToast(text) { toast = { text, t: 1.6 }; },
    openPopup(p) { popup = p; },
    closePopup() { popup = null; panelFx = []; },
    get popup() { return popup; },
    syncCoins() { displayedCoins = SaveManager.data.coins; },
  };
})();
</script>
<script>
/**
 * GameManager — owns the canvas, main loop, scene switching
 * (loading / farm / map), global economy, unlock flow and autosave.
 */
const Game = (() => {
  const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
  let canvas, ctx, scale = 1, offX = 0, offY = 0;
  let scene = 'loading';         // 'loading' | 'farm' | 'map'
  let farmScene = null;
  let mapScene = null;
  let lastT = 0, dt = 0, elapsed = 0, autosaveT = 0, idleT = 0;
  let started = false;
  let celebration = null;        // active discovery celebration, see startCelebration()
  let upgradeTutorial = null;    // active first-upgrade tutorial: {t}, see maybeStartUpgradeTutorial()

  // ---------------- setup ----------------
  function init() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    SaveManager.load();
    Idle.tick(); // apply capped offline production to every farm before scenes build
    AudioManager.setMusic(SaveManager.data.settings.music);
    AudioManager.setSfx(SaveManager.data.settings.sfx);
    resize();
    window.addEventListener('resize', resize);
    bindInput();
    mapScene = new MapScene();
    farmScene = new FarmScene(SaveManager.data.currentFarm);
    UI.syncCoins();
    scheduleFrame(loop);
  }

  /**
   * rAF normally, with a timer watchdog so the idle sim keeps running when
   * the tab is hidden (rAF stops firing there, even for pending frames).
   * Whichever fires first runs the frame; the loser is a no-op.
   */
  function scheduleFrame(fn) {
    let done = false;
    const run = t => { if (done) return; done = true; fn(t); };
    requestAnimationFrame(run);
    setTimeout(() => run(performance.now()), 50);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const sw = window.innerWidth, sh = window.innerHeight;
    scale = Math.min(sw / W, sh / H);
    canvas.style.width = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const rect = { w: Math.round(W * scale), h: Math.round(H * scale) };
    offX = (sw - rect.w) / 2; offY = (sh - rect.h) / 2;
  }

  // ---------------- input ----------------
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? (e.touches[0] || e.changedTouches[0]).clientX : e.clientX) - r.left;
    const cy = (e.touches ? (e.touches[0] || e.changedTouches[0]).clientY : e.clientY) - r.top;
    return { x: cx / scale, y: cy / scale };
  }

  function bindInput() {
    const down = e => {
      e.preventDefault();
      AudioManager.ensure();
      const p = toGame(e);
      if (scene === 'loading') { start(); return; }
      if (UFO.cinematicActive) return;                   // abduction cinematic blocks all input
      if (Tornado.active) return;                        // tornado sweep blocks all input
      if (celebration && !celebration.popupOpen) return; // sequence plays untouched
      if (UI.tap(p.x, p.y)) return;
      if (celebration) return;                           // popup swallows farm taps
      if (upgradeTutorial) return;                       // tutorial: only the upgrade flow is tappable
      if (scene === 'farm' && Tornado.tap(p.x, p.y)) return;
      if (scene === 'farm' && Pigeon.tap(p.x, p.y)) return;
      if (scene === 'farm') farmScene.pointerDown(p.x, p.y);
      else if (scene === 'map' && !mapScene.unlockAnim) {
        const id = mapScene.tappedFarm(p.x, p.y);
        if (id >= 0) onMapFarmTap(id);
      }
    };
    const move = e => {
      e.preventDefault();
      if (UFO.cinematicActive || Tornado.active) return;
      const p = toGame(e);
      if (scene === 'farm') farmScene.pointerMove(p.x, p.y);
    };
    const up = e => {
      e.preventDefault();
      if (UFO.cinematicActive || Tornado.active) return;
      if (scene === 'farm') farmScene.pointerUp();
    };
    canvas.addEventListener('mousedown', down);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    canvas.addEventListener('touchstart', down, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', up, { passive: false });
  }

  function start() {
    if (started) return;
    started = true;
    scene = 'farm';
    AudioManager.play('click');
    collectFarmPending(SaveManager.data.currentFarm);
  }

  /** Deliver a farm's accumulated background earnings as flying coins. */
  function collectFarmPending(farmId) {
    const amt = Idle.collect(farmId);
    if (amt <= 0) return;
    const b = farmScene.bounds;
    VFXManager.coinPayout(b.x + b.w / 2, b.y + b.h / 2, amt, 40, 25);
  }

  // ---------------- discovery celebration ----------------
  /**
   * Interrupt gameplay for a first-time evolution: zoom toward the merge
   * point, flash, golden sparkles, then open the discovery popup.
   * Gameplay resumes when the player presses CONTINUE (endCelebration).
   */
  function startCelebration(animal, x, y) {
    celebration = {
      t: 0, x, y,
      species: animal.species,
      stage: animal.stage,
      animal,
      sparkleT: 0,
      popupOpen: false,
    };
    AudioManager.play('unlock');
  }

  function updateCelebration() {
    const c = celebration, D = CONFIG.DISCOVERY;
    c.t += dt;
    // let the new animal finish its spawn pop, then hold it still
    if (c.animal.state === 'spawning') c.animal.update(dt, farmScene.bounds, farmScene);
    // golden sparkles raining around the merge point
    c.sparkleT -= dt;
    if (c.sparkleT <= 0 && !c.popupOpen) {
      c.sparkleT = D.SPARKLE_RATE;
      VFXManager.sparkle(c.x, c.y - 16, 5, 26);
      if (Math.random() < 0.5) {
        VFXManager.burst(c.x, c.y - 14, ['#ffe98a', '#f4c437', '#fff6d0'], 4, 70);
      }
    }
    if (!c.popupOpen && c.t >= D.PRE_POPUP_TIME) {
      c.popupOpen = true;
      UI.openPopup({ type: 'discovery', species: c.species, stage: c.stage, fxT: 0, confetti: [] });
    }
  }

  /** Camera zoom factor toward the merge point during the celebration. */
  function celebrationZoom() {
    const c = celebration, D = CONFIG.DISCOVERY;
    const t = Math.min(c.t / D.ZOOM_TIME, 1);
    return 1 + D.ZOOM_AMOUNT * (1 - Math.pow(1 - t, 3)); // ease-out cubic
  }

  /** White flash alpha, peaking right after the zoom lands. */
  function celebrationFlash() {
    const c = celebration, D = CONFIG.DISCOVERY;
    const ft = c.t - D.ZOOM_TIME * 0.55;
    if (ft < 0 || ft > D.FLASH_TIME) return 0;
    return Math.sin((ft / D.FLASH_TIME) * Math.PI) * 0.85;
  }

  function endCelebration() {
    celebration = null;
    farmScene.persist();
  }

  // ---------------- first-upgrade tutorial ----------------
  /** Cheapest non-maxed upgrade cost on the current farm. */
  function cheapestUpgradeCost() {
    const id = SaveManager.data.currentFarm;
    const keys = ['spawn'];
    for (let s = 0; s < CONFIG.UPGRADES.STAGES.length; s++) keys.push(s);
    let min = Infinity;
    for (const k of keys) {
      if (!Upgrades.isMaxed(id, k)) min = Math.min(min, Upgrades.cost(id, k));
    }
    return min;
  }

  /**
   * First time the player can afford an upgrade: freeze gameplay, spotlight
   * the UPGRADE button, then the BUY button, until the purchase completes.
   */
  function maybeStartUpgradeTutorial() {
    if (upgradeTutorial || SaveManager.data.upgradeTutorialDone) return;
    if (farmScene.tutorial || UI.popup) return;
    if (SaveManager.data.coins < cheapestUpgradeCost()) return;
    farmScene.pointerUp(); // settle any in-progress drag
    upgradeTutorial = { t: 0 };
    AudioManager.play('pop');
  }

  /** Any successful upgrade purchase completes the tutorial for good. */
  function onUpgradePurchased() {
    if (!SaveManager.data.upgradeTutorialDone) {
      SaveManager.data.upgradeTutorialDone = true;
      SaveManager.save();
    }
    upgradeTutorial = null;
  }

  // ---------------- economy ----------------
  function addCoins(n) {
    SaveManager.data.coins += n;
    UI.pulseCoin();
  }

  // ---------------- buttons ----------------
  function onButton(id) {
    if (id === 'settings') {
      UI.openPopup({ type: 'settings' });
    } else if (id === 'upgrade') {
      UI.openPopup({ type: 'upgrades', farmId: SaveManager.data.currentFarm, fx: {} });
    } else if (id === 'map') {
      goToMap();
    }
  }

  function onMapFarmTap(id) {
    AudioManager.play('click');
    if (SaveManager.data.unlocked[id]) {
      // switch farm: load that farm's own animals, upgrades and UFO state
      Idle.tick(); // reconcile so the board matches what accumulated offscreen
      Pigeon.reset(); // pays out any rain still falling, keeps saved perch state
      Tornado.reset();
      SaveManager.data.currentFarm = id;
      SaveManager.save();
      UFO.reset();
      farmScene = new FarmScene(id);
      scene = 'farm';
      collectFarmPending(id);
    } else {
      UI.openPopup({ type: 'unlock', farmId: id });
    }
  }

  // ---------------- unlock flow ----------------
  function tryUnlock(farmId) {
    const cost = CONFIG.UNLOCK_COSTS[farmId];
    if (SaveManager.data.coins < cost) {
      UI.showToast('NOT ENOUGH COINS!');
      AudioManager.play('error');
      return;
    }
    SaveManager.data.coins -= cost;
    SaveManager.save();
    UI.closePopup();
    // move to map & play the golden path animation
    goToMap();
    mapScene.playUnlock(farmId);
  }

  function onUnlockAnimDone(farmId) {
    SaveManager.data.unlocked[farmId] = true;
    SaveManager.data.currentFarm = farmId;
    SaveManager.save();
    // brief pause then enter the new farm
    setTimeout(() => {
      UFO.reset();
      Pigeon.reset();
      Tornado.reset();
      farmScene = new FarmScene(farmId);
      scene = 'farm';
      AudioManager.play('pop');
    }, 900);
  }

  function goToMap() {
    farmScene.persist();
    // stamp the live farm's clock before it goes background, accrue the rest
    Idle.tick(SaveManager.data.currentFarm);
    scene = 'map';
    mapScene.queuePendingCollect();
  }

  function resetAll() {
    Pigeon.reset(true); // discard any in-flight rain, no payout into the fresh save
    Tornado.reset();
    SaveManager.reset();
    celebration = null;
    upgradeTutorial = null;
    UFO.reset();
    UI.syncCoins();
    mapScene = new MapScene();
    farmScene = new FarmScene(0);
    scene = 'farm';
  }

  // ---------------- main loop ----------------
  function loop(t) {
    dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    elapsed += dt;
    Game.dt = dt;

    if (scene === 'loading') {
      UI.drawLoading(ctx, elapsed);
      scheduleFrame(loop);
      return;
    }

    // update (gameplay pauses during a celebration, the upgrade tutorial,
    // or the UFO abduction cinematic — the cinematic itself keeps animating)
    if (celebration) updateCelebration();
    else if (scene === 'farm') {
      if (UFO.cinematicActive) UFO.update(dt);
      // tornado sweep: gameplay paused, only the storm + UFO collects animate
      else if (Tornado.active) { Tornado.updateRun(dt); UFO.update(dt); }
      else {
        maybeStartUpgradeTutorial();
        if (upgradeTutorial) upgradeTutorial.t += dt;
        else {
          farmScene.update(dt); UFO.update(dt);
          Pigeon.update(dt, !!farmScene.tutorial);
          Tornado.update(dt, !!farmScene.tutorial);
        }
      }
    }
    else mapScene.update(dt);
    VFXManager.update(dt);

    // background farms: reconcile elapsed production on a coarse tick
    idleT += dt;
    if (idleT >= CONFIG.IDLE.TICK_INTERVAL) {
      idleT = 0;
      Idle.tick(scene === 'farm' ? SaveManager.data.currentFarm : -1);
      // while watching the map, freshly accrued coins keep flying in
      if (scene === 'map' && !mapScene.unlockAnim) mapScene.queuePendingCollect();
    }

    // autosave
    autosaveT += dt;
    if (autosaveT >= CONFIG.AUTOSAVE_INTERVAL) {
      autosaveT = 0;
      if (scene === 'farm') farmScene.persist();
      else SaveManager.save();
    }

    // draw
    ctx.fillStyle = '#1a140e';
    ctx.fillRect(0, 0, W, H);
    if (scene === 'farm') {
      if (celebration) {
        // zoom the camera toward the merge location
        const z = celebrationZoom();
        ctx.save();
        ctx.translate(celebration.x, celebration.y);
        ctx.scale(z, z);
        ctx.translate(-celebration.x, -celebration.y);
        farmScene.draw(ctx);
        VFXManager.draw(ctx);
        ctx.restore();
        const flash = celebrationFlash();
        if (flash > 0) {
          ctx.globalAlpha = flash;
          ctx.fillStyle = '#fff9e0';
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      } else {
        // subtle screen shake while poops are hitting the ground
        const sh = Pigeon.shakeOffset();
        ctx.save();
        ctx.translate(sh.x, sh.y);
        farmScene.draw(ctx);
        VFXManager.draw(ctx);
        ctx.restore();
      }
    } else {
      mapScene.draw(ctx);
      VFXManager.draw(ctx);
    }
    UI.drawHUD(ctx, scene);
    UI.drawPopup(ctx);
    if (upgradeTutorial && scene === 'farm') UI.drawUpgradeTutorial(ctx, upgradeTutorial.t);

    scheduleFrame(loop);
  }

  window.addEventListener('load', init);
  window.addEventListener('beforeunload', () => {
    Idle.tick(scene === 'farm' ? SaveManager.data.currentFarm : -1);
    if (farmScene) farmScene.persist();
    SaveManager.save();
  });

  return {
    addCoins, onButton, tryUnlock, onUnlockAnimDone, resetAll,
    startCelebration, endCelebration, onUpgradePurchased,
    get scene() { return scene; },
    get farm() { return farmScene; },
    get celebrating() { return !!celebration; },
    get upgradeTutorialActive() { return !!upgradeTutorial; },
    dt: 1 / 60,
  };
})();
</script>
</body>
</html>
