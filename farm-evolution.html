  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Permanent parking spot: hovering beside the farmhouse in the upper-right
   * corner of the scene, anchored to the view's top/right edges (not the
   * pen). It fills the clear sky strip between the top HUD bar (backdrop
   * ends at y 56) and the pen's back fence (starts at y 140), to the right
   * of the farmhouse (widest building ends at x 234) — fully outside the
   * fenced animal area, never covering the house, and clear of the settings
   * button (ends at y 44). The right flanking tree was moved to the
   * bottom-right grass (environment.js) to keep this corner open. The whole
   * 360x640 virtual view is letterboxed on every device, so an edge anchor
   * inside it stays fully visible and tappable at any resolution or aspect
   * ratio. (Saucer is 88x52 px, bottom-anchored; counter extends ~30 px
   * below.)
   */
  function spot() {
    return {
      x: CONFIG.VIEW_W - 48,   // right-edge anchored: saucer spans x 268-356
      y: 110,                  // top-edge anchored: saucer spans y 58-110
    };
  }

  /** Entry point from FarmScene.merge for a Mutant + Mutant pair. */
  function collect(x, y) {
    // record the Mutant 2 as in-transit so a reload mid-animation can't lose it
    data().pending = (data().pending || 0) + 1;
    SaveManager.save();
    if (!data().landed) {
      if (cine) return; // already playing (shouldn't happen: input is blocked)
      cine = {
        phase: 'spawn', t: 0, x, y,
        ufoX: x, ufoY: -30,
        alien: { y, s: 0 },
      };
    } else {
      collects.push({ x, y, t: 0 });
      AudioManager.play('beam');
    }
  }

  /** A Mutant 2 reached the UFO: bump the collection + production for good. */
  function addAlien() {
    const p = spot();
    data().aliens++;
    data().pending = Math.max(0, (data().pending || 0) - 1);
    SaveManager.save();
    AudioManager.play('alien');
    VFXManager.burst(p.x, p.y - 24, ['#7de87a', '#c4ffb8', '#ffe98a', '#ffffff'], 20, 120);
    VFXManager.sparkle(p.x, p.y - 26, 14, 26);
    VFXManager.floatText(p.x, p.y - 52, '+1 MUTANT 2', '#c4ffb8');
    VFXManager.floatText(p.x, p.y - 38, '+' + Upgrades.alienValue(SaveManager.data.currentFarm) + '/' + C().INTERVAL.toFixed(0) + 'S');
    flashT = 0.3;
  }

  // ---------------- update ----------------
  function update(dt) {
    bobT += dt;
    if (flashT > 0) flashT -= dt;
    if (cine) { updateCinematic(dt); return; }

    // recover Mutant 2s stranded by a reload mid-animation
    const stranded = (data().pending || 0) - collects.length;
    if (stranded > 0) {
      if (!data().landed) {
        // replay the abduction from the middle of the pen
        const cx = ENVIRONMENT.PLAY.x + ENVIRONMENT.PLAY.w / 2;
        const cy = ENVIRONMENT.PLAY.y + ENVIRONMENT.PLAY.h / 2;
        cine = { phase: 'spawn', t: 0, x: cx, y: cy, ufoX: cx, ufoY: -30, alien: { y: cy, s: 0 } };
        return;
      }
      for (let i = 0; i < stranded; i++) addAlien();
    }

    // quick collects (post-landing, < 1 s each)
    for (let i = collects.length - 1; i >= 0; i--) {
      const c = collects[i];
      c.t += dt;
      if (c.t >= C().QUICK_COLLECT_TIME) {
        collects.splice(i, 1);
        addAlien();
      }
    }

    // passive coin production, scaling with the collection
    if (data().landed && data().aliens > 0) {
      prodT += dt;
      if (prodT >= C().INTERVAL) {
        prodT = 0;
        const p = spot();
        const value = data().aliens * Upgrades.alienValue(SaveManager.data.currentFarm);
        const t = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 18, t.x, t.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 34, '+' + value);
      }
    }
  }

  function updateCinematic(dt) {
    const c = cine, D = C().CINEMATIC;
    c.t += dt;
    if (c.phase === 'spawn') {
      // the merged pair materializes as a MUTANT 2
      c.alien.s = U.easeOutBack(Math.min(c.t / 0.5, 1));
      if (Math.random() < 0.3) VFXManager.sparkle(c.x, c.y - 12, 3, 14);
      if (c.t >= D.SPAWN) { c.phase = 'arrive'; c.t = 0; AudioManager.play('ufo'); }
    } else if (c.phase === 'arrive') {
      // UFO descends from the sky to hover over the Mutant 2
      const t = smooth(c.t / D.ARRIVE);
      c.ufoX = c.x + Math.sin(t * Math.PI * 3) * 12 * (1 - t);
      c.ufoY = U.lerp(-30, c.y - 92, t);
      if (c.t >= D.ARRIVE) { c.phase = 'beam'; c.t = 0; AudioManager.play('beam'); }
    } else if (c.phase === 'beam') {
      // tractor beam pulls the Mutant 2 up into the saucer
      const t = U.clamp(c.t / D.BEAM, 0, 1);
      c.alien.y = U.lerp(c.y, c.ufoY + 14, t * t);
      c.alien.s = 1 - t * 0.7;
      if (Math.random() < 0.5) VFXManager.sparkle(c.x, U.lerp(c.y, c.ufoY + 20, Math.random()), 2, 8);
      if (c.t >= D.BEAM) {
        c.phase = 'fly'; c.t = 0;
        c.fromX = c.ufoX; c.fromY = c.ufoY;
        VFXManager.burst(c.ufoX, c.ufoY - 10, ['#7de87a', '#c4ffb8', '#ffffff'], 16, 100);
        AudioManager.play('ufo');
      }
    } else if (c.phase === 'fly') {
      // cruise to the permanent landing corner with a little arc
      const p = spot();
      const t = smooth(c.t / D.FLY);
      c.ufoX = U.lerp(c.fromX, p.x, t);
      c.ufoY = U.lerp(c.fromY, p.y - 26, t) - Math.sin(t * Math.PI) * 26;
      if (c.t >= D.FLY) { c.phase = 'land'; c.t = 0; }
    } else if (c.phase === 'land') {
      const p = spot();
      c.ufoX = p.x;
      c.ufoY = U.lerp(p.y - 26, p.y, smooth(c.t / D.LAND));
      if (c.t >= D.LAND) {
        cine = null;
        data().landed = true;
        addAlien();   // first alien joins the collection (also saves)
      }
    }
  }

  // ---------------- draw ----------------
  /** Soft tractor-beam cone from the saucer belly down to the ground. */
  function drawBeam(ctx, x, topY, groundY, alpha, wTop = 7, wBot = 24) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = '#c4ffb8';
    ctx.beginPath();
    ctx.moveTo(x - wTop, topY); ctx.lineTo(x + wTop, topY);
    ctx.lineTo(x + wBot, groundY); ctx.lineTo(x - wBot, groundY);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath(); ctx.ellipse(x, groundY, wBot, 6, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawSaucer(ctx, x, y, aliens, shadow = true) {
    if (shadow) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(x, spot().y + 6, 26, 6, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    const phase = Math.floor(bobT * 5) % 3;
    PIXEL.blit(ctx, SPRITES.ufo(phase, aliens), x, y, 2);
  }

  function draw(ctx) {
    if (cine) { drawCinematic(ctx); return; }
    if (!data().landed) return;
    const p = spot();
    const bob = Math.sin(bobT * 2) * 2;

    // arrival flash: short tractor beam under the parked saucer
    if (flashT > 0) drawBeam(ctx, p.x, p.y - 6 + bob, p.y + 8, Math.min(1, flashT * 4));

    // Mutant 2s being beamed in (quick collect)
    for (const c of collects) {
      const t = U.clamp(c.t / C().QUICK_COLLECT_TIME, 0, 1);
      const pop = U.easeOutBack(Math.min(c.t / 0.15, 1));
      const e = smooth(t);
      const ax = U.lerp(c.x, p.x, e);
      const ay = U.lerp(c.y, p.y - 12, e) - Math.sin(e * Math.PI) * 36;
      PIXEL.blit(ctx, SPRITES.mutant2(species()), ax, ay, 2 * pop * (1 - t * 0.55));
      if (Math.random() < 0.5) VFXManager.sparkle(ax, ay - 8, 1, 6);
    }

    drawSaucer(ctx, p.x, p.y + bob, data().aliens);

    // collection counter under the saucer, in the sky gap above the pen's
    // back fence (fence starts at y 140; the counter ends right there)
    if (data().aliens > 0) {
      PIXEL.blit(ctx, SPRITES.mutant2(species()), p.x - 2, p.y + 30, 1);
      UI.drawText(ctx, 'X' + data().aliens, p.x + 6, p.y + 16, UI.SIZE.BODY, '#c4ffb8', 'left', true);
    }
  }

  function drawCinematic(ctx) {
    const c = cine;
    // dim the farm for drama
    ctx.fillStyle = 'rgba(8, 12, 28, 0.35)';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);

    if (c.phase === 'beam') {
      const pulse = 0.7 + Math.sin(bobT * 16) * 0.3;
      drawBeam(ctx, c.ufoX, c.ufoY - 4, c.y + 6, pulse);
    }
    if (c.phase !== 'fly' && c.phase !== 'land') {
      PIXEL.blit(ctx, SPRITES.mutant2(species()), c.x, c.alien.y, 2 * c.alien.s);
    }
    if (c.phase !== 'spawn') {
      drawSaucer(ctx, c.ufoX, c.ufoY, 0, c.phase === 'land');
    }
  }

  return {
    collect, update, draw,
    get cinematicActive() { return !!cine; },
    /** Clear transient animation state (farm switch / full reset). */
    reset() { cine = null; collects = []; prodT = 0; flashT = 0; },
  };
})();
</script>
<script>
/**
 * PigeonManager — reward-ad event layer (Pigeon & Poop Rain).
 *
 * Every SPAWN_INTERVAL seconds a pigeon flies across the screen and lands
 * on the back fence of the current farm, where it perches for STAY_TIME
 * seconds playing idle animations (blinking, looking around, the odd wing
 * flap). Tapping it opens the reward-ad popup; completing the ad removes
 * the pigeon and triggers a Poop Rain: poops (the same asset the animals
 * produce) fall over the pen and each one auto-collects into coins. The
 * whole rain is worth REWARD_MINUTES of the farm's current passive income
 * (see poopValue), so the offer scales with the player's economy forever.
 * Ignoring the pigeon for STAY_TIME loses the opportunity until the next
 * visit.
 *
 * Per-farm state (spawn countdown + remaining perch time) lives in
 * SaveManager.data.pigeon, so every farm runs its own independent event
 * and a pigeon left perched on one farm is restored when returning to it.
 * Only one pigeon can exist at a time on a farm, and it never appears
 * during the merge tutorial, the upgrade tutorial, celebrations or the
 * UFO cinematic (Game only ticks this manager during normal gameplay).
 *
 * Balancing values live in CONFIG.PIGEON and can be overridden at runtime
 * through window.RemoteConfig.PIGEON (Remote Config hook).
 */
const Pigeon = (() => {
  const C = () => Object.assign({}, CONFIG.PIGEON, (window.RemoteConfig || {}).PIGEON);
  // each farm has its own pigeon slot: always operate on the current farm's
  const data = () => SaveManager.data.pigeon[SaveManager.data.currentFarm];

  let bird = null;      // {state:'fly'|'idle'|'leave', t, x, y, fromX, fromY, toX, toY, dir, ...}
  let poops = [];       // {x, y, vy, groundY, state:'fall'|'land', t}
  let rain = null;      // {t, spawned}
  let rainValue = 0;    // coins per poop, locked in when the ad completes
  let shakeT = 0;       // impact screen-shake time left

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Random perch spot on the back fence rail — clear of the UFO corner on
   * the right and the farmhouse behind the fence center.
   */
  function perchSpot() {
    const P = ENVIRONMENT.PLAY, cx = CONFIG.VIEW_W / 2;
    const x = Math.random() < 0.5
      ? U.rand(P.x + 30, cx - 64)
      : U.rand(cx + 64, P.x + P.w - 90);
    return { x, y: P.y - 12 };
  }

  /**
   * Coins one poop pays out. Auto mode (COIN_PER_POOP = 0): the whole rain
   * is worth REWARD_MINUTES of the farm's CURRENT passive income, split
   * evenly across POOP_COUNT poops. Pricing the ad off the live income
   * rate keeps it a meaningful accelerator at every stage of the game —
   * "a few minutes of progress, right now" — without ever dwarfing normal
   * play or going stale late-game. MIN_PER_POOP floors a fresh farm.
   */
  function poopValue() {
    const cfg = C();
    if (cfg.COIN_PER_POOP > 0) return cfg.COIN_PER_POOP;
    const farm = Game.farm;
    const rate = Upgrades.incomeRate(SaveManager.data.currentFarm, farm ? farm.animals : []);
    return Math.max(cfg.MIN_PER_POOP, Math.round(rate * cfg.REWARD_MINUTES * 60 / cfg.POOP_COUNT));
  }

  function spawn(restore) {
    const p = perchSpot();
    const dir = Math.random() < 0.5 ? 1 : -1;   // 1 = enters from the left
    bird = {
      state: restore ? 'idle' : 'fly', t: 0,
      x: p.x, y: p.y, toX: p.x, toY: p.y,
      fromX: dir === 1 ? -24 : CONFIG.VIEW_W + 24,
      fromY: p.y - 70,
      dir,
      blink: false, blinkT: U.rand(1, 3),
      look: false, lookT: U.rand(2, 4),
      flap: 0, flapT: U.rand(3, 6),
      attractT: 2.0,
    };
    if (!restore) {
      bird.x = bird.fromX; bird.y = bird.fromY;
      data().remaining = C().STAY_TIME;
      SaveManager.save();
      AudioManager.play('flap');
    }
  }

  // ---------------- update ----------------
  function update(dt, tutorialActive) {
    if (shakeT > 0) shakeT -= dt;
    const d = data();

    const enabled = C().ENABLED; // kill switch gates new visits only

    // restore a pigeon that was left perched on this farm
    if (!bird && enabled && d.remaining > 0 && !tutorialActive) spawn(true);

    // spawn countdown: one pigeon at a time, never during the tutorial
    if (!bird && enabled && d.remaining <= 0 && !tutorialActive) {
      d.next -= dt;
      if (d.next <= 0) spawn(false);
    }

    if (bird) updateBird(dt);
    if (rain || poops.length) updateRain(dt);
  }

  function updateBird(dt) {
    const b = bird, d = data();
    b.t += dt;
    if (b.state === 'fly') {
      // swoop across the sky, then glide down onto the fence rail
      const t = smooth(b.t / C().FLY_TIME);
      b.x = U.lerp(b.fromX, b.toX, t);
      b.y = U.lerp(b.fromY, b.toY, t * t) - Math.sin(t * Math.PI) * 16;
      if (b.t >= C().FLY_TIME) {
        b.state = 'idle'; b.t = 0; b.x = b.toX; b.y = b.toY;
        VFXManager.dust(b.x, b.y, 4);
        AudioManager.play('coo');
      }
    } else if (b.state === 'idle') {
      // perch countdown (frozen while the reward popup / ad is open, so
      // closing the popup never eats the player's remaining window)
      const p = UI.popup;
      const frozen = p && (p.type === 'pigeonAd' || p.type === 'adPlaying');
      if (!frozen) {
        d.remaining -= dt;
        if (d.remaining <= 0) {
          // ignored: the opportunity is lost until the next visit
          d.remaining = 0;
          d.next = C().SPAWN_INTERVAL;
          SaveManager.save();
          b.state = 'leave'; b.t = 0;
          b.fromX = b.x; b.fromY = b.y;
          b.dir = b.x < CONFIG.VIEW_W / 2 ? -1 : 1;
          AudioManager.play('flap');
          return;
        }
      }
      // idle acting: blink, look around, occasional wing flap
      b.blinkT -= dt;
      if (b.blinkT <= 0) { b.blink = !b.blink; b.blinkT = b.blink ? 0.12 : U.rand(1.5, 4); }
      b.lookT -= dt;
      if (b.lookT <= 0) { b.look = !b.look; b.lookT = b.look ? U.rand(0.5, 1.1) : U.rand(2, 4.5); }
      if (b.flap > 0) b.flap -= dt;
      else {
        b.flapT -= dt;
        if (b.flapT <= 0) { b.flap = 0.4; b.flapT = U.rand(3.5, 7); AudioManager.play('flap'); }
      }
      // attention sparkle so the player spots the visitor
      b.attractT -= dt;
      if (b.attractT <= 0) { b.attractT = 3.2; VFXManager.sparkle(b.x, b.y - 28, 4, 10); }
    } else if (b.state === 'leave') {
      const t = b.t / C().LEAVE_TIME;
      b.x = b.fromX + b.dir * t * 260;
      b.y = b.fromY - smooth(t) * 180 + Math.sin(b.t * 14) * 2;
      if (b.t >= C().LEAVE_TIME) bird = null;
    }
  }

  function updateRain(dt) {
    if (rain) {
      rain.t += dt;
      const count = C().POOP_COUNT;
      const gap = C().RAIN_DURATION / count;
      while (rain.spawned < count && rain.t >= rain.spawned * gap) {
        const P = ENVIRONMENT.PLAY;
        poops.push({
          x: U.rand(P.x + 14, P.x + P.w - 14),
          groundY: U.rand(P.y + 20, P.y + P.h - 8),
          y: -16 - U.rand(0, 30),
          vy: U.rand(120, 200),
          state: 'fall', t: 0,
        });
        rain.spawned++;
      }
      if (rain.spawned >= count) rain = null;
    }
    for (let i = poops.length - 1; i >= 0; i--) {
      const p = poops[i];
      p.t += dt;
      if (p.state === 'fall') {
        p.vy += 620 * dt;
        p.y += p.vy * dt;
        if (p.y >= p.groundY) {
          p.y = p.groundY; p.state = 'land'; p.t = 0;
          VFXManager.dust(p.x, p.y, 6);
          AudioManager.play('poop');
          shakeT = 0.18;
        }
      } else if (p.t >= 0.4) {
        // auto-collect: the poop turns into coins flying to the HUD
        const value = rainValue;
        const tgt = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 6, tgt.x, tgt.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 18, '+' + value);
        VFXManager.sparkle(p.x, p.y - 8, 5, 8);
        poops.splice(i, 1);
      }
    }
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the perched pigeon (opens the ad popup). */
  function tap(x, y) {
    if (!bird || bird.state !== 'idle') return false;
    if (U.dist(x, y, bird.x, bird.y - 12) > 22) return false;
    AudioManager.play('coo');
    UI.openPopup({ type: 'pigeonAd' });
    return true;
  }

  /** The reward ad finished successfully: pigeon leaves, poops fall. */
  function adCompleted() {
    const d = data();
    d.remaining = 0;
    d.next = C().SPAWN_INTERVAL + C().REWARD_COOLDOWN;
    SaveManager.save();
    if (bird) {
      VFXManager.burst(bird.x, bird.y - 12, ['#ffe98a', '#fff6d0', '#c6cfd8', '#ffffff'], 14, 100);
      VFXManager.sparkle(bird.x, bird.y - 16, 8, 14);
      bird = null;
    }
    rainValue = poopValue();
    rain = { t: 0, spawned: 0 };
    AudioManager.play('unlock');
  }

  // ---------------- draw ----------------
  function draw(ctx) {
    // ground shadows under falling poops
    for (const p of poops) {
      if (p.state !== 'fall') continue;
      const near = U.clamp(1 - (p.groundY - p.y) / 220, 0.15, 1);
      ctx.globalAlpha = 0.22 * near;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(p.x, p.groundY + 2, 8 * near + 2, 3 * near + 1, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (bird) {
      const b = bird;
      const flying = b.state !== 'idle';
      let frame = 'idle';
      if (flying) frame = Math.floor(b.t * 12) % 2 ? 'flapUp' : 'flapDn';
      else if (b.flap > 0) frame = Math.floor(b.t * 16) % 2 ? 'flapUp' : 'flapDn';
      else if (b.look) frame = 'look';
      const bob = b.state === 'idle' ? Math.sin(b.t * 2.2) * 0.8 : 0;
      const img = SPRITES.pigeon(frame, b.blink && !flying);
      PIXEL.blit(ctx, img, b.x, b.y + bob, 2, b.dir === -1);

      // golden "!" bubble while perched, so the offer reads as tappable
      if (b.state === 'idle') {
        const pulse = Math.sin(b.t * 5) * 2;
        const by = b.y - 40 + pulse;
        ctx.fillStyle = PIXEL.OUTLINE;
        ctx.beginPath(); ctx.arc(b.x, by, 8, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.gold;
        ctx.beginPath(); ctx.arc(b.x, by, 6, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.goldHi;
        ctx.beginPath(); ctx.arc(b.x - 1, by - 1, 4, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.gold;
        ctx.beginPath(); ctx.arc(b.x, by + 1, 4, 0, 7); ctx.fill();
        UI.drawText(ctx, '!', b.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
      }
    }

    // falling poops (same asset the animals produce, squash bounce on impact)
    for (const p of poops) {
      const squash = p.state === 'land' && p.t < 0.18 ? 0.72 + (p.t / 0.18) * 0.28 : 1;
      PIXEL.blit(ctx, SPRITES.poop(0), p.x, p.y + 4, 2, false, squash, 1 + (1 - squash) * 0.8);
    }
  }

  /** Subtle screen offset while a poop impact shake is active. */
  function shakeOffset() {
    if (shakeT <= 0) return { x: 0, y: 0 };
    const a = (shakeT / 0.18) * 2.2;
    return { x: (Math.random() * 2 - 1) * a, y: (Math.random() * 2 - 1) * a };
  }

  /** Reward panel numbers for the popup. */
  function info() {
    return { count: C().POOP_COUNT, value: poopValue(), adDur: C().AD_DURATION };
  }

  /**
   * Clear transient animation state (farm switch / full reset). A rain in
   * progress pays out its remaining poops instantly so switching farms
   * never costs the player their reward; discard=true (save reset) skips it.
   */
  function reset(discard = false) {
    if (!discard) {
      const pending = poops.length + (rain ? C().POOP_COUNT - rain.spawned : 0);
      if (pending > 0) Game.addCoins(pending * rainValue);
    }
    bird = null; poops = []; rain = null; shakeT = 0;
  }

  return { update, draw, tap, adCompleted, shakeOffset, info, reset };
})();
</script>
<script>
/**
 * TornadoManager — reward-ad event layer (Tornado Auto Merge).
 *
 * At most every SPAWN_INTERVAL seconds — and only once the pen is crowded
 * with several merges pending (see offerWorthwhile) — a tornado icon
 * appears on the left side of the screen and stays available for
 * STAY_TIME seconds. Tapping it opens
 * the reward-ad popup; completing the ad sends a large pixel tornado
 * sweeping across the farm. The tornado is pure quality-of-life: it
 * performs exactly the merges the player could make by hand, only much
 * faster. It sweeps the pen collecting every animal that will take part
 * in a merge and leaves everything else grazing untouched; then, once
 * collection is complete, the pooled animals resolve in one cascading
 * pass (2 x level N -> 1 x level N+1, repeated until fewer than 2 remain
 * at every level — e.g. 4 babies -> 2 adults -> 1 elder). Animals are
 * pooled and merged strictly per species, never across species, matching
 * the manual drag-merge rule. Odd leftovers survive unchanged, and
 * max-level Mutants only pair off into MUTANT 2s on farms where the UFO
 * has already been unlocked — otherwise they are never even collected.
 * The evolved survivors are tossed back onto the farm and the tornado
 * leaves. Ignoring the icon loses the offer until the next cycle.
 *
 * Per-farm state (offer countdown + remaining availability) lives in
 * SaveManager.data.tornado, so every farm runs its own independent event.
 * Only one offer can be active at a time on a farm, and it never appears
 * during the merge tutorial (Game only ticks this manager during normal
 * gameplay). While the tornado is running all farm input is blocked and
 * spawning is paused; normal gameplay resumes the moment it leaves.
 *
 * Balancing values live in CONFIG.TORNADO and can be overridden at
 * runtime through window.RemoteConfig.TORNADO (Remote Config hook).
 */
const Tornado = (() => {
  const C = () => Object.assign({}, CONFIG.TORNADO, (window.RemoteConfig || {}).TORNADO);
  // each farm has its own tornado slot: always operate on the current farm's
  const data = () => SaveManager.data.tornado[SaveManager.data.currentFarm];

  const ICON = { x: 38, y: 132 };  // bottom-anchored icon spot, left side

  let icon = null;   // {t} the offer icon is visible / available
  let run = null;    // active tornado, see start()
  let clockT = 0;    // spin animation clock

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Reward-ad timing: only offer the tornado at a moment where it saves
   * real manual work — a crowded pen with several merges waiting. The
   * countdown may have long elapsed; the icon then appears the moment the
   * farm actually fills up ("here's a boost if you want it", not a nag).
   * Mutant pairs only count where the UFO is unlocked (they can't merge
   * otherwise, matching the funnel's own rule).
   */
  function offerWorthwhile() {
    const scene = Game.farm;
    if (!scene || scene.tutorial) return false;
    if (scene.animals.length < C().MIN_ANIMALS) return false;
    const top = CONFIG.STAGE_NAMES.length - 1;
    const landed = SaveManager.data.ufo[SaveManager.data.currentFarm].landed;
    const counts = {};
    for (const a of scene.animals) {
      if (a.state === 'merging') continue;
      if (a.stage === top && !landed) continue;
      const k = a.species + ':' + a.stage;
      counts[k] = (counts[k] || 0) + 1;
    }
    let pairs = 0;
    for (const k in counts) pairs += Math.floor(counts[k] / 2);
    return pairs >= C().MIN_PAIRS;
  }

  // ---------------- availability cycle ----------------
  function update(dt, tutorialActive) {
    clockT += dt;
    const d = data();
    if (!C().ENABLED) { icon = null; return; }

    // restore an offer that was left available on this farm
    if (!icon && d.remaining > 0 && !tutorialActive) icon = { t: 0 };

    // offer countdown: one offer at a time, never during the tutorial,
    // and only released once the pen is crowded enough to be worth it
    if (!icon && d.remaining <= 0 && !tutorialActive) {
      d.next -= dt;
      if (d.next <= 0 && offerWorthwhile()) {
        icon = { t: 0 };
        d.remaining = C().STAY_TIME;
        SaveManager.save();
        VFXManager.sparkle(ICON.x, ICON.y - 20, 8, 16);
        AudioManager.play('pop');
      }
    }

    if (icon) {
      // availability countdown (frozen while the reward popup / ad is
      // open, so closing the popup never eats the player's window)
      const p = UI.popup;
      const frozen = p && (p.type === 'tornadoAd' || p.type === 'adPlaying');
      if (!frozen) {
        icon.t += dt;
        d.remaining -= dt;
        if (d.remaining <= 0) {
          // ignored: the opportunity is lost until the next cycle
          d.remaining = 0;
          d.next = C().SPAWN_INTERVAL;
          SaveManager.save();
          icon = null;
        }
      }
    }
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the tornado icon (opens the ad popup). */
  function tap(x, y) {
    if (!icon || run) return false;
    if (U.dist(x, y, ICON.x, ICON.y - 16) > 24) return false;
    AudioManager.play('click');
    UI.openPopup({ type: 'tornadoAd' });
    return true;
  }

  /** Reward panel numbers for the popup. */
  function info() {
    return { adDur: C().AD_DURATION };
  }

  /** The reward ad finished successfully: consume the offer, unleash it. */
  function adCompleted() {
    const d = data();
    d.remaining = 0;
    d.next = C().SPAWN_INTERVAL + C().REWARD_COOLDOWN;
    SaveManager.save();
    if (icon) {
      VFXManager.burst(ICON.x, ICON.y - 16, ['#c8cdd4', '#eef2f6', '#ffe98a'], 12, 90);
      icon = null;
    }
    start();
  }

  // ---------------- active tornado ----------------
  function start() {
    const scene = Game.farm;
    scene.pointerUp(); // settle any in-progress drag defensively
    run = {
      phase: 'enter', t: 0,
      scene,
      x: -40,
      y: scene.bounds.y + scene.bounds.h * 0.55,
      held: [],      // animals spinning inside: {species, stage, angle, r, h, maxH, spin, pull, sx, sy}
      ejected: 0,    // eject-phase counter
      dustT: 0,
    };
    AudioManager.play('wind');
  }

  /**
   * Simulate the full merge cascade over ALL animals (farm + funnel),
   * pooled per species — never across species, matching the manual
   * drag-merge rule. Returns, per species, the set of stages that will
   * see at least one merge: exactly the animals worth collecting. A
   * stage with a single animal only becomes "active" when lower-stage
   * merges will produce it a partner, so untouched singles stay out.
   * Max-level Mutants only pair off where the UFO has been unlocked.
   */
  function mergePlan() {
    const top = CONFIG.STAGE_NAMES.length - 1;
    const landed = SaveManager.data.ufo[run.scene.farmId].landed;
    const pools = {};
    const add = (sp, st) => {
      const c = pools[sp] = pools[sp] || [];
      c[st] = (c[st] || 0) + 1;
    };
    for (const a of run.scene.animals) if (a.state !== 'merging') add(a.species, a.stage);
    for (const h of run.held) add(h.species, h.stage);
    const active = {};
    for (const sp in pools) {
      const counts = pools[sp];
      active[sp] = new Set();
      for (let s = 0; s <= top; s++) {
        const canPair = s < top || landed;
        const pairs = canPair ? Math.floor((counts[s] || 0) / 2) : 0;
        if (pairs > 0) active[sp].add(s);
        if (s < top) counts[s + 1] = (counts[s + 1] || 0) + pairs;
      }
    }
    return active;
  }

  /** Will this animal take part in the cascade? (see mergePlan) */
  function collectible(a, active) {
    return !!active[a.species] && active[a.species].has(a.stage);
  }

  /** Pull one farm animal into the funnel. */
  function capture(a) {
    a.dead = true; // FarmScene.update would splice it, but we run instead
    const i = run.scene.animals.indexOf(a);
    if (i >= 0) run.scene.animals.splice(i, 1);
    run.held.push({
      species: a.species, stage: a.stage,
      angle: U.rand(0, Math.PI * 2),
      r: U.rand(12, 22),
      h: 6, maxH: U.rand(16, 48),
      spin: U.rand(0, 5),
      pull: 0, sx: a.x, sy: a.y,
    });
    VFXManager.dust(a.x, a.y, 5);
    AudioManager.play('flap');
  }

  /**
   * Suck in the collectible animals the sweeping funnel has passed or
   * come close to. Animals that won't merge are left grazing untouched.
   */
  function captureNear() {
    const active = mergePlan();
    for (let i = run.scene.animals.length - 1; i >= 0; i--) {
      const a = run.scene.animals[i];
      if (a.state === 'merging' || !collectible(a, active)) continue;
      if (a.x < run.x + 22 || U.dist(a.x, a.y, run.x, run.y) < 52) capture(a);
    }
  }

  /**
   * Magnet mode (gather phase): pull in every remaining collectible
   * animal regardless of distance, so the pool is complete before the
   * one-shot resolution.
   */
  function captureRemaining() {
    const active = mergePlan();
    for (let i = run.scene.animals.length - 1; i >= 0; i--) {
      const a = run.scene.animals[i];
      if (a.state === 'merging' || !collectible(a, active)) continue;
      capture(a);
    }
  }

  /** Toss one funnel animal back onto a free spot of the pen. */
  function eject(h) {
    const r = run;
    let p = r.scene.randomSpot(), tries = 0;
    while (tries++ < 12 && r.scene.animals.some(a => U.dist(a.x, a.y, p.x, p.y) < 40)) {
      p = r.scene.randomSpot();
    }
    const a = new Animal(h.species, h.stage, p.x, p.y);
    r.scene.animals.push(a);
    VFXManager.dust(p.x, p.y, 6);
    AudioManager.play('pop');
  }

  /**
   * Collection is complete: resolve the whole pool in one cascading pass.
   * Per species (never across species), from the lowest level up:
   * 2 x level N -> 1 x level N+1, newly created animals feeding straight
   * into the next level, until fewer than 2 remain at every level. Odd
   * leftovers survive unchanged. Max-level Mutant pairs become MUTANT 2s
   * only where the UFO is unlocked; otherwise Mutants pass through as-is.
   * The survivors replace the funnel contents for the eject phase.
   */
  function resolvePool() {
    const r = run;
    const top = CONFIG.STAGE_NAMES.length - 1;
    const landed = SaveManager.data.ufo[r.scene.farmId].landed;
    const pools = {};
    for (const h of r.held) {
      const c = pools[h.species] = pools[h.species] || [];
      c[h.stage] = (c[h.stage] || 0) + 1;
    }
    const survivors = [];
    let aliens = 0, ty = r.y - 70;
    for (const sp in pools) {
      const counts = pools[sp];
      for (let s = 0; s <= top; s++) {
        let c = counts[s] || 0;
        if (s < top) {
          const pairs = Math.floor(c / 2);
          if (pairs > 0) {
            counts[s + 1] = (counts[s + 1] || 0) + pairs;
            c -= pairs * 2;
            // discoveries still count (no celebration mid-storm)
            Discovery.mark(sp, s + 1);
            VFXManager.floatText(r.x, ty, pairs + 'X ' + CONFIG.STAGE_NAMES[s + 1] + '!');
            ty -= 14;
          }
        } else if (landed) {
          const pairs = Math.floor(c / 2);
          c -= pairs * 2;
          aliens += pairs;
        }
        // odd leftovers and unmergeable max-level animals survive as-is
        for (let i = 0; i < c; i++) survivors.push({ species: sp, stage: s });
      }
    }
    // one big satisfying blast as everything evolves at once
    AudioManager.play('merge');
    VFXManager.burst(r.x, r.y - 44, ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'], 26, 130);
    VFXManager.sparkle(r.x, r.y - 50, 16, 26);
    if (aliens > 0) {
      VFXManager.burst(r.x, r.y - 44, ['#7de87a', '#c4ffb8', '#a07cc0'], 14, 110);
      VFXManager.floatText(r.x, ty, aliens + 'X MUTANT 2!', '#c4ffb8');
      for (let i = 0; i < aliens; i++) UFO.collect(r.x + U.rand(-10, 10), r.y - 40);
    }
    // survivors keep spinning in the funnel until ejected one by one
    r.held = survivors.map(v => ({
      species: v.species, stage: v.stage,
      angle: U.rand(0, Math.PI * 2), r: U.rand(12, 22),
      h: U.rand(16, 40), maxH: U.rand(16, 48),
      spin: U.rand(0, 5), pull: 1, sx: r.x, sy: r.y,
    }));
  }

  /** Main tick while the tornado is on the farm (gameplay is paused). */
  function updateRun(dt) {
    const r = run, cfg = C();
    const speed = Math.max(0.2, cfg.TRAVEL_SPEED);
    clockT += dt;
    r.t += dt;

    // animals spiral around the funnel, rising as they get pulled in
    for (const h of r.held) {
      h.angle += dt * (7 + h.spin);
      if (h.pull < 1) h.pull = Math.min(1, h.pull + dt / 0.3);
      h.h = Math.min(h.maxH, h.h + dt * 40);
    }

    // constant dust, leaves and debris kicked up around the base
    r.dustT -= dt;
    if (r.dustT <= 0) {
      r.dustT = 0.07;
      VFXManager.dust(r.x + U.rand(-16, 16), r.y + U.rand(-2, 4), 2);
      if (Math.random() < 0.45) {
        VFXManager.burst(r.x + U.rand(-12, 12), r.y - U.rand(6, 56),
          ['#5e9c31', '#7dbb4a', '#c8b088', '#b09a72'], 2, 55);
      }
    }

    // untouched animals keep wandering and poops keep ripening while the
    // storm works (only spawning and player input are paused)
    for (let i = r.scene.animals.length - 1; i >= 0; i--) {
      const a = r.scene.animals[i];
      a.update(dt, r.scene.bounds, r.scene);
      if (a.dead) r.scene.animals.splice(i, 1);
    }
    r.scene.updatePoops(dt);

    if (r.phase === 'enter') {
      // roll in from the left edge
      const t = smooth(r.t / (0.7 / speed));
      r.x = U.lerp(-40, r.scene.bounds.x + 8, t);
      if (t >= 1) { r.phase = 'sweep'; r.t = 0; }
    } else if (r.phase === 'sweep') {
      // weave across the whole pen, collecting every animal that will
      // take part in the cascade — no merging yet, collection only
      const B = r.scene.bounds;
      const t = Math.min(r.t / (2.6 / speed), 1);
      r.x = U.lerp(B.x + 8, B.x + B.w - 8, t);
      r.y = B.y + B.h * 0.55 + Math.sin(t * Math.PI * 2.2) * B.h * 0.28;
      captureNear();
      if (t >= 1) { r.phase = 'gather'; r.t = 0; }
    } else if (r.phase === 'gather') {
      // drift to the pen center, magnet-pull any collectible stragglers,
      // then — with the pool complete — resolve every merge at once
      const B = r.scene.bounds;
      r.x = U.lerp(r.x, B.x + B.w / 2, Math.min(1, dt * 2.5));
      r.y = U.lerp(r.y, B.y + B.h * 0.5, Math.min(1, dt * 2.5));
      captureRemaining();
      if (r.t >= 0.5 / speed) {
        resolvePool();
        r.phase = 'eject'; r.t = 0; r.ejected = 0;
      }
    } else if (r.phase === 'eject') {
      // toss the evolved survivors back out, one animal at a time
      while (r.held.length && r.t >= r.ejected * C().MERGE_INTERVAL) {
        eject(r.held.shift());
        r.ejected++;
      }
      if (!r.held.length) {
        r.scene.persist();
        r.phase = 'exit'; r.t = 0; r.exitX = r.x;
        AudioManager.play('wind');
      }
    } else if (r.phase === 'exit') {
      // spin away past the right edge; normal gameplay resumes right after
      const t = r.t / (0.8 / speed);
      r.x = U.lerp(r.exitX, CONFIG.VIEW_W + 50, t * t);
      if (t >= 1) { run = null; }
    }
  }

  // ---------------- draw ----------------
  function drawIcon(ctx) {
    const t = icon.t;
    const bob = Math.sin(t * 3) * 1.5;
    // pulsing golden ring so the offer reads as tappable
    const pulse = (Math.sin(t * 5) + 1) / 2;
    ctx.save();
    ctx.globalAlpha = 0.35 + pulse * 0.3;
    ctx.strokeStyle = '#ffe98a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ICON.x, ICON.y - 16, 20 + pulse * 2, 0, 7); ctx.stroke();
    ctx.restore();
    const frame = Math.floor(clockT * 10) % 3;
    PIXEL.blit(ctx, SPRITES.tornado(frame), ICON.x, ICON.y + bob, 1.2);
    // golden "!" bubble, matching the pigeon offer style
    const by = ICON.y - 44 + Math.sin(t * 5) * 2;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.beginPath(); ctx.arc(ICON.x, by, 8, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.gold;
    ctx.beginPath(); ctx.arc(ICON.x, by, 6, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.goldHi;
    ctx.beginPath(); ctx.arc(ICON.x - 1, by - 1, 4, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.gold;
    ctx.beginPath(); ctx.arc(ICON.x, by + 1, 4, 0, 7); ctx.fill();
    UI.drawText(ctx, '!', ICON.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
    // remaining availability bar under the icon
    const frac = U.clamp(data().remaining / C().STAY_TIME, 0, 1);
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(ICON.x - 14, ICON.y + 5, 28, 5);
    ctx.fillStyle = '#3a2817';     ctx.fillRect(ICON.x - 13, ICON.y + 6, 26, 3);
    ctx.fillStyle = '#ffe98a';     ctx.fillRect(ICON.x - 13, ICON.y + 6, Math.round(26 * frac), 3);
  }

  function drawRun(ctx) {
    const r = run;
    // ground shadow
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath(); ctx.ellipse(r.x, r.y + 5, 26, 7, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;

    // orbit position of a held animal (pull-in lerps from its old spot)
    const pos = h => {
      const ox = r.x + Math.cos(h.angle) * h.r;
      const oy = r.y - h.h + Math.sin(h.angle) * h.r * 0.35;
      const e = smooth(h.pull);
      return { x: U.lerp(h.sx, ox, e), y: U.lerp(h.sy, oy, e) };
    };
    const back = r.held.filter(h => Math.sin(h.angle) < 0);
    const front = r.held.filter(h => Math.sin(h.angle) >= 0);
    const drawHeld = h => {
      const p = pos(h);
      const img = SPRITES.animal(h.species, h.stage, 'idle', false);
      PIXEL.blit(ctx, img, p.x, p.y, 1.25, Math.cos(h.angle) < 0);
    };
    // behind the funnel, then the funnel, then the front arc
    for (const h of back) drawHeld(h);
    const frame = Math.floor(clockT * 14) % 3;
    const wob = Math.sin(clockT * 9) * 2;
    PIXEL.blit(ctx, SPRITES.tornado(frame), r.x + wob, r.y + 6, 2.2, false, 1, 1 + Math.sin(clockT * 13) * 0.05);
    for (const h of front) drawHeld(h);
  }

  function draw(ctx) {
    if (icon && !run) drawIcon(ctx);
    if (run) drawRun(ctx);
  }

  /**
   * Animals currently held inside the funnel, as save-format entries.
   * FarmScene.persist appends this so an autosave / reload mid-tornado
   * can never lose the herd (they come back unmerged, nothing worse).
   */
  function heldSnapshot(farmId) {
    if (!run || run.scene.farmId !== farmId) return [];
    return run.held.map(h => ({ stage: h.stage }));
  }

  /** Clear transient animation state (farm switch / full reset). */
  function reset() { icon = null; run = null; }

  return {
    update, updateRun, draw, tap, adCompleted, info, heldSnapshot, reset,
    get active() { return !!run; },
  };
})();
</script>
<script>
/**
 * AnimalController — one instance per animal on the farm.
 * State machine: idle / walk / peck(graze) / drag / merging / spawning.
 * Handles blinking, breathing squash, walk bounce, poop production.
 */
class Animal {
  constructor(species, stage, x, y) {
    this.init(species, stage, x, y);
  }

  init(species, stage, x, y) {
    this.species = species;
    this.stage = stage;
    this.x = x; this.y = y;
    this.homeX = x; this.homeY = y;
    this.facing = Math.random() < 0.5 ? 1 : -1;
    this.state = 'spawning';
    this.stateT = 0;
    this.stateDur = CONFIG.SPAWN_POP_TIME;
    this.walkDx = 0; this.walkDy = 0;
    this.speed = U.rand(CONFIG.WALK_SPEED_MIN, CONFIG.WALK_SPEED_MAX);
    this.blinkT = U.rand(CONFIG.BLINK_INTERVAL_MIN, CONFIG.BLINK_INTERVAL_MAX);
    this.blinking = 0;
    this.bob = Math.random() * Math.PI * 2;
    this.poopT = U.rand(1, CONFIG.POOP_INTERVAL + CONFIG.POOP_INTERVAL_JITTER);
    this.dragging = false;
    this.dead = false;
    this.scaleX = 1; this.scaleY = 1;
    this.shadowW = SPRITES.ANIMAL_SIZES[species][stage][0] * CONFIG.ANIMAL_VISUAL_SCALE * 0.6;
    return this;
  }

  get frameName() {
    if (this.state === 'peck') {
      // dip down during middle of the peck
      const t = this.stateT / this.stateDur;
      return (t % 0.5) > 0.22 ? 'peck' : 'idle';
    }
    if (this.state === 'walk' && !this.dragging) return (this.bob % (Math.PI * 2)) < Math.PI ? 'walk' : 'idle';
    return 'idle';
  }

  setState(state, dur) {
    this.state = state;
    this.stateT = 0;
    this.stateDur = dur;
  }

  chooseNext(bounds) {
    if (Math.random() < CONFIG.PECK_CHANCE) {
      this.setState('peck', U.rand(1.0, 2.0));
    } else if (Math.random() < 0.55) {
      // pick a wander target direction
      const a = Math.random() * Math.PI * 2;
      this.walkDx = Math.cos(a); this.walkDy = Math.sin(a) * 0.6;
      if (this.walkDx !== 0) this.facing = this.walkDx > 0 ? 1 : -1;
      this.setState('walk', U.rand(CONFIG.WALK_TIME_MIN, CONFIG.WALK_TIME_MAX));
    } else {
      this.setState('idle', U.rand(CONFIG.IDLE_TIME_MIN, CONFIG.IDLE_TIME_MAX));
    }
  }

  update(dt, bounds, farm) {
    this.stateT += dt;
    this.bob += dt * (this.state === 'walk' ? 10 : 3);

    // blinking
    this.blinkT -= dt;
    if (this.blinkT <= 0) {
      this.blinking = 0.12;
      this.blinkT = U.rand(CONFIG.BLINK_INTERVAL_MIN, CONFIG.BLINK_INTERVAL_MAX);
    }
    if (this.blinking > 0) this.blinking -= dt;

    if (this.dragging) {
      // slight lift wobble while dragged
      this.scaleX = U.lerp(this.scaleX, 1.06, dt * 10);
      this.scaleY = U.lerp(this.scaleY, 1.06, dt * 10);
      return;
    }

    switch (this.state) {
      case 'spawning': {
        const t = U.clamp(this.stateT / this.stateDur, 0, 1);
        const s = U.easeOutBack(t);
        this.scaleX = s; this.scaleY = s;
        if (t >= 1) { this.scaleX = this.scaleY = 1; this.chooseNext(bounds); }
        break;
      }
      case 'merging': {
        // shrink into the merge point
        const t = U.clamp(this.stateT / this.stateDur, 0, 1);
        this.x = U.lerp(this.x, this.mergeX, dt * 14);
        this.y = U.lerp(this.y, this.mergeY, dt * 14);
        this.scaleX = this.scaleY = 1 - U.easeInCubic(t) * 0.9;
        if (t >= 1) this.dead = true;
        break;
      }
      case 'return': {
        const d = U.dist(this.x, this.y, this.homeX, this.homeY);
        if (d < 3) { this.x = this.homeX; this.y = this.homeY; this.chooseNext(bounds); }
        else {
          this.x += (this.homeX - this.x) / d * 220 * dt;
          this.y += (this.homeY - this.y) / d * 220 * dt;
        }
        break;
      }
      case 'walk': {
        this.x += this.walkDx * this.speed * dt;
        this.y += this.walkDy * this.speed * dt;
        // clamp to pen; bounce off edges
        if (this.x < bounds.x) { this.x = bounds.x; this.walkDx *= -1; this.facing *= -1; }
        if (this.x > bounds.x + bounds.w) { this.x = bounds.x + bounds.w; this.walkDx *= -1; this.facing *= -1; }
        if (this.y < bounds.y) { this.y = bounds.y; this.walkDy *= -1; }
        if (this.y > bounds.y + bounds.h) { this.y = bounds.y + bounds.h; this.walkDy *= -1; }
        if (this.stateT >= this.stateDur) this.chooseNext(bounds);
        break;
      }
      case 'peck':
      case 'idle': {
        if (this.stateT >= this.stateDur) this.chooseNext(bounds);
        break;
      }
    }

    // breathing squash (idle) / bounce (walk)
    if (this.state === 'idle' || this.state === 'peck') {
      this.scaleY = 1 + Math.sin(this.bob) * 0.02;
      this.scaleX = 1 - Math.sin(this.bob) * 0.015;
    } else if (this.state === 'walk') {
      this.scaleY = 1 + Math.abs(Math.sin(this.bob)) * 0.05;
    }

    // poop production (not while spawning/merging)
    if (this.state !== 'spawning' && this.state !== 'merging') {
      this.poopT -= dt;
      if (this.poopT <= 0) {
        this.poopT = Upgrades.poopInterval(farm.farmId, this.stage) + U.rand(0, CONFIG.POOP_INTERVAL_JITTER);
        farm.dropPoop(this);
      }
    }
  }

  /** Visual bounce offset while walking. */
  get hopY() {
    return this.state === 'walk' && !this.dragging ? -Math.abs(Math.sin(this.bob)) * 3 : 0;
  }

  get img() {
    return SPRITES.animal(this.species, this.stage, this.frameName, this.blinking > 0);
  }

  /** Approximate radius for hit tests. */
  get radius() {
    return SPRITES.ANIMAL_SIZES[this.species][this.stage][0] * CONFIG.PIXEL_SCALE * 0.5;
  }

  draw(ctx) {
    const img = this.img;
    const sc = CONFIG.ANIMAL_VISUAL_SCALE;
    const lift = this.dragging ? -10 : 0;
    // soft shadow
    ctx.globalAlpha = this.dragging ? 0.18 : 0.28;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + 2, this.shadowW / 2 * this.scaleX, 4, 0, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;
    PIXEL.blit(ctx, img, this.x, this.y + this.hopY + lift, sc, this.facing < 0, this.scaleY, this.scaleX);
  }
}
</script>
<script>
/**
 * FarmScene — gameplay scene for one farm.
 * Owns: SpawnManager (auto baby spawns), MergeManager (drag & merge),
 * EconomyManager hooks (poop -> coin lifecycle).
 */
class FarmScene {
  constructor(farmId) {
    this.farmId = farmId;
    this.def = CONFIG.FARMS[farmId];
    this.animals = [];
    this.poops = [];       // {x, y, t, stage, phase}
    this.spawnT = 1.0;
    this.dragged = null;
    this.dragOffX = 0; this.dragOffY = 0;
    this.mergeTarget = null;
    this.bg = ENVIRONMENT.farm(farmId);
    this.bounds = {
      x: ENVIRONMENT.PLAY.x + 18,
      y: ENVIRONMENT.PLAY.y + 26,
      w: ENVIRONMENT.PLAY.w - 36,
      h: ENVIRONMENT.PLAY.h - 46,
    };
    this.tutorial = null;
    if (!SaveManager.data.tutorialDone[farmId]) {
      // first visit: exactly two babies pre-placed, spawning paused until they merge
      this.startTutorial();
    } else {
      // restore saved animals (incl. offline-spawned ones) on free spots
      const saved = SaveManager.data.animals[farmId] || [];
      for (const a of saved) {
        const p = this.freeSpot();
        const an = new Animal(this.def.species, a.stage, p.x, p.y);
        an.setState('idle', U.rand(0.5, 2));
        an.scaleX = an.scaleY = 1;
        this.animals.push(an);
      }
    }
  }

  /** TutorialManager: seed the guaranteed first merge and show the drag hint. */
  startTutorial() {
    const cx = this.bounds.x + this.bounds.w / 2;
    const cy = this.bounds.y + this.bounds.h * 0.45;
    const gap = CONFIG.TUTORIAL.GAP / 2;
    const a = new Animal(this.def.species, 0, cx - gap, cy);
    const b = new Animal(this.def.species, 0, cx + gap, cy);
    for (const an of [a, b]) {
      an.setState('idle', 1e9); // hold still so the merge stays obvious
      an.scaleX = an.scaleY = 1;
      this.animals.push(an);
      Discovery.mark(this.def.species, 0);
    }
    this.tutorial = { a, b, t: 0 };
  }

  randomSpot() {
    return {
      x: U.rand(this.bounds.x, this.bounds.x + this.bounds.w),
      y: U.rand(this.bounds.y, this.bounds.y + this.bounds.h),
    };
  }

  /** Random pen position kept clear of existing animals (best effort). */
  freeSpot() {
    let p = this.randomSpot(), tries = 0;
    while (tries++ < 12 && this.animals.some(a => U.dist(a.x, a.y, p.x, p.y) < 40)) {
      p = this.randomSpot();
    }
    return p;
  }

  /** SpawnManager: place a new animal at a free spot. */
  spawnAnimal(stage = 0, sfx = true) {
    if (this.animals.length >= CONFIG.MAX_ANIMALS) return null;
    const p = this.freeSpot();
    const a = new Animal(this.def.species, stage, p.x, p.y);
    this.animals.push(a);
    Discovery.mark(this.def.species, stage); // babies count for the collection, no celebration
    VFXManager.dust(p.x, p.y, 6);
    if (sfx) AudioManager.play('pop');
    this.persist();
    return a;
  }

  /** EconomyManager: animal drops a poop that later becomes a coin. */
  dropPoop(animal) {
    this.poops.push({
      x: animal.x - animal.facing * 8,
      y: animal.y + 2,
      t: 0,
      stage: animal.stage,
      phase: 'poop',
    });
    AudioManager.play('poop');
  }

  updatePoops(dt) {
    for (let i = this.poops.length - 1; i >= 0; i--) {
      const p = this.poops[i];
      p.t += dt;
      if (p.phase === 'poop' && p.t >= CONFIG.POOP_TO_COIN_DELAY) {
        p.phase = 'glow';
        p.t = 0;
        VFXManager.sparkle(p.x, p.y - 6, 10, 10);
      } else if (p.phase === 'glow' && p.t >= 0.5) {
        // transform: launch flying coin toward the HUD counter
        const value = Upgrades.coinValue(this.farmId, p.stage);
        const target = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 6, target.x, target.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 18, '+' + value);
        this.poops.splice(i, 1);
      }
    }
  }

  // ---------------- MergeManager: input ----------------
  pointerDown(x, y) {
    // topmost animal under pointer
    for (let i = this.animals.length - 1; i >= 0; i--) {
      const a = this.animals[i];
      if (a.state === 'merging' || a.state === 'spawning') continue;
      if (U.dist(x, y, a.x, a.y - a.radius * 0.6) < a.radius + 8) {
        this.dragged = a;
        a.dragging = true;
        a.homeX = a.x; a.homeY = a.y;
        this.dragOffX = a.x - x; this.dragOffY = a.y - y;
        // draw on top
        this.animals.splice(i, 1);
        this.animals.push(a);
        AudioManager.play('click');
        return true;
      }
    }
    return false;
  }

  pointerMove(x, y) {
    if (!this.dragged) return;
    this.dragged.x = U.clamp(x + this.dragOffX, this.bounds.x - 10, this.bounds.x + this.bounds.w + 10);
    this.dragged.y = U.clamp(y + this.dragOffY, this.bounds.y - 10, this.bounds.y + this.bounds.h + 10);
    this.mergeTarget = this.findMergeTarget();
  }

  findMergeTarget() {
    const d = this.dragged;
    if (!d) return null;
    let best = null, bestDist = CONFIG.MERGE_RADIUS + d.radius * 0.5;
    for (const a of this.animals) {
      if (a === d || a.dead || a.state === 'merging' || a.state === 'spawning') continue;
      // mutants (final stage) can still pair up — they become a MUTANT 2
      if (a.species !== d.species || a.stage !== d.stage) continue;
      const dist = U.dist(a.x, a.y, d.x, d.y);
      if (dist < bestDist) { best = a; bestDist = dist; }
    }
    return best;
  }

  pointerUp() {
    const d = this.dragged;
    if (!d) return;
    d.dragging = false;
    this.dragged = null;
    const target = this.mergeTarget;
    this.mergeTarget = null;
    if (target) {
      this.merge(d, target);
    } else {
      d.setState('return', 1);
    }
  }

  /** Merge two identical animals into one evolved animal (instant swap, no animation). */
  merge(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const species = a.species, newStage = a.stage + 1;
    // remove both source animals immediately
    a.dead = b.dead = true;
    this.animals = this.animals.filter(an => !an.dead);
    AudioManager.play('merge');
    // Mutant + Mutant: no separate stage — the pair permanently becomes a
    // MUTANT 2 collected by the UFO (full cinematic first time, quick beam after)
    if (newStage >= CONFIG.STAGE_NAMES.length) {
      VFXManager.burst(mx, my - 14, ['#7de87a', '#c4ffb8', '#a07cc0', '#ffffff'], 20, 120);
      VFXManager.sparkle(mx, my - 20, 12, 22);
      this.persist();
      UFO.collect(mx, my);
      return;
    }
    // replace with the evolved asset at the merge position, full size right away
    const evolved = new Animal(species, newStage, mx, my);
    evolved.setState('idle', U.rand(1, 2));
    evolved.scaleX = evolved.scaleY = 1;
    this.animals.push(evolved);
    const cols = ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'];
    VFXManager.burst(mx, my - 14, cols, 18, 110);
    VFXManager.sparkle(mx, my - 20, 12, 22);
    // first successful merge completes the tutorial and starts normal spawning
    if (this.tutorial) {
      this.tutorial = null;
      SaveManager.data.tutorialDone[this.farmId] = true;
      this.spawnT = 1.0;
    }
    this.persist();
    // first time this species+stage is ever created -> celebration!
    if (Discovery.mark(species, newStage)) {
      Game.startCelebration(evolved, mx, my);
    }
  }

  persist() {
    // animals spinning inside an active tornado are appended so an
    // autosave / reload mid-event can never lose them
    SaveManager.data.animals[this.farmId] =
      this.animals.filter(a => !a.dead && a.state !== 'merging').map(a => ({ stage: a.stage }))
        .concat(Tornado.heldSnapshot(this.farmId));
    SaveManager.save();
  }

  update(dt) {
    // SpawnManager tick (paused until the tutorial merge is done)
    if (!this.tutorial) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) {
        this.spawnT = Upgrades.spawnInterval(this.farmId);
        this.spawnAnimal(0);
      }
    } else {
      this.tutorial.t += dt;
    }

    for (let i = this.animals.length - 1; i >= 0; i--) {
      const a = this.animals[i];
      a.update(dt, this.bounds, this);
      // keep the tutorial pair in place so the merge stays obvious
      if (this.tutorial && a.state === 'walk') a.setState('idle', 1e9);
      if (a.dead) this.animals.splice(i, 1);
    }
    this.updatePoops(dt);
  }

  draw(ctx) {
    ctx.drawImage(this.bg, 0, 0);

    // poops (under animals)
    for (const p of this.poops) {
      const img = SPRITES.poop(p.stage);
      if (p.phase === 'glow') {
        // pulsing golden aura
        const pulse = 0.5 + Math.sin(p.t * 20) * 0.2;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#ffe98a';
        ctx.beginPath(); ctx.arc(p.x, p.y - 5, 14, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      const pop = p.phase === 'poop' && p.t < 0.25 ? U.easeOutBack(p.t / 0.25) : 1;
      PIXEL.blit(ctx, img, p.x, p.y + 4, 2 * pop);
    }

    // merge target highlight ring
    if (this.mergeTarget) {
      const t = this.mergeTarget;
      ctx.strokeStyle = '#ffe98a';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 + Math.sin(performance.now() / 90) * 0.3;
      ctx.beginPath();
      ctx.ellipse(t.x, t.y, t.radius + 6, (t.radius + 6) * 0.6, 0, 0, 7);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // animals sorted by y for correct overlap; babies (stage 0) always render
    // above evolved animals so they stay easy to find and merge
    const layer = a => a.dragging ? 2 : a.stage === 0 ? 1 : 0;
    const sorted = this.animals.slice().sort((a, b) => layer(a) - layer(b) || a.y - b.y);
    for (const a of sorted) a.draw(ctx);

    // parked UFO / abduction cinematic (above the animals)
    UFO.draw(ctx);

    // pigeon on the fence + falling poops (above the animals)
    Pigeon.draw(ctx);

    // tornado offer icon / active tornado (above everything)
    Tornado.draw(ctx);

    if (this.tutorial) this.drawTutorial(ctx);
  }

  /** Drag hint: dashed guide + hand sweeping from one baby onto the other. */
  drawTutorial(ctx) {
    const { a, b, t } = this.tutorial;
    if (this.dragged) return; // hide while the player is already dragging
    const cycle = (t % CONFIG.TUTORIAL.HAND_CYCLE) / CONFIG.TUTORIAL.HAND_CYCLE;
    const move = U.clamp(cycle / 0.7, 0, 1);          // 70% travel, 30% hold
    const e = move * move * (3 - 2 * move);           // smoothstep
    const hx = U.lerp(a.x, b.x, e);
    const hy = U.lerp(a.y, b.y, e);
    const alpha = cycle > 0.85 ? (1 - cycle) / 0.15 : 1;

    // dashed guide line between the two animals
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - 6);
    ctx.lineTo(b.x, b.y - 6);
    ctx.stroke();
    ctx.setLineDash([]);

    // hand pointer
    ctx.globalAlpha = alpha;
    UI.drawHand(ctx, hx + 4, hy - 4);
    ctx.restore();

    // hint label above the pair
    ctx.save();
    ctx.globalAlpha = 0.85 + Math.sin(t * 4) * 0.15;
    const lx = (a.x + b.x) / 2, ly = Math.min(a.y, b.y) - 48;
    UI.drawText(ctx, 'DRAG TO MERGE!', lx, ly, UI.SIZE.BUTTON, '#fff6e8', 'center', true);
    ctx.restore();
  }
}
