        s.ellipse(17, 11, 1.8, 1.6, P.glow);
        s.px(16, 11, P.pupil); s.px(18, 11, P.pupil);
      }
      // saucer disc
      s.ellipse(22, 16, 20, 6.5, '#b8c4cc');
      s.shadeEllipse(22, 16, 20, 6.5, '#7a8890', 1, 0.4);
      s.ellipse(14, 13.5, 6, 2, '#dce8ee');
      // dark underside
      s.ellipse(22, 19.5, 14, 3.2, '#5a6670');
      // rim lights chasing around the saucer
      for (let i = 0; i < 7; i++) {
        const lx = Math.round(7 + i * 5);
        const on = (i + phase) % 3 === 0;

  // pigeon palette: city-gray feathers with an iridescent neck
  const PG = {
    body: '#9aa4b2', shade: '#707a88', light: '#c6cfd8',
    wing: '#7d8794', wingHi: '#98a2b0',
    neck: '#5fae62', neck2: '#8a6ec0',
    beak: '#e8933c', beakDk: '#b96a24', foot: '#d1762e',
  };

  /**
   * Pixel pigeon, faces RIGHT, bottom anchored.
   * Frames: 'idle' | 'look' (head turned back) | 'flapUp' | 'flapDn'.
   */
  function pigeon(frame = 'idle', blink = false) {
    return PIXEL.sprite(`pigeon:${frame}:${blink ? 1 : 0}`, 22, 20, s => {
      const look = frame === 'look';
      const flapUp = frame === 'flapUp', flapDn = frame === 'flapDn';
      // feet
      s.line(9, 15, 9, 17, PG.foot); s.line(13, 15, 13, 17, PG.foot);
      s.px(8, 17, PG.foot); s.px(10, 17, PG.foot);
      s.px(12, 17, PG.foot); s.px(14, 17, PG.foot);
      // tail (points left)
      s.line(4, 10, 1, 8, PG.wing); s.line(4, 11, 1, 9, PG.shade);
      // body
      s.ellipse(10, 11, 6, 4.5, PG.body);
      s.shadeEllipse(10, 11, 6, 4.5, PG.shade, 1, 0.38);
      s.ellipse(8, 9, 2.5, 2, PG.light);
      // wing: folded, raised, or beating down
      if (flapUp) {
        s.ellipse(7, 5, 4.5, 2.2, PG.wing);
        s.ellipse(6, 4, 2.6, 1.4, PG.wingHi);
      } else if (flapDn) {
        s.ellipse(7, 14, 4.5, 2, PG.wing);
        s.px(4, 14, PG.wingHi);
      } else {
        s.ellipse(8, 11, 3.6, 2.6, PG.wing);
        s.px(6, 10, PG.wingHi); s.px(7, 10, PG.wingHi);
      }
      // head (turned back for the 'look' frame)
      const hx = look ? 6 : 15;
      s.ellipse(hx, 6, 3.4, 3.2, PG.body);
      s.ellipse(hx - 1, 4.5, 1.5, 1.2, PG.light);
      // iridescent neck feathers
      if (look) {
        s.px(8, 8, PG.neck); s.px(9, 9, PG.neck2); s.px(8, 9, PG.neck);
      } else {
        s.px(13, 8, PG.neck); s.px(14, 9, PG.neck2); s.px(13, 9, PG.neck);
      }
      // beak
      if (look) { s.rect(2, 6, 2, 1, PG.beak); s.px(3, 7, PG.beakDk); }
      else { s.rect(18, 6, 2, 1, PG.beak); s.px(18, 7, PG.beakDk); }
      // eye
      const ex = look ? 5 : 16;
      if (blink) s.px(ex, 5, PG.shade);
      else { s.px(ex, 5, P.pupil); s.px(ex - 1, 4, P.eyeWhite); }
      s.outline();
    });
  }

  // tornado palette: pale storm-gray funnel with a dusty skirt
  const TN = {
    base: '#c8cdd4', hi: '#eef2f6', dk: '#98a1ac',
    dust: '#b09a72', dustDk: '#8a7350', leaf: '#5e9c31',
  };

  /**
   * Pixel tornado funnel, bottom anchored. Three spin frames: the
   * highlight streaks and debris flecks rotate around the cone.
   */
  function tornado(frame = 0) {
    return PIXEL.sprite(`tornado:${frame}`, 36, 42, s => {
      // stacked funnel bands, wide at the top, tapering to the ground
      const bands = [
        { y: 4, rx: 15 }, { y: 8, rx: 13.5 }, { y: 12, rx: 12 },
        { y: 16, rx: 10 }, { y: 20, rx: 8.5 }, { y: 24, rx: 7 },
        { y: 28, rx: 5.5 }, { y: 32, rx: 4 }, { y: 35, rx: 3 }, { y: 38, rx: 2 },
      ];
      bands.forEach((b, i) => {
        s.ellipse(18, b.y, b.rx, 2.4, TN.base);
        s.shadeEllipse(18, b.y, b.rx, 2.4, TN.dk, 1, 0.45);
        // spinning highlight streak: offset cycles with the frame
        const ph = (i + frame) % 3;
        const off = (ph - 1) * b.rx * 0.5;
        s.rect(18 + off - Math.max(1, b.rx * 0.3), b.y - 1, Math.max(2, b.rx * 0.6), 1, TN.hi);
      });
      // debris flecks whirling around the cone
      const specks = [[6, 6], [30, 10], [8, 18], [27, 22], [12, 28], [23, 31]];
      specks.forEach(([px, py], i) => {
        const on = (i + frame) % 3;
        if (on === 0) s.px(px, py, TN.leaf);
        else if (on === 1) s.px(px, py, TN.dust);
      });
      // dust skirt kicked up at the base
      s.ellipse(18, 39, 7, 1.8, TN.dust);
      s.shadeEllipse(18, 39, 7, 1.8, TN.dustDk, 1, 0.5);
      s.px(9 + frame, 38, TN.dust); s.px(27 - frame, 39, TN.dust);
      s.outline();
    });
  }

  /**
   * Parachute canopy, bottom-anchored like every other sprite. The dome is
   * an ellipse whose lower half falls off the surface, so it reads as a
   * half-dome; the cords from its rim down to the crate are drawn live by
   * the manager (they stretch with the sway).
   */
  function parachute() {
    return PIXEL.sprite('parachute', 36, 20, s => {
      const cx = 18, cy = 19, rx = 17.5, ry = 15.5;
      for (let y = 3; y <= 19; y++) {
        const k = 1 - Math.pow((y + 0.5 - cy) / ry, 2);
        if (k <= 0) continue;
        const half = Math.sqrt(k) * rx;
        const x0 = Math.round(cx - half), x1 = Math.round(cx + half);
        for (let x = x0; x <= x1; x++) {
          // five radial panels (red / cream / red / cream / red), so the
          // seams fan out from the apex instead of running straight down
          const u = (x + 0.5 - (cx - half)) / (half * 2);
          s.px(x, y, y >= 18 ? P.redDk : (Math.min(4, Math.floor(u * 5)) % 2 ? '#f2e6c8' : P.red));
        }
      }
      s.ellipse(13, 8, 2, 1.5, P.redHi);
      s.outline();
    });
  }

  /** Windmill blade cross, 4 rotation frames (frame 0-3). */
  function windmillBlades(frame = 0) {
    return PIXEL.sprite(`wmBlades:${frame}`, 28, 28, s => {

      for (let k = 0; k < 4; k++) {
        const a = a0 + k * Math.PI / 2;
        const dx = Math.cos(a), dy = Math.sin(a);
        s.line(c, c, c + dx * 12, c + dy * 12, P.wood);
        // canvas paddle alongside the outer half of each arm
        s.line(c + dx * 5 - dy * 2, c + dy * 5 + dx * 2,
               c + dx * 11 - dy * 2, c + dy * 11 + dx * 2, '#e8ddc8');
        s.line(c + dx * 6 - dy, c + dy * 6 + dx,
               c + dx * 11 - dy, c + dy * 11 + dx, '#f4ecd8');
      }
      s.ellipse(c, c, 2, 2, P.woodDk); s.px(c, c, P.woodHi);
      s.outline();
    });
  }

      for (let y = 13; y < 32; y += 6) s.rect(3, y, 10, 1, '#a8a298');
      // red dome
      s.ellipse(8, 7, 5.5, 4, P.red);
      s.shadeEllipse(8, 7, 5.5, 4, P.redDk, 1, 0.4);
      s.px(5, 4, P.redHi); s.px(6, 4, P.redHi);
      // hatch
      s.rect(6, 17, 4, 5, '#8a95a0'); s.px(6, 17, '#b8c0c6');
      s.outline();
    });
  }

  /** Milk can (cow farm decoration). */
  function milkCan() {
    return PIXEL.sprite('milkCan', 10, 12, s => {
      s.rect(2, 4, 6, 7, '#c8d0d4');
      s.rect(2, 4, 2, 7, '#e4eaec');
      s.rect(6, 4, 2, 7, '#98a2a8');
      s.ellipse(5, 3.5, 3, 1.4, '#98a2a8');
      s.rect(4, 1, 2, 2, '#c8d0d4');
      s.rect(2, 7, 6, 1, '#8a95a0');
      s.outline();
    });
  }

  /** Rolled wool bale (sheep farm decoration). */
  function woolBale() {
    return PIXEL.sprite('woolBale', 14, 11, s => {
      s.ellipse(7, 6, 6, 4, P.woolLight);
      s.shadeEllipse(7, 6, 6, 4, P.woolShade, 1, 0.4);
      s.ellipse(7, 6, 3, 2, P.woolMid);
      s.ellipse(7, 6, 1.4, 1, P.woolLight);
      s.px(4, 3, '#ffffff'); s.px(3, 5, '#ffffff');
      s.outline();
    });
  }

  function barn() {
    return PIXEL.sprite('barn', 36, 32, s => {
      s.rect(4, 14, 28, 16, P.red);
      s.rect(4, 14, 28, 2, P.redHi);
      s.rect(4, 28, 28, 2, P.redDk);
      // gambrel roof
      for (let i = 0; i < 6; i++) s.rect(6 + i, 12 - i, 24 - i * 2, 1, P.woodDkr);
      s.rect(8, 5, 20, 3, P.woodDk);
      s.rect(4, 12, 28, 2, P.woodDkr);
      // hay door
      s.rect(15, 8, 6, 5, P.woodDk);
      s.rect(16, 9, 4, 3, P.hay);
      // big door + cross braces
      s.rect(13, 20, 10, 10, P.woodDk);
      s.rect(14, 21, 8, 9, P.wood);
      s.line(14, 21, 21, 29, P.woodDk);
      s.line(21, 21, 14, 29, P.woodDk);
      // white trim
      s.rect(6, 16, 2, 12, '#e8ddc8'); s.rect(28, 16, 2, 12, '#e8ddc8');
      s.outline();
    });
  }

  function shed() {
    return PIXEL.sprite('shed', 30, 26, s => {
      s.rect(4, 12, 22, 12, '#c8b088');
      s.rect(4, 12, 22, 2, '#dcc8a0');
      for (let i = 0; i < 7; i++) s.rect(2 + i, 11 - i, 26 - i * 2, 1, P.blueRoof);
      s.rect(2, 11, 26, 2, P.blueRoofDk);
      s.rect(6, 5, 8, 1, P.blueRoofHi);
      s.rect(12, 16, 6, 8, P.woodDk);
      s.rect(13, 17, 4, 7, P.wood);
      s.rect(6, 16, 4, 4, '#7ec8e0'); s.rect(6, 17, 4, 1, P.woodDk);
      s.outline();
    });
  }

  // ============================================================
  //  UI / MAP ICONS
  // ============================================================

  function mapPin() {
    return PIXEL.sprite('mapPin', 16, 20, s => {
      s.ellipse(8, 7, 6, 6, P.red);
      s.rect(5, 11, 6, 3, P.red);
      s.px(6, 14, P.red); s.px(7, 15, P.redDk); s.px(8, 16, P.redDk);
      s.px(7, 14, P.red); s.px(8, 14, P.redDk); s.px(9, 14, P.redDk);
      s.px(8, 15, P.redDk);
      s.shadeEllipse(8, 7, 6, 6, P.redDk, 1, 0.4);
      s.ellipse(6, 5, 2, 1.6, P.redHi);
      s.ellipse(8, 7, 2.4, 2.4, '#f4ece0');
      s.outline();
    });
  }

  function lock() {
    return PIXEL.sprite('lock', 16, 18, s => {
      // shackle
      s.rect(4, 2, 8, 2, P.stoneHi);
      s.rect(4, 2, 2, 6, P.stoneHi);
      s.rect(10, 2, 2, 6, P.stoneHi);
      s.px(5, 3, '#d8d2c8'); s.px(10, 3, P.stoneDk);
      // body
      s.rect(2, 7, 12, 9, '#b8ad9c');
      s.rect(2, 7, 12, 2, '#cec4b4');
      s.rect(2, 14, 12, 2, '#8c8272');
      // keyhole
      s.rect(7, 10, 2, 2, P.outline);
      s.rect(7, 12, 2, 2, P.outline);
      s.outline();
    });
  }

  function gear() {
    return PIXEL.sprite('gear', 16, 16, s => {
      const c = 8;
      for (let a = 0; a < 8; a++) {
        const t = a / 8 * Math.PI * 2;
        s.rect(Math.round(c + Math.cos(t) * 6) - 1, Math.round(c + Math.sin(t) * 6) - 1, 3, 3, '#d8d2c8');
      }
      s.ellipse(c, c, 5, 5, '#d8d2c8');
      s.shadeEllipse(c, c, 5, 5, '#a09888', 1, 0.4);
      s.ellipse(c, c, 2, 2, '#6a6458');
      s.outline();
    });
  }

  function arrowUp() {
    return PIXEL.sprite('arrowUp', 12, 12, s => {
      s.rect(4, 5, 4, 6, '#f4ece0');
      for (let i = 0; i < 4; i++) s.rect(1 + i, 5 - i, 10 - i * 2, 1, '#f4ece0');
      s.rect(4, 9, 4, 2, '#d0c4ac');
      s.outline();
    });
  }

  /**
   * Animal-upgrades button icon: the farm's own animal under a gold
   * up-chevron. That button carries no label, so the icon has to say both
   * things on its own — the animal says WHICH menu (a gear or a bare arrow
   * would be indistinguishable from the farmhouse's farm-upgrade menu), the
   * chevron says "upgrade". It is built from the species' showcase sprite,
   * so enabling the split menu on another farm shows that farm's animal
   * without any new art.
   */
  function animalUp(species) {
    const img = animal(species, CONFIG.showcaseStage(species), 'idle', false);
    return PIXEL.sprite('animalUp:' + species, 32, 32, s => {
      // chevron centered in the clear band above the animal
      const gold = '#ffe98a';
      s.rect(14, 1, 4, 2, gold);
      s.rect(11, 3, 3, 2, gold); s.rect(18, 3, 3, 2, gold);
      s.rect(8, 5, 3, 2, gold);  s.rect(21, 5, 3, 2, gold);
      // outlines the chevron only — the animal sprite brings its own
      s.outline();
      s.g.drawImage(img, Math.round((32 - img.width) / 2), 32 - img.height);
    });
  }

  function xIcon() {
    return PIXEL.sprite('xIcon', 12, 12, s => {
      for (let i = 0; i < 9; i++) {
        s.rect(1 + i, 1 + i, 2, 2, '#f4ece0');
        s.rect(9 - i, 1 + i, 2, 2, '#f4ece0');
      }
      s.outline();
    });
  }

  /** Rewarded-video icon: little screen with a play triangle. */
  function adPlay() {
    return PIXEL.sprite('adPlay', 16, 12, s => {
      s.rect(1, 1, 14, 10, '#f4ece0');   // screen frame
      s.rect(2, 2, 12, 8, '#4a4440');    // dark screen
      for (let i = 0; i < 3; i++) s.rect(6 + i, 3 + i, 1, 6 - i * 2, '#7dbb4a');
      s.outline();
    });
  }

  return {
    animal, ANIMAL_SIZES, poop, coin, mutant2, ufo, pigeon, tornado,
    tree, bush, flower, rock, barrel, crate, giftCrate, crateLid, parachute,
    haystack, sign, fenceH,
    farmhouse, barn, shed,
    coop, nest, cottage, windmillTower, windmillBlades, silo, milkCan, woolBale,
    mapPin, lock, gear, arrowUp, animalUp, xIcon, adPlay,
    P,
  };
})();
</script>
<script>
/**
 * ENVIRONMENT — pre-rendered backgrounds: the three farm pens (top view,
 * wooden fence perimeter, per-farm ground + decoration set) and the world map.
 * Each is drawn once into an offscreen canvas at virtual resolution.
 */
const ENVIRONMENT = (() => {
  const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
  const cache = {};

  // Per-farm ground palettes (bright green / darker green / brown dirt)
  const GROUNDS = [
    { base: '#79a848', dark: '#6a9840', light: '#8ab656', speck: '#5c8a36', edge: '#55803a' },
    { base: '#5f8c3e', dark: '#537e36', light: '#6f9c4a', speck: '#42682c', edge: '#41652f' },
    { base: '#9a7043', dark: '#8a6238', light: '#aa804f', speck: '#755232', edge: '#6b4d30' },
  ];

  // Playable area inside the fence (virtual px). Wider pen, pushed down a
  // little so the themed farmhouse sits above it as the focal point.
  const PLAY = { x: 22, y: 160, w: W - 44, h: H - 300 };

  /** The full PLAY rect scaled to a fence tier's footprint (top edge fixed,
   *  centered horizontally so the farmhouse path still meets the pen gate). */
  function rectForSize(size) {
    if (!(size < 1)) return PLAY;
    const w = Math.round(PLAY.w * size), h = Math.round(PLAY.h * size);
    return { x: PLAY.x + Math.round((PLAY.w - w) / 2), y: PLAY.y, w, h };
  }

  /**
   * The farm's CURRENT playable area: the full PLAY rect, shrunk to the
   * fence tier's footprint on construction farms. This is the single source
   * for spawn slots, walk bounds and fence rendering, so capacity gained
   * from a fence upgrade is always physically usable. Before the fence
   * exists the whole plot is walkable — that is the area animals escape from.
   */
  function playRect(farmId) {
    const def = Construction.levelDef(farmId);
    return def ? rectForSize(def.size) : PLAY;
  }

  /** Footprint the fence would have at a given tier (1-based) — ghost preview. */
  function rectForLevel(farmId, lv) {
    const def = Construction.levelDef(farmId, lv);
    return def ? rectForSize(def.size) : PLAY;
  }

  /** Screen rect of the farmhouse — also the ghost placeholder's spot. */
  function houseRect(id) {
    const building = [SPRITES.coop, SPRITES.cottage, SPRITES.barn][id]();
    const w = building.width * 3, h = building.height * 3;
    return { x: (W - w) / 2 | 0, y: PLAY.y - 16 - h, w, h, img: building };
  }

  /** Deterministic pseudo-random for stable decoration layouts. */
  function seededRand(seed) {
    let s = seed;
    return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }

  function noiseGround(g, pal, rnd, x0, y0, w, h) {
    g.fillStyle = pal.base;
    g.fillRect(x0, y0, w, h);
    const n = (w * h) / 90;
    for (let i = 0; i < n; i++) {
      const x = x0 + rnd() * w, y = y0 + rnd() * h;
      const r = rnd();
      g.fillStyle = r < 0.35 ? pal.dark : r < 0.7 ? pal.light : pal.speck;
      const sz = 2 + ((rnd() * 3) | 0) * 2;
      g.fillRect(x | 0, y | 0, sz, rnd() < 0.5 ? 2 : sz);
    }
  }

  /**
   * Fence art — one look for the whole game. Every farm, built or classic,
   * renders Farm 1's wood fence: same sprite, same palette, same proportions.
   * A fence upgrade grows the enclosure (footprint + segment count, see
   * playRect / rectForLevel); it never changes the material.
   */

  /**
   * Post colors [face, highlight, shadow] — shared by the baked fence and the
   * live ghost preview, so an unbuilt fence previews in the material it will
   * actually be built from.
   */
  function fencePalette() {
    return [SPRITES.P.wood, SPRITES.P.woodHi, SPRITES.P.woodDk];
  }

  /** Fence perimeter around a play rect. */
  function drawFence(g, rect) {
    const f = SPRITES.fenceH(24);
    const sc = 2;
    const { x, y, w, h } = rect;
    const top = y - 20, bot = y + h - 6;
    // back fence (behind animals visually)
    for (let fx = x - 14; fx < x + w + 14; fx += f.width * sc - 2) {
      g.drawImage(f, fx, top, f.width * sc, f.height * sc);
    }
    // side fences (vertical posts made from small segments)
    for (let fy = top + 16; fy < bot; fy += 22) {
      drawPost(g, x - 12, fy); drawPost(g, x + w + 4, fy);
    }
    // side rails
    g.fillStyle = SPRITES.P.woodDk;
    g.fillRect(x - 8, top + 10, 3, bot - top - 4);
    g.fillRect(x + w + 8, top + 10, 3, bot - top - 4);
    g.fillStyle = SPRITES.P.wood;
    g.fillRect(x - 9, top + 10, 1, bot - top - 4);
    g.fillRect(x + w + 7, top + 10, 1, bot - top - 4);
    // front fence
    for (let fx = x - 14; fx < x + w + 14; fx += f.width * sc - 2) {
      g.drawImage(f, fx, bot, f.width * sc, f.height * sc);
    }
  }
  function drawPost(g, x, y) {
    const [face, hi, dk] = fencePalette();
    g.fillStyle = PIXEL.OUTLINE; g.fillRect(x - 1, y - 1, 10, 18);
    g.fillStyle = face; g.fillRect(x, y, 8, 16);
    g.fillStyle = hi; g.fillRect(x, y, 2, 16);
    g.fillStyle = dk; g.fillRect(x + 6, y, 2, 16);
  }

  /** Small stack of planks — construction-site prop for the unbuilt farm. */
  function drawPlankPile(g, x, y) {
    g.fillStyle = PIXEL.OUTLINE;
    g.fillRect(x - 2, y - 2, 48, 20);
    for (let row = 0; row < 3; row++) {
      const px2 = x + (row % 2) * 3, py = y + row * 5;
      g.fillStyle = SPRITES.P.wood; g.fillRect(px2, py, 42, 4);
      g.fillStyle = SPRITES.P.woodHi; g.fillRect(px2, py, 42, 1);
      g.fillStyle = SPRITES.P.woodDk; g.fillRect(px2 + 39, py, 3, 4);
    }
  }

  /**
   * Build one farm background. Construction farms re-render (and re-cache)
   * per build stage: a bare plot has neither house nor pen, a housed-but-
   * unfenced plot is open pasture, and each fence tier bakes its own
   * footprint (see playRect).
   */
  function farm(id) {
    const house = Construction.houseBuilt(id);
    const built = Construction.fenceBuilt(id);
    const fenceLv = Construction.fenceLevel(id);
    const key = 'farm' + id + (!Construction.required(id) ? ''
      : built ? '-f' + fenceLv : house ? '-h' : '-l');
    if (cache[key]) return cache[key];
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const pal = GROUNDS[id];
    const rnd = seededRand(1234 + id * 999);
    const R = playRect(id);

    // outer ground (darker border grass/dirt)
    noiseGround(g, { ...pal, base: pal.edge, light: pal.dark, dark: pal.edge, speck: pal.speck }, rnd, 0, 0, W, H);
    if (house) {
      // inner pen ground
      noiseGround(g, pal, rnd, R.x - 16, R.y - 30, R.w + 32, R.h + 30);

      // dirt patches inside pen — just a couple, kept subtle for open grass
      for (let i = 0; i < 2; i++) {
        const px2 = R.x + 40 + rnd() * Math.max(20, R.w - 110), py = R.y + 50 + rnd() * Math.max(20, R.h - 120);
        g.fillStyle = id === 2 ? '#8a6238' : '#8a7a4a';
        g.globalAlpha = 0.4;
        g.beginPath(); g.ellipse(px2, py, 16 + rnd() * 10, 7 + rnd() * 4, 0, 0, 7); g.fill();
        g.globalAlpha = 1;
      }
    }

    // dirt path from the farmhouse door down to the pen gate, then the
    // themed farmhouse itself — the focal point, centered on the grass
    // above the pen (both only once the house has been built)
    if (house) {
      g.fillStyle = '#caa96a';
      g.fillRect(W / 2 - 11, R.y - 34, 22, 40);
      g.beginPath(); g.ellipse(W / 2, R.y + 8, 15, 7, 0, 0, 7); g.fill();
      g.fillStyle = '#b8935a';
      g.fillRect(W / 2 - 7, R.y - 34, 14, 38);
      g.beginPath(); g.ellipse(W / 2, R.y + 6, 10, 5, 0, 0, 7); g.fill();

      const hr = houseRect(id);
      g.drawImage(hr.img, hr.x, hr.y, hr.w, hr.h);
    }

    // trees: one flanking the farmhouse on the left, one on the
    // bottom-right grass — the upper-right corner is kept clear for the
    // UFO's permanent parking spot (see ufo.js spot())
    const treeV = id === 0 ? 0 : 1;
    const treeImg = SPRITES.tree(treeV);
    g.drawImage(treeImg, 6, R.y - 94, 60, 72);
    g.drawImage(treeImg, W - 68, PLAY.y + PLAY.h + 40, 60, 72);

    // flowers beside the path entrance
    g.drawImage(SPRITES.flower(id), W / 2 - 52, R.y - 40, 16, 20);
    g.drawImage(SPRITES.flower((id + 1) % 3), W / 2 + 38, R.y - 38, 16, 20);

    // tidy row of decorations on the grass below the front fence
    const botY = R.y + R.h + 32;
    g.drawImage(SPRITES.bush(id === 0 ? 2 : 1), 28, botY, 36, 24);
    // (kept left of x~250: the relocated tree stands on the bottom-right grass)
    g.drawImage(SPRITES.bush(1), 206, botY + 4, 36, 24);
    if (id === 2) {
      g.drawImage(SPRITES.haystack(), W / 2 - 20, botY - 2, 40, 32);
    } else {
      g.drawImage(SPRITES.rock(1), W / 2 - 16, botY + 8, 32, 20);
    }
    g.drawImage(SPRITES.flower((id + 2) % 3), 78, botY + 10, 16, 20);
    g.drawImage(SPRITES.flower(id), W - 88, botY + 12, 16, 20);

    if (!built) {
      // no fence yet: a construction site waiting for the player — a plank
      // pile and site rubble where the pen will go (the ghosted fence
      // footprint is drawn live, see FarmScene.drawHouse)
      drawPlankPile(g, W / 2 - 74, PLAY.y + PLAY.h - 24);
      g.drawImage(SPRITES.rock(0), W / 2 + 30, PLAY.y + PLAY.h - 34, 28, 20);
      g.drawImage(SPRITES.rock(1), W / 2 + 54, PLAY.y + PLAY.h - 20, 28, 20);
      cache[key] = c;
      return c;
    }

    drawFence(g, R);

    // in-pen props tucked into the top corners, out of the walk area
    g.drawImage(SPRITES.barrel(), R.x + 6, R.y - 2, 28, 32);
    if (id === 2) {
      g.drawImage(SPRITES.haystack(), R.x + R.w - 48, R.y + 2, 40, 32);
    } else {
      g.drawImage(SPRITES.bush(id === 0 ? 2 : 1), R.x + R.w - 44, R.y + 4, 36, 24);
    }
    // a few accents pinned to the pen edges so the middle stays open
    const edge = [
      { x: R.x + 16, y: R.y + R.h - 42 },
      { x: R.x + R.w - 34, y: R.y + R.h - 52 },
      { x: R.x + 18, y: R.y + 64 },
    ];
    for (let i = 0; i < edge.length; i++) {
      const img = id === 2 ? SPRITES.rock(i % 2) : SPRITES.flower((id + i) % 3);
      g.drawImage(img, edge[i].x, edge[i].y, img.width * 2, img.height * 2);
    }

    cache[key] = c;
    return c;
  }

  // ---------------- WORLD MAP ----------------
  // Farm node positions on the map
  const MAP_NODES = [
    { x: 80,  y: 200 },
    { x: 250, y: 330 },
    { x: 110, y: 470 },
  ];

  /**
   * Per-farm themed map anchors: where the species mascot stands, where
   * chimney smoke rises, the windmill hub, and waving grass tufts.
   * All animated in MapScene; static art is baked into worldMap().
   */
  const THEME = [
    { // chicken
      animal: { x: 56, y: 232 },
      grass: [{ x: 38, y: 180 }, { x: 120, y: 184 }, { x: 46, y: 232 }],
    },
    { // sheep
      animal: { x: 278, y: 352 },
      windmill: { x: 188, y: 294 },
      chimney: { x: 266, y: 282 },
      grass: [{ x: 210, y: 302 }, { x: 292, y: 346 }, { x: 206, y: 354 }],
    },
    { // cow
      animal: { x: 140, y: 502 },
      chimney: { x: 96, y: 414 },
      grass: [{ x: 70, y: 444 }, { x: 150, y: 488 }, { x: 66, y: 498 }],
    },
  ];

  /** Road control path between nodes (list of points per segment). */
  const ROADS = [
    [{ x: 80, y: 200 }, { x: 150, y: 230 }, { x: 210, y: 280 }, { x: 250, y: 330 }],
    [{ x: 250, y: 330 }, { x: 230, y: 390 }, { x: 170, y: 440 }, { x: 110, y: 470 }],
  ];

  // Decorative striped flag planted roadside on the Farm 1 → Farm 2 stretch —
  // anchored to the road segment's middle control points so it tracks any
  // road re-routing. Offset perpendicular to the upper-right side of the
  // road, outside every node's tap radius and clear of the windmill blades.
  // Purely visual.
  const FLAG = (() => {
    const a = ROADS[0][1], b = ROADS[0][2];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    // unit perpendicular pointing away from the road's upper-right edge
    const px = (b.y - a.y) / len, py = -(b.x - a.x) / len;
    return {
      x: Math.round((a.x + b.x) / 2 + px * 14),
      y: Math.round((a.y + b.y) / 2 + py * 14),
    };
  })();

  function roadPoints(seg, step = 6) {
    // Catmull-rom-ish smooth sampling through control points
    const pts = [];
    const cp = ROADS[seg];
    for (let i = 0; i < cp.length - 1; i++) {
      const a = cp[i], b = cp[i + 1];
      const n = Math.ceil(U.dist(a.x, a.y, b.x, b.y) / step);
      for (let j = 0; j < n; j++) {
        const t = j / n;
        // slight sine wiggle for a hand-drawn curve
        const wig = Math.sin((i + t) * 5) * 6;
        pts.push({ x: U.lerp(a.x, b.x, t) + wig * 0.4, y: U.lerp(a.y, b.y, t) });
      }
    }
    pts.push(cp[cp.length - 1]);
    return pts;
  }

  /**
   * Construction stage of one farm for map rendering: 0 = empty, undeveloped
   * plot (land not bought, or bought but nothing built on it yet), 1 = house
   * standing but no fence, 2 = complete. Classic farms are always 2.
   */
  function mapStage(farmId) {
    if (!Construction.required(farmId)) return 2;
    if (!Construction.houseBuilt(farmId)) return 0;
    return Construction.fenceBuilt(farmId) ? 2 : 1;
  }

  function worldMap() {
    // the map re-bakes (and re-caches) whenever a construction farm's build
    // stage or fence tier changes, so plots develop visibly as the player
    // builds — including the fence ring taking on each new tier's material
    const mapKey = 'map-' + CONFIG.FARMS
      .map(f => mapStage(f.id) + '.' + Construction.fenceLevel(f.id)).join('');
    if (cache[mapKey]) return cache[mapKey];
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const rnd = seededRand(777);

    noiseGround(g, GROUNDS[1], rnd, 0, 0, W, H);

    // river on the right
    g.fillStyle = '#3d6f8e';
    g.beginPath();
    g.moveTo(W - 60, 0);
    for (let y = 0; y <= H; y += 20) g.lineTo(W - 55 + Math.sin(y * 0.02) * 16, y);
    g.lineTo(W, H); g.lineTo(W, 0); g.closePath(); g.fill();
    g.fillStyle = '#4d83a3';
    for (let y = 10; y < H; y += 26) {
      g.fillRect(W - 40 + Math.sin(y * 0.05) * 10, y, 10, 3);
    }
    g.fillStyle = '#6ea3bf';
    for (let y = 22; y < H; y += 34) g.fillRect(W - 30 + Math.sin(y * 0.07) * 8, y, 6, 2);

    // roads
    g.strokeStyle = '#caa96a';
    g.lineWidth = 12;
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let seg = 0; seg < 2; seg++) {
      const pts = roadPoints(seg);
      g.beginPath();
      g.moveTo(pts[0].x, pts[0].y);
      for (const p of pts) g.lineTo(p.x, p.y);
      g.stroke();
    }
    g.strokeStyle = '#b8935a';
    g.lineWidth = 8;
    for (let seg = 0; seg < 2; seg++) {
      const pts = roadPoints(seg);
      g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
      for (const p of pts) g.lineTo(p.x, p.y);
      g.stroke();
    }

    // farm plots: fenced circles with per-farm ground (an unpurchased
    // construction plot stays an open, unfenced patch of ground)
    for (let i = 0; i < 3; i++) {
      const n = MAP_NODES[i], pal = GROUNDS[i];
      const stage = mapStage(i);
      g.fillStyle = PIXEL.OUTLINE;
      g.beginPath(); g.ellipse(n.x, n.y, 47, 35, 0, 0, 7); g.fill();
      g.fillStyle = pal.base;
      g.beginPath(); g.ellipse(n.x, n.y, 45, 33, 0, 0, 7); g.fill();
      g.fillStyle = pal.dark;
      for (let k = 0; k < 14; k++) {
        g.fillRect(n.x - 40 + rnd() * 78, n.y - 26 + rnd() * 52, 3, 2);
      }
      if (stage < 2) continue; // no fence built yet: no fence ring on the plot
      // fence ring: posts around the ellipse, in the same wood the farm's
      // own fence is built from
      const [face, hi] = fencePalette();
      for (let a = 0; a < 14; a++) {
        const t = a / 14 * Math.PI * 2;
        const px2 = n.x + Math.cos(t) * 44, py = n.y + Math.sin(t) * 32;
        g.fillStyle = PIXEL.OUTLINE; g.fillRect(px2 - 2, py - 7, 6, 12);
        g.fillStyle = face; g.fillRect(px2 - 1, py - 6, 4, 10);
        g.fillStyle = hi; g.fillRect(px2 - 1, py - 6, 1, 10);
      }
    }

    // ---- ground details on the plots (kept procedural; part of the
    // terrain layers in the Figma "World Map — Props" scene) ----
    {
      const n = MAP_NODES[0];
      // scattered feed
      g.fillStyle = '#e0b656';
      for (let k = 0; k < 10; k++) {
        g.fillRect(n.x - 24 + rnd() * 48 | 0, n.y + 8 + rnd() * 18 | 0, 2, 2);
      }
    }
    {
      const n = MAP_NODES[1];
      // pasture tufts (lighter green)
      g.fillStyle = GROUNDS[1].light;
      for (let k = 0; k < 12; k++) {
        g.fillRect(n.x - 36 + rnd() * 72 | 0, n.y - 20 + rnd() * 42 | 0, 3, 2);
      }
    }
    {
      const n = MAP_NODES[2];
      // grazing patches on the dirt plot
      g.fillStyle = '#79a848'; g.globalAlpha = 0.7;
      g.beginPath(); g.ellipse(n.x - 26, n.y + 16, 14, 7, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(n.x + 30, n.y + 8, 11, 6, 0, 0, 7); g.fill();
      g.globalAlpha = 1;
    }

    // ---- props: fixed layout from the Figma "World Map — Props" scene
    // (50:3), Figma px / 2, trim offsets unfolded to full-sprite rects.
    // Layer order here mirrors the design's z-order. ----
    const SPR = {
      haystack: () => SPRITES.haystack(), coop: () => SPRITES.coop(), nest: () => SPRITES.nest(),
      windmillTower: () => SPRITES.windmillTower(), cottage: () => SPRITES.cottage(),
      woolBale: () => SPRITES.woolBale(), flower0: () => SPRITES.flower(0), flower2: () => SPRITES.flower(2),
      silo: () => SPRITES.silo(), barn: () => SPRITES.barn(), milkCan: () => SPRITES.milkCan(),
      tree0: () => SPRITES.tree(0), tree1: () => SPRITES.tree(1),
      bush1: () => SPRITES.bush(1), rock0: () => SPRITES.rock(0),
    };
    // Props tagged with a farm id + the build stage they appear at grow in
    // with that farm's construction: the farmhouse prop arrives with the
    // house (stage 1) and the farm's dressing with the fence (stage 2), so a
    // plot under construction reads as under construction from the map.
    // Farm 1 has no entry and is therefore always fully dressed.
    const MID_PROPS = [
      ['haystack', 47.5, 197, 24, 19], ['coop', 45, 121.84, 71, 62.16], ['nest', 85.5, 194, 32, 20],
      ['windmillTower', 170, 282, 36, 60, 1, 2], ['cottage', 212.3, 248.09, 79.9, 75.26, 1, 1],
      ['woolBale', 268, 342, 28, 22, 1, 2], ['woolBale', 256, 354.36, 22, 18, 1, 2],
      ['flower0', 212, 336, 16, 20, 1, 2], ['flower2', 208, 332, 16, 20, 1, 2],
      ['silo', 37, 397, 32, 68, 2, 2], ['barn', 67.15, 379.22, 88.2, 78.22, 2, 1],
      ['milkCan', 62, 480, 20, 24, 2, 2], ['milkCan', 76, 486, 16, 20, 2, 2],
    ];
    const FG_PROPS = [
      ['tree1', 206, 79.5, 60, 72], ['tree0', 258, 409, 60, 72], ['tree1', 244, 490, 60, 72],
      ['tree1', 16, 511, 60, 72], ['tree0', 168, 490, 60, 72], ['tree1', 84.5, 297, 60, 72],
      ['tree1', 124, 67, 60, 72], ['tree0', 167.5, 125, 60, 72], ['tree0', 72, 1, 60, 72],
      ['tree0', 3, 250, 60, 72], ['tree0', 202, 200, 60, 72], ['tree0', 209, 561, 60, 72],
      ['tree0', 75.5, 556, 60, 72],
      ['bush1', 104, 252, 36, 24], ['bush1', 14, 354, 36, 24], ['bush1', 128, 147, 36, 24],
      ['bush1', 197.5, 43, 36, 24],
      ['rock0', 12, 151, 28, 20], ['rock0', 121, 502, 28, 20], ['bush1', 42, 65, 36, 24],
      ['rock0', 48, 314, 28, 20], ['rock0', 271.5, 554, 28, 20],
    ];
    for (const [kind, x, y, w, h, farmId, needStage] of MID_PROPS) {
      if (farmId !== undefined && mapStage(farmId) < needStage) continue;
      g.drawImage(SPR[kind](), x, y, w, h);
    }
    for (const [kind, x, y, w, h] of FG_PROPS) g.drawImage(SPR[kind](), x, y, w, h);

    cache[mapKey] = c;
    return c;
  }

  return {
    farm, worldMap, mapStage, playRect, rectForLevel, houseRect, fencePalette,
    PLAY, MAP_NODES, THEME, FLAG, roadPoints, GROUNDS,
  };
})();
</script>
<script>
/**
 * AudioManager — all sound is synthesized with WebAudio (no asset files).
 * Provides SFX (merge, coin, poop, click, unlock) plus a gentle looping
 * background tune and ambient birds.
 */
const AudioManager = (() => {
  let ctx = null, master = null, musicGain = null, sfxGain = null;
  let musicOn = true, sfxOn = true;
  let musicTimer = null, ambientTimer = null;

  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = CONFIG.MUSIC_VOLUME; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = CONFIG.SFX_VOLUME; sfxGain.connect(master);
      startMusic();
      startAmbient();
      return true;
    } catch (e) { return false; }
  }

  /** One synthesized note. */
  function tone(freq, dur, type = 'sine', vol = 0.3, dest = null, slide = 0) {
    if (!ctx || !sfxOn && dest !== musicGain) { if (dest !== musicGain) return; }
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ctx.currentTime + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  function noise(dur, vol = 0.2, freq = 1000) {
    if (!ctx || !sfxOn) return;
    const len = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start();
  }

  // ---------------- SFX ----------------
  const SFX = {
    click()  { tone(650, 0.06, 'square', 0.12); tone(880, 0.05, 'square', 0.08); },
    merge()  {
      tone(440, 0.12, 'triangle', 0.3, null, 220);
      setTimeout(() => tone(660, 0.15, 'triangle', 0.3, null, 330), 60);
      setTimeout(() => tone(990, 0.25, 'sine', 0.25, null, 200), 130);
      noise(0.15, 0.12, 2400);
    },
    coin()   { tone(1320, 0.09, 'square', 0.12); setTimeout(() => tone(1760, 0.18, 'square', 0.1), 60); },
    poop()   { tone(180, 0.12, 'sine', 0.2, null, -80); noise(0.08, 0.06, 500); },
    pop()    { tone(520, 0.08, 'sine', 0.25, null, 300); },
    error()  { tone(220, 0.15, 'square', 0.12, null, -60); },
    buy()    {
      tone(660, 0.08, 'square', 0.18);
      setTimeout(() => tone(880, 0.1, 'square', 0.16), 70);
      setTimeout(() => tone(1320, 0.16, 'triangle', 0.2), 140);
    },
    ufo()    {
      // wobbly saucer hum
      tone(140, 0.9, 'sawtooth', 0.07, null, 80);
      tone(220, 0.9, 'sine', 0.09, null, 120);
      setTimeout(() => tone(180, 0.6, 'sine', 0.07, null, -60), 350);
    },
    beam()   {
      // tractor-beam zap sweeping down
      tone(1400, 0.35, 'sawtooth', 0.07, null, -900);
      tone(900, 0.3, 'sine', 0.1, null, -500);
      noise(0.2, 0.05, 3000);
    },
    alien()  {
      // chirpy "collected!" jingle
      tone(700, 0.09, 'square', 0.14, null, 300);
      setTimeout(() => tone(1050, 0.1, 'square', 0.12, null, 350), 80);
      setTimeout(() => tone(1580, 0.2, 'triangle', 0.16), 160);
    },
    coo()    {
      // soft two-note pigeon coo
      tone(520, 0.12, 'sine', 0.18, null, -160);
      setTimeout(() => tone(430, 0.18, 'sine', 0.15, null, -120), 110);
    },
    flap()   { noise(0.09, 0.1, 900); setTimeout(() => noise(0.07, 0.07, 900), 90); },
    wind()   {
      // roaring tornado gust
      noise(0.9, 0.12, 700);
      tone(110, 0.8, 'sawtooth', 0.05, null, 60);
      setTimeout(() => noise(0.6, 0.08, 500), 400);
    },
    unlock() {
      const seq = [523, 659, 784, 1047, 1319];
      seq.forEach((f, i) => setTimeout(() => tone(f, 0.35, 'triangle', 0.28), i * 110));
      setTimeout(() => noise(0.4, 0.1, 3000), 500);
    },
  };

  function play(name) { if (ctx && sfxOn && SFX[name]) SFX[name](); }

  // ---------------- MUSIC ----------------
  // Gentle pentatonic loop.
  const SCALE = [262, 294, 330, 392, 440, 523, 587, 659];
  let step = 0;
  function startMusic() {
    if (musicTimer) return;
    const beat = 0.32;
    musicTimer = setInterval(() => {
      if (!musicOn || !ctx) return;
      const bar = Math.floor(step / 8) % 4;
      // bass
      if (step % 4 === 0) tone(SCALE[[0, 3, 4, 3][bar]] / 2, beat * 2.2, 'triangle', 0.16, musicGain);
      // melody: sparse, wandering
      if (Math.random() < 0.6) {
        const n = SCALE[(step + bar * 2 + U.randInt(0, 2)) % SCALE.length];
        tone(n, beat * 1.4, 'sine', 0.10, musicGain);
      }
      step++;
    }, beat * 1000);
  }
  function startAmbient() {
    if (ambientTimer) return;
    ambientTimer = setInterval(() => {
      if (!musicOn || !ctx) return;
      // random birdsong chirp
      if (Math.random() < 0.4) {
        const f = U.rand(1800, 2600);
        tone(f, 0.08, 'sine', 0.04, musicGain, U.rand(200, 500));
        setTimeout(() => tone(f * 1.1, 0.1, 'sine', 0.03, musicGain, -300), 120);
      }
    }, 2600);
  }

  return {
    ensure, play,
    get musicOn() { return musicOn; },
    get sfxOn() { return sfxOn; },
    setMusic(v) { musicOn = v; if (musicGain) musicGain.gain.value = v ? CONFIG.MUSIC_VOLUME : 0; },
    setSfx(v) { sfxOn = v; },
  };
})();
</script>
<script>
/**
 * SaveManager — persists progress to localStorage and autosaves.
 */
const SaveManager = (() => {
  let data = null;

  // Chains are per species and each has its own length (Farm 1's chicken
  // chain is the long one), so every sized array is measured per farm.
  const STAGE_COUNT = species => CONFIG.stageCount(species);
  const UPGRADE_SLOTS = farmId => CONFIG.stageCount(CONFIG.FARMS[farmId].species);

  function defaults() {
    return {
      coins: 0,
      unlocked: [true, false, false],
      currentFarm: 0,
      settings: { music: true, sfx: true },
      // per-farm upgrade levels: { spawn, stages:[one level per evolution stage] }
      upgrades: CONFIG.FARMS.map(f => ({ spawn: 0, stages: CONFIG.stages(f.species).map(() => 0), et: 0 })),
      // per-farm animal snapshot: [{stage}...]
      animals: [[], [], []],
      // discovery collection: species -> [bool per stage], permanent once true
      discovered: discoveredDefaults(),
      // per-farm: upgrade keys ('spawn' | stage index | 'et') whose row has
      // already animated into the upgrade panel, so each discovery plays its
      // entry animation exactly once (see Upgrades.takeUnrevealed)
      upgradesRevealed: CONFIG.FARMS.map(() => []),
      // per-farm: has the first-merge tutorial been completed?
      tutorialDone: CONFIG.FARMS.map(() => false),
      // one-time: has the first-upgrade tutorial been completed?
      upgradeTutorialDone: false,
      // per-farm UFO alien-collection layer: each farm unlocks its own UFO
      // with the first Mutant+Mutant merge on that farm
      ufo: CONFIG.FARMS.map(() => ({ landed: false, aliens: 0, pending: 0 })),
      // per-farm pigeon reward-ad event: remaining perch time, so a pigeon
      // left on a farm is still there when the player comes back to it
      pigeon: CONFIG.FARMS.map(() => ({ remaining: 0 })),
      // per-farm tornado auto-merge reward-ad event: remaining availability
      // window of an offer already on screen
      tornado: CONFIG.FARMS.map(() => ({ remaining: 0 })),
      // reward-event director (see js/events.js): lifetime active play (the
      // new-game grace), the appearance log, and per-feature appearance
      // timestamps driving the rolling frequency cap. Player-level, not
      // per-farm: the quota follows the player across their farms.
      events: eventsDefault(),
      // per-farm parachute surprise box: cooldown remaining, whether a crate
      // is currently resting in the pen (it persists until tapped), the
      // stage rolled inside it, and a granted animal still waiting for a
      // free slot (-1 = none)
      crate: CONFIG.FARMS.map(() => crateDefault()),
      // per-farm latch: this farm's whole chain has been discovered, which is
      // what switches the surprise box on. Latched once and kept, so the
      // feature never turns itself back off (see js/crate.js `unlocked`).
      crateUnlocked: CONFIG.FARMS.map(() => false),
      // per-farm background production: last reconcile timestamp (ms epoch),
      // uncollected coin balance, and the carried spawn-timer remainder
      idle: CONFIG.FARMS.map(() => ({ last: 0, pending: 0, carry: 0 })),
      // per-farm step-by-step build state (only meaningful for farms with a
      // CONFIG.CONSTRUCTION entry): land bought, house built, fence tier
      construction: CONFIG.FARMS.map(() => ({ land: false, house: false, fence: 0 })),
      // one-time flag: upgradesRevealed has been back-filled from an older
      // save's discoveries (see migrate) — a new save needs no back-fill
      revealSeeded: true,
      firstRun: true,
    };
  }

  /** Frequency-limit slot for one reward event (timestamps in ms epoch). */
  function eventSlot() { return { shown: [], last: 0, extra: 0 }; }

  function eventsDefault() {
    return { play: 0, log: [], pigeon: eventSlot(), tornado: eventSlot() };
  }

  function crateDefault() {
    return { next: CONFIG.CRATE.COOLDOWN, active: 0, stage: -1, pending: -1 };
  }

  function discoveredDefaults() {
    const d = {};
    for (const f of CONFIG.FARMS) d[f.species] = CONFIG.stages(f.species).map(() => false);
    return d;
  }

  /** Bring older saves up to the current schema (extra stages, discovery data). */
  function migrate(d) {
    // a chain that has grown (Farm 1 went from four stages to six) simply
    // gains fresh level-0 slots; the old levels stay on the stages they were
    // bought for, so nothing a player paid for is lost or shifted
    d.upgrades.forEach((u, farmId) => {
      while (u.stages.length < UPGRADE_SLOTS(farmId)) u.stages.push(0);
      if (u.et === undefined) u.et = 0;
    });
    if (!d.discovered) d.discovered = discoveredDefaults();
    if (!d.ufo) d.ufo = CONFIG.FARMS.map(() => ({ landed: false, aliens: 0, pending: 0 }));
    // old saves had one global UFO: it becomes Farm 1's UFO, others start locked
    if (!Array.isArray(d.ufo)) {
      const legacy = d.ufo;
      d.ufo = CONFIG.FARMS.map((f, i) => i === 0
        ? { landed: !!legacy.landed, aliens: legacy.aliens || 0, pending: legacy.pending || 0 }
        : { landed: false, aliens: 0, pending: 0 });
    }
    while (d.ufo.length < CONFIG.FARMS.length) d.ufo.push({ landed: false, aliens: 0, pending: 0 });
    // the old `next` countdown on these slots is obsolete (js/events.js owns
    // timing now) — an older save simply carries a field nothing reads
    if (!d.pigeon) d.pigeon = CONFIG.FARMS.map(() => ({ remaining: 0 }));
    while (d.pigeon.length < CONFIG.FARMS.length) d.pigeon.push({ remaining: 0 });
    if (!d.tornado) d.tornado = CONFIG.FARMS.map(() => ({ remaining: 0 }));
    while (d.tornado.length < CONFIG.FARMS.length) d.tornado.push({ remaining: 0 });
    // reward-event director state, back-filled slot by slot so a save from
    // before any part of it existed starts with a clean, complete record
    if (!d.events) d.events = eventsDefault();
    if (typeof d.events.play !== 'number') d.events.play = 0;
    if (!Array.isArray(d.events.log)) d.events.log = [];
    for (const f of ['pigeon', 'tornado']) {
      const s = d.events[f] || (d.events[f] = eventSlot());
      if (!Array.isArray(s.shown)) s.shown = [];
      if (typeof s.last !== 'number') s.last = 0;
      if (typeof s.extra !== 'number') s.extra = 0;
    }
    if (!d.crate) d.crate = CONFIG.FARMS.map(() => crateDefault());
    while (d.crate.length < CONFIG.FARMS.length) d.crate.push(crateDefault());
    if (!d.crateUnlocked) d.crateUnlocked = CONFIG.FARMS.map(() => false);
    while (d.crateUnlocked.length < CONFIG.FARMS.length) d.crateUnlocked.push(false);
    // a crate rolled before the pool rule existed (or on a chain that has
    // since shrunk) is re-rolled on tap; clamp the stored index defensively
    for (const f of CONFIG.FARMS) {
      const c = d.crate[f.id];
      if (c.pending !== undefined && c.pending >= STAGE_COUNT(f.species)) c.pending = -1;
      if (c.stage !== undefined && c.stage >= STAGE_COUNT(f.species)) c.stage = -1;
      if (c.pending === undefined) c.pending = -1;
    }
    if (!d.idle) d.idle = CONFIG.FARMS.map(() => ({ last: 0, pending: 0, carry: 0 }));
    while (d.idle.length < CONFIG.FARMS.length) d.idle.push({ last: 0, pending: 0, carry: 0 });
    if (!d.construction) d.construction = CONFIG.FARMS.map(() => ({ land: false, house: false, fence: 0 }));
    while (d.construction.length < CONFIG.FARMS.length) d.construction.push({ land: false, house: false, fence: 0 });
    // saves from before the construction system: a construction farm that is
    // already unlocked keeps working as a finished farm (land + house owned,
    // fence at the top tier so its pen still fits every animal the player has)
    for (const f of CONFIG.FARMS) {
      const p = (CONFIG.CONSTRUCTION || {})[f.id];
      const c = d.construction[f.id];
      if (!p) continue;
      if (c.house === undefined) c.house = c.fence >= 1;
      if (d.unlocked[f.id] && !c.land) {
        c.land = true;
        c.house = true;
        c.fence = p.FENCE_LEVELS.length;
      }
    }
    // players from before the tutorial existed (or with animals already) skip it
    if (!d.tutorialDone) d.tutorialDone = CONFIG.FARMS.map(f => (d.animals[f.id] || []).length > 0);
    // players who already bought an upgrade skip the first-upgrade tutorial
    if (d.upgradeTutorialDone === undefined) {
      d.upgradeTutorialDone = d.upgrades.some(u => u.spawn > 0 || u.stages.some(s => s > 0));
    }
    for (const f of CONFIG.FARMS) {
      const n = STAGE_COUNT(f.species);
      if (!d.discovered[f.species]) d.discovered[f.species] = CONFIG.stages(f.species).map(() => false);
      while (d.discovered[f.species].length < n) d.discovered[f.species].push(false);
      // animals the player already owns don't need a (re)celebration
      for (const a of d.animals[f.id] || []) {
        if (a.stage < n) d.discovered[f.species][a.stage] = true;
      }
      // a save from before the chicken chain was deepened can hold animals
      // past the new top stage only if the chain ever shrinks — clamp so a
      // stale index can never index past the sprite table
      d.animals[f.id] = (d.animals[f.id] || []).map(a => ({ stage: Math.min(a.stage, n - 1) }));
    }
    // Existing saves: every upgrade the player can already see counts as
    // revealed, so opening the panel doesn't replay entry animations for rows
    // that have always been there. Seeded exactly once per save — Farm 1's
    // rows used to be ungated, so without this the whole panel would animate
    // in the first time it is opened now that the discovery gate applies
    // there too. Rows for stages the player has NOT reached stay unseeded, so
    // each still animates in on its own discovery, this session or a later one.
    if (!d.upgradesRevealed) d.upgradesRevealed = CONFIG.FARMS.map(() => []);
    while (d.upgradesRevealed.length < CONFIG.FARMS.length) d.upgradesRevealed.push([]);
    if (!d.revealSeeded) {
      d.revealSeeded = true;
      for (const f of CONFIG.FARMS) {
        const disc = d.discovered[f.species] || [];
        const seen = d.upgradesRevealed[f.id];
        const mark = k => { if (!seen.includes(k)) seen.push(k); };
        disc.forEach((v, s) => { if (v) mark(String(s)); });
        if (disc[0]) mark('spawn');
        if (d.ufo[f.id] && d.ufo[f.id].landed) mark('et');
      }
    }
    return d;
  }

  function load() {
    try {
      const raw = localStorage.getItem(CONFIG.SAVE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      // revealSeeded is forced from the stored value: a save written before
      // the flag existed must read as unseeded, not inherit the default's true
      data = parsed
        ? migrate(Object.assign(defaults(), parsed, { revealSeeded: !!parsed.revealSeeded }))
        : defaults();
    } catch (e) { data = defaults(); }
    return data;
  }

  function save() {
    try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function reset() {
    data = defaults();
    save();
  }

  return {
    load, save, reset,
    get data() { return data || load(); },
  };
})();
</script>
<script>
/**
 * Discovery — tracks which species+stage evolutions the player has created.
 * Each unique evolution unlocks exactly once, is permanently saved, and can
 * later back an encyclopedia / collection book / achievements screen.
 */
const Discovery = (() => {

  function list(species) {
    return SaveManager.data.discovered[species];
  }

  function isDiscovered(species, stage) {
    return !!list(species)[stage];
  }

  /**
   * Mark a species+stage as discovered.
   * Returns true only the FIRST time (i.e. this creation is a new discovery).
   */
  function mark(species, stage) {
    const l = list(species);
    if (l[stage]) return false;
    l[stage] = true;
    SaveManager.save();
    return true;
  }

  /**
   * The chain's final, abducted form (Farm 1: the Final Chicken). It is
   * discovered by matching two of the last board stage on that farm, which is
   * exactly what starts its UFO layer, so the farm's saved UFO state IS the
   * discovery record (landed, or one already collected / in transit).
   */
  function isEtDiscovered(farmId) {
    const u = SaveManager.data.ufo[farmId];
    return !!u && (u.landed || u.aliens > 0 || (u.pending || 0) > 0);
  }

  /**
   * Has this farm's whole chain been discovered — every board stage AND the
   * final, abducted form? This is the end of that farm's collection, and
   * what gates the parachute surprise box (see js/crate.js).
   */
  function chainComplete(farmId) {
    const sp = CONFIG.FARMS[farmId].species;
    return CONFIG.stages(sp).every((_, i) => isDiscovered(sp, i)) && isEtDiscovered(farmId);
  }

  /** Full collection snapshot: [{species, label, stages:[{name, discovered}]}] */
  function collection() {
    return CONFIG.FARMS.map(f => ({
      species: f.species,
      label: f.label,
      stages: CONFIG.stages(f.species).map((s, i) => ({
        name: s.name,
        discovered: isDiscovered(f.species, i),
      })),
    }));
  }

  /**
   * Display name for the celebration popup, e.g. "STRANGE CHICKEN". A stage
   * whose name doesn't read well in front of the species (the chain's
   * "MUTANT 2" wants to be "MUTANT CHICKEN 2") carries its own `title`.
   */
  function displayName(species, stage) {
    const s = CONFIG.stage(species, stage);
    return s.title || (s.name + ' ' + species.toUpperCase());
  }

  function flavor(species, stage) {
    const s = CONFIG.stage(species, stage);
    return (s && s.flavor) || '';
  }

  return { isDiscovered, isEtDiscovered, chainComplete, mark, collection, displayName, flavor };
})();
</script>
<script>
/**
 * Construction — step-by-step farm build progression (see CONFIG.CONSTRUCTION).
 * A construction farm goes: buy the land (map) -> build the house (starts
 * animal spawning) -> build the fence (animals stop escaping, production
 * starts) -> fence upgrades (capacity + pen footprint; the fence art is the
 * same wood on every farm and every tier).
 *
 * The farm produces NOTHING — no money, no background/offline accrual — until
 * land + house + fence all exist; with the house but no fence, animals spawn
 * and then wander off the plot (see js/animal.js 'escape').
 * State lives in SaveManager.data.construction[farmId] = { land, house, fence }.
 * Farms without a CONFIG entry are always "complete" and keep the classic
 * one-shot unlock behavior.
 */
const Construction = (() => {
  function plan(farmId) { return (CONFIG.CONSTRUCTION || {})[farmId] || null; }
  function state(farmId) { return SaveManager.data.construction[farmId]; }

  /** Does this farm use the step-by-step build flow at all? */
  function required(farmId) { return !!plan(farmId); }

  function landOwned(farmId) { return !required(farmId) || !!state(farmId).land; }

  /** The house is what starts animal spawning. Classic farms always have one. */
  function houseBuilt(farmId) { return !required(farmId) || !!state(farmId).house; }

  /** Current fence tier (0 = not built yet). Non-construction farms: 0. */
  function fenceLevel(farmId) { return required(farmId) ? state(farmId).fence : 0; }

  function maxFenceLevel(farmId) { return required(farmId) ? plan(farmId).FENCE_LEVELS.length : 0; }

  function fenceBuilt(farmId) { return !required(farmId) || state(farmId).fence >= 1; }

  /** Definition of the current fence tier, or null while unbuilt. */
  function levelDef(farmId, lv = fenceLevel(farmId)) {
    const p = plan(farmId);
    if (!p || lv < 1) return null;
    return p.FENCE_LEVELS[Math.min(lv, p.FENCE_LEVELS.length) - 1];
  }

  /** Definition of the next buildable/upgradable tier, or null at max. */
  function nextDef(farmId) {
    const p = plan(farmId);
    if (!p) return null;
    const lv = fenceLevel(farmId);
    return lv < p.FENCE_LEVELS.length ? p.FENCE_LEVELS[lv] : null;
  }

  /** Land + house + fence: the farm is operational. */
  function isComplete(farmId) {
    return !required(farmId) ||
      (!!state(farmId).land && !!state(farmId).house && state(farmId).fence >= 1);
  }

  /**
   * Hard animal cap. No house: nothing spawns at all. House but no fence:
   * the unfenced cap (they escape anyway). Fenced: the tier's capacity.
   */
  function capacity(farmId) {
    if (!required(farmId)) return CONFIG.farmMaxAnimals(farmId);
    if (!houseBuilt(farmId)) return 0;
    const def = levelDef(farmId);
    return def ? def.capacity : plan(farmId).UNFENCED_CAPACITY;
  }

  /** House standing, no fence yet: spawned animals wander off and are lost. */
  function escapesActive(farmId) {
    return required(farmId) && houseBuilt(farmId) && !fenceBuilt(farmId);
  }

  /**
   * Fence-jump tuning, or null on a farm that doesn't use construction —
   * both escape behaviours are exclusive to construction farms, so a null
   * here means animals on that farm are never lost (see FarmScene).
   */
  function jumpCfg(farmId) {
    const p = plan(farmId);
    return p && p.FENCE_JUMP && p.FENCE_JUMP.ENABLED ? p.FENCE_JUMP : null;
  }

  /** Seconds this animal stays on the board before walking off. */
  function escapeDelay(farmId) {
    const p = plan(farmId);
    if (!p) return Infinity;
    return Math.max(1, p.ESCAPE_TIME + U.rand(-p.ESCAPE_VARIANCE, p.ESCAPE_VARIANCE));
  }

  /** Map purchase price (falls back to the classic unlock cost). */
  function landCost(farmId) {
    return required(farmId) ? plan(farmId).LAND_COST : CONFIG.UNLOCK_COSTS[farmId];
  }

  function houseCost(farmId) { return required(farmId) ? plan(farmId).HOUSE_COST : 0; }

  /** Called by the unlock flow once the map purchase animation lands. */
  function grantLand(farmId) {
    if (!required(farmId)) return;
    state(farmId).land = true;
    SaveManager.save();
  }

  /**
   * The build step waiting for the player:
   *   'land'    — plot not bought yet (handled by the map unlock flow)
   *   'house'   — bare plot, nothing spawns
   *   'fence'   — animals spawn but escape
   *   'upgrade' — operational, fence can still grow
   *   'max'     — fully built
   */
  function stage(farmId) {
    if (!required(farmId)) return 'max';
    if (!landOwned(farmId)) return 'land';
    if (!houseBuilt(farmId)) return 'house';
    if (!fenceBuilt(farmId)) return 'fence';
    return nextDef(farmId) ? 'upgrade' : 'max';
  }

  /** Cost of the next build step, or 0 when there is nothing left to buy. */
  function nextCost(farmId) {
    const s = stage(farmId);
    if (s === 'house') return houseCost(farmId);
    if (s === 'fence' || s === 'upgrade') return nextDef(farmId).cost;
    return 0;
  }

  /** Is there a purchase waiting on this farm (drives the map/HUD badges)? */
  function pending(farmId) {
    const s = stage(farmId);
    return s === 'house' || s === 'fence';
  }

  /**
   * Stamp the farm's idle clock to NOW so background/offline production
   * starts from this moment — never retroactively for the time the farm sat
   * unbuilt (see js/idle.js, which skips incomplete farms entirely).
   */
  function startIdleClock(farmId) {
    const r = SaveManager.data.idle[farmId];
    r.last = Date.now();
    r.carry = 0;
    r.pending = 0;
  }

  /** Build the farmhouse: from here babies start spawning. */
  function buyHouse(farmId) {
    if (!required(farmId) || houseBuilt(farmId)) return { ok: false, reason: 'ALREADY BUILT!' };
    const c = houseCost(farmId);
    if (SaveManager.data.coins < c) return { ok: false, reason: 'NOT ENOUGH COINS!' };
    SaveManager.data.coins -= c;
    state(farmId).house = true;
    SaveManager.save();
    return { ok: true };
  }

  /**
   * Build (level 0 -> 1) or upgrade the fence. The build that completes
   * construction also starts the farm's idle clock.
   */
  function buyFence(farmId) {
    const nxt = nextDef(farmId);
    if (!nxt) return { ok: false, reason: 'MAX LEVEL!' };
    if (!houseBuilt(farmId)) return { ok: false, reason: 'BUILD THE HOUSE FIRST!' };
    if (SaveManager.data.coins < nxt.cost) return { ok: false, reason: 'NOT ENOUGH COINS!' };
    SaveManager.data.coins -= nxt.cost;
    state(farmId).fence++;
    if (state(farmId).fence === 1) startIdleClock(farmId);
    SaveManager.save();
    return { ok: true };
  }

  /** Buy whatever the current stage offers. */
  function buyNext(farmId) {
    const s = stage(farmId);
    if (s === 'house') return buyHouse(farmId);
    if (s === 'fence' || s === 'upgrade') return buyFence(farmId);
    return { ok: false, reason: 'MAX LEVEL!' };
  }

  /**
   * Everything the build panel needs to render its current state:
   * where the player is, what the next purchase is, what it costs and what
   * it unlocks, plus the live fence tier / animal count once fenced.
   */
  function info(farmId, animalCount = 0) {
    const s = stage(farmId);
    const lv = fenceLevel(farmId);
    const maxLv = maxFenceLevel(farmId);
    const nxt = nextDef(farmId);
    const COPY = {
      house: { title: 'BUILD THE HOUSE', unlocks: 'ANIMALS START SPAWNING' },
      fence: { title: 'BUILD THE FENCE', unlocks: 'ANIMALS STOP ESCAPING' },
      upgrade: { title: 'UPGRADE THE FENCE', unlocks: 'BIGGER PEN, MORE ANIMALS' },
      max: { title: 'FARM COMPLETE!', unlocks: 'EVERYTHING IS BUILT' },
    };
    const copy = COPY[s] || COPY.max;
    // step 1 land / 2 house / 3 fence / 4.. upgrades
    const step = s === 'land' ? 1 : s === 'house' ? 2 : 2 + Math.min(lv + 1, maxLv);
    return {
      stage: s,
      step,
      steps: 2 + maxLv,
      title: copy.title,
      unlocks: copy.unlocks,
      cost: nextCost(farmId),
      maxed: s === 'max',
      fenceBuilt: fenceBuilt(farmId),
      level: lv,
      maxLevel: maxLv,
      capacity: capacity(farmId),
      nextCapacity: nxt ? nxt.capacity : null,
      animals: animalCount,
    };
  }

  return {
    required, landOwned, houseBuilt, fenceLevel, maxFenceLevel, fenceBuilt,
    levelDef, nextDef, isComplete, capacity, escapesActive, jumpCfg,
    escapeDelay, landCost, houseCost, nextCost, stage, pending, grantLand,
    buyHouse, buyFence, buyNext, info,
  };
})();
</script>
<script>
/**
 * Upgrades — per-farm, data-driven upgrade system.
 * Levels live in SaveManager.data.upgrades[farmId] = { spawn, stages:[...], et }.
 * All numbers come from the farm's chain (CONFIG.CHAINS) and CONFIG.UPGRADES;
 * nothing is hardcoded here, and no chain length is assumed — a farm's rows
 * are exactly as many as its species has stages.
 *
 * Keys used throughout: 'spawn' for the farm spawn-speed upgrade, a board
 * stage index for the animal upgrades, or 'et' for the chain's final,
 * UFO-abducted form (Farm 1: the Final Chicken).
 *
 * Every upgrade is gated behind discovery — see unlocked() — so the menu
 * fills in one row at a time as the player merges their way up the chain.
 */
const Upgrades = (() => {
  const CU = () => CONFIG.UPGRADES;
  const species = farmId => CONFIG.FARMS[farmId].species;

  function farmData(farmId) {
    return SaveManager.data.upgrades[farmId];
  }

  /** The upgrade definition behind a key, or null if the chain has no row for it. */
  function def(farmId, key) {
    if (key === 'spawn') return CU().FARM.SPAWN;
    const entry = CONFIG.entry(species(farmId), key);
    return (entry && entry.up) || null;
  }

  function level(farmId, key) {
    const d = farmData(farmId);
    return key === 'spawn' ? d.spawn : key === 'et' ? (d.et || 0) : d.stages[key];
  }

  function cost(farmId, key) {
    const u = def(farmId, key);
    if (!u) return 0;
    const growth = u.costGrowth || CU().COST_GROWTH;
    return Math.round(u.baseCost * Math.pow(growth, level(farmId, key)) * CONFIG.FARMS[farmId].costMult);
  }

  function maxLevel(farmId, key) {
    const u = def(farmId, key);
    return u ? u.maxLevel : 0;
  }

  function isMaxed(farmId, key) {
    return level(farmId, key) >= maxLevel(farmId, key);
  }

  /**
   * Discovery gating, on every farm. An upgrade is not offered up front: it
   * unlocks only once the player has discovered the animal it improves on
   * that farm — the farm has spawned it and they have matched their way up to
   * it. Until then the row does not exist in the panel at all, so a long
   * chain never spoils its own ending. Discovery is per species (so per farm)
   * and permanent, so an unlocked upgrade stays unlocked across sessions.
   * The spawn-speed upgrade rides on the baby: the farm has to have produced
   * one before its spawn rate can be tuned. The final abducted form follows
   * the same rule via its own discovery record.
   */
  function unlocked(farmId, key) {
    if (!def(farmId, key)) return false;   // this chain has no such row
    if (key === 'et') return Discovery.isEtDiscovered(farmId);
    const stage = key === 'spawn' ? 0 : key;
    return Discovery.isDiscovered(species(farmId), stage);
  }

  /** What the player has to find before this upgrade exists. */
  function unlockHint(farmId, key) {
    const sp = species(farmId);
    const stage = key === 'spawn' ? 0 : key;
    return 'DISCOVER THE ' + (key === 'et' ? CONFIG.finalStage(sp).name : CONFIG.stageName(sp, stage));
  }

  /**
   * Upgrades unlocked since this farm's panel was last opened, in panel
   * order — the panel plays its entry animation for exactly these, then they
   * are at rest for good. Marking happens here, on open, so a discovery made
   * while the panel is closed still animates the next time it is opened, and
   * a player who closes the panel mid-animation does not see it replayed.
   * The record is per farm and saved, so it survives a session.
   *
   * `group` scopes this to one entry point's rows: opening the farm menu
   * must not consume the animal menu's pending reveals, so each panel plays
   * the entry animation for exactly the rows it actually shows.
   */
  function takeUnrevealed(farmId, group) {
    const seen = SaveManager.data.upgradesRevealed[farmId];
    const fresh = keys(farmId, group).filter(k => unlocked(farmId, k) && !seen.includes(String(k)));
    if (fresh.length) {
      for (const k of fresh) seen.push(String(k));
      SaveManager.save();
    }
    return fresh;
  }

  /** Seconds between automatic baby spawns for this farm (optionally at a given level). */
  function spawnInterval(farmId, lv = level(farmId, 'spawn')) {
    const u = CU().FARM.SPAWN;
    return Math.max(u.minInterval, CONFIG.SPAWN_INTERVAL - lv * u.intervalStep);
  }

  /** Seconds between poops for one animal of this stage on this farm. */
  function poopInterval(farmId, stage, lv = level(farmId, stage)) {
    const s = CONFIG.stage(species(farmId), stage);
    const u = s.up;
    return Math.max(u.minPoop, (s.poop ?? CONFIG.POOP_INTERVAL) - lv * u.poopStep);
  }

  /** Coins granted when a poop of this stage transforms on this farm. */
  function coinValue(farmId, stage, lv = level(farmId, stage)) {
    const s = CONFIG.stage(species(farmId), stage);
    return Math.round((s.income + lv * s.up.coinStep) * CONFIG.FARMS[farmId].incomeMult);
  }

  /**
   * Coins one collected final form pays out per UFO production drop on this
   * farm, including its own upgrade levels where the chain offers that row.
   */
  function alienValue(farmId, lv = level(farmId, 'et')) {
    const u = def(farmId, 'et');
    const step = u ? lv * u.incomeStep : 0;
    return Math.round((CONFIG.UFO.INCOME_PER_ALIEN + step) * CONFIG.FARMS[farmId].incomeMult);
  }

  /**
   * Current passive income of a farm in coins/sec: every animal's poop
   * value over its average cycle, plus the landed UFO's alien drip.
   * This is the economy's yardstick — reward ads price themselves off it
   * so acceleration always stays proportional to normal play.
   */
  function incomeRate(farmId, animals) {
    let rate = 0;
    for (const a of animals) {
      if (a.state === 'merging') continue;
      rate += coinValue(farmId, a.stage)
            / (poopInterval(farmId, a.stage) + CONFIG.POOP_INTERVAL_JITTER / 2);
    }
    const ufo = SaveManager.data.ufo[farmId];
    if (ufo && ufo.landed) rate += ufo.aliens * alienValue(farmId) / CONFIG.UFO.INTERVAL;
    return rate;
  }

  /** Attempt a purchase. Returns {ok} or {ok:false, reason}. */
  function buy(farmId, key) {
    if (!unlocked(farmId, key)) return { ok: false, reason: unlockHint(farmId, key) + '!' };
    if (isMaxed(farmId, key)) return { ok: false, reason: 'MAX LEVEL!' };
    const c = cost(farmId, key);
    if (SaveManager.data.coins < c) return { ok: false, reason: 'NOT ENOUGH COINS!' };
    SaveManager.data.coins -= c;
    const d = farmData(farmId);
    if (key === 'spawn') d.spawn++;
    else if (key === 'et') d.et = (d.et || 0) + 1;
    else d.stages[key]++;
    SaveManager.save();
    // a purchase that empties the wallet is a poop-rain trigger (js/events.js)
    Events.onPurchase(farmId);
    return { ok: true };
  }

  /**
   * Which entry point owns a row. A farm with CONFIG.splitUpgrades shows its
   * upgrades through two entry points — the farmhouse for 'farm' rows, the
   * animal button for the chain — so every key belongs to exactly one group.
   * Farms without the flag list both groups in one panel, so grouping only
   * ever narrows an existing list; it never changes a row, cost or effect.
   */
  function keyGroup(key) { return key === 'spawn' ? 'farm' : 'animals'; }

  /**
   * Every upgrade key this farm's panel could list, in panel order: the farm
   * row, then one row per board stage of its chain, then the abducted final
   * form last — that one only where the chain defines an upgrade for it.
   * `group` ('farm' | 'animals') narrows the list to one entry point's rows;
   * omit it for the whole menu.
   */
  function keys(farmId, group) {
    const sp = species(farmId);
    const k = ['spawn'];
    for (let s = 0; s < CONFIG.stageCount(sp); s++) k.push(s);
    if (CONFIG.finalStage(sp).up) k.push('et');
    return group ? k.filter(key => keyGroup(key) === group) : k;
  }

  /** Is this upgrade unlocked, not maxed, and affordable right now? */
  function affordable(farmId, key) {
    return unlocked(farmId, key) && !isMaxed(farmId, key) &&
           SaveManager.data.coins >= cost(farmId, key);
  }

  /**
   * True if the player can afford at least one unlocked, non-maxed upgrade on
   * this farm — a locked upgrade never badges, it isn't buyable yet. Pass a
   * group to badge one entry point only (each carries its own badge).
   */
  function anyAffordable(farmId, group) {
    return keys(farmId, group).some(k => affordable(farmId, k));
  }

  /**
   * The cheapest upgrade the player can afford right now, as
   * {key, cost, group}, or null. The first-upgrade tutorial uses it to decide
   * which entry point to spotlight on a farm whose menu is split.
   */
  function cheapestAffordable(farmId, group) {
    let best = null;
    for (const k of keys(farmId, group)) {
      if (!affordable(farmId, k)) continue;
      const c = cost(farmId, k);
      if (!best || c < best.cost) best = { key: k, cost: c, group: keyGroup(k) };
    }
    return best;
  }

  /**
   * Everything the upgrade panel needs to render one card.
   * stats: [{name, cur, next}] — next is null when maxed, so the UI can
   * render a "cur > next" improvement comparison per stat.
   * A locked card carries no numbers at all: the animal it belongs to is
   * still unknown, so the panel only shows how to find it.
   */
  function info(farmId, key) {
    if (!unlocked(farmId, key)) {
      // an undiscovered upgrade has no row in the panel at all, so this is
      // only a guard: no label, and no cost — price is never evaluated while
      // an upgrade is locked
      return { key, locked: true, label: '???', hint: unlockHint(farmId, key),
               level: 0, maxed: false, cost: 0, stats: [] };
    }
    const sp = species(farmId);
    const lv = level(farmId, key);
    const maxed = isMaxed(farmId, key);
    const fmtS = v => v.toFixed(1) + 'S';
    let label, stats;
    if (key === 'spawn') {
      label = CU().FARM.SPAWN.label;
      stats = [{ name: 'EVERY', cur: fmtS(spawnInterval(farmId, lv)),
                 next: maxed ? null : fmtS(spawnInterval(farmId, lv + 1)) }];
    } else if (key === 'et') {
      // the abducted form never poops: its row buys UFO drip instead
      label = CONFIG.finalStage(sp).name;
      stats = [
        { name: 'EVERY', cur: CONFIG.UFO.INTERVAL.toFixed(1) + 'S', next: null },
        { name: 'COINS', cur: String(alienValue(farmId, lv)),
          next: maxed ? null : String(alienValue(farmId, lv + 1)) },
      ];
    } else {
      label = CONFIG.stageName(sp, key);
      stats = [
        { name: 'POOP', cur: fmtS(poopInterval(farmId, key, lv)),
          next: maxed ? null : fmtS(poopInterval(farmId, key, lv + 1)) },
        { name: 'COINS', cur: String(coinValue(farmId, key, lv)),
          next: maxed ? null : String(coinValue(farmId, key, lv + 1)) },
      ];
    }
    return { key, locked: false, label, level: lv, maxed, cost: maxed ? 0 : cost(farmId, key), stats };
  }

  return { level, cost, isMaxed, unlocked, keys, keyGroup, takeUnrevealed, spawnInterval, poopInterval,
           coinValue, alienValue, incomeRate, buy, info, affordable, anyAffordable, cheapestAffordable };
})();
</script>
<script>
/**
 * Idle — background & offline production for every unlocked farm.
 * Nothing is simulated frame by frame: each farm carries a lastUpdate
 * timestamp and elapsed production is computed on demand (launch, map,
 * entering a farm, periodic tick). Earnings accumulate into a per-farm
 * pending balance that is auto-collected on the map / on farm entry.
 */
const Idle = (() => {
  const capSeconds = () => CONFIG.IDLE.OFFLINE_CAP_HOURS * 3600;

  function rec(farmId) { return SaveManager.data.idle[farmId]; }

  /** Passive coins/sec of one saved animal, matching Upgrades.incomeRate. */
  function animalRate(farmId, stage) {
    return Upgrades.coinValue(farmId, stage)
         / (Upgrades.poopInterval(farmId, stage) + CONFIG.POOP_INTERVAL_JITTER / 2);
  }

  /**
   * How many animals offline spawning may leave on the board.
   *
   * The base threshold is a percentage of the farm's CURRENT animal cap (the
   * fence tier's capacity on construction farms), so it rescales with every
   * fence upgrade instead of being a fixed absolute number. On top of that it
   * never returns fewer than two babies per stage in that farm's chain: a
   * longer chain needs proportionally more raw material to climb, so Farm 1's
   * six-stage chicken chain comes back with a workable board instead of the
   * handful that was plenty for a four-stage one. Both terms stay clamped to
   * the farm's real capacity — offline play can never overfill the pen.
   */
  function offlineFillCap(farmId) {
    const cap = Construction.capacity(farmId);
    const pct = Math.floor(cap * (CONFIG.FARMS[farmId].offlinePenFill ?? CONFIG.IDLE.OFFLINE_PEN_FILL));
    const perChain = CONFIG.stageCount(CONFIG.FARMS[farmId].species) * CONFIG.IDLE.OFFLINE_PER_STAGE;
    return Math.min(cap, Math.max(pct, perChain));
  }

  /**
   * Advance one farm's clock to `now`. When `live` (the farm is being
   * simulated on-screen) only the timestamp is stamped; otherwise the
   * elapsed time (capped) becomes spawned babies + pending coins.
   */
  function reconcile(farmId, now, live) {
    const r = rec(farmId);
    // fresh save / clock rolled backwards: no elapsed time, restamp
    if (!r.last || now < r.last) { r.last = now; return; }
    const elapsed = Math.min((now - r.last) / 1000, capSeconds());
    r.last = now;
    if (live || elapsed <= 0) return;
    const d = SaveManager.data;
    // locked farms produce nothing; a construction farm is excluded entirely
    // until land + fence exist (its clock is stamped fresh on completion, so
    // unbuilt time never converts to earnings); spawning is paused until the
    // farm's first-merge tutorial is done, exactly like the live scene
    if (!d.unlocked[farmId] || !Construction.isComplete(farmId) || !d.tutorialDone[farmId]) return;

    // the parachute crate's cooldown runs while the game is closed too,
    // under this same capped window (see js/crate.js)
    Crate.offlineTick(farmId, elapsed);

    // existing animals poop the whole time
    const animals = d.animals[farmId] || (d.animals[farmId] = []);
    let coins = 0;
    for (const a of animals) coins += animalRate(farmId, a.stage) * elapsed;

    // babies keep spawning on the farm's interval, but only up to the
    // offline pen-fill threshold (a partial fill so the board comes back
    // playable — active play can still reach the farm's full cap as usual);
    // the timer remainder carries across ticks so short ticks don't slow it
    const int = Upgrades.spawnInterval(farmId);
    const t = elapsed + (r.carry || 0);
    const free = Math.max(0, offlineFillCap(farmId) - animals.length);
    const spawns = Math.min(free, Math.floor(t / int));
    r.carry = t % int;
    for (let i = 1; i <= spawns; i++) {
      animals.push({ stage: 0 });
      coins += animalRate(farmId, 0) * Math.max(0, elapsed - i * int);
    }

    // landed UFO keeps dripping its alien income
    const ufo = d.ufo[farmId];
    if (ufo && ufo.landed && ufo.aliens > 0) {
      coins += ufo.aliens * Upgrades.alienValue(farmId) / CONFIG.UFO.INTERVAL * elapsed;
    }

    r.pending += coins;
  }

  /** Advance every farm; pass the farm currently simulated on-screen (or -1). */
  function tick(liveFarmId = -1) {
    const now = Date.now();
    for (const f of CONFIG.FARMS) reconcile(f.id, now, f.id === liveFarmId);
  }

  let launchReport = null; // {awaySec, capped, perFarm, total} captured once at boot

  /**
   * Boot-time reconcile for the welcome-back popup: measures how long the
   * game was closed (the most recent farm stamp from the previous session)
   * and how many coins each farm produced over that capped window (the
   * per-farm pending deltas the reconcile itself generates).
   */
  function launchTick() {
    const now = Date.now();
    let lastSeen = 0;
    for (const f of CONFIG.FARMS) lastSeen = Math.max(lastSeen, rec(f.id).last || 0);
    const before = CONFIG.FARMS.map(f => rec(f.id).pending);
    tick();
    const perFarm = CONFIG.FARMS.map(f => rec(f.id).pending - before[f.id]);
    const awaySec = lastSeen && now > lastSeen ? (now - lastSeen) / 1000 : 0;
    launchReport = {
      awaySec: Math.min(awaySec, capSeconds()),
      capped: awaySec > capSeconds(),
      perFarm,
      total: perFarm.reduce((a, b) => a + b, 0),
    };
  }

  /** One-shot: the boot report for the welcome-back popup (null after use). */
  function takeLaunchReport() { const r = launchReport; launchReport = null; return r; }

  /** Whole coins waiting to be collected on this farm. */
  function pending(farmId) { return Math.floor(rec(farmId).pending); }

  /** Take the whole-coin pending balance; the fraction keeps accruing. */
  function collect(farmId) {
    const r = rec(farmId);
    const amount = Math.floor(r.pending);
    r.pending -= amount;
    return amount;
  }

  return { tick, launchTick, takeLaunchReport, pending, collect };
})();
</script>
<script>
/**
 * VFXManager — pooled particles, flying coins, floating numbers,
 * transient glow effects. Zero per-frame allocations once warm.
 */
const VFXManager = (() => {
  const particles = [];
  const pool = new Pool(
    () => ({}),
    p => { p.dead = false; p.t = 0; }
  );

  function spawn(props) {
    const p = pool.get();
    Object.assign(p, {
      x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, size: 3, col: '#fff',
      kind: 'square', img: null, text: null, targetX: null, targetY: null,
      speed: 0, onArrive: null, delay: 0,
    }, props);
    particles.push(p);
    return p;
  }

  /** Burst of colored squares (merge / unlock particles). */
  function burst(x, y, cols, n = 14, force = 90) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, f = U.rand(force * 0.4, force);
      spawn({
        x, y, vx: Math.cos(a) * f, vy: Math.sin(a) * f - 30,
        g: 160, life: U.rand(0.4, 0.8), size: U.randInt(2, 5),
        col: U.pick(cols), kind: 'square',
      });
    }
  }

  /** Soft dust puff at feet. */
  function dust(x, y, n = 5) {
    for (let i = 0; i < n; i++) {
      spawn({
        x: x + U.rand(-6, 6), y: y + U.rand(-2, 2),
        vx: U.rand(-18, 18), vy: U.rand(-24, -8), g: 20,
        life: U.rand(0.3, 0.55), size: U.randInt(2, 4),
        col: 'rgba(220,205,170,0.7)', kind: 'circle',
      });
    }
  }

  /** Golden sparkles. */
  function sparkle(x, y, n = 8, spread = 14) {
    for (let i = 0; i < n; i++) {
      spawn({
        x: x + U.rand(-spread, spread), y: y + U.rand(-spread, spread),
        vx: 0, vy: U.rand(-14, -4), g: 0,
        life: U.rand(0.35, 0.7), size: U.randInt(1, 3),
        col: U.pick(['#ffe98a', '#f4c437', '#fff6d0']), kind: 'star',
        delay: U.rand(0, 0.25),
      });
    }
  }

  /** Coin that flies to the HUD counter then triggers callback. */
  function flyCoin(x, y, tx, ty, onArrive) {
    spawn({
      x, y, targetX: tx, targetY: ty, speed: CONFIG.COIN_FLY_SPEED,
      life: 5, kind: 'coin', img: SPRITES.coin(2), onArrive,
      vx: U.rand(-50, 50), vy: U.rand(-120, -70), g: 0,
    });
  }

  /**
   * A few coins arcing to the HUD wallet, together carrying `amount`:
   * each adds its share as it lands so the counter visibly ticks up.
   */
  function coinPayout(x, y, amount, spreadX = 16, spreadY = 8) {
    const target = UI.coinTarget();
    const n = Math.min(CONFIG.IDLE.COINS_PER_COLLECT, amount);
    const base = Math.floor(amount / n);
    for (let i = 0; i < n; i++) {
      const share = i === n - 1 ? amount - base * (n - 1) : base;
      flyCoin(x + U.rand(-spreadX, spreadX), y + U.rand(-spreadY, spreadY),
        target.x, target.y, () => {
          Game.addCoins(share);
          AudioManager.play('coin');
        });
    }
    floatText(x, y - 26, '+' + U.fmt(amount));
  }

  /** Floating "+N" text. */
  function floatText(x, y, text, col = '#ffe98a') {
