    // Props tagged with a farm id + the build stage they appear at grow in
    // with that farm's construction: the farmhouse prop arrives with the
    // house (stage 1) and the farm's dressing with the fence (stage 2), so a
    // plot under construction reads as under construction from the map.
    // Farm 1 has no entry and is therefore always fully dressed.
    const MID_PROPS = [
      ['haystack', 47.5, 197, 24, 19], ['coop', 45, 121.84, 71, 62.16], ['nest', 85.5, 194, 32, 20],
      ['windmillTower', 170, 282, 36, 60, 1, 2], ['cottage', 212.3, 248.09, 79.9, 75.26, 1, 1],
      ['woolBale', 268, 342, 28, 22, 1, 2], ['woolBale', 256, 354.36, 22, 18, 1, 2],
      ['flower0', 212, 336, 16, 20, 1, 2], ['flower2', 208, 332, 16, 20, 1, 2],
      ['silo', 37, 397, 32, 68, 2, 2], ['barn', 67.15, 379.22, 88.2, 78.22, 2, 1],
      ['milkCan', 62, 480, 20, 24, 2, 2], ['milkCan', 76, 486, 16, 20, 2, 2],
    ];
    const FG_PROPS = [
      ['tree1', 206, 79.5, 60, 72], ['tree0', 258, 409, 60, 72], ['tree1', 244, 490, 60, 72],
      ['tree1', 16, 511, 60, 72], ['tree0', 168, 490, 60, 72], ['tree1', 84.5, 297, 60, 72],
      ['tree1', 124, 67, 60, 72], ['tree0', 167.5, 125, 60, 72], ['tree0', 72, 1, 60, 72],
      ['tree0', 3, 250, 60, 72], ['tree0', 202, 200, 60, 72], ['tree0', 209, 561, 60, 72],
      ['tree0', 75.5, 556, 60, 72],
      ['bush1', 104, 252, 36, 24], ['bush1', 14, 354, 36, 24], ['bush1', 128, 147, 36, 24],
      ['bush1', 197.5, 43, 36, 24],
      ['rock0', 12, 151, 28, 20], ['rock0', 121, 502, 28, 20], ['bush1', 42, 65, 36, 24],
      ['rock0', 48, 314, 28, 20], ['rock0', 271.5, 554, 28, 20],
    ];
    for (const [kind, x, y, w, h, farmId, needStage] of MID_PROPS) {
      if (farmId !== undefined && mapStage(farmId) < needStage) continue;
      g.drawImage(SPR[kind](), x, y, w, h);
    }
    for (const [kind, x, y, w, h] of FG_PROPS) g.drawImage(SPR[kind](), x, y, w, h);

    cache[mapKey] = c;
    return c;
  }

  return {
    farm, worldMap, mapStage, playRect, rectForLevel, houseRect, fencePalette,
    PLAY, MAP_NODES, THEME, FLAG, roadPoints, GROUNDS,
  };
})();
</script>
<script>
/**
 * AudioManager — all sound is synthesized with WebAudio (no asset files).
 * Provides SFX (merge, coin, poop, click, unlock) plus a gentle looping
 * background tune and ambient birds.
 */
const AudioManager = (() => {
  let ctx = null, master = null, musicGain = null, sfxGain = null;
  let musicOn = true, sfxOn = true;
  let musicTimer = null, ambientTimer = null;

  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = CONFIG.MUSIC_VOLUME; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = CONFIG.SFX_VOLUME; sfxGain.connect(master);
      startMusic();
      startAmbient();
      return true;
    } catch (e) { return false; }
  }

  /** One synthesized note. */
  function tone(freq, dur, type = 'sine', vol = 0.3, dest = null, slide = 0) {
    if (!ctx || !sfxOn && dest !== musicGain) { if (dest !== musicGain) return; }
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ctx.currentTime + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  function noise(dur, vol = 0.2, freq = 1000) {
    if (!ctx || !sfxOn) return;
    const len = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start();
  }

  // ---------------- SFX ----------------
  const SFX = {
    click()  { tone(650, 0.06, 'square', 0.12); tone(880, 0.05, 'square', 0.08); },
    merge()  {
      tone(440, 0.12, 'triangle', 0.3, null, 220);
      setTimeout(() => tone(660, 0.15, 'triangle', 0.3, null, 330), 60);
      setTimeout(() => tone(990, 0.25, 'sine', 0.25, null, 200), 130);
      noise(0.15, 0.12, 2400);
    },
    coin()   { tone(1320, 0.09, 'square', 0.12); setTimeout(() => tone(1760, 0.18, 'square', 0.1), 60); },
    poop()   { tone(180, 0.12, 'sine', 0.2, null, -80); noise(0.08, 0.06, 500); },
    pop()    { tone(520, 0.08, 'sine', 0.25, null, 300); },
    error()  { tone(220, 0.15, 'square', 0.12, null, -60); },
    buy()    {
      tone(660, 0.08, 'square', 0.18);
      setTimeout(() => tone(880, 0.1, 'square', 0.16), 70);
      setTimeout(() => tone(1320, 0.16, 'triangle', 0.2), 140);
    },
    ufo()    {
      // wobbly saucer hum
      tone(140, 0.9, 'sawtooth', 0.07, null, 80);
      tone(220, 0.9, 'sine', 0.09, null, 120);
      setTimeout(() => tone(180, 0.6, 'sine', 0.07, null, -60), 350);
    },
    beam()   {
      // tractor-beam zap sweeping down
      tone(1400, 0.35, 'sawtooth', 0.07, null, -900);
      tone(900, 0.3, 'sine', 0.1, null, -500);
      noise(0.2, 0.05, 3000);
    },
    alien()  {
      // chirpy "collected!" jingle
      tone(700, 0.09, 'square', 0.14, null, 300);
      setTimeout(() => tone(1050, 0.1, 'square', 0.12, null, 350), 80);
      setTimeout(() => tone(1580, 0.2, 'triangle', 0.16), 160);
    },
    coo()    {
      // soft two-note pigeon coo
      tone(520, 0.12, 'sine', 0.18, null, -160);
      setTimeout(() => tone(430, 0.18, 'sine', 0.15, null, -120), 110);
    },
    flap()   { noise(0.09, 0.1, 900); setTimeout(() => noise(0.07, 0.07, 900), 90); },
    wind()   {
      // roaring tornado gust
      noise(0.9, 0.12, 700);
      tone(110, 0.8, 'sawtooth', 0.05, null, 60);
      setTimeout(() => noise(0.6, 0.08, 500), 400);
    },
    unlock() {
      const seq = [523, 659, 784, 1047, 1319];
      seq.forEach((f, i) => setTimeout(() => tone(f, 0.35, 'triangle', 0.28), i * 110));
      setTimeout(() => noise(0.4, 0.1, 3000), 500);
    },
  };

  function play(name) { if (ctx && sfxOn && SFX[name]) SFX[name](); }

  // ---------------- MUSIC ----------------
  // Gentle pentatonic loop.
  const SCALE = [262, 294, 330, 392, 440, 523, 587, 659];
  let step = 0;
  function startMusic() {
    if (musicTimer) return;
    const beat = 0.32;
    musicTimer = setInterval(() => {
      if (!musicOn || !ctx) return;
      const bar = Math.floor(step / 8) % 4;
      // bass
      if (step % 4 === 0) tone(SCALE[[0, 3, 4, 3][bar]] / 2, beat * 2.2, 'triangle', 0.16, musicGain);
      // melody: sparse, wandering
      if (Math.random() < 0.6) {
        const n = SCALE[(step + bar * 2 + U.randInt(0, 2)) % SCALE.length];
        tone(n, beat * 1.4, 'sine', 0.10, musicGain);
      }
      step++;
    }, beat * 1000);
  }
  function startAmbient() {
    if (ambientTimer) return;
    ambientTimer = setInterval(() => {
      if (!musicOn || !ctx) return;
      // random birdsong chirp
      if (Math.random() < 0.4) {
        const f = U.rand(1800, 2600);
        tone(f, 0.08, 'sine', 0.04, musicGain, U.rand(200, 500));
        setTimeout(() => tone(f * 1.1, 0.1, 'sine', 0.03, musicGain, -300), 120);
      }
    }, 2600);
  }

  return {
    ensure, play,
    get musicOn() { return musicOn; },
    get sfxOn() { return sfxOn; },
    setMusic(v) { musicOn = v; if (musicGain) musicGain.gain.value = v ? CONFIG.MUSIC_VOLUME : 0; },
    setSfx(v) { sfxOn = v; },
  };
})();
</script>
<script>
/**
 * SaveManager — persists progress to localStorage and autosaves.
 */
const SaveManager = (() => {
  let data = null;

  const STAGE_COUNT = () => CONFIG.STAGE_NAMES.length;

  function defaults() {
    return {
      coins: 0,
      unlocked: [true, false, false],
      currentFarm: 0,
      settings: { music: true, sfx: true },
      // per-farm upgrade levels: { spawn, stages:[one level per evolution stage] }
      upgrades: CONFIG.FARMS.map(() => ({ spawn: 0, stages: CONFIG.STAGE_NAMES.map(() => 0) })),
      // per-farm animal snapshot: [{stage}...]
      animals: [[], [], []],
      // discovery collection: species -> [bool per stage], permanent once true
      discovered: discoveredDefaults(),
      // per-farm: has the first-merge tutorial been completed?
      tutorialDone: CONFIG.FARMS.map(() => false),
      // one-time: has the first-upgrade tutorial been completed?
      upgradeTutorialDone: false,
      // per-farm UFO alien-collection layer: each farm unlocks its own UFO
      // with the first Mutant+Mutant merge on that farm
      ufo: CONFIG.FARMS.map(() => ({ landed: false, aliens: 0, pending: 0 })),
      // per-farm pigeon reward-ad event: independent spawn countdown +
      // remaining perch time (so a pigeon survives leaving the farm)
      pigeon: CONFIG.FARMS.map(() => ({ next: CONFIG.PIGEON.SPAWN_INTERVAL, remaining: 0 })),
      // per-farm tornado auto-merge reward-ad event: independent offer
      // countdown + remaining availability window
      tornado: CONFIG.FARMS.map(() => ({ next: CONFIG.TORNADO.SPAWN_INTERVAL, remaining: 0 })),
      // per-farm background production: last reconcile timestamp (ms epoch),
      // uncollected coin balance, and the carried spawn-timer remainder
      idle: CONFIG.FARMS.map(() => ({ last: 0, pending: 0, carry: 0 })),
      // per-farm step-by-step build state (only meaningful for farms with a
      // CONFIG.CONSTRUCTION entry): land bought, house built, fence tier
      construction: CONFIG.FARMS.map(() => ({ land: false, house: false, fence: 0 })),
      firstRun: true,
    };
  }

  function discoveredDefaults() {
    const d = {};
    for (const f of CONFIG.FARMS) d[f.species] = CONFIG.STAGE_NAMES.map(() => false);
    return d;
  }

  /** Bring older saves up to the current schema (extra stages, discovery data). */
  function migrate(d) {
    for (const u of d.upgrades) {
      while (u.stages.length < STAGE_COUNT()) u.stages.push(0);
    }
    if (!d.discovered) d.discovered = discoveredDefaults();
    if (!d.ufo) d.ufo = CONFIG.FARMS.map(() => ({ landed: false, aliens: 0, pending: 0 }));
    // old saves had one global UFO: it becomes Farm 1's UFO, others start locked
    if (!Array.isArray(d.ufo)) {
      const legacy = d.ufo;
      d.ufo = CONFIG.FARMS.map((f, i) => i === 0
        ? { landed: !!legacy.landed, aliens: legacy.aliens || 0, pending: legacy.pending || 0 }
        : { landed: false, aliens: 0, pending: 0 });
    }
    while (d.ufo.length < CONFIG.FARMS.length) d.ufo.push({ landed: false, aliens: 0, pending: 0 });
    if (!d.pigeon) d.pigeon = CONFIG.FARMS.map(() => ({ next: CONFIG.PIGEON.SPAWN_INTERVAL, remaining: 0 }));
    while (d.pigeon.length < CONFIG.FARMS.length) d.pigeon.push({ next: CONFIG.PIGEON.SPAWN_INTERVAL, remaining: 0 });
    if (!d.tornado) d.tornado = CONFIG.FARMS.map(() => ({ next: CONFIG.TORNADO.SPAWN_INTERVAL, remaining: 0 }));
    while (d.tornado.length < CONFIG.FARMS.length) d.tornado.push({ next: CONFIG.TORNADO.SPAWN_INTERVAL, remaining: 0 });
    if (!d.idle) d.idle = CONFIG.FARMS.map(() => ({ last: 0, pending: 0, carry: 0 }));
    while (d.idle.length < CONFIG.FARMS.length) d.idle.push({ last: 0, pending: 0, carry: 0 });
    if (!d.construction) d.construction = CONFIG.FARMS.map(() => ({ land: false, house: false, fence: 0 }));
    while (d.construction.length < CONFIG.FARMS.length) d.construction.push({ land: false, house: false, fence: 0 });
    // saves from before the construction system: a construction farm that is
    // already unlocked keeps working as a finished farm (land + house owned,
    // fence at the top tier so its pen still fits every animal the player has)
    for (const f of CONFIG.FARMS) {
      const p = (CONFIG.CONSTRUCTION || {})[f.id];
      const c = d.construction[f.id];
      if (!p) continue;
      if (c.house === undefined) c.house = c.fence >= 1;
      if (d.unlocked[f.id] && !c.land) {
        c.land = true;
        c.house = true;
        c.fence = p.FENCE_LEVELS.length;
      }
    }
    // players from before the tutorial existed (or with animals already) skip it
    if (!d.tutorialDone) d.tutorialDone = CONFIG.FARMS.map(f => (d.animals[f.id] || []).length > 0);
    // players who already bought an upgrade skip the first-upgrade tutorial
    if (d.upgradeTutorialDone === undefined) {
      d.upgradeTutorialDone = d.upgrades.some(u => u.spawn > 0 || u.stages.some(s => s > 0));
    }
    for (const f of CONFIG.FARMS) {
      if (!d.discovered[f.species]) d.discovered[f.species] = CONFIG.STAGE_NAMES.map(() => false);
      while (d.discovered[f.species].length < STAGE_COUNT()) d.discovered[f.species].push(false);
      // animals the player already owns don't need a (re)celebration
      for (const a of d.animals[f.id] || []) {
        if (a.stage < STAGE_COUNT()) d.discovered[f.species][a.stage] = true;
      }
    }
    return d;
  }

  function load() {
    try {
      const raw = localStorage.getItem(CONFIG.SAVE_KEY);
      data = raw ? migrate(Object.assign(defaults(), JSON.parse(raw))) : defaults();
    } catch (e) { data = defaults(); }
    return data;
  }

  function save() {
    try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function reset() {
    data = defaults();
    save();
  }

  return {
    load, save, reset,
    get data() { return data || load(); },
  };
})();
</script>
<script>
/**
 * Discovery — tracks which species+stage evolutions the player has created.
 * Each unique evolution unlocks exactly once, is permanently saved, and can
 * later back an encyclopedia / collection book / achievements screen.
 */
const Discovery = (() => {

  function list(species) {
    return SaveManager.data.discovered[species];
  }

  function isDiscovered(species, stage) {
    return !!list(species)[stage];
  }

  /**
   * Mark a species+stage as discovered.
   * Returns true only the FIRST time (i.e. this creation is a new discovery).
   */
  function mark(species, stage) {
    const l = list(species);
    if (l[stage]) return false;
    l[stage] = true;
    SaveManager.save();
    return true;
  }

  /** Full collection snapshot: [{species, label, stages:[{name, discovered}]}] */
  function collection() {
    return CONFIG.FARMS.map(f => ({
      species: f.species,
      label: f.label,
      stages: CONFIG.STAGE_NAMES.map((name, i) => ({
        name,
        discovered: isDiscovered(f.species, i),
      })),
    }));
  }

  /** Display name, e.g. "MUTANT CHICKEN". */
  function displayName(species, stage) {
    return CONFIG.STAGE_NAMES[stage] + ' ' + species.toUpperCase();
  }

  function flavor(species, stage) {
    const f = CONFIG.DISCOVERY.FLAVOR[species];
    return (f && f[stage]) || '';
  }

  return { isDiscovered, mark, collection, displayName, flavor };
})();
</script>
<script>
/**
 * Construction — step-by-step farm build progression (see CONFIG.CONSTRUCTION).
 * A construction farm goes: buy the land (map) -> build the house (starts
 * animal spawning) -> build the fence (animals stop escaping, production
 * starts) -> fence upgrades (capacity + pen footprint + art tier).
 *
 * The farm produces NOTHING — no money, no background/offline accrual — until
 * land + house + fence all exist; with the house but no fence, animals spawn
 * and then wander off the plot (see js/animal.js 'escape').
 * State lives in SaveManager.data.construction[farmId] = { land, house, fence }.
 * Farms without a CONFIG entry are always "complete" and keep the classic
 * one-shot unlock behavior.
 */
const Construction = (() => {
  function plan(farmId) { return (CONFIG.CONSTRUCTION || {})[farmId] || null; }
  function state(farmId) { return SaveManager.data.construction[farmId]; }

  /** Does this farm use the step-by-step build flow at all? */
  function required(farmId) { return !!plan(farmId); }

  function landOwned(farmId) { return !required(farmId) || !!state(farmId).land; }

  /** The house is what starts animal spawning. Classic farms always have one. */
  function houseBuilt(farmId) { return !required(farmId) || !!state(farmId).house; }

  /** Current fence tier (0 = not built yet). Non-construction farms: 0. */
  function fenceLevel(farmId) { return required(farmId) ? state(farmId).fence : 0; }

  function maxFenceLevel(farmId) { return required(farmId) ? plan(farmId).FENCE_LEVELS.length : 0; }

  /**
   * Which fence palette set this farm's art tiers index into (see
   * ENVIRONMENT.FENCE_THEMES) — every farm gets its own visual identity
   * across tiers. Classic farms fall back to the base wood look.
   */
  function fenceTheme(farmId) {
    const p = plan(farmId);
    return (p && p.FENCE_THEME) || 'wood';
  }

  function fenceBuilt(farmId) { return !required(farmId) || state(farmId).fence >= 1; }

  /** Definition of the current fence tier, or null while unbuilt. */
  function levelDef(farmId, lv = fenceLevel(farmId)) {
    const p = plan(farmId);
    if (!p || lv < 1) return null;
    return p.FENCE_LEVELS[Math.min(lv, p.FENCE_LEVELS.length) - 1];
  }

  /** Definition of the next buildable/upgradable tier, or null at max. */
  function nextDef(farmId) {
    const p = plan(farmId);
    if (!p) return null;
    const lv = fenceLevel(farmId);
    return lv < p.FENCE_LEVELS.length ? p.FENCE_LEVELS[lv] : null;
  }

  /** Land + house + fence: the farm is operational. */
  function isComplete(farmId) {
    return !required(farmId) ||
      (!!state(farmId).land && !!state(farmId).house && state(farmId).fence >= 1);
  }

  /**
   * Hard animal cap. No house: nothing spawns at all. House but no fence:
   * the unfenced cap (they escape anyway). Fenced: the tier's capacity.
   */
  function capacity(farmId) {
    if (!required(farmId)) return CONFIG.MAX_ANIMALS;
    if (!houseBuilt(farmId)) return 0;
    const def = levelDef(farmId);
    return def ? def.capacity : plan(farmId).UNFENCED_CAPACITY;
  }

  /** House standing, no fence yet: spawned animals wander off and are lost. */
  function escapesActive(farmId) {
    return required(farmId) && houseBuilt(farmId) && !fenceBuilt(farmId);
  }

  /**
   * Fence-jump tuning, or null on a farm that doesn't use construction —
   * both escape behaviours are exclusive to construction farms, so a null
   * here means animals on that farm are never lost (see FarmScene).
   */
  function jumpCfg(farmId) {
    const p = plan(farmId);
    return p && p.FENCE_JUMP && p.FENCE_JUMP.ENABLED ? p.FENCE_JUMP : null;
  }

  /** Seconds this animal stays on the board before walking off. */
  function escapeDelay(farmId) {
    const p = plan(farmId);
    if (!p) return Infinity;
    return Math.max(1, p.ESCAPE_TIME + U.rand(-p.ESCAPE_VARIANCE, p.ESCAPE_VARIANCE));
  }

  /** Map purchase price (falls back to the classic unlock cost). */
  function landCost(farmId) {
    return required(farmId) ? plan(farmId).LAND_COST : CONFIG.UNLOCK_COSTS[farmId];
  }

  function houseCost(farmId) { return required(farmId) ? plan(farmId).HOUSE_COST : 0; }

  /** Called by the unlock flow once the map purchase animation lands. */
  function grantLand(farmId) {
    if (!required(farmId)) return;
    state(farmId).land = true;
    SaveManager.save();
  }

  /**
   * The build step waiting for the player:
   *   'land'    — plot not bought yet (handled by the map unlock flow)
   *   'house'   — bare plot, nothing spawns
   *   'fence'   — animals spawn but escape
   *   'upgrade' — operational, fence can still grow
   *   'max'     — fully built
   */
  function stage(farmId) {
    if (!required(farmId)) return 'max';
    if (!landOwned(farmId)) return 'land';
    if (!houseBuilt(farmId)) return 'house';
    if (!fenceBuilt(farmId)) return 'fence';
    return nextDef(farmId) ? 'upgrade' : 'max';
  }

  /** Cost of the next build step, or 0 when there is nothing left to buy. */
  function nextCost(farmId) {
    const s = stage(farmId);
    if (s === 'house') return houseCost(farmId);
    if (s === 'fence' || s === 'upgrade') return nextDef(farmId).cost;
    return 0;
  }

  /** Is there a purchase waiting on this farm (drives the map/HUD badges)? */
  function pending(farmId) {
    const s = stage(farmId);
    return s === 'house' || s === 'fence';
  }

  /**
   * Stamp the farm's idle clock to NOW so background/offline production
   * starts from this moment — never retroactively for the time the farm sat
   * unbuilt (see js/idle.js, which skips incomplete farms entirely).
   */
  function startIdleClock(farmId) {
    const r = SaveManager.data.idle[farmId];
    r.last = Date.now();
    r.carry = 0;
    r.pending = 0;
  }

  /** Build the farmhouse: from here babies start spawning. */
  function buyHouse(farmId) {
    if (!required(farmId) || houseBuilt(farmId)) return { ok: false, reason: 'ALREADY BUILT!' };
    const c = houseCost(farmId);
    if (SaveManager.data.coins < c) return { ok: false, reason: 'NOT ENOUGH COINS!' };
    SaveManager.data.coins -= c;
    state(farmId).house = true;
    SaveManager.save();
    return { ok: true };
  }

  /**
   * Build (level 0 -> 1) or upgrade the fence. The build that completes
   * construction also starts the farm's idle clock.
   */
  function buyFence(farmId) {
    const nxt = nextDef(farmId);
    if (!nxt) return { ok: false, reason: 'MAX LEVEL!' };
    if (!houseBuilt(farmId)) return { ok: false, reason: 'BUILD THE HOUSE FIRST!' };
    if (SaveManager.data.coins < nxt.cost) return { ok: false, reason: 'NOT ENOUGH COINS!' };
    SaveManager.data.coins -= nxt.cost;
    state(farmId).fence++;
    if (state(farmId).fence === 1) startIdleClock(farmId);
    SaveManager.save();
    return { ok: true };
  }

  /** Buy whatever the current stage offers. */
  function buyNext(farmId) {
    const s = stage(farmId);
    if (s === 'house') return buyHouse(farmId);
    if (s === 'fence' || s === 'upgrade') return buyFence(farmId);
    return { ok: false, reason: 'MAX LEVEL!' };
  }

  /**
   * Everything the build panel needs to render its current state:
   * where the player is, what the next purchase is, what it costs and what
   * it unlocks, plus the live fence tier / animal count once fenced.
   */
  function info(farmId, animalCount = 0) {
    const s = stage(farmId);
    const lv = fenceLevel(farmId);
    const maxLv = maxFenceLevel(farmId);
    const nxt = nextDef(farmId);
    const COPY = {
      house: { title: 'BUILD THE HOUSE', unlocks: 'ANIMALS START SPAWNING' },
      fence: { title: 'BUILD THE FENCE', unlocks: 'ANIMALS STOP ESCAPING' },
      upgrade: { title: 'UPGRADE THE FENCE', unlocks: 'BIGGER PEN, MORE ANIMALS' },
      max: { title: 'FARM COMPLETE!', unlocks: 'EVERYTHING IS BUILT' },
    };
    const copy = COPY[s] || COPY.max;
    // step 1 land / 2 house / 3 fence / 4.. upgrades
    const step = s === 'land' ? 1 : s === 'house' ? 2 : 2 + Math.min(lv + 1, maxLv);
    return {
      stage: s,
      step,
      steps: 2 + maxLv,
      title: copy.title,
      unlocks: copy.unlocks,
      cost: nextCost(farmId),
      maxed: s === 'max',
      fenceBuilt: fenceBuilt(farmId),
      level: lv,
      maxLevel: maxLv,
      capacity: capacity(farmId),
      nextCapacity: nxt ? nxt.capacity : null,
      animals: animalCount,
    };
  }

  return {
    required, landOwned, houseBuilt, fenceLevel, maxFenceLevel, fenceBuilt, fenceTheme,
    levelDef, nextDef, isComplete, capacity, escapesActive, jumpCfg,
    escapeDelay, landCost, houseCost, nextCost, stage, pending, grantLand,
    buyHouse, buyFence, buyNext, info,
  };
})();
</script>
<script>
/**
 * Upgrades — per-farm, data-driven upgrade system.
 * Levels live in SaveManager.data.upgrades[farmId] = { spawn, stages:[s0,s1,s2] }.
 * All numbers come from CONFIG.UPGRADES / CONFIG base values; nothing hardcoded here.
 *
 * Keys used throughout: 'spawn' for the farm spawn-speed upgrade,
 * or a stage index (0..CONFIG.STAGE_NAMES.length-1) for the animal upgrades.
 */
const Upgrades = (() => {
  const CU = () => CONFIG.UPGRADES;

  function farmData(farmId) {
    return SaveManager.data.upgrades[farmId];
  }

  function level(farmId, key) {
    const d = farmData(farmId);
    return key === 'spawn' ? d.spawn : d.stages[key];
  }

  function cost(farmId, key) {
    const def = key === 'spawn' ? CU().FARM.SPAWN : CU().STAGES[key];
    const growth = def.costGrowth || CU().COST_GROWTH;
    return Math.round(def.baseCost * Math.pow(growth, level(farmId, key)) * CONFIG.FARMS[farmId].costMult);
  }

  function maxLevel(key) {
    return key === 'spawn' ? CU().FARM.SPAWN.maxLevel : CU().STAGES[key].maxLevel;
  }

  function isMaxed(farmId, key) {
    return level(farmId, key) >= maxLevel(key);
  }

  /** Seconds between automatic baby spawns for this farm (optionally at a given level). */
  function spawnInterval(farmId, lv = level(farmId, 'spawn')) {
    const u = CU().FARM.SPAWN;
    return Math.max(u.minInterval, CONFIG.SPAWN_INTERVAL - lv * u.intervalStep);
  }

  /** Seconds between poops for one animal of this stage on this farm. */
  function poopInterval(farmId, stage, lv = level(farmId, stage)) {
    const u = CU().STAGES[stage];
    const base = (CONFIG.POOP_INTERVAL_BY_STAGE || [])[stage] ?? CONFIG.POOP_INTERVAL;
    return Math.max(u.minPoop, base - lv * u.poopStep);
  }

  /** Coins granted when a poop of this stage transforms on this farm. */
  function coinValue(farmId, stage, lv = level(farmId, stage)) {
    return Math.round((CONFIG.INCOME_BY_STAGE[stage] + lv * CU().STAGES[stage].coinStep)
                      * CONFIG.FARMS[farmId].incomeMult);
  }

  /** Coins one UFO alien pays out per production drop on this farm. */
  function alienValue(farmId) {
    return Math.round(CONFIG.UFO.INCOME_PER_ALIEN * CONFIG.FARMS[farmId].incomeMult);
  }

  /**
   * Current passive income of a farm in coins/sec: every animal's poop
   * value over its average cycle, plus the landed UFO's alien drip.
   * This is the economy's yardstick — reward ads price themselves off it
   * so acceleration always stays proportional to normal play.
   */
  function incomeRate(farmId, animals) {
    let rate = 0;
    for (const a of animals) {
      if (a.state === 'merging') continue;
      rate += coinValue(farmId, a.stage)
            / (poopInterval(farmId, a.stage) + CONFIG.POOP_INTERVAL_JITTER / 2);
    }
    const ufo = SaveManager.data.ufo[farmId];
    if (ufo && ufo.landed) rate += ufo.aliens * alienValue(farmId) / CONFIG.UFO.INTERVAL;
    return rate;
  }

  /** Attempt a purchase. Returns {ok} or {ok:false, reason}. */
  function buy(farmId, key) {
    if (isMaxed(farmId, key)) return { ok: false, reason: 'MAX LEVEL!' };
    const c = cost(farmId, key);
    if (SaveManager.data.coins < c) return { ok: false, reason: 'NOT ENOUGH COINS!' };
    SaveManager.data.coins -= c;
    const d = farmData(farmId);
    if (key === 'spawn') d.spawn++; else d.stages[key]++;
    SaveManager.save();
    return { ok: true };
  }

  /** True if the player can afford at least one non-maxed upgrade on this farm. */
  function anyAffordable(farmId) {
    const keys = ['spawn'];
    for (let s = 0; s < CU().STAGES.length; s++) keys.push(s);
    return keys.some(k => !isMaxed(farmId, k) && SaveManager.data.coins >= cost(farmId, k));
  }

  /**
   * Everything the upgrade panel needs to render one card.
   * stats: [{name, cur, next}] — next is null when maxed, so the UI can
   * render a "cur > next" improvement comparison per stat.
   */
  function info(farmId, key) {
    const lv = level(farmId, key);
    const maxed = isMaxed(farmId, key);
    const fmtS = v => v.toFixed(1) + 'S';
    let label, stats;
    if (key === 'spawn') {
      label = CU().FARM.SPAWN.label;
      stats = [{ name: 'EVERY', cur: fmtS(spawnInterval(farmId, lv)),
                 next: maxed ? null : fmtS(spawnInterval(farmId, lv + 1)) }];
    } else {
      label = CU().STAGES[key].label;
      stats = [
        { name: 'POOP', cur: fmtS(poopInterval(farmId, key, lv)),
          next: maxed ? null : fmtS(poopInterval(farmId, key, lv + 1)) },
        { name: 'COINS', cur: String(coinValue(farmId, key, lv)),
          next: maxed ? null : String(coinValue(farmId, key, lv + 1)) },
      ];
    }
    return { key, label, level: lv, maxed, cost: maxed ? 0 : cost(farmId, key), stats };
  }

  return { level, cost, isMaxed, spawnInterval, poopInterval, coinValue, alienValue, incomeRate, buy, info, anyAffordable };
})();
</script>
<script>
/**
 * Idle — background & offline production for every unlocked farm.
 * Nothing is simulated frame by frame: each farm carries a lastUpdate
 * timestamp and elapsed production is computed on demand (launch, map,
 * entering a farm, periodic tick). Earnings accumulate into a per-farm
 * pending balance that is auto-collected on the map / on farm entry.
 */
const Idle = (() => {
  const capSeconds = () => CONFIG.IDLE.OFFLINE_CAP_HOURS * 3600;

  function rec(farmId) { return SaveManager.data.idle[farmId]; }

  /** Passive coins/sec of one saved animal, matching Upgrades.incomeRate. */
  function animalRate(farmId, stage) {
    return Upgrades.coinValue(farmId, stage)
         / (Upgrades.poopInterval(farmId, stage) + CONFIG.POOP_INTERVAL_JITTER / 2);
  }

  /**
   * Advance one farm's clock to `now`. When `live` (the farm is being
   * simulated on-screen) only the timestamp is stamped; otherwise the
   * elapsed time (capped) becomes spawned babies + pending coins.
   */
  function reconcile(farmId, now, live) {
    const r = rec(farmId);
    // fresh save / clock rolled backwards: no elapsed time, restamp
    if (!r.last || now < r.last) { r.last = now; return; }
    const elapsed = Math.min((now - r.last) / 1000, capSeconds());
    r.last = now;
    if (live || elapsed <= 0) return;
    const d = SaveManager.data;
    // locked farms produce nothing; a construction farm is excluded entirely
    // until land + fence exist (its clock is stamped fresh on completion, so
    // unbuilt time never converts to earnings); spawning is paused until the
    // farm's first-merge tutorial is done, exactly like the live scene
    if (!d.unlocked[farmId] || !Construction.isComplete(farmId) || !d.tutorialDone[farmId]) return;

    // existing animals poop the whole time
    const animals = d.animals[farmId] || (d.animals[farmId] = []);
    let coins = 0;
    for (const a of animals) coins += animalRate(farmId, a.stage) * elapsed;

    // babies keep spawning on the farm's interval, but only up to the
    // offline pen-fill threshold (a partial fill so the board comes back
    // playable — active play can still reach MAX_ANIMALS as usual);
    // the timer remainder carries across ticks so short ticks don't slow it
    const int = Upgrades.spawnInterval(farmId);
    const t = elapsed + (r.carry || 0);
    // the threshold is a percentage of the farm's CURRENT animal cap (the
    // fence tier's capacity on construction farms), so it rescales with
    // every fence upgrade instead of being a fixed absolute number
    const fillCap = Math.floor(Construction.capacity(farmId) *
      (CONFIG.FARMS[farmId].offlinePenFill ?? CONFIG.IDLE.OFFLINE_PEN_FILL));
    const free = Math.max(0, fillCap - animals.length);
    const spawns = Math.min(free, Math.floor(t / int));
    r.carry = t % int;
    for (let i = 1; i <= spawns; i++) {
      animals.push({ stage: 0 });
      coins += animalRate(farmId, 0) * Math.max(0, elapsed - i * int);
    }

    // landed UFO keeps dripping its alien income
    const ufo = d.ufo[farmId];
    if (ufo && ufo.landed && ufo.aliens > 0) {
      coins += ufo.aliens * Upgrades.alienValue(farmId) / CONFIG.UFO.INTERVAL * elapsed;
    }

    r.pending += coins;
  }

  /** Advance every farm; pass the farm currently simulated on-screen (or -1). */
  function tick(liveFarmId = -1) {
    const now = Date.now();
    for (const f of CONFIG.FARMS) reconcile(f.id, now, f.id === liveFarmId);
  }

  let launchReport = null; // {awaySec, capped, perFarm, total} captured once at boot

  /**
   * Boot-time reconcile for the welcome-back popup: measures how long the
   * game was closed (the most recent farm stamp from the previous session)
   * and how many coins each farm produced over that capped window (the
   * per-farm pending deltas the reconcile itself generates).
   */
  function launchTick() {
    const now = Date.now();
    let lastSeen = 0;
    for (const f of CONFIG.FARMS) lastSeen = Math.max(lastSeen, rec(f.id).last || 0);
    const before = CONFIG.FARMS.map(f => rec(f.id).pending);
    tick();
    const perFarm = CONFIG.FARMS.map(f => rec(f.id).pending - before[f.id]);
    const awaySec = lastSeen && now > lastSeen ? (now - lastSeen) / 1000 : 0;
    launchReport = {
      awaySec: Math.min(awaySec, capSeconds()),
      capped: awaySec > capSeconds(),
      perFarm,
      total: perFarm.reduce((a, b) => a + b, 0),
    };
  }

  /** One-shot: the boot report for the welcome-back popup (null after use). */
  function takeLaunchReport() { const r = launchReport; launchReport = null; return r; }

  /** Whole coins waiting to be collected on this farm. */
  function pending(farmId) { return Math.floor(rec(farmId).pending); }

  /** Take the whole-coin pending balance; the fraction keeps accruing. */
  function collect(farmId) {
    const r = rec(farmId);
    const amount = Math.floor(r.pending);
    r.pending -= amount;
    return amount;
  }

  return { tick, launchTick, takeLaunchReport, pending, collect };
})();
</script>
<script>
/**
 * VFXManager — pooled particles, flying coins, floating numbers,
 * transient glow effects. Zero per-frame allocations once warm.
 */
const VFXManager = (() => {
  const particles = [];
  const pool = new Pool(
    () => ({}),
    p => { p.dead = false; p.t = 0; }
  );

  function spawn(props) {
    const p = pool.get();
    Object.assign(p, {
      x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, size: 3, col: '#fff',
      kind: 'square', img: null, text: null, targetX: null, targetY: null,
      speed: 0, onArrive: null, delay: 0,
    }, props);
    particles.push(p);
    return p;
  }

  /** Burst of colored squares (merge / unlock particles). */
  function burst(x, y, cols, n = 14, force = 90) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, f = U.rand(force * 0.4, force);
      spawn({
        x, y, vx: Math.cos(a) * f, vy: Math.sin(a) * f - 30,
        g: 160, life: U.rand(0.4, 0.8), size: U.randInt(2, 5),
        col: U.pick(cols), kind: 'square',
      });
    }
  }

  /** Soft dust puff at feet. */
  function dust(x, y, n = 5) {
    for (let i = 0; i < n; i++) {
      spawn({
        x: x + U.rand(-6, 6), y: y + U.rand(-2, 2),
        vx: U.rand(-18, 18), vy: U.rand(-24, -8), g: 20,
        life: U.rand(0.3, 0.55), size: U.randInt(2, 4),
        col: 'rgba(220,205,170,0.7)', kind: 'circle',
      });
    }
  }

  /** Golden sparkles. */
  function sparkle(x, y, n = 8, spread = 14) {
    for (let i = 0; i < n; i++) {
      spawn({
        x: x + U.rand(-spread, spread), y: y + U.rand(-spread, spread),
        vx: 0, vy: U.rand(-14, -4), g: 0,
        life: U.rand(0.35, 0.7), size: U.randInt(1, 3),
        col: U.pick(['#ffe98a', '#f4c437', '#fff6d0']), kind: 'star',
        delay: U.rand(0, 0.25),
      });
    }
  }

  /** Coin that flies to the HUD counter then triggers callback. */
  function flyCoin(x, y, tx, ty, onArrive) {
    spawn({
      x, y, targetX: tx, targetY: ty, speed: CONFIG.COIN_FLY_SPEED,
      life: 5, kind: 'coin', img: SPRITES.coin(2), onArrive,
      vx: U.rand(-50, 50), vy: U.rand(-120, -70), g: 0,
    });
  }

  /**
   * A few coins arcing to the HUD wallet, together carrying `amount`:
   * each adds its share as it lands so the counter visibly ticks up.
   */
  function coinPayout(x, y, amount, spreadX = 16, spreadY = 8) {
    const target = UI.coinTarget();
    const n = Math.min(CONFIG.IDLE.COINS_PER_COLLECT, amount);
    const base = Math.floor(amount / n);
    for (let i = 0; i < n; i++) {
      const share = i === n - 1 ? amount - base * (n - 1) : base;
      flyCoin(x + U.rand(-spreadX, spreadX), y + U.rand(-spreadY, spreadY),
        target.x, target.y, () => {
          Game.addCoins(share);
          AudioManager.play('coin');
        });
    }
    floatText(x, y - 26, '+' + U.fmt(amount));
  }

  /** Floating "+N" text. */
  function floatText(x, y, text, col = '#ffe98a') {
    spawn({ x, y, vx: 0, vy: -28, g: 0, life: 1.0, kind: 'text', text, col });
  }

  function update(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.t += dt;
      if (p.kind === 'coin') {
        // brief hop then home to target
        if (p.t < 0.25) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
        } else {
          const d = U.dist(p.x, p.y, p.targetX, p.targetY);
          if (d < 14) {
            if (p.onArrive) p.onArrive();
            p.dead = true;
          } else {
            const sp = p.speed * dt;
            p.x += (p.targetX - p.x) / d * sp;
            p.y += (p.targetY - p.y) / d * sp;
          }
        }
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      if (p.t >= p.life || p.dead) {
        particles.splice(i, 1);
        pool.release(p);
      }
    }
  }

  function draw(ctx) {
    for (const p of particles) {
      if (p.delay > 0) continue;
      const a = U.clamp(1 - p.t / p.life, 0, 1);
      ctx.globalAlpha = a;
      if (p.kind === 'square') {
        ctx.fillStyle = p.col;
        ctx.fillRect(p.x - p.size / 2 | 0, p.y - p.size / 2 | 0, p.size, p.size);
      } else if (p.kind === 'circle') {
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + 1, 0, 7); ctx.fill();
      } else if (p.kind === 'star') {
        ctx.fillStyle = p.col;
        const s = p.size;
        ctx.fillRect(p.x - s, p.y, s * 2 + 1, 1);
        ctx.fillRect(p.x, p.y - s, 1, s * 2 + 1);
      } else if (p.kind === 'coin') {
        const wob = 1 + Math.sin(p.t * 20) * 0.12;
        ctx.globalAlpha = 1;
        ctx.drawImage(p.img, p.x - 12, p.y - 12 * wob, 24, 24 * wob);
      } else if (p.kind === 'text') {
        UI.drawText(ctx, p.text, p.x, p.y, UI.SIZE.BODY, p.col, 'center', true);
      }
      ctx.globalAlpha = 1;
    }
  }

  return { burst, dust, sparkle, flyCoin, coinPayout, floatText, update, draw };
})();
</script>
<script>
/**
 * UFOManager — end-game MUTANT 2 collection layer.
 *
 * Every farm unlocks its own UFO independently. The first Mutant + Mutant
 * merge on a farm plays the full abduction cinematic (gameplay paused,
 * input blocked): the pair becomes a MUTANT 2 (the final, fully mutated
 * form of the farm's animal), a UFO flies in, beams it up, then parks
 * permanently beside the farmhouse in the upper-right corner of the scene,
 * outside the pen. Every later Mutant + Mutant merge there is a sub-second
 * quick collect straight into the parked UFO.
 *
 * Each collected Mutant 2 permanently raises the UFO's passive coin
 * drip (aliens * INCOME_PER_ALIEN coins every INTERVAL seconds — the
 * internal `aliens` counter/config names are kept for save compatibility).
 */
const UFO = (() => {
  const C = () => CONFIG.UFO;
  // each farm has its own UFO: always operate on the current farm's slot
  const data = () => SaveManager.data.ufo[SaveManager.data.currentFarm];
  // the collected Mutant 2 is the current farm's own species
  const species = () => CONFIG.FARMS[SaveManager.data.currentFarm].species;

  let cine = null;       // first-time cinematic {phase, t, x, y, ufoX, ufoY, alien:{y, s}, fromX, fromY}
  let collects = [];     // quick collect anims: {x, y, t}
  let prodT = 0;         // production timer
  let bobT = 0;          // idle hover / light animation clock
  let flashT = 0;        // brief tractor-beam flash when an alien arrives

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Permanent parking spot: hovering beside the farmhouse in the upper-right
   * corner of the scene, anchored to the view's top/right edges (not the
   * pen). It fills the clear sky strip between the top HUD bar (backdrop
   * ends at y 56) and the pen's back fence (starts at y 140), to the right
   * of the farmhouse (widest building ends at x 234) — fully outside the
   * fenced animal area, never covering the house, and clear of the settings
   * button (ends at y 44). The right flanking tree was moved to the
   * bottom-right grass (environment.js) to keep this corner open. The whole
   * 360x640 virtual view is letterboxed on every device, so an edge anchor
   * inside it stays fully visible and tappable at any resolution or aspect
   * ratio. (Saucer is 88x52 px, bottom-anchored; counter extends ~30 px
   * below.)
   */
  function spot() {
    return {
      x: CONFIG.VIEW_W - 48,   // right-edge anchored: saucer spans x 268-356
      y: 110,                  // top-edge anchored: saucer spans y 58-110
    };
  }

  /** Entry point from FarmScene.merge for a Mutant + Mutant pair. */
  function collect(x, y) {
    // record the Mutant 2 as in-transit so a reload mid-animation can't lose it
    data().pending = (data().pending || 0) + 1;
    SaveManager.save();
    if (!data().landed) {
      if (cine) return; // already playing (shouldn't happen: input is blocked)
      cine = {
        phase: 'spawn', t: 0, x, y,
        ufoX: x, ufoY: -30,
        alien: { y, s: 0 },
      };
    } else {
      collects.push({ x, y, t: 0 });
      AudioManager.play('beam');
    }
  }

  /** A Mutant 2 reached the UFO: bump the collection + production for good. */
  function addAlien() {
    const p = spot();
    data().aliens++;
    data().pending = Math.max(0, (data().pending || 0) - 1);
    SaveManager.save();
    AudioManager.play('alien');
    VFXManager.burst(p.x, p.y - 24, ['#7de87a', '#c4ffb8', '#ffe98a', '#ffffff'], 20, 120);
    VFXManager.sparkle(p.x, p.y - 26, 14, 26);
    VFXManager.floatText(p.x, p.y - 52, '+1 MUTANT 2', '#c4ffb8');
    VFXManager.floatText(p.x, p.y - 38, '+' + Upgrades.alienValue(SaveManager.data.currentFarm) + '/' + C().INTERVAL.toFixed(0) + 'S');
    flashT = 0.3;
  }

  // ---------------- update ----------------
  function update(dt) {
    bobT += dt;
    if (flashT > 0) flashT -= dt;
    if (cine) { updateCinematic(dt); return; }

    // recover Mutant 2s stranded by a reload mid-animation
    const stranded = (data().pending || 0) - collects.length;
    if (stranded > 0) {
      if (!data().landed) {
        // replay the abduction from the middle of the pen
        const cx = ENVIRONMENT.PLAY.x + ENVIRONMENT.PLAY.w / 2;
        const cy = ENVIRONMENT.PLAY.y + ENVIRONMENT.PLAY.h / 2;
        cine = { phase: 'spawn', t: 0, x: cx, y: cy, ufoX: cx, ufoY: -30, alien: { y: cy, s: 0 } };
        return;
      }
      for (let i = 0; i < stranded; i++) addAlien();
    }

    // quick collects (post-landing, < 1 s each)
    for (let i = collects.length - 1; i >= 0; i--) {
      const c = collects[i];
      c.t += dt;
      if (c.t >= C().QUICK_COLLECT_TIME) {
        collects.splice(i, 1);
        addAlien();
      }
    }

    // passive coin production, scaling with the collection
    if (data().landed && data().aliens > 0) {
      prodT += dt;
      if (prodT >= C().INTERVAL) {
        prodT = 0;
        const p = spot();
        const value = data().aliens * Upgrades.alienValue(SaveManager.data.currentFarm);
        const t = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 18, t.x, t.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 34, '+' + value);
      }
    }
  }

  function updateCinematic(dt) {
    const c = cine, D = C().CINEMATIC;
    c.t += dt;
    if (c.phase === 'spawn') {
      // the merged pair materializes as a MUTANT 2
      c.alien.s = U.easeOutBack(Math.min(c.t / 0.5, 1));
      if (Math.random() < 0.3) VFXManager.sparkle(c.x, c.y - 12, 3, 14);
      if (c.t >= D.SPAWN) { c.phase = 'arrive'; c.t = 0; AudioManager.play('ufo'); }
    } else if (c.phase === 'arrive') {
      // UFO descends from the sky to hover over the Mutant 2
      const t = smooth(c.t / D.ARRIVE);
      c.ufoX = c.x + Math.sin(t * Math.PI * 3) * 12 * (1 - t);
      c.ufoY = U.lerp(-30, c.y - 92, t);
      if (c.t >= D.ARRIVE) { c.phase = 'beam'; c.t = 0; AudioManager.play('beam'); }
    } else if (c.phase === 'beam') {
      // tractor beam pulls the Mutant 2 up into the saucer
      const t = U.clamp(c.t / D.BEAM, 0, 1);
      c.alien.y = U.lerp(c.y, c.ufoY + 14, t * t);
      c.alien.s = 1 - t * 0.7;
      if (Math.random() < 0.5) VFXManager.sparkle(c.x, U.lerp(c.y, c.ufoY + 20, Math.random()), 2, 8);
      if (c.t >= D.BEAM) {
        c.phase = 'fly'; c.t = 0;
        c.fromX = c.ufoX; c.fromY = c.ufoY;
        VFXManager.burst(c.ufoX, c.ufoY - 10, ['#7de87a', '#c4ffb8', '#ffffff'], 16, 100);
        AudioManager.play('ufo');
      }
    } else if (c.phase === 'fly') {
      // cruise to the permanent landing corner with a little arc
      const p = spot();
      const t = smooth(c.t / D.FLY);
      c.ufoX = U.lerp(c.fromX, p.x, t);
      c.ufoY = U.lerp(c.fromY, p.y - 26, t) - Math.sin(t * Math.PI) * 26;
      if (c.t >= D.FLY) { c.phase = 'land'; c.t = 0; }
    } else if (c.phase === 'land') {
      const p = spot();
      c.ufoX = p.x;
      c.ufoY = U.lerp(p.y - 26, p.y, smooth(c.t / D.LAND));
      if (c.t >= D.LAND) {
        cine = null;
        data().landed = true;
        addAlien();   // first alien joins the collection (also saves)
      }
    }
  }

  // ---------------- draw ----------------
  /** Soft tractor-beam cone from the saucer belly down to the ground. */
  function drawBeam(ctx, x, topY, groundY, alpha, wTop = 7, wBot = 24) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = '#c4ffb8';
    ctx.beginPath();
    ctx.moveTo(x - wTop, topY); ctx.lineTo(x + wTop, topY);
    ctx.lineTo(x + wBot, groundY); ctx.lineTo(x - wBot, groundY);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath(); ctx.ellipse(x, groundY, wBot, 6, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawSaucer(ctx, x, y, aliens, shadow = true) {
    if (shadow) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(x, spot().y + 6, 26, 6, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    const phase = Math.floor(bobT * 5) % 3;
    PIXEL.blit(ctx, SPRITES.ufo(phase, aliens), x, y, 2);
  }

  function draw(ctx) {
    if (cine) { drawCinematic(ctx); return; }
    if (!data().landed) return;
    const p = spot();
    const bob = Math.sin(bobT * 2) * 2;

    // arrival flash: short tractor beam under the parked saucer
    if (flashT > 0) drawBeam(ctx, p.x, p.y - 6 + bob, p.y + 8, Math.min(1, flashT * 4));

    // Mutant 2s being beamed in (quick collect)
    for (const c of collects) {
      const t = U.clamp(c.t / C().QUICK_COLLECT_TIME, 0, 1);
      const pop = U.easeOutBack(Math.min(c.t / 0.15, 1));
      const e = smooth(t);
      const ax = U.lerp(c.x, p.x, e);
      const ay = U.lerp(c.y, p.y - 12, e) - Math.sin(e * Math.PI) * 36;
      PIXEL.blit(ctx, SPRITES.mutant2(species()), ax, ay, 2 * pop * (1 - t * 0.55));
      if (Math.random() < 0.5) VFXManager.sparkle(ax, ay - 8, 1, 6);
    }

    drawSaucer(ctx, p.x, p.y + bob, data().aliens);

    // collection counter under the saucer, in the sky gap above the pen's
    // back fence (fence starts at y 140; the counter ends right there)
    if (data().aliens > 0) {
      PIXEL.blit(ctx, SPRITES.mutant2(species()), p.x - 2, p.y + 30, 1);
      UI.drawText(ctx, 'X' + data().aliens, p.x + 6, p.y + 16, UI.SIZE.BODY, '#c4ffb8', 'left', true);
    }
  }

  function drawCinematic(ctx) {
    const c = cine;
    // dim the farm for drama
    ctx.fillStyle = 'rgba(8, 12, 28, 0.35)';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);

    if (c.phase === 'beam') {
      const pulse = 0.7 + Math.sin(bobT * 16) * 0.3;
      drawBeam(ctx, c.ufoX, c.ufoY - 4, c.y + 6, pulse);
    }
    if (c.phase !== 'fly' && c.phase !== 'land') {
      PIXEL.blit(ctx, SPRITES.mutant2(species()), c.x, c.alien.y, 2 * c.alien.s);
    }
    if (c.phase !== 'spawn') {
      drawSaucer(ctx, c.ufoX, c.ufoY, 0, c.phase === 'land');
    }
  }

  return {
    collect, update, draw,
    get cinematicActive() { return !!cine; },
    /** Clear transient animation state (farm switch / full reset). */
    reset() { cine = null; collects = []; prodT = 0; flashT = 0; },
  };
})();
</script>
<script>
/**
 * PigeonManager — reward-ad event layer (Pigeon & Poop Rain).
 *
 * Every SPAWN_INTERVAL seconds a pigeon flies across the screen and lands
 * on the back fence of the current farm, where it perches for STAY_TIME
 * seconds playing idle animations (blinking, looking around, the odd wing
 * flap). Tapping it opens the reward-ad popup; completing the ad removes
 * the pigeon and triggers a Poop Rain: poops (the same asset the animals
 * produce) fall over the pen and each one auto-collects into coins. The
 * whole rain is worth REWARD_MINUTES of the farm's current passive income
 * (see poopValue), so the offer scales with the player's economy forever.
 * Ignoring the pigeon for STAY_TIME loses the opportunity until the next
 * visit.
 *
 * Per-farm state (spawn countdown + remaining perch time) lives in
 * SaveManager.data.pigeon, so every farm runs its own independent event
 * and a pigeon left perched on one farm is restored when returning to it.
 * Only one pigeon can exist at a time on a farm, and it never appears
 * during the merge tutorial, the upgrade tutorial, celebrations or the
 * UFO cinematic (Game only ticks this manager during normal gameplay).
 *
 * Balancing values live in CONFIG.PIGEON and can be overridden at runtime
 * through window.RemoteConfig.PIGEON (Remote Config hook).
 */
const Pigeon = (() => {
  const C = () => Object.assign({}, CONFIG.PIGEON, (window.RemoteConfig || {}).PIGEON);
  // each farm has its own pigeon slot: always operate on the current farm's
  const data = () => SaveManager.data.pigeon[SaveManager.data.currentFarm];

  let bird = null;      // {state:'fly'|'idle'|'leave', t, x, y, fromX, fromY, toX, toY, dir, ...}
  let poops = [];       // {x, y, vy, groundY, state:'fall'|'land', t}
  let rain = null;      // {t, spawned}
  let rainValue = 0;    // coins per poop, locked in when the ad completes
  let shakeT = 0;       // impact screen-shake time left

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Random perch spot on the back fence rail — clear of the UFO corner on
   * the right and the farmhouse behind the fence center.
   */
  function perchSpot() {
    // the current fence footprint — the pigeon perches on the real rail
    const P = ENVIRONMENT.playRect(SaveManager.data.currentFarm), cx = CONFIG.VIEW_W / 2;
    const x = Math.random() < 0.5
      ? U.rand(P.x + 30, cx - 64)
      : U.rand(cx + 64, P.x + P.w - 90);
    return { x, y: P.y - 12 };
  }

  /**
   * Coins one poop pays out. Auto mode (COIN_PER_POOP = 0): the whole rain
   * is worth REWARD_MINUTES of the farm's CURRENT passive income, split
   * evenly across POOP_COUNT poops. Pricing the ad off the live income
   * rate keeps it a meaningful accelerator at every stage of the game —
   * "a few minutes of progress, right now" — without ever dwarfing normal
   * play or going stale late-game. MIN_PER_POOP floors a fresh farm.
   */
  function poopValue() {
    const cfg = C();
    if (cfg.COIN_PER_POOP > 0) return cfg.COIN_PER_POOP;
    const farm = Game.farm;
    const rate = Upgrades.incomeRate(SaveManager.data.currentFarm, farm ? farm.animals : []);
    return Math.max(cfg.MIN_PER_POOP, Math.round(rate * cfg.REWARD_MINUTES * 60 / cfg.POOP_COUNT));
  }

  function spawn(restore) {
    const p = perchSpot();
    const dir = Math.random() < 0.5 ? 1 : -1;   // 1 = enters from the left
    bird = {
      state: restore ? 'idle' : 'fly', t: 0,
      x: p.x, y: p.y, toX: p.x, toY: p.y,
      fromX: dir === 1 ? -24 : CONFIG.VIEW_W + 24,
      fromY: p.y - 70,
      dir,
      blink: false, blinkT: U.rand(1, 3),
      look: false, lookT: U.rand(2, 4),
      flap: 0, flapT: U.rand(3, 6),
      attractT: 2.0,
    };
    if (!restore) {
      bird.x = bird.fromX; bird.y = bird.fromY;
      data().remaining = C().STAY_TIME;
      SaveManager.save();
      AudioManager.play('flap');
    }
  }

  // ---------------- update ----------------
  function update(dt, tutorialActive) {
    if (shakeT > 0) shakeT -= dt;
    const d = data();

    const enabled = C().ENABLED; // kill switch gates new visits only

    // restore a pigeon that was left perched on this farm
    if (!bird && enabled && d.remaining > 0 && !tutorialActive) spawn(true);

    // spawn countdown: one pigeon at a time, never during the tutorial
    if (!bird && enabled && d.remaining <= 0 && !tutorialActive) {
      d.next -= dt;
      if (d.next <= 0) spawn(false);
    }

    if (bird) updateBird(dt);
    if (rain || poops.length) updateRain(dt);
  }

  function updateBird(dt) {
    const b = bird, d = data();
    b.t += dt;
    if (b.state === 'fly') {
      // swoop across the sky, then glide down onto the fence rail
      const t = smooth(b.t / C().FLY_TIME);
      b.x = U.lerp(b.fromX, b.toX, t);
      b.y = U.lerp(b.fromY, b.toY, t * t) - Math.sin(t * Math.PI) * 16;
      if (b.t >= C().FLY_TIME) {
        b.state = 'idle'; b.t = 0; b.x = b.toX; b.y = b.toY;
        VFXManager.dust(b.x, b.y, 4);
        AudioManager.play('coo');
      }
    } else if (b.state === 'idle') {
      // perch countdown (frozen while the reward popup / ad is open, so
      // closing the popup never eats the player's remaining window)
      const p = UI.popup;
      const frozen = p && (p.type === 'pigeonAd' || p.type === 'adPlaying');
      if (!frozen) {
        d.remaining -= dt;
        if (d.remaining <= 0) {
          // ignored: the opportunity is lost until the next visit
          d.remaining = 0;
          d.next = C().SPAWN_INTERVAL;
          SaveManager.save();
          b.state = 'leave'; b.t = 0;
          b.fromX = b.x; b.fromY = b.y;
          b.dir = b.x < CONFIG.VIEW_W / 2 ? -1 : 1;
          AudioManager.play('flap');
          return;
        }
      }
      // idle acting: blink, look around, occasional wing flap
      b.blinkT -= dt;
      if (b.blinkT <= 0) { b.blink = !b.blink; b.blinkT = b.blink ? 0.12 : U.rand(1.5, 4); }
      b.lookT -= dt;
      if (b.lookT <= 0) { b.look = !b.look; b.lookT = b.look ? U.rand(0.5, 1.1) : U.rand(2, 4.5); }
      if (b.flap > 0) b.flap -= dt;
      else {
        b.flapT -= dt;
        if (b.flapT <= 0) { b.flap = 0.4; b.flapT = U.rand(3.5, 7); AudioManager.play('flap'); }
      }
      // attention sparkle so the player spots the visitor
      b.attractT -= dt;
      if (b.attractT <= 0) { b.attractT = 3.2; VFXManager.sparkle(b.x, b.y - 28, 4, 10); }
    } else if (b.state === 'leave') {
      const t = b.t / C().LEAVE_TIME;
      b.x = b.fromX + b.dir * t * 260;
      b.y = b.fromY - smooth(t) * 180 + Math.sin(b.t * 14) * 2;
      if (b.t >= C().LEAVE_TIME) bird = null;
    }
  }

  function updateRain(dt) {
    if (rain) {
      rain.t += dt;
      const count = C().POOP_COUNT;
      const gap = C().RAIN_DURATION / count;
      while (rain.spawned < count && rain.t >= rain.spawned * gap) {
        const P = ENVIRONMENT.playRect(SaveManager.data.currentFarm);
        poops.push({
          x: U.rand(P.x + 14, P.x + P.w - 14),
          groundY: U.rand(P.y + 20, P.y + P.h - 8),
          y: -16 - U.rand(0, 30),
          vy: U.rand(120, 200),
          state: 'fall', t: 0,
        });
        rain.spawned++;
      }
      if (rain.spawned >= count) rain = null;
    }
    for (let i = poops.length - 1; i >= 0; i--) {
      const p = poops[i];
      p.t += dt;
      if (p.state === 'fall') {
        p.vy += 620 * dt;
        p.y += p.vy * dt;
        if (p.y >= p.groundY) {
          p.y = p.groundY; p.state = 'land'; p.t = 0;
          VFXManager.dust(p.x, p.y, 6);
          AudioManager.play('poop');
          shakeT = 0.18;
        }
      } else if (p.t >= 0.4) {
        // auto-collect: the poop turns into coins flying to the HUD
        const value = rainValue;
        const tgt = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 6, tgt.x, tgt.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 18, '+' + value);
        VFXManager.sparkle(p.x, p.y - 8, 5, 8);
        poops.splice(i, 1);
      }
    }
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the perched pigeon (opens the ad popup). */
  function tap(x, y) {
    if (!bird || bird.state !== 'idle') return false;
    if (U.dist(x, y, bird.x, bird.y - 12) > 22) return false;
    AudioManager.play('coo');
    UI.openPopup({ type: 'pigeonAd' });
    return true;
  }

  /** The reward ad finished successfully: pigeon leaves, poops fall. */
  function adCompleted() {
    const d = data();
    d.remaining = 0;
    d.next = C().SPAWN_INTERVAL + C().REWARD_COOLDOWN;
    SaveManager.save();
    if (bird) {
      VFXManager.burst(bird.x, bird.y - 12, ['#ffe98a', '#fff6d0', '#c6cfd8', '#ffffff'], 14, 100);
      VFXManager.sparkle(bird.x, bird.y - 16, 8, 14);
      bird = null;
    }
    rainValue = poopValue();
    rain = { t: 0, spawned: 0 };
    AudioManager.play('unlock');
  }

  // ---------------- draw ----------------
  function draw(ctx) {
    // ground shadows under falling poops
    for (const p of poops) {
      if (p.state !== 'fall') continue;
      const near = U.clamp(1 - (p.groundY - p.y) / 220, 0.15, 1);
      ctx.globalAlpha = 0.22 * near;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(p.x, p.groundY + 2, 8 * near + 2, 3 * near + 1, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (bird) {
      const b = bird;
      const flying = b.state !== 'idle';
      let frame = 'idle';
      if (flying) frame = Math.floor(b.t * 12) % 2 ? 'flapUp' : 'flapDn';
      else if (b.flap > 0) frame = Math.floor(b.t * 16) % 2 ? 'flapUp' : 'flapDn';
      else if (b.look) frame = 'look';
      const bob = b.state === 'idle' ? Math.sin(b.t * 2.2) * 0.8 : 0;
      const img = SPRITES.pigeon(frame, b.blink && !flying);
      PIXEL.blit(ctx, img, b.x, b.y + bob, 2, b.dir === -1);

      // golden "!" bubble while perched, so the offer reads as tappable
      if (b.state === 'idle') {
        const pulse = Math.sin(b.t * 5) * 2;
        const by = b.y - 40 + pulse;
        ctx.fillStyle = PIXEL.OUTLINE;
        ctx.beginPath(); ctx.arc(b.x, by, 8, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.gold;
        ctx.beginPath(); ctx.arc(b.x, by, 6, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.goldHi;
        ctx.beginPath(); ctx.arc(b.x - 1, by - 1, 4, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.gold;
        ctx.beginPath(); ctx.arc(b.x, by + 1, 4, 0, 7); ctx.fill();
        UI.drawText(ctx, '!', b.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
      }
    }

    // falling poops (same asset the animals produce, squash bounce on impact)
    for (const p of poops) {
      const squash = p.state === 'land' && p.t < 0.18 ? 0.72 + (p.t / 0.18) * 0.28 : 1;
      PIXEL.blit(ctx, SPRITES.poop(0), p.x, p.y + 4, 2, false, squash, 1 + (1 - squash) * 0.8);
    }
  }

  /** Subtle screen offset while a poop impact shake is active. */
  function shakeOffset() {
    if (shakeT <= 0) return { x: 0, y: 0 };
    const a = (shakeT / 0.18) * 2.2;
    return { x: (Math.random() * 2 - 1) * a, y: (Math.random() * 2 - 1) * a };
  }

  /** Reward panel numbers for the popup. */
  function info() {
    return { count: C().POOP_COUNT, value: poopValue(), adDur: C().AD_DURATION };
  }

  /**
   * Clear transient animation state (farm switch / full reset). A rain in
   * progress pays out its remaining poops instantly so switching farms
   * never costs the player their reward; discard=true (save reset) skips it.
   */
  function reset(discard = false) {
    if (!discard) {
      const pending = poops.length + (rain ? C().POOP_COUNT - rain.spawned : 0);
      if (pending > 0) Game.addCoins(pending * rainValue);
    }
    bird = null; poops = []; rain = null; shakeT = 0;
  }

  return { update, draw, tap, adCompleted, shakeOffset, info, reset };
})();
</script>
<script>
/**
 * TornadoManager — reward-ad event layer (Tornado Auto Merge).
 *
 * At most every SPAWN_INTERVAL seconds — and only once the pen is crowded
 * with several merges pending (see offerWorthwhile) — a tornado icon
 * appears on the left side of the screen and stays available for
 * STAY_TIME seconds. Tapping it opens
 * the reward-ad popup; completing the ad sends a large pixel tornado
 * sweeping across the farm. The tornado is pure quality-of-life: it
 * performs exactly the merges the player could make by hand, only much
 * faster. It sweeps the pen collecting every animal that will take part
 * in a merge and leaves everything else grazing untouched; then, once
 * collection is complete, the pooled animals resolve in one cascading
 * pass (2 x level N -> 1 x level N+1, repeated until fewer than 2 remain
 * at every level — e.g. 4 babies -> 2 adults -> 1 elder). Animals are
 * pooled and merged strictly per species, never across species, matching
 * the manual drag-merge rule. Odd leftovers survive unchanged, and
 * max-level Mutants only pair off into MUTANT 2s on farms where the UFO
 * has already been unlocked — otherwise they are never even collected.
 * The evolved survivors are tossed back onto the farm and the tornado
 * leaves. Ignoring the icon loses the offer until the next cycle.
 *
 * Per-farm state (offer countdown + remaining availability) lives in
 * SaveManager.data.tornado, so every farm runs its own independent event.
 * Only one offer can be active at a time on a farm, and it never appears
 * during the merge tutorial (Game only ticks this manager during normal
 * gameplay). While the tornado is running all farm input is blocked and
 * spawning is paused; normal gameplay resumes the moment it leaves.
 *
 * Balancing values live in CONFIG.TORNADO and can be overridden at
 * runtime through window.RemoteConfig.TORNADO (Remote Config hook).
 */
const Tornado = (() => {
  const C = () => Object.assign({}, CONFIG.TORNADO, (window.RemoteConfig || {}).TORNADO);
  // each farm has its own tornado slot: always operate on the current farm's
  const data = () => SaveManager.data.tornado[SaveManager.data.currentFarm];

  const ICON = { x: 38, y: 132 };  // bottom-anchored icon spot, left side

  let icon = null;   // {t} the offer icon is visible / available
  let run = null;    // active tornado, see start()
  let clockT = 0;    // spin animation clock

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Reward-ad timing: only offer the tornado at a moment where it saves
   * real manual work — a crowded pen with several merges waiting. The
   * countdown may have long elapsed; the icon then appears the moment the
   * farm actually fills up ("here's a boost if you want it", not a nag).
   * Mutant pairs only count where the UFO is unlocked (they can't merge
   * otherwise, matching the funnel's own rule).
   */
  function offerWorthwhile() {
    const scene = Game.farm;
    if (!scene || scene.tutorial) return false;
    if (scene.animals.length < C().MIN_ANIMALS) return false;
    const top = CONFIG.STAGE_NAMES.length - 1;
    const landed = SaveManager.data.ufo[SaveManager.data.currentFarm].landed;
    const counts = {};
    for (const a of scene.animals) {
      if (a.state === 'merging') continue;
      if (a.stage === top && !landed) continue;
      const k = a.species + ':' + a.stage;
      counts[k] = (counts[k] || 0) + 1;
    }
    let pairs = 0;
    for (const k in counts) pairs += Math.floor(counts[k] / 2);
    return pairs >= C().MIN_PAIRS;
  }

  // ---------------- availability cycle ----------------
  function update(dt, tutorialActive) {
    clockT += dt;
    const d = data();
    if (!C().ENABLED) { icon = null; return; }

    // restore an offer that was left available on this farm
    if (!icon && d.remaining > 0 && !tutorialActive) icon = { t: 0 };

    // offer countdown: one offer at a time, never during the tutorial,
    // and only released once the pen is crowded enough to be worth it
    if (!icon && d.remaining <= 0 && !tutorialActive) {
      d.next -= dt;
      if (d.next <= 0 && offerWorthwhile()) {
        icon = { t: 0 };
        d.remaining = C().STAY_TIME;
        SaveManager.save();
        VFXManager.sparkle(ICON.x, ICON.y - 20, 8, 16);
        AudioManager.play('pop');
      }
    }

    if (icon) {
      // availability countdown (frozen while the reward popup / ad is
      // open, so closing the popup never eats the player's window)
      const p = UI.popup;
      const frozen = p && (p.type === 'tornadoAd' || p.type === 'adPlaying');
      if (!frozen) {
        icon.t += dt;
        d.remaining -= dt;
        if (d.remaining <= 0) {
          // ignored: the opportunity is lost until the next cycle
          d.remaining = 0;
          d.next = C().SPAWN_INTERVAL;
          SaveManager.save();
          icon = null;
        }
      }
    }
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the tornado icon (opens the ad popup). */
  function tap(x, y) {
    if (!icon || run) return false;
    if (U.dist(x, y, ICON.x, ICON.y - 16) > 24) return false;
    AudioManager.play('click');
    UI.openPopup({ type: 'tornadoAd' });
    return true;
  }

  /** Reward panel numbers for the popup. */
  function info() {
    return { adDur: C().AD_DURATION };
  }

  /** The reward ad finished successfully: consume the offer, unleash it. */
  function adCompleted() {
    const d = data();
    d.remaining = 0;
    d.next = C().SPAWN_INTERVAL + C().REWARD_COOLDOWN;
    SaveManager.save();
    if (icon) {
      VFXManager.burst(ICON.x, ICON.y - 16, ['#c8cdd4', '#eef2f6', '#ffe98a'], 12, 90);
      icon = null;
    }
    start();
  }

  // ---------------- active tornado ----------------
  function start() {
    const scene = Game.farm;
    scene.pointerUp(); // settle any in-progress drag defensively
    run = {
      phase: 'enter', t: 0,
      scene,
      x: -40,
      y: scene.bounds.y + scene.bounds.h * 0.55,
      held: [],      // animals spinning inside: {species, stage, angle, r, h, maxH, spin, pull, sx, sy}
      ejected: 0,    // eject-phase counter
      dustT: 0,
    };
    AudioManager.play('wind');
  }

  /**
   * Simulate the full merge cascade over ALL animals (farm + funnel),
   * pooled per species — never across species, matching the manual
   * drag-merge rule. Returns, per species, the set of stages that will
   * see at least one merge: exactly the animals worth collecting. A
   * stage with a single animal only becomes "active" when lower-stage
   * merges will produce it a partner, so untouched singles stay out.
   * Max-level Mutants only pair off where the UFO has been unlocked.
   */
  function mergePlan() {
    const top = CONFIG.STAGE_NAMES.length - 1;
    const landed = SaveManager.data.ufo[run.scene.farmId].landed;
    const pools = {};
    const add = (sp, st) => {
      const c = pools[sp] = pools[sp] || [];
      c[st] = (c[st] || 0) + 1;
    };
    for (const a of run.scene.animals) if (a.state !== 'merging') add(a.species, a.stage);
    for (const h of run.held) add(h.species, h.stage);
    const active = {};
    for (const sp in pools) {
      const counts = pools[sp];
      active[sp] = new Set();
      for (let s = 0; s <= top; s++) {
        const canPair = s < top || landed;
        const pairs = canPair ? Math.floor((counts[s] || 0) / 2) : 0;
        if (pairs > 0) active[sp].add(s);
        if (s < top) counts[s + 1] = (counts[s + 1] || 0) + pairs;
      }
    }
    return active;
  }

  /** Will this animal take part in the cascade? (see mergePlan) */
  function collectible(a, active) {
    if (a.escaping) return false;   // already leaving: no longer matchable
    return !!active[a.species] && active[a.species].has(a.stage);
  }

  /** Pull one farm animal into the funnel. */
  function capture(a) {
    a.dead = true; // FarmScene.update would splice it, but we run instead
    const i = run.scene.animals.indexOf(a);
    if (i >= 0) run.scene.animals.splice(i, 1);
    run.held.push({
      species: a.species, stage: a.stage,
      angle: U.rand(0, Math.PI * 2),
      r: U.rand(12, 22),
      h: 6, maxH: U.rand(16, 48),
      spin: U.rand(0, 5),
      pull: 0, sx: a.x, sy: a.y,
    });
    VFXManager.dust(a.x, a.y, 5);
    AudioManager.play('flap');
  }

  /**
   * Suck in the collectible animals the sweeping funnel has passed or
   * come close to. Animals that won't merge are left grazing untouched.
   */
  function captureNear() {
    const active = mergePlan();
    for (let i = run.scene.animals.length - 1; i >= 0; i--) {
      const a = run.scene.animals[i];
      if (a.state === 'merging' || !collectible(a, active)) continue;
      if (a.x < run.x + 22 || U.dist(a.x, a.y, run.x, run.y) < 52) capture(a);
    }
  }

  /**
   * Magnet mode (gather phase): pull in every remaining collectible
   * animal regardless of distance, so the pool is complete before the
   * one-shot resolution.
   */
  function captureRemaining() {
    const active = mergePlan();
    for (let i = run.scene.animals.length - 1; i >= 0; i--) {
      const a = run.scene.animals[i];
      if (a.state === 'merging' || !collectible(a, active)) continue;
      capture(a);
    }
  }

  /** Toss one funnel animal back onto a free spot of the pen. */
  function eject(h) {
    const r = run;
    let p = r.scene.randomSpot(), tries = 0;
    while (tries++ < 12 && r.scene.animals.some(a => U.dist(a.x, a.y, p.x, p.y) < 40)) {
      p = r.scene.randomSpot();
    }
    const a = new Animal(h.species, h.stage, p.x, p.y);
    r.scene.animals.push(a);
    VFXManager.dust(p.x, p.y, 6);
    AudioManager.play('pop');
  }

  /**
   * Collection is complete: resolve the whole pool in one cascading pass.
   * Per species (never across species), from the lowest level up:
   * 2 x level N -> 1 x level N+1, newly created animals feeding straight
   * into the next level, until fewer than 2 remain at every level. Odd
   * leftovers survive unchanged. Max-level Mutant pairs become MUTANT 2s
   * only where the UFO is unlocked; otherwise Mutants pass through as-is.
   * The survivors replace the funnel contents for the eject phase.
   */
  function resolvePool() {
    const r = run;
    const top = CONFIG.STAGE_NAMES.length - 1;
    const landed = SaveManager.data.ufo[r.scene.farmId].landed;
    const pools = {};
    for (const h of r.held) {
      const c = pools[h.species] = pools[h.species] || [];
      c[h.stage] = (c[h.stage] || 0) + 1;
    }
    const survivors = [];
    let aliens = 0, ty = r.y - 70;
    for (const sp in pools) {
      const counts = pools[sp];
      for (let s = 0; s <= top; s++) {
        let c = counts[s] || 0;
        if (s < top) {
          const pairs = Math.floor(c / 2);
          if (pairs > 0) {
            counts[s + 1] = (counts[s + 1] || 0) + pairs;
            c -= pairs * 2;
            // discoveries still count (no celebration mid-storm)
            Discovery.mark(sp, s + 1);
            VFXManager.floatText(r.x, ty, pairs + 'X ' + CONFIG.STAGE_NAMES[s + 1] + '!');
            ty -= 14;
          }
        } else if (landed) {
          const pairs = Math.floor(c / 2);
          c -= pairs * 2;
          aliens += pairs;
        }
        // odd leftovers and unmergeable max-level animals survive as-is
        for (let i = 0; i < c; i++) survivors.push({ species: sp, stage: s });
      }
    }
    // one big satisfying blast as everything evolves at once
    AudioManager.play('merge');
    VFXManager.burst(r.x, r.y - 44, ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'], 26, 130);
    VFXManager.sparkle(r.x, r.y - 50, 16, 26);
    if (aliens > 0) {
      VFXManager.burst(r.x, r.y - 44, ['#7de87a', '#c4ffb8', '#a07cc0'], 14, 110);
      VFXManager.floatText(r.x, ty, aliens + 'X MUTANT 2!', '#c4ffb8');
      for (let i = 0; i < aliens; i++) UFO.collect(r.x + U.rand(-10, 10), r.y - 40);
    }
    // survivors keep spinning in the funnel until ejected one by one
    r.held = survivors.map(v => ({
      species: v.species, stage: v.stage,
      angle: U.rand(0, Math.PI * 2), r: U.rand(12, 22),
      h: U.rand(16, 40), maxH: U.rand(16, 48),
      spin: U.rand(0, 5), pull: 1, sx: r.x, sy: r.y,
    }));
  }

  /** Main tick while the tornado is on the farm (gameplay is paused). */
  function updateRun(dt) {
    const r = run, cfg = C();
    const speed = Math.max(0.2, cfg.TRAVEL_SPEED);
    clockT += dt;
    r.t += dt;

    // animals spiral around the funnel, rising as they get pulled in
    for (const h of r.held) {
      h.angle += dt * (7 + h.spin);
      if (h.pull < 1) h.pull = Math.min(1, h.pull + dt / 0.3);
      h.h = Math.min(h.maxH, h.h + dt * 40);
    }

    // constant dust, leaves and debris kicked up around the base
    r.dustT -= dt;
    if (r.dustT <= 0) {
      r.dustT = 0.07;
      VFXManager.dust(r.x + U.rand(-16, 16), r.y + U.rand(-2, 4), 2);
      if (Math.random() < 0.45) {
        VFXManager.burst(r.x + U.rand(-12, 12), r.y - U.rand(6, 56),
          ['#5e9c31', '#7dbb4a', '#c8b088', '#b09a72'], 2, 55);
      }
    }

    // untouched animals keep wandering and poops keep ripening while the
    // storm works (only spawning and player input are paused)
    for (let i = r.scene.animals.length - 1; i >= 0; i--) {
      const a = r.scene.animals[i];
      a.update(dt, r.scene.bounds, r.scene);
      if (a.dead) r.scene.animals.splice(i, 1);
    }
    r.scene.updatePoops(dt);

    if (r.phase === 'enter') {
      // roll in from the left edge
      const t = smooth(r.t / (0.7 / speed));
      r.x = U.lerp(-40, r.scene.bounds.x + 8, t);
      if (t >= 1) { r.phase = 'sweep'; r.t = 0; }
    } else if (r.phase === 'sweep') {
      // weave across the whole pen, collecting every animal that will
      // take part in the cascade — no merging yet, collection only
      const B = r.scene.bounds;
      const t = Math.min(r.t / (2.6 / speed), 1);
      r.x = U.lerp(B.x + 8, B.x + B.w - 8, t);
      r.y = B.y + B.h * 0.55 + Math.sin(t * Math.PI * 2.2) * B.h * 0.28;
      captureNear();
      if (t >= 1) { r.phase = 'gather'; r.t = 0; }
    } else if (r.phase === 'gather') {
      // drift to the pen center, magnet-pull any collectible stragglers,
      // then — with the pool complete — resolve every merge at once
      const B = r.scene.bounds;
      r.x = U.lerp(r.x, B.x + B.w / 2, Math.min(1, dt * 2.5));
      r.y = U.lerp(r.y, B.y + B.h * 0.5, Math.min(1, dt * 2.5));
      captureRemaining();
      if (r.t >= 0.5 / speed) {
        resolvePool();
        r.phase = 'eject'; r.t = 0; r.ejected = 0;
      }
    } else if (r.phase === 'eject') {
      // toss the evolved survivors back out, one animal at a time
      while (r.held.length && r.t >= r.ejected * C().MERGE_INTERVAL) {
        eject(r.held.shift());
        r.ejected++;
      }
      if (!r.held.length) {
        r.scene.persist();
        r.phase = 'exit'; r.t = 0; r.exitX = r.x;
        AudioManager.play('wind');
      }
    } else if (r.phase === 'exit') {
      // spin away past the right edge; normal gameplay resumes right after
      const t = r.t / (0.8 / speed);
      r.x = U.lerp(r.exitX, CONFIG.VIEW_W + 50, t * t);
      if (t >= 1) { run = null; }
    }
  }

  // ---------------- draw ----------------
  function drawIcon(ctx) {
    const t = icon.t;
    const bob = Math.sin(t * 3) * 1.5;
    // pulsing golden ring so the offer reads as tappable
    const pulse = (Math.sin(t * 5) + 1) / 2;
    ctx.save();
    ctx.globalAlpha = 0.35 + pulse * 0.3;
    ctx.strokeStyle = '#ffe98a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ICON.x, ICON.y - 16, 20 + pulse * 2, 0, 7); ctx.stroke();
    ctx.restore();
    const frame = Math.floor(clockT * 10) % 3;
    PIXEL.blit(ctx, SPRITES.tornado(frame), ICON.x, ICON.y + bob, 1.2);
    // golden "!" bubble, matching the pigeon offer style
    const by = ICON.y - 44 + Math.sin(t * 5) * 2;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.beginPath(); ctx.arc(ICON.x, by, 8, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.gold;
    ctx.beginPath(); ctx.arc(ICON.x, by, 6, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.goldHi;
    ctx.beginPath(); ctx.arc(ICON.x - 1, by - 1, 4, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.gold;
    ctx.beginPath(); ctx.arc(ICON.x, by + 1, 4, 0, 7); ctx.fill();
    UI.drawText(ctx, '!', ICON.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
    // remaining availability bar under the icon
    const frac = U.clamp(data().remaining / C().STAY_TIME, 0, 1);
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(ICON.x - 14, ICON.y + 5, 28, 5);
    ctx.fillStyle = '#3a2817';     ctx.fillRect(ICON.x - 13, ICON.y + 6, 26, 3);
    ctx.fillStyle = '#ffe98a';     ctx.fillRect(ICON.x - 13, ICON.y + 6, Math.round(26 * frac), 3);
  }

  function drawRun(ctx) {
    const r = run;
    // ground shadow
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath(); ctx.ellipse(r.x, r.y + 5, 26, 7, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;

    // orbit position of a held animal (pull-in lerps from its old spot)
    const pos = h => {
      const ox = r.x + Math.cos(h.angle) * h.r;
      const oy = r.y - h.h + Math.sin(h.angle) * h.r * 0.35;
      const e = smooth(h.pull);
      return { x: U.lerp(h.sx, ox, e), y: U.lerp(h.sy, oy, e) };
    };
    const back = r.held.filter(h => Math.sin(h.angle) < 0);
    const front = r.held.filter(h => Math.sin(h.angle) >= 0);
    const drawHeld = h => {
      const p = pos(h);
      const img = SPRITES.animal(h.species, h.stage, 'idle', false);
      PIXEL.blit(ctx, img, p.x, p.y, 1.25, Math.cos(h.angle) < 0);
    };
    // behind the funnel, then the funnel, then the front arc
    for (const h of back) drawHeld(h);
    const frame = Math.floor(clockT * 14) % 3;
    const wob = Math.sin(clockT * 9) * 2;
    PIXEL.blit(ctx, SPRITES.tornado(frame), r.x + wob, r.y + 6, 2.2, false, 1, 1 + Math.sin(clockT * 13) * 0.05);
    for (const h of front) drawHeld(h);
  }

  function draw(ctx) {
    if (icon && !run) drawIcon(ctx);
    if (run) drawRun(ctx);
  }

  /**
   * Animals currently held inside the funnel, as save-format entries.
   * FarmScene.persist appends this so an autosave / reload mid-tornado
   * can never lose the herd (they come back unmerged, nothing worse).
   */
  function heldSnapshot(farmId) {
    if (!run || run.scene.farmId !== farmId) return [];
    return run.held.map(h => ({ stage: h.stage }));
  }

  /** Clear transient animation state (farm switch / full reset). */
  function reset() { icon = null; run = null; }

  return {
    update, updateRun, draw, tap, adCompleted, info, heldSnapshot, reset,
    get active() { return !!run; },
  };
})();
</script>
<script>
/**
 * AnimalController — one instance per animal on the farm.
 * State machine: idle / walk / peck(graze) / drag / merging / spawning /
 * escape (walking off an unfenced farm, or jumping a full pen's fence —
 * see startEscape; an escaping animal is locked out of all interaction).
