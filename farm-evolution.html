<script>
/**
 * CONFIG — every tunable value in the game lives here.
 * No gameplay numbers should be hardcoded elsewhere.
 */
const CONFIG = {
  // Virtual resolution (portrait, mobile). Canvas scales to fit screen.
  VIEW_W: 360,
  VIEW_H: 640,
  PIXEL_SCALE: 2,          // native art pixels -> screen pixels multiplier baseline
  ANIMAL_VISUAL_SCALE: 1.7, // animals render ~15% smaller than props (visual only;
                            // hit/merge radii still use PIXEL_SCALE)

  // Spawning
  SPAWN_INTERVAL: 3.0,     // seconds between automatic baby spawns
  MAX_ANIMALS: 14,         // maximum simultaneous animals per farm
  SPAWN_POP_TIME: 0.35,

  // ---------------- Economy ----------------
  // Poop is the primary income source. Per-animal passive rate (coins/sec)
  // = coins-per-poop / (interval + jitter/2):
  //   BABY 2/5s = 0.4    ADULT 4/5s = 0.8    ELDER 10/5s = 2.0    MUTANT 24/3.6s = 6.7
  // Each merge tier roughly doubles per-poop value without going fully
  // exponential (x2, x2.5, x2.4), and the animal cap means every merge
  // frees a pen slot that a free spawn refills — so merging always grows
  // the idle rate, and the idle rate is never zero.
  INCOME_BY_STAGE: [2, 4, 10, 24],      // coins per poop for stage 1/2/3/4
  POOP_INTERVAL: 4.0,                   // default seconds between poops per animal
  POOP_INTERVAL_BY_STAGE: [4.0, 4.0, 4.0, 2.6],  // per-stage base poop interval (mutant poops fastest)
  POOP_INTERVAL_JITTER: 2.0,     // random extra seconds
  POOP_TO_COIN_DELAY: 1.4,       // poop sits, then transforms
  COIN_FLY_SPEED: 620,           // px/sec toward HUD
  // Per-farm upgrade system (see js/upgrades.js). All values data-driven.
  //
  // Pacing targets (farm 1 baseline; later farms scale via costMult):
  //   short-term  (30-90s): BABY level, SPAWN level, another merge
  //   medium-term (3-8min): ADULT/ELDER levels, first ELDER, first MUTANT
  //   long-term  (10-20m+): MUTANT levels, farm unlock, first alien
  // Each tier has its own cost growth (no single global curve): cheap tiers
  // grow slowest so there is always a small purchase within reach, while
  // rising income keeps time-to-next-upgrade roughly flat instead of
  // walling. Every level adds a visible +coinStep per poop.
  UPGRADES: {
    COST_GROWTH: 1.18,           // fallback cost multiplier per level
    FARM: {
      SPAWN: {
        label: 'SPAWN SPEED',
        baseCost: 100,
        costGrowth: 1.3,         // strong effect (more animals = more merges), few levels
        maxLevel: 10,            // levels until minInterval is reached
        intervalStep: 0.2,       // seconds removed from spawn interval per level
        minInterval: 1.0,        // spawn interval floor
      },
    },
    // One entry per evolution stage; each level improves poop speed AND coin value.
    STAGES: [
      { label: 'BABY',   baseCost: 30,   costGrowth: 1.16, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 1 },
      { label: 'ADULT',  baseCost: 120,  costGrowth: 1.17, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 2 },
      { label: 'ELDER',  baseCost: 500,  costGrowth: 1.18, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 4 },
      { label: 'MUTANT', baseCost: 2500, costGrowth: 1.20, maxLevel: 30, poopStep: 0.25, minPoop: 0.8, coinStep: 8 },
    ],
  },

  // Evolution stages (index 0-3). Stage count drives merging, sprites, save data.
  STAGE_NAMES: ['BABY', 'ADULT', 'ELDER', 'MUTANT'],

  // Discovery celebration (first time a species+stage is created)
  DISCOVERY: {
    ZOOM_TIME: 0.7,          // camera zoom-in duration (s)
    ZOOM_AMOUNT: 0.35,       // extra scale toward the merge point
    FLASH_TIME: 0.45,        // bright flash duration (s)
    PRE_POPUP_TIME: 2.4,     // total sequence length before popup opens (s)
    SPARKLE_RATE: 0.12,      // seconds between golden sparkle bursts
    // Flavor text per species per stage (shown on the celebration popup)
    FLAVOR: {
      chicken: [
        'A TINY PUFF OF FLUFF!',
        'CLUCKS WITH GREAT PRIDE!',
        'WISE AND SLIGHTLY WEIRD.',
        'SCIENCE WENT TOO FAR!',
      ],
      sheep: [
        'SOFT, SLEEPY AND SMALL.',
        'WOOL FOR DAYS!',
        'ANCIENT FLUFF WISDOM.',
        'THE WOOL HAS AWAKENED!',
      ],
      cow: [
        'SMALL MOO, BIG DREAMS.',
        'PRODUCES PREMIUM MOO.',
        'HORNS OF THE ANCIENTS.',
        'UDDERLY MUTATED!',
      ],
    },
  },

  // UFO Mutant 2 collection layer (end-game, see js/ufo.js).
  // Mutant + Mutant merges feed MUTANT 2s (each farm's final, fully
  // mutated animal form) to a permanently parked UFO. Internal ALIEN key
  // names are kept for save compatibility.
  UFO: {
    INCOME_PER_ALIEN: 25,      // coins per production drop, per collected Mutant 2
    INTERVAL: 5.0,             // seconds between automatic UFO coin drops
    QUICK_COLLECT_TIME: 0.7,   // fast tractor-beam collection after landing (s)
    CINEMATIC: {               // first-abduction cinematic phase durations (s)
      SPAWN: 0.9,              // Mutant 2 materializes at the merge point
      ARRIVE: 1.5,             // UFO flies in from the sky
      BEAM: 1.5,               // tractor beam pulls the Mutant 2 up
      FLY: 1.6,                // UFO travels to its landing corner
      LAND: 0.7,               // touchdown settle
    },
  },

  // Pigeon reward-ad event (see js/pigeon.js). Every value here is a
  // Remote Config default: override at runtime via
  // window.RemoteConfig = { PIGEON: { SPAWN_INTERVAL: 30, ... } }.
  // Reward = REWARD_MINUTES of the farm's CURRENT passive income, split
  // across the rain — the ad scales with the player's economy forever
  // (meaningful acceleration, never mandatory, never game-breaking).
  PIGEON: {
    ENABLED: true,         // reward ad offer on/off (kill switch)
    SPAWN_INTERVAL: 75,    // seconds between pigeon visits (offers stay occasional)
    STAY_TIME: 120,        // seconds the pigeon waits on the fence
    FLY_TIME: 2.6,         // fly-across-and-land duration (s)
    LEAVE_TIME: 1.6,       // fly-away duration when ignored (s)
    POOP_COUNT: 10,        // poops per Poop Rain
    COIN_PER_POOP: 0,      // 0 = auto: income-based (see REWARD_MINUTES); >0 = fixed override
    REWARD_MINUTES: 4,     // rain total = this many minutes of current passive income
    MIN_PER_POOP: 5,       // reward floor per poop (fresh-farm early game)
    RAIN_DURATION: 3.5,    // seconds over which the poops spawn
    REWARD_COOLDOWN: 0,    // extra seconds before the next visit after a claim
    AD_DURATION: 3.0,      // simulated reward-ad length (s)
  },

  // Tornado Auto Merge reward-ad event (see js/tornado.js). Every value
  // here is a Remote Config default: override at runtime via
  // window.RemoteConfig = { TORNADO: { SPAWN_INTERVAL: 30, ... } }.
  // The offer waits for a moment where it saves real work: it only appears
  // once the countdown has elapsed AND the pen is crowded with several
  // merges pending ("here's a boost if you want it", never a nag).
  TORNADO: {
    ENABLED: true,         // reward ad offer on/off (kill switch)
    SPAWN_INTERVAL: 150,   // seconds between tornado offers (minimum)
    STAY_TIME: 60,         // seconds the icon stays available once it appears
    MIN_ANIMALS: 8,        // pen crowding required before the offer appears
    MIN_PAIRS: 2,          // pending merge pairs required before the offer appears
    TRAVEL_SPEED: 1.0,     // tornado animation speed multiplier
    MERGE_INTERVAL: 0.12,  // seconds between survivors tossed back out after the merge blast
    REWARD_COOLDOWN: 0,    // extra seconds before the next offer after a claim
    AD_DURATION: 3.0,      // simulated reward-ad length (s)
  },

  // Background / offline production (see js/idle.js). Every unlocked farm
  // keeps spawning animals and earning coins while the player is elsewhere
  // (another farm, the map, or with the game closed).
  IDLE: {
    OFFLINE_CAP_HOURS: 2,    // max hours of production applied after being away
    TICK_INTERVAL: 5,        // seconds between background reconcile ticks
    MAP_STAGGER: 0.5,        // seconds between each farm's coin-collect burst on the map
    COINS_PER_COLLECT: 5,    // max flying coins used to deliver one pending balance
    // offline spawning stops at this fraction of MAX_ANIMALS (default; each
    // farm can override via its offlinePenFill) so the board comes back
    // playable, never merged-locked at the 100% active-play cap
    OFFLINE_PEN_FILL: 0.65,
    // welcome-back popup: summarizes offline earnings on launch with an
    // optional rewarded-ad 2x. Only shown after a real absence so quick
    // app switches don't trigger it.
    WELCOME_MIN_AWAY: 60,      // seconds away required before the popup shows
    WELCOME_AD_DURATION: 3.0,  // simulated reward-ad length (s)
  },

  // Farm unlock costs — the long-term goals. Tuned to ~15-25 min of the
  // previous farm's mature income (goal windows stretch as the player
  // progresses, but never wall).
  UNLOCK_COSTS: [0, 12000, 120000],

  // ---------------- Farm construction ----------------
  // Step-by-step build progression, keyed by farm id (see js/construction.js).
  // The system is fully data-driven: adding a farm to this map is all it takes
  // to put that farm on the staged build flow — every consumer (scene, map,
  // build panel, idle, escapes) reads its numbers, art tier and copy from
  // here. Farms without an entry keep the classic one-shot unlock, untouched.
  //   1. LAND_COST buys the plot on the map (replaces UNLOCK_COSTS for this
  //      farm) — the scene opens but the plot is bare and produces nothing.
  //   2. HOUSE_COST builds the farmhouse: this is what starts animal
  //      spawning. Without the house there are no animals at all.
  //   3. FENCE_LEVELS[0] builds the pen. Until it exists, spawned animals
  //      wander off the plot and are lost (see the ESCAPE_* values below),
  //      and the farm is excluded from background/offline production —
  //      the idle clock is stamped the moment the fence completes.
  //      Both ways of losing an animal (that walk-off and FENCE_JUMP) are
  //      exclusive to farms listed here: on every other farm animals stay
  //      contained and spawning simply stops at the capacity limit.
  //   4. Later levels upgrade the fence: a higher hard animal cap, a
  //      physically bigger pen footprint and an art tier per level. `art`
  //      indexes into the farm's FENCE_THEME palette set (see
  //      ENVIRONMENT.FENCE_THEMES) so each farm's fence follows its own
  //      visual identity instead of sharing one wood look.
  // On every construction farm, land + house + first fence together add up to
  // that farm's old UNLOCK_COSTS lump sum, so reaching an operational farm
  // costs exactly what it did before; the fence upgrades are new, optional
  // capacity growth beyond that. Every farm's final tier caps at
  // MAX_ANIMALS — the pen is a fixed physical size, so the top tier is the
  // point where a constructed farm plays exactly like a classic one, and
  // later farms scale up by *starting* more generous rather than by ending
  // higher. All values are balance-tunable.
  CONSTRUCTION: {
    1: {
      LAND_COST: 4000,
      HOUSE_COST: 3000,
      FENCE_THEME: 'wood',    // pasture wood: rough -> planked -> painted white
      FENCE_LEVELS: [
        { cost: 5000,  capacity: 6,  size: 0.62, art: 0 },
        { cost: 14000, capacity: 10, size: 0.82, art: 1 },
        { cost: 40000, capacity: 14, size: 1.00, art: 2 },
      ],
      // House built, no fence: animals still spawn (up to this cap) but each
      // one walks off the plot when its own escape timer runs out. The timer
      // starts at spawn and is staggered by +/- ESCAPE_VARIANCE seconds so
      // they never leave all at once. Shared leaving animation values (the
      // tell, walk speed, fade) live in CONFIG.ESCAPE.
      UNFENCED_CAPACITY: 5,
      ESCAPE_TIME: 14,        // seconds on the board before an animal leaves
      ESCAPE_VARIANCE: 5,     // +/- random seconds on that timer

      // Fence jumping — the constructed farm's second way of losing an
      // animal. Once the pen is fenced and full, spawn pressure keeps
      // building until an older animal hops the fence and is lost, so the
      // board makes room instead of hard-blocking spawns. Tier 1 (babies)
      // never jump — only MIN_STAGE and above, and the cheapest eligible
      // tier goes first, so a full pen costs the player its most redundant
      // animal, never its best.
      FENCE_JUMP: {
        ENABLED: true,
        MIN_STAGE: 1,          // stage index: 1 = tier 2 (ADULT) and above
        PRESSURE_TIME: 8,      // seconds of blocked spawns before one jumps
        VARIANCE: 3,           // +/- random seconds on that pressure timer
        COOLDOWN: 18,          // minimum seconds between jumps on this farm
        HOP_TIME: 0.95,        // arc over the fence (s)
        HOP_HEIGHT: 40,        // peak of the arc above the ground line (px)
      },
    },

    // Farm 3 (cows) — same build sequence as Farm 2, scaled to its slot in
    // the progression. Costs are 10x Farm 2's throughout, matching the 10x
    // step between the two farms' old lump-sum unlocks (12000 -> 120000), so
    // land + house + first fence still total exactly UNLOCK_COSTS[2].
    // Production scales on top of that through FARMS[2].incomeMult (12 vs
    // Farm 2's 4), so a built Farm 3 out-earns Farm 2 without needing any
    // per-farm income values here.
    2: {
      LAND_COST: 40000,
      HOUSE_COST: 30000,
      FENCE_THEME: 'ranch',   // cattle ranch: weathered rails -> barn-red timber -> iron-reinforced
      // Capacities start higher than Farm 2's (8/11 vs 6/10) and still land
      // on MAX_ANIMALS at the top tier — the pen footprint is the same
      // physical rect on every farm, so the ceiling is shared and the
      // scaling shows up as a roomier farm from the very first fence.
      FENCE_LEVELS: [
        { cost: 50000,  capacity: 8,  size: 0.70, art: 0 },
        { cost: 140000, capacity: 11, size: 0.86, art: 1 },
        { cost: 400000, capacity: 14, size: 1.00, art: 2 },
      ],
      // Cows are slower and heavier than sheep: a bigger unfenced herd, a
      // touch longer on the board before wandering off, and a lower, slower
      // hop when one does clear the fence.
      UNFENCED_CAPACITY: 7,
      ESCAPE_TIME: 16,
      ESCAPE_VARIANCE: 5,
      FENCE_JUMP: {
        ENABLED: true,
        MIN_STAGE: 1,          // stage index: 1 = tier 2 (ADULT) and above
        PRESSURE_TIME: 9,
        VARIANCE: 3,
        COOLDOWN: 20,
        HOP_TIME: 1.05,
        HOP_HEIGHT: 34,
      },
    },
  },

  // ---------------- Leaving the farm ----------------
  // Animation values shared by both ways an animal leaves for good (see
  // js/animal.js 'escape'): the unfenced walk-off and the fence jump. Both
  // belong to the construction farms above — a farm without a CONSTRUCTION
  // entry never escapes, so nothing here is ever reached from Farm 1.
  // An animal that has started leaving is locked out of interaction — it
  // can't be picked up or matched — so the sequence opens with a readable
  // tell (startled hop + "!" + a brief opacity blink) before it sets off.
  ESCAPE: {
    TELL_MIN: 0.55,        // shortest startled beat before setting off (s)
    TELL_MAX: 1.20,        // longest
    TELL_HOPS: 2,          // startled hops during the tell
    TELL_HOP_H: 7,         // startled hop height (px)
    SPEED: 22,             // px/sec while walking out (normal walk anim)
    FADE: 0.8,             // seconds to fade out past the boundary
  },

  // Animal behaviour
  WALK_SPEED_MIN: 14,
  WALK_SPEED_MAX: 26,
  IDLE_TIME_MIN: 1.2,
  IDLE_TIME_MAX: 3.4,
  WALK_TIME_MIN: 0.8,
  WALK_TIME_MAX: 2.4,
  PECK_CHANCE: 0.45,       // chance an idle becomes a peck/graze
  BLINK_INTERVAL_MIN: 2.0,
  BLINK_INTERVAL_MAX: 5.0,

  // Merge
  MERGE_RADIUS: 26,        // px distance to count as a merge drop
  MERGE_ANIM_TIME: 0.45,

  // First-time tutorial (per farm): two pre-placed babies + drag hint
  TUTORIAL: {
    GAP: 70,               // px between the two starting babies
    HAND_CYCLE: 1.8,       // seconds per drag-hint loop
  },

  // Animation durations
  UNLOCK_PATH_TIME: 2.2,
  UNLOCK_CAMERA_PAUSE: 0.8,
  COIN_COUNT_LERP: 8,      // HUD money counter easing speed

  // Audio
  MUSIC_VOLUME: 0.35,
  SFX_VOLUME: 0.8,

  // Save
  SAVE_KEY: 'farm-evolution-save-v1',
  AUTOSAVE_INTERVAL: 10,   // seconds

  // Farms. Dynamic balance: each farm scales the whole economy up —
  // incomeMult multiplies every coin payout (poops, aliens) and costMult
  // multiplies every upgrade cost, so the curve keeps its early-game shape
  // while numbers, goals and ad rewards grow with the player.
  // offlinePenFill: fraction of MAX_ANIMALS that offline spawning may fill
  // (per-farm balance knob; falls back to IDLE.OFFLINE_PEN_FILL if omitted).
  FARMS: [
    { id: 0, name: 'FARM 1', species: 'chicken', label: 'CHICKENS', incomeMult: 1,  costMult: 1,  offlinePenFill: 0.65 },
    { id: 1, name: 'FARM 2', species: 'sheep',   label: 'SHEEP',    incomeMult: 4,  costMult: 4,  offlinePenFill: 0.65 },
    { id: 2, name: 'FARM 3', species: 'cow',     label: 'COWS',     incomeMult: 12, costMult: 12, offlinePenFill: 0.65 },
  ],
};

<script>
/** Small shared helpers. */
const U = {
  rand(a, b) { return a + Math.random() * (b - a); },
  randInt(a, b) { return Math.floor(U.rand(a, b + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); },
  // Smooth ease helpers for juicy animation
  easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); },
  easeInCubic(t) { return t * t * t; },
  easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
  // Format 12450 -> "12,450"
  fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); },
  // Compact 250000 -> "250,000" (kept full per reference HUD style)
  fmtCost(n) { return U.fmt(n); },
  // Format seconds -> "1H 47M" / "12M" / "45S"
  fmtDur(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    if (h > 0) return h + 'H ' + m + 'M';
    if (m > 0) return m + 'M';
    return sec + 'S';
  },
};

/** Simple object pool to avoid per-frame allocations. */
class Pool {
  constructor(factory, reset) {
    this.factory = factory;
    this.reset = reset;
    this.items = [];
  }
  get() {
    const it = this.items.pop() || this.factory();
    this.reset(it);
    return it;
  }
  release(it) { this.items.push(it); }
}
</script>
<script>
/**
 * PIXEL — tiny pixel-art authoring engine.
 * Sprites are drawn once at native resolution onto offscreen canvases,
 * auto-outlined in the reference sheet's dark warm-brown line color,
 * cached, and blitted scaled-up with crisp rendering.
 */
const PIXEL = (() => {
  const OUTLINE = '#2a1c12';       // warm dark outline used across the whole art bible
  const cache = new Map();

  /** A tiny drawing surface with pixel-level ops. */
  class Surface {
    constructor(w, h) {
      this.w = w; this.h = h;
      this.c = document.createElement('canvas');
      this.c.width = w; this.c.height = h;
      this.g = this.c.getContext('2d');
      this.g.imageSmoothingEnabled = false;
    }
    px(x, y, col) { this.g.fillStyle = col; this.g.fillRect(x | 0, y | 0, 1, 1); }
    rect(x, y, w, h, col) { this.g.fillStyle = col; this.g.fillRect(x | 0, y | 0, w, h); }
    /** Filled pixel ellipse (cx,cy center; rx,ry radii). */
    ellipse(cx, cy, rx, ry, col) {
      this.g.fillStyle = col;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / (rx + 0.5), dy = (y + 0.5 - cy) / (ry + 0.5);
          if (dx * dx + dy * dy <= 1) this.g.fillRect(x, y, 1, 1);
        }
      }
    }
    /** Ellipse ring segment used for shading crescents. */
    shadeEllipse(cx, cy, rx, ry, col, side = 1, thickness = 0.35) {
      this.g.fillStyle = col;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / (rx + 0.5), dy = (y + 0.5 - cy) / (ry + 0.5);
          const d = dx * dx + dy * dy;
          if (d <= 1 && d >= 1 - thickness && (side > 0 ? (dx + dy) > 0.15 : (dx + dy) < -0.15)) {
            this.g.fillRect(x, y, 1, 1);
          }
        }
      }
    }
    line(x1, y1, x2, y2, col) {
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) || 1;
      for (let i = 0; i <= steps; i++) {
        this.px(Math.round(U.lerp(x1, x2, i / steps)), Math.round(U.lerp(y1, y2, i / steps)), col);
      }
    }
    /** Auto-trace: adds a 1px outline around every opaque region. */
    outline(col = OUTLINE) {
      const img = this.g.getImageData(0, 0, this.w, this.h);
      const d = img.data;
      const solid = (x, y) => x >= 0 && y >= 0 && x < this.w && y < this.h && d[(y * this.w + x) * 4 + 3] > 40;
      const out = [];
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          if (!solid(x, y) && (solid(x + 1, y) || solid(x - 1, y) || solid(x, y + 1) || solid(x, y - 1))) {
            out.push([x, y]);
          }
        }
      }
      for (const [x, y] of out) this.px(x, y, col);
    }
  }

  /** Build (or fetch cached) sprite. key must be unique per variant. */
  function sprite(key, w, h, drawFn) {
    if (cache.has(key)) return cache.get(key);
    const s = new Surface(w, h);
    drawFn(s);
    cache.set(key, s.c);
    return s.c;
  }

  /** Blit a cached sprite scaled, centered on (x, y-bottom anchored). */
  function blit(ctx, img, x, y, scale = CONFIG.PIXEL_SCALE, flipX = false, squashY = 1, squashX = 1) {
    const w = img.width * scale * squashX, h = img.height * scale * squashY;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flipX) ctx.scale(-1, 1);
    ctx.drawImage(img, Math.round(-w / 2), Math.round(-h), Math.round(w), Math.round(h));
    ctx.restore();
  }

  return { Surface, sprite, blit, OUTLINE, cache };
})();

<script>
/**
 * PixelFont — the game's global text engine, rendering the embedded
 * "Press Start 2P" typeface (assets/fonts/PressStart2P-Regular.ttf), the
 * exact font used by the Figma designs (single source of truth).
 *
 * Font metrics (parsed from the TTF): unitsPerEm 1000, ascent 1000,
 * descent 0 — the baseline sits exactly 1em below the glyph-box top, and
 * the font is strictly monospaced with advance = 1em. This makes layout
 * fully deterministic: measure(text, size) = text.length * size, and
 * draw(x, y, size) places the glyph em-box top at y (baseline at y + size),
 * mirroring how Figma positions text nodes.
 *
 * - Sizes are in canvas px and may be fractional (Figma px / 2), snapped
 *   to 0.5 so they land on whole device pixels at the 2x render scale.
 * - SIZE tiers define the visual hierarchy: TITLE > SUBTITLE > BUTTON/BODY > CAPTION.
 * - fit / truncate / wrap keep text inside fixed-width containers: fitting
 *   first steps the size down, then falls back to an '…' ellipsis.
 */
const PixelFont = (() => {
  const FAMILY = 'Press Start 2P';

  // Typography scale (canvas px = Figma px / 2, from the Figma file).
  const SIZE = {
    TITLE: 17,      // screen titles (loading, discovery, reward ad) — Figma 34px
    SUBTITLE: 15,   // popup / panel titles
    BUTTON: 10,     // interactive button labels — Figma 20px
    BODY: 10,       // primary inline text (names, values, counters)
    CAPTION: 7.5,   // secondary text (stat lines, flavor, hints) — Figma 15px
  };

  // ---------------- font loading ----------------
  let loaded = false;
  const ready = (typeof FontFace !== 'undefined' && typeof document !== 'undefined')
    ? new FontFace(FAMILY, "url('assets/fonts/PressStart2P-Regular.ttf')")
        .load()
        .then(face => { document.fonts.add(face); loaded = true; })
        .catch(() => { loaded = true; })
    : Promise.resolve();

  // ---------------- sizing ----------------
  /** Snap any requested size to the 0.5px grid (whole device pixels at 2x). */
  function snap(size) {
    return Math.max(2, Math.round(size * 2) / 2);
  }

  /** Pixel width of text at this size (monospace: advance = 1em). */
  function measure(text, size) {
    return String(text).length * snap(size);
  }

  /** Line advance for stacked lines of this size. */
  function lineHeight(size) { return Math.round(snap(size) * 1.4); }

  /**
   * Largest 0.5-snapped size <= `size` whose text fits in maxWidth
   * (never below 5px — beyond that, truncate instead).
   */
  function fit(text, size, maxWidth) {
    const n = String(text).length || 1;
    const px = Math.min(snap(size), Math.floor((maxWidth / n) * 2) / 2);
    return Math.max(5, px);
  }

  /** Truncate with an '…' ellipsis so text fits in maxWidth at this size. */
  function truncate(text, size, maxWidth) {
    let t = String(text);
    if (measure(t, size) <= maxWidth) return t;
    while (t.length > 1 && measure(t + '…', size) > maxWidth) t = t.slice(0, -1);
    return t.trimEnd() + '…';
  }

  /** Word-wrap text into lines that each fit maxWidth at this size. */
  function wrap(text, size, maxWidth) {
    const words = String(text).split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const cand = line ? line + ' ' + word : word;
      if (line && measure(cand, size) > maxWidth) {
        lines.push(line);
        line = word;
      } else {
        line = cand;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------------- rendering ----------------
  function setFont(ctx, px) {
    ctx.font = px + 'px "' + FAMILY + '"';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  /**
   * Draw one line of text. (x, y) is the glyph em-box top-left (baseline is
   * at y + size, matching Figma's text node top + half-leading).
   * align: 'left' | 'center' | 'right'; outline adds a dark border,
   * shadow a soft drop. maxWidth (optional) is the container safety net:
   * the size steps down to fit, then the text is ellipsis-truncated.
   * Returns the rendered width.
   */
  function draw(ctx, text, x, y, size = SIZE.BODY, col = '#fff', align = 'left',
                outline = false, shadow = false, maxWidth = 0) {
    let t = String(text).toUpperCase();
    let px = snap(size);
    if (maxWidth > 0) {
      px = fit(t, px, maxWidth);
      if (measure(t, px) > maxWidth) t = truncate(t, px, maxWidth);
    }
    const w = measure(t, px);
    let dx = x;
    if (align === 'center') dx = x - w / 2;
    if (align === 'right') dx = x - w;
    dx = Math.round(dx * 2) / 2;
    const by = Math.round((y + px) * 2) / 2;   // baseline
    setFont(ctx, px);
    if (outline) {
      const o = Math.max(1, Math.round(px / 8));
      ctx.fillStyle = PIXEL.OUTLINE;
      for (const [ox, oy] of [[-o, 0], [o, 0], [0, -o], [0, o], [-o, -o], [o, -o], [-o, o], [o, o]]) {
        ctx.fillText(t, dx + ox, by + oy);
      }
    } else if (shadow) {
      const o = Math.max(1, Math.round(px / 8));
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(t, dx + o, by + o);
    }
    ctx.fillStyle = col;
    ctx.fillText(t, dx, by);
    return w;
  }

  /**
   * Draw auto-wrapped text (up to maxLines, last line ellipsis-truncated).
   * Returns the y just below the last rendered line.
   */
  function drawWrapped(ctx, text, x, y, size, col, align, maxWidth, maxLines = 2,
                       outline = false, shadow = false) {
    const px = snap(size);
    let lines = wrap(text, px, maxWidth);
    if (lines.length > maxLines) {
      const rest = lines.slice(maxLines - 1).join(' ');
      lines = lines.slice(0, maxLines - 1);
      lines.push(truncate(rest, px, maxWidth));
    }
    const lh = lineHeight(px);
    for (let i = 0; i < lines.length; i++) {
      draw(ctx, lines[i], x, y + i * lh, px, col, align, outline, shadow);
    }
    return y + lines.length * lh;
  }

  return { FAMILY, SIZE, ready, snap, measure, lineHeight, fit, truncate, wrap, draw, drawWrapped,
           get loaded() { return loaded; } };
})();
</script>
<script>

    comb: '#d8443a', combShade: '#a52f28', beak: '#e8933c', beakShade: '#b96a24',

    woolLight: '#f2e9d6', woolMid: '#dfd2b4', woolShade: '#bfae8c',

    purple: '#7e5a9e', purpleHi: '#a07cc0', purpleDk: '#5c3f78',
    // mutant (stage 4) accents
    glow: '#7de87a', glowHi: '#c4ffb8', glowDk: '#3f9c48',
    tentacle: '#9a6ec0', tentacleHi: '#c09ae0', tentacleDk: '#6a4a90',
    // Mutant 2 abductee skins (final abducted form ONLY — see mutant2();
    // every earlier stage keeps the normal farm palette above)
    alienChick: '#8be07e', alienChickShade: '#4f9c58', alienChickHi: '#d6ffc4',
    alienBeak: '#c25ad8', alienBeakShade: '#8a3aa0',
    alienLeg: '#57945e',
    alienWoolLight: '#cfa9ee', alienWoolMid: '#a87ed2', alienWoolShade: '#7c55a6',

    alienCow: '#b2e9dd', alienCowShade: '#7cbcab', alienHoof: '#4d8878',

    leaf: '#5a8f3c', leafHi: '#7fb35a', leafDk: '#3d6b28',
    leafDark: '#42702e', leafDarkHi: '#5c8f42', leafDarkDk: '#2e5220',

    gold: '#f4c437', goldHi: '#ffe98a', goldDk: '#c88f1e', goldDkr: '#96660f',
    poo: '#7a5230', pooHi: '#96694a', pooDk: '#57381e',
    hay: '#e0b656', hayHi: '#f2d284', hayDk: '#b08a35',

  // ============================================================
  //  ANIMALS
  // ============================================================

  /** Eye helper: white + pupil (+ optional blink). */
  function eye(s, x, y, blink) {
    if (blink) { s.rect(x, y + 1, 2, 1, P.pupil); return; }
    s.rect(x, y, 2, 2, P.eyeWhite);
    s.px(x + 1, y + 1, P.pupil);
    s.px(x + 1, y, P.pupil);
  }
  function smallEye(s, x, y, blink) {
    if (blink) { s.px(x, y, P.pupil); return; }
    s.px(x, y, P.eyeWhite); s.px(x + 1, y, P.pupil);
  }
  /** Mutant glowing eye: toxic-green iris with bright core. */
  function glowEye(s, x, y, blink) {
    if (blink) { s.rect(x, y + 1, 2, 1, P.glowDk); return; }
    s.rect(x, y, 2, 2, P.glow);
    s.px(x + 1, y, P.glowHi);
    s.px(x, y + 1, P.glowDk);

  function smallGlowEye(s, x, y, blink) {

  // ----------------- CHICKEN -----------------

    } else if (stage === 1) {
      // ADULT HEN 24x22 — white body, red comb, tail feathers
      const hy = peck ? 3 : 0;
      s.line(9, 18, 9, 21, P.leg); s.line(14 + (walk ? 1 : 0), 18, 14 + (walk ? 1 : 0), 21, P.leg);
      s.px(8, 21, P.leg); s.px(10, 21, P.leg); s.px(13 + (walk ? 1 : 0), 21, P.leg); s.px(15 + (walk ? 1 : 0), 21, P.leg);
      // tail
      s.ellipse(4, 8, 3, 4, P.henShade);
      s.ellipse(4, 6, 2, 2.5, P.henBody);
      // body
      s.ellipse(11, 13, 7, 6, P.henBody);
      s.shadeEllipse(11, 13, 7, 6, P.henShade, 1, 0.38);
      // head
      s.ellipse(17, 6 + hy, 4, 4, P.henBody);
      s.ellipse(15.5, 4.5 + hy, 1.8, 1.5, P.henLight);
      s.rect(14, 8 + hy, 5, 5, P.henBody); // neck join
      // wing
      s.ellipse(10, 14, 4, 3, P.henShade);
      s.ellipse(10, 13, 3, 2, P.henBody);
      // comb
      s.px(16, 1 + hy, P.comb); s.px(17, 0 + hy, P.comb); s.px(18, 1 + hy, P.comb);
      s.rect(16, 2 + hy, 3, 1, P.comb); s.px(17, 2 + hy, P.combShade);
      // beak + wattle
      s.rect(21, 6 + hy, 2, 1, P.beak); s.px(21, 7 + hy, P.beakShade);
      s.px(20, 8 + hy, P.comb); s.px(20, 9 + hy, P.combShade);
      eye(s, 18, 4 + hy, blink);
    } else if (stage === 2) {
      // ELDER 30x28 — plump, purple crest, THREE eyes, twin wattles
      const hy = peck ? 3 : 0;
      s.line(12, 23, 12, 27, P.leg); s.line(18 + (walk ? 1 : 0), 23, 18 + (walk ? 1 : 0), 27, P.leg);

      s.ellipse(5, 12, 4, 5, P.henShade);

      s.ellipse(14, 17, 9, 8, P.henBody);
      s.shadeEllipse(14, 17, 9, 8, P.henShade, 1, 0.36);
      // head (big)
      s.ellipse(21, 8 + hy, 6, 6, P.henBody);
      s.ellipse(18.5, 5.5 + hy, 2.5, 2, P.henLight);
      s.rect(17, 12 + hy, 8, 5, P.henBody);
      // wing
      s.ellipse(12, 18, 5, 4, P.henShade);
      s.ellipse(12, 17, 4, 3, P.henBody);
      // purple mutant crest
      s.px(18, 1 + hy, P.purple); s.px(20, 0 + hy, P.purple); s.px(22, 1 + hy, P.purple);

      s.px(19, 2 + hy, P.purpleHi); s.px(21, 2 + hy, P.purpleHi);

      s.rect(26, 8 + hy, 3, 2, P.beak); s.rect(26, 10 + hy, 2, 1, P.beakShade);

      s.px(26, 12 + hy, P.comb); s.px(26, 13 + hy, P.combShade);
      // THREE eyes
      eye(s, 22, 6 + hy, blink);
      eye(s, 18, 6 + hy, blink);
      smallEye(s, 21, 10 + hy, blink);
    } else {
      // MUTANT 36x34 — TWO heads, THREE legs, glowing eyes, tentacle tail
      const hy = peck ? 3 : 0;
      // three legs
      s.line(12, 29, 12, 33, P.leg); s.line(18 + (walk ? 1 : 0), 29, 18 + (walk ? 1 : 0), 33, P.leg);
      s.line(24, 29, 24, 33, P.leg);
      s.rect(11, 33, 3, 1, P.leg); s.rect(17 + (walk ? 1 : 0), 33, 3, 1, P.leg); s.rect(23, 33, 3, 1, P.leg);
      // tentacle tail — three curling purple stalks
      s.line(7, 20, 4, 14, P.tentacle); s.line(4, 14, 5, 10, P.tentacle);

      s.line(8, 18, 3, 17, P.tentacle); s.px(2, 16, P.tentacleHi);
      s.line(8, 22, 4, 22, P.tentacleDk); s.px(3, 21, P.tentacle);

      s.ellipse(22.5, 6 + hy, 2.5, 2, P.henLight);
      s.rect(20, 13 + hy, 9, 6, P.henBody);
      // tall purple crest
      s.px(22, 1 + hy, P.purple); s.px(24, 0 + hy, P.purple); s.px(26, 1 + hy, P.purple); s.px(28, 2 + hy, P.purple);
      s.rect(22, 2 + hy, 7, 2, P.purple);
      s.px(23, 2 + hy, P.purpleHi); s.px(25, 2 + hy, P.purpleHi); s.px(27, 3 + hy, P.purpleHi);
      s.rect(23, 4 + hy, 5, 1, P.purpleDk);
      // big beak + twin wattles
      s.rect(31, 9 + hy, 3, 2, P.beak); s.rect(31, 11 + hy, 2, 1, P.beakShade);
      s.px(29, 13 + hy, P.comb); s.px(29, 14 + hy, P.combShade);
      s.px(31, 13 + hy, P.comb); s.px(31, 14 + hy, P.combShade);

    }
  }

  // ----------------- SHEEP -----------------
  /** Wool cloud made of overlapping bumps. */
  function woolCloud(s, cx, cy, rx, ry, light, mid, shade) {
    s.ellipse(cx, cy, rx, ry, mid);
    const bumps = 7;
    for (let i = 0; i < bumps; i++) {
      const a = (i / bumps) * Math.PI * 2;
      s.ellipse(cx + Math.cos(a) * rx * 0.8, cy + Math.sin(a) * ry * 0.8, rx * 0.32, ry * 0.34, mid);
    }
    s.shadeEllipse(cx, cy + 1, rx + 1, ry + 1, shade, 1, 0.32);
    s.ellipse(cx - rx * 0.35, cy - ry * 0.4, rx * 0.4, ry * 0.35, light);
  }

  function drawSheep(s, stage, frame, blink) {
    const walk = frame === 'walk', graze = frame === 'peck';
    if (stage === 0) {
      // BABY 18x16 — dark little lamb with pale wool cap
      const hy = graze ? 2 : 0;

      // pale head
      s.ellipse(13, 7 + hy, 3.5, 3.5, P.woolMid);
      s.ellipse(12, 5.5 + hy, 1.5, 1.3, P.woolLight);
      // ears
      s.rect(10, 6 + hy, 2, 1, P.woolShade); s.px(15, 9 + hy, P.woolShade);
      eye(s, 13, 6 + hy, blink);
      s.px(15, 9 + hy, P.pupil); // nose
    } else if (stage === 1) {
      // ADULT 24x20 — cream wool cloud, dark face
      const hy = graze ? 3 : 0;
      s.line(8, 16, 8, 19, P.sheepFace); s.line(15 + (walk ? 1 : 0), 16, 15 + (walk ? 1 : 0), 19, P.sheepFace);
      woolCloud(s, 11, 10, 7.5, 6, P.woolLight, P.woolMid, P.woolShade);
      // dark face
      s.ellipse(19, 8 + hy, 4, 4, P.sheepFace);
      s.ellipse(18, 6.5 + hy, 1.6, 1.4, P.sheepFaceHi);
      // wool tuft on head
      s.ellipse(17, 4 + hy, 2.5, 1.8, P.woolLight);
      // ears
      s.rect(15, 7 + hy, 2, 2, P.sheepFaceHi);
      eye(s, 19, 7 + hy, blink);
      s.px(22, 10 + hy, P.pupil);
    } else if (stage === 2) {
      // ELDER 30x26 — mega fluff, purple curly horns, extra eyes
      const hy = graze ? 3 : 0;
      s.line(10, 21, 10, 25, P.sheepFace); s.line(19 + (walk ? 1 : 0), 21, 19 + (walk ? 1 : 0), 25, P.sheepFace);
      woolCloud(s, 14, 13, 10, 8.5, P.woolLight, P.woolMid, P.woolShade);
      // face
      s.ellipse(23, 10 + hy, 5, 5, P.sheepFace);
      s.ellipse(21.5, 8 + hy, 2, 1.8, P.sheepFaceHi);
      // wool crown
      s.ellipse(21, 4.5 + hy, 3.5, 2.4, P.woolLight);
      // purple curly horns
      s.ellipse(17, 5 + hy, 2.2, 2.2, P.purple);

  // ----------------- COW -----------------
  function cowPatches(s, spots) {
    for (const [x, y, rx, ry] of spots) {
      s.ellipse(x, y, rx, ry, P.cowPatch);
      s.px(x - 1, y - 1, P.cowPatchHi);
    }
  }
  function drawCow(s, stage, frame, blink) {
    const walk = frame === 'walk', graze = frame === 'peck';
    if (stage === 0) {
      // BABY CALF 18x16 — big head, tiny body
      const hy = graze ? 2 : 0;
      s.line(6, 13, 6, 15, P.cowShade); s.line(10 + (walk ? 1 : 0), 13, 10 + (walk ? 1 : 0), 15, P.cowShade);
      s.ellipse(8, 10, 5, 4, P.cowBody);
      s.shadeEllipse(8, 10, 5, 4, P.cowShade, 1, 0.4);
      cowPatches(s, [[6, 9, 1.6, 1.2]]);
      // big head
      s.ellipse(12, 6 + hy, 4.5, 4, P.cowBody);
      s.ellipse(11, 4.5 + hy, 1.8, 1.4, '#fbf0e0');
      cowPatches(s, [[10, 3.5 + hy, 1.4, 1]]);
      // ears
      s.rect(8, 4 + hy, 2, 2, P.cowShade); s.px(16, 5 + hy, P.cowShade);
      // muzzle
      s.ellipse(14, 8.5 + hy, 2.4, 1.6, P.muzzle);
      s.px(14, 8 + hy, P.pupil); s.px(16, 8 + hy, P.pupil);
      eye(s, 12, 4 + hy, blink);
      // tail
      s.px(3, 9, P.cowShade); s.px(2, 10, P.cowPatch);
    } else if (stage === 1) {
      // ADULT 26x22
      const hy = graze ? 3 : 0;
      s.line(9, 17, 9, 21, P.cowShade); s.line(16 + (walk ? 1 : 0), 17, 16 + (walk ? 1 : 0), 21, P.cowShade);
      s.rect(8, 21, 3, 1, P.cowShade); s.rect(15 + (walk ? 1 : 0), 21, 3, 1, P.cowShade);
      s.ellipse(12, 13, 8, 6, P.cowBody);
      s.shadeEllipse(12, 13, 8, 6, P.cowShade, 1, 0.36);
      cowPatches(s, [[8, 11, 2.4, 2], [15, 16, 2, 1.6]]);
      // head
      s.ellipse(19, 7 + hy, 5, 4.5, P.cowBody);
      s.ellipse(17.5, 5 + hy, 2, 1.6, '#fbf0e0');
      cowPatches(s, [[17, 4 + hy, 1.6, 1.2]]);
      // horns
      s.rect(15, 2 + hy, 2, 2, P.horn); s.px(15, 2 + hy, P.hornShade);
      s.rect(22, 2 + hy, 2, 2, P.horn); s.px(23, 2 + hy, P.hornShade);

      s.px(20, 10 + hy, P.pupil); s.px(23, 10 + hy, P.pupil);
      eye(s, 19, 5 + hy, blink);
      // tail
      s.px(4, 11, P.cowShade); s.px(3, 12, P.cowShade); s.px(3, 13, P.cowPatch);
    } else if (stage === 2) {
      // ELDER 32x28 — big horns, extra eyes, chaotic patches
      const hy = graze ? 3 : 0;
      s.line(11, 22, 11, 27, P.cowShade); s.line(20 + (walk ? 1 : 0), 22, 20 + (walk ? 1 : 0), 27, P.cowShade);
      s.rect(10, 27, 3, 1, P.cowShade); s.rect(19 + (walk ? 1 : 0), 27, 3, 1, P.cowShade);
      s.ellipse(14, 17, 10, 7.5, P.cowBody);
      s.shadeEllipse(14, 17, 10, 7.5, P.cowShade, 1, 0.34);
      cowPatches(s, [[8, 14, 3, 2.4], [18, 21, 2.6, 2], [14, 12, 2, 1.6]]);
      // head
      s.ellipse(23, 9 + hy, 6.5, 5.5, P.cowBody);
      s.ellipse(21, 6.5 + hy, 2.5, 2, '#fbf0e0');
      cowPatches(s, [[21, 5 + hy, 2, 1.4]]);
      // BIG curved horns
      s.rect(17, 3 + hy, 2, 3, P.horn); s.rect(16, 1 + hy, 2, 3, P.horn); s.px(16, 1 + hy, P.hornShade);
      s.rect(28, 3 + hy, 2, 3, P.horn); s.rect(29, 1 + hy, 2, 3, P.horn); s.px(30, 1 + hy, P.hornShade);
      // third tiny horn

    } else {
      // MUTANT 40x34 — FIVE horns, FOUR glowing eyes, purple mutant patches,
      // tentacle tail, an extra little leg
      const hy = graze ? 3 : 0;
      // legs (plus a stubby extra one in the middle)
      s.line(13, 27, 13, 33, P.cowShade); s.line(24 + (walk ? 1 : 0), 27, 24 + (walk ? 1 : 0), 33, P.cowShade);
      s.rect(12, 33, 3, 1, P.cowShade); s.rect(23 + (walk ? 1 : 0), 33, 3, 1, P.cowShade);
      s.line(18, 29, 18, 33, P.cowShade); s.rect(17, 33, 3, 1, P.cowShade);

      s.line(6, 18, 3, 13, P.tentacle); s.line(3, 13, 5, 9, P.tentacle);
      s.px(5, 8, P.tentacleHi); s.px(3, 12, P.tentacleDk);
      s.px(6, 21, P.tentacle); s.px(5, 22, P.tentacleDk);
      // huge body
      s.ellipse(17, 21, 12, 9, P.cowBody);
      s.shadeEllipse(17, 21, 12, 9, P.cowShade, 1, 0.32);
      // chaotic patches — brown plus PURPLE mutant patches
      cowPatches(s, [[10, 17, 3.2, 2.6], [22, 26, 2.8, 2.2]]);
      s.ellipse(17, 15, 2.6, 2, P.purple); s.px(16, 14, P.purpleHi);
      s.ellipse(12, 24, 2.2, 1.8, P.purple); s.px(11, 23, P.purpleHi);
      // glowing patch
      s.ellipse(24, 17, 2, 1.6, P.glowDk); s.px(24, 16, P.glow);

      s.ellipse(29, 11 + hy, 7.5, 6.5, P.cowBody);
      s.ellipse(26.5, 8 + hy, 3, 2.4, '#fbf0e0');
      cowPatches(s, [[26, 6.5 + hy, 2.2, 1.6]]);
      // FIVE horns: two big curved pairs + tiny center horn
      s.rect(21, 4 + hy, 2, 4, P.horn); s.rect(20, 1 + hy, 2, 4, P.horn); s.px(20, 1 + hy, P.hornShade);
      s.rect(35, 4 + hy, 2, 4, P.horn); s.rect(36, 1 + hy, 2, 4, P.horn); s.px(37, 1 + hy, P.hornShade);
      s.rect(24, 2 + hy, 2, 3, P.horn); s.px(24, 2 + hy, P.hornShade);
      s.rect(32, 2 + hy, 2, 3, P.horn); s.px(33, 2 + hy, P.hornShade);
      s.rect(28, 0 + hy, 2, 3, P.horn);
      // ears
      s.rect(20, 8 + hy, 2, 2, P.cowShade);
      // muzzle with little fangs
      s.ellipse(32.5, 15 + hy, 4.2, 2.8, P.muzzle);
      s.shadeEllipse(32.5, 15 + hy, 4.2, 2.8, P.muzzleShade, 1, 0.5);
      s.px(30, 14.5 + hy, P.pupil); s.px(35, 14.5 + hy, P.pupil);
      s.px(30, 17 + hy, P.eyeWhite); s.px(34, 17 + hy, P.eyeWhite);
      // FOUR glowing eyes
      glowEye(s, 25, 9 + hy, blink);
      glowEye(s, 31, 9 + hy, blink);
      smallGlowEye(s, 28, 12 + hy, blink);
      smallGlowEye(s, 23, 12 + hy, blink);
    }
  }

  const ANIMAL_SIZES = {
    chicken: [[18, 16], [24, 22], [30, 28], [36, 34]],
    sheep:   [[18, 16], [24, 20], [30, 26], [36, 32]],
    cow:     [[18, 16], [26, 22], [32, 28], [40, 34]],
  };
  const DRAWERS = { chicken: drawChicken, sheep: drawSheep, cow: drawCow };

  /** Get animal sprite canvas: species, stage 0-3, frame, blink. */
  function animal(species, stage, frame = 'idle', blink = false) {
    const [w, h] = ANIMAL_SIZES[species][stage];
    return PIXEL.sprite(`a:${species}:${stage}:${frame}:${blink ? 1 : 0}`, w + 2, h + 2, s => {
      s.g.translate(1, 1);
      DRAWERS[species](s, stage, frame, blink);
      s.g.translate(-1, -1);
      s.outline();
    });
  }

  // ============================================================
  //  ECONOMY SPRITES
  // ============================================================

  function poop(size = 0) {
    const d = 10 + size * 2;
    return PIXEL.sprite(`poop:${size}`, d + 2, d + 2, s => {
      const c = d / 2 + 1;
      s.ellipse(c, d - 2, d / 2 - 1, 2.4, P.poo);
      s.ellipse(c, d - 4.5, d / 2 - 2.5, 2.2, P.poo);
      s.ellipse(c, d - 6.5, d / 2 - 4, 1.8, P.poo);
      s.px(c, d - 8, P.poo);
      s.shadeEllipse(c, d - 2, d / 2 - 1, 2.4, P.pooDk, 1, 0.5);
      s.px(c - 2, d - 5, P.pooHi); s.px(c - 1, d - 7, P.pooHi);
      s.outline();
    });
  }

  function coin(size = 2) {  // size 0..3 like reference "coin assets"
    const d = [6, 8, 12, 16][size];
    return PIXEL.sprite(`coin:${size}`, d + 2, d + 2, s => {
      const c = d / 2 + 1, r = d / 2;
      s.ellipse(c, c, r, r, P.gold);
      s.shadeEllipse(c, c, r, r, P.goldDk, 1, 0.42);
      s.ellipse(c - r * 0.3, c - r * 0.35, r * 0.35, r * 0.3, P.goldHi);
      if (size >= 2) {
        s.ellipse(c, c, r - 2, r - 2, P.gold);
        // inner ring + face mark
        for (let a = 0; a < 16; a++) {
          const t = a / 16 * Math.PI * 2;
          s.px(Math.round(c + Math.cos(t) * (r - 1.6)), Math.round(c + Math.sin(t) * (r - 1.6)), P.goldDk);
        }
        s.rect(c - 1, c - r + 3, 2, d - 6, P.goldDk);
        s.px(c - r * 0.3 | 0, c - r * 0.35 | 0, P.goldHi);
      }
      s.outline();
    });
  }

  // ============================================================
  //  UFO / MUTANT 2 (end-game collection layer)
  // ============================================================

  /**
   * MUTANT 2 — the final match stage, born from a Mutant + Mutant merge.
   * Built from scratch, sharing no silhouette, pose, or feature set with
   * the stage-4 Mutant: the escalation is structural chaos — extra heads,
   * extra legs, eyes budding where they shouldn't, duplicated and
   * mismatched anatomy — while each still reads as the farm's animal.
   * On top of the chaos, the abduction changed them: every species swaps
   * its natural farm palette for its own alien skin (P.alien*) — sickly
   * bioluminescent green feathers, irradiated violet wool, spectral pale
   * hide — plus antennae with glowing tips. Earlier stages are untouched.
   * Bottom-anchored 30x28, blitted by the UFO exactly like the old alien.
   */
  function mutant2(species) {
    return PIXEL.sprite(`mut2:${species}`, 30, 28, s => {
      if (species === 'chicken') {
        // ABDUCTEE HYDRA CHICK — no yellow left on it: sickly biolumin-
        // escent green feathers, violet beaks, antennae with glowing tips.
        // THREE heads on necks of different heights, FOUR mismatched legs
        // (one is a tentacle), eyes budding on the body, one feathered
        // wing and one tentacle wing
        // four legs, no two alike
        s.line(8, 23, 8, 25, P.alienLeg); s.px(7, 26, P.alienLeg); s.px(9, 26, P.alienLeg);
        s.line(12, 23, 12, 27, P.alienLeg); s.px(11, 27, P.alienLeg); s.px(13, 27, P.alienLeg);
        s.line(18, 23, 18, 26, P.alienLeg); s.px(17, 27, P.alienLeg); s.px(19, 27, P.alienLeg);
        s.line(22, 23, 24, 26, P.tentacle); s.px(25, 27, P.tentacleHi); // tentacle leg
        // round body — irradiated speckles on the flank
        s.ellipse(15, 18, 8, 6, P.alienChick);
        s.shadeEllipse(15, 18, 8, 6, P.alienChickShade, 1, 0.36);
        s.ellipse(11, 15, 3, 2.2, P.alienChickHi);
        s.px(14, 16, P.alienChickHi); s.px(19, 18, P.alienChickHi);
        // one FEATHERED wing (left) ...
        s.ellipse(8, 18, 3, 4, P.alienChickShade);
        s.ellipse(8, 17, 2.2, 3, P.alienChick);
        // ... and one TENTACLE wing (right)
        s.line(22, 16, 26, 13, P.tentacle); s.line(26, 13, 27, 10, P.tentacle);
        s.px(27, 9, P.tentacleHi); s.px(25, 14, P.tentacleDk);
        // stray eyes budding on the body
        smallGlowEye(s, 12, 20, false);
        smallGlowEye(s, 18, 19, false);
        s.px(15, 22, P.glowDk); s.px(16, 22, P.glow);
        // CENTER head — big, tall neck, TWIN ANTENNAE, two glowing eyes
        s.rect(13, 8, 4, 5, P.alienChick);
        s.ellipse(15, 5, 4.5, 4, P.alienChick);
        s.shadeEllipse(15, 5, 4.5, 4, P.alienChickShade, 1, 0.3);
        s.px(13, 1, P.purple); s.px(13, 0, P.glowHi);   // left antenna, glowing tip
        s.px(17, 1, P.purple); s.px(17, 0, P.glowHi);   // right antenna, glowing tip
        s.rect(13, 6, 4, 2, P.alienBeak); s.px(14, 7, P.alienBeakShade);
        glowEye(s, 12, 4, false); glowEye(s, 16, 4, false);
        // LEFT head — small, low neck, beak points left, ONE eye
        s.rect(7, 12, 3, 3, P.alienChick);
        s.ellipse(6, 10, 3.2, 2.8, P.alienChick);
        s.shadeEllipse(6, 10, 3.2, 2.8, P.alienChickShade, 1, 0.35);
        s.px(2, 10, P.alienBeak); s.px(1, 10, P.alienBeak); s.px(2, 11, P.alienBeakShade);
        s.px(5, 7, P.purpleDk); s.px(5, 6, P.glow);     // bent antenna
        glowEye(s, 5, 9, false);
        // RIGHT head — tiny, high crooked neck, THREE stacked eyes
        s.rect(21, 8, 2, 6, P.alienChick); s.rect(22, 6, 2, 4, P.alienChick);
        s.ellipse(24, 4, 3, 2.6, P.alienChick);
        s.shadeEllipse(24, 4, 3, 2.6, P.alienChickShade, 1, 0.35);
        s.px(28, 4, P.alienBeak); s.px(28, 5, P.alienBeakShade);
        s.px(24, 1, P.purple); s.px(24, 0, P.glowHi);   // antenna, glowing tip
        smallGlowEye(s, 22, 3, false); smallGlowEye(s, 25, 3, false);
        s.px(24, 5, P.glow);
      } else if (species === 'sheep') {
        // ABDUCTEE WOOL TOTEM WORM — irradiated violet wool over deep
        // teal skin, antennae on the top face. Three wool blobs stacked
        // askew, a face on EVERY segment, SIX caterpillar legs, one
        // giant oversized horn
        // six stubby legs in a row
        for (let i = 0; i < 6; i++) {
          const lx = 5 + i * 4;
          s.line(lx, 24, lx, 27, P.alienFace); s.px(lx - 1, 27, P.alienFace);
        }
        // BOTTOM segment — widest blob, face on its right side
        woolCloud(s, 15, 21, 10, 4.5, P.alienWoolLight, P.alienWoolMid, P.alienWoolShade);
        s.ellipse(23, 20, 3.2, 2.8, P.alienFace);
        s.px(22, 18.5, P.alienFaceHi);
        glowEye(s, 22, 19.5, false);
        s.px(25, 21, P.pupil); // nose
        // MIDDLE segment — shoved left, one big lonely eye
        woolCloud(s, 11, 14, 7.5, 4, P.alienWoolLight, P.alienWoolMid, P.alienWoolShade);
        s.ellipse(6, 13, 2.8, 2.6, P.alienFace);
        s.rect(5, 12, 3, 2, P.glow); s.px(6, 12, P.glowHi); s.px(6, 13, P.pupil);
        // TOP segment — shoved right, the "real" two-eyed face, twin
        // antennae with glowing tips
        woolCloud(s, 18, 7, 6, 3.6, P.alienWoolLight, P.alienWoolMid, P.alienWoolShade);
        s.ellipse(19, 7, 3.4, 2.8, P.alienFace);
        s.px(17.5, 5.5, P.alienFaceHi);
        s.px(17, 2, P.purple); s.px(17, 1, P.glowHi);   // left antenna
        s.px(21, 2, P.purpleDk); s.px(21, 1, P.glow);   // right antenna
        smallGlowEye(s, 17, 6.5, false); smallGlowEye(s, 21, 6.5, false);
        s.px(19, 9, P.pupil); // mouth
        // GIANT oversized curled horn bursting from the top-left
        s.ellipse(10, 4, 3.6, 3.6, P.purple);
        s.ellipse(10, 4, 1.8, 1.8, P.purpleDk);
        s.px(8, 1, P.purpleHi); s.px(12, 6, P.purple);
        // tiny mismatched nub horn top-right
        s.px(24, 3, P.purple); s.px(25, 4, P.purpleDk);
        // stray eyes + glowing tufts buried in the wool
        s.px(15, 16, P.glow); s.px(16, 16, P.pupil);
        s.px(9, 22, P.glowDk); s.px(4, 17, P.glow);
        s.px(21, 12, P.glowHi);
      } else {
        // ABDUCTEE TWIN-HEAD STAMPEDE — spectral pale-teal hide with an
        // irradiated green patch, ice-blue horns, antennae with glowing
        // tips. TWO unequal heads, an eye-stalk sprouting between them,
        // SIX legs, twin tentacle tails, and eyes budding on the flank
        // six legs with hooves
        for (let i = 0; i < 6; i++) {
          const lx = 6 + i * 3.6;
          s.line(lx, 22, lx, 26, P.alienCowShade);
          s.rect(lx - 1, 26, 3, 1, P.alienHoof);
        }
        // long wide body
        s.ellipse(15, 18, 11, 5.5, P.alienCow);
        s.shadeEllipse(15, 18, 11, 5.5, P.alienCowShade, 1, 0.34);
        // patches: irradiated green left, one BIG purple blotch right
        s.ellipse(11, 17, 2.4, 1.8, P.glowDk); s.px(10, 16, P.glow);
        s.ellipse(20, 18, 3, 2.2, P.purple); s.px(19, 17, P.purpleHi);
        // eyes budding on the flank
        smallGlowEye(s, 14, 20, false);
        s.px(17, 21, P.glow); s.px(18, 21, P.pupil);
        // twin tentacle tails, curling apart
        s.line(4, 16, 1, 12, P.tentacle); s.px(1, 11, P.tentacleHi);
        s.line(5, 18, 2, 19, P.tentacleDk); s.px(1, 18, P.tentacle);

  // pigeon palette: city-gray feathers with an iridescent neck
  const PG = {
    body: '#9aa4b2', shade: '#707a88', light: '#c6cfd8',

  /**
   * Pixel pigeon, faces RIGHT, bottom anchored.
   * Frames: 'idle' | 'look' (head turned back) | 'flapUp' | 'flapDn'.
   */
  function pigeon(frame = 'idle', blink = false) {
    return PIXEL.sprite(`pigeon:${frame}:${blink ? 1 : 0}`, 22, 20, s => {
      const look = frame === 'look';
      const flapUp = frame === 'flapUp', flapDn = frame === 'flapDn';
      // feet
      s.line(9, 15, 9, 17, PG.foot); s.line(13, 15, 13, 17, PG.foot);
      s.px(8, 17, PG.foot); s.px(10, 17, PG.foot);
      s.px(12, 17, PG.foot); s.px(14, 17, PG.foot);
      // tail (points left)
      s.line(4, 10, 1, 8, PG.wing); s.line(4, 11, 1, 9, PG.shade);
      // body
      s.ellipse(10, 11, 6, 4.5, PG.body);
      s.shadeEllipse(10, 11, 6, 4.5, PG.shade, 1, 0.38);
      s.ellipse(8, 9, 2.5, 2, PG.light);
      // wing: folded, raised, or beating down
      if (flapUp) {
        s.ellipse(7, 5, 4.5, 2.2, PG.wing);
        s.ellipse(6, 4, 2.6, 1.4, PG.wingHi);
      } else if (flapDn) {
        s.ellipse(7, 14, 4.5, 2, PG.wing);
        s.px(4, 14, PG.wingHi);
      } else {
        s.ellipse(8, 11, 3.6, 2.6, PG.wing);
        s.px(6, 10, PG.wingHi); s.px(7, 10, PG.wingHi);
      }
      // head (turned back for the 'look' frame)
      const hx = look ? 6 : 15;
      s.ellipse(hx, 6, 3.4, 3.2, PG.body);
      s.ellipse(hx - 1, 4.5, 1.5, 1.2, PG.light);
      // iridescent neck feathers
      if (look) {
        s.px(8, 8, PG.neck); s.px(9, 9, PG.neck2); s.px(8, 9, PG.neck);
      } else {
        s.px(13, 8, PG.neck); s.px(14, 9, PG.neck2); s.px(13, 9, PG.neck);
      }
      // beak
      if (look) { s.rect(2, 6, 2, 1, PG.beak); s.px(3, 7, PG.beakDk); }
      else { s.rect(18, 6, 2, 1, PG.beak); s.px(18, 7, PG.beakDk); }
      // eye
      const ex = look ? 5 : 16;
      if (blink) s.px(ex, 5, PG.shade);
      else { s.px(ex, 5, P.pupil); s.px(ex - 1, 4, P.eyeWhite); }
      s.outline();
    });
  }

  // tornado palette: pale storm-gray funnel with a dusty skirt
  const TN = {
    base: '#c8cdd4', hi: '#eef2f6', dk: '#98a1ac',
    dust: '#b09a72', dustDk: '#8a7350', leaf: '#5e9c31',
  };

  /**
   * Pixel tornado funnel, bottom anchored. Three spin frames: the
   * highlight streaks and debris flecks rotate around the cone.
   */
  function tornado(frame = 0) {
    return PIXEL.sprite(`tornado:${frame}`, 36, 42, s => {
      // stacked funnel bands, wide at the top, tapering to the ground
      const bands = [
        { y: 4, rx: 15 }, { y: 8, rx: 13.5 }, { y: 12, rx: 12 },
        { y: 16, rx: 10 }, { y: 20, rx: 8.5 }, { y: 24, rx: 7 },
        { y: 28, rx: 5.5 }, { y: 32, rx: 4 }, { y: 35, rx: 3 }, { y: 38, rx: 2 },
      ];
      bands.forEach((b, i) => {
        s.ellipse(18, b.y, b.rx, 2.4, TN.base);
        s.shadeEllipse(18, b.y, b.rx, 2.4, TN.dk, 1, 0.45);
        // spinning highlight streak: offset cycles with the frame
        const ph = (i + frame) % 3;
        const off = (ph - 1) * b.rx * 0.5;
        s.rect(18 + off - Math.max(1, b.rx * 0.3), b.y - 1, Math.max(2, b.rx * 0.6), 1, TN.hi);
      });
      // debris flecks whirling around the cone
      const specks = [[6, 6], [30, 10], [8, 18], [27, 22], [12, 28], [23, 31]];
      specks.forEach(([px, py], i) => {
        const on = (i + frame) % 3;
        if (on === 0) s.px(px, py, TN.leaf);
        else if (on === 1) s.px(px, py, TN.dust);
      });
      // dust skirt kicked up at the base
      s.ellipse(18, 39, 7, 1.8, TN.dust);
      s.shadeEllipse(18, 39, 7, 1.8, TN.dustDk, 1, 0.5);
      s.px(9 + frame, 38, TN.dust); s.px(27 - frame, 39, TN.dust);
      s.outline();
    });
  }

      s.rect(4, 1, 2, 2, '#c8d0d4');
      s.rect(2, 7, 6, 1, '#8a95a0');
      s.outline();
    });
  }

  /** Rolled wool bale (sheep farm decoration). */
  function woolBale() {
    return PIXEL.sprite('woolBale', 14, 11, s => {
      s.ellipse(7, 6, 6, 4, P.woolLight);
      s.shadeEllipse(7, 6, 6, 4, P.woolShade, 1, 0.4);
      s.ellipse(7, 6, 3, 2, P.woolMid);
      s.ellipse(7, 6, 1.4, 1, P.woolLight);
      s.px(4, 3, '#ffffff'); s.px(3, 5, '#ffffff');
      s.outline();
    });
  }

  function barn() {
    return PIXEL.sprite('barn', 36, 32, s => {
      s.rect(4, 14, 28, 16, P.red);
      s.rect(4, 14, 28, 2, P.redHi);
      s.rect(4, 28, 28, 2, P.redDk);
      // gambrel roof
      for (let i = 0; i < 6; i++) s.rect(6 + i, 12 - i, 24 - i * 2, 1, P.woodDkr);
      s.rect(8, 5, 20, 3, P.woodDk);
      s.rect(4, 12, 28, 2, P.woodDkr);
      // hay door
      s.rect(15, 8, 6, 5, P.woodDk);
      s.rect(16, 9, 4, 3, P.hay);
      // big door + cross braces
      s.rect(13, 20, 10, 10, P.woodDk);
      s.rect(14, 21, 8, 9, P.wood);
      s.line(14, 21, 21, 29, P.woodDk);
      s.line(21, 21, 14, 29, P.woodDk);
      // white trim
      s.rect(6, 16, 2, 12, '#e8ddc8'); s.rect(28, 16, 2, 12, '#e8ddc8');
      s.outline();
    });
  }

  function shed() {
    return PIXEL.sprite('shed', 30, 26, s => {
      s.rect(4, 12, 22, 12, '#c8b088');
      s.rect(4, 12, 22, 2, '#dcc8a0');
      for (let i = 0; i < 7; i++) s.rect(2 + i, 11 - i, 26 - i * 2, 1, P.blueRoof);
      s.rect(2, 11, 26, 2, P.blueRoofDk);
      s.rect(6, 5, 8, 1, P.blueRoofHi);
      s.rect(12, 16, 6, 8, P.woodDk);
      s.rect(13, 17, 4, 7, P.wood);
      s.rect(6, 16, 4, 4, '#7ec8e0'); s.rect(6, 17, 4, 1, P.woodDk);
      s.outline();
    });
  }

  // ============================================================
  //  UI / MAP ICONS
  // ============================================================

  function mapPin() {
    return PIXEL.sprite('mapPin', 16, 20, s => {
      s.ellipse(8, 7, 6, 6, P.red);
      s.rect(5, 11, 6, 3, P.red);
      s.px(6, 14, P.red); s.px(7, 15, P.redDk); s.px(8, 16, P.redDk);
      s.px(7, 14, P.red); s.px(8, 14, P.redDk); s.px(9, 14, P.redDk);
      s.px(8, 15, P.redDk);
      s.shadeEllipse(8, 7, 6, 6, P.redDk, 1, 0.4);
      s.ellipse(6, 5, 2, 1.6, P.redHi);
      s.ellipse(8, 7, 2.4, 2.4, '#f4ece0');
      s.outline();
    });
  }

  function lock() {
    return PIXEL.sprite('lock', 16, 18, s => {
      // shackle
      s.rect(4, 2, 8, 2, P.stoneHi);
      s.rect(4, 2, 2, 6, P.stoneHi);
      s.rect(10, 2, 2, 6, P.stoneHi);
      s.px(5, 3, '#d8d2c8'); s.px(10, 3, P.stoneDk);
      // body
      s.rect(2, 7, 12, 9, '#b8ad9c');
      s.rect(2, 7, 12, 2, '#cec4b4');
      s.rect(2, 14, 12, 2, '#8c8272');
      // keyhole
      s.rect(7, 10, 2, 2, P.outline);
      s.rect(7, 12, 2, 2, P.outline);
      s.outline();
    });
  }

  function gear() {
    return PIXEL.sprite('gear', 16, 16, s => {
      const c = 8;
      for (let a = 0; a < 8; a++) {
        const t = a / 8 * Math.PI * 2;
        s.rect(Math.round(c + Math.cos(t) * 6) - 1, Math.round(c + Math.sin(t) * 6) - 1, 3, 3, '#d8d2c8');
      }
      s.ellipse(c, c, 5, 5, '#d8d2c8');
      s.shadeEllipse(c, c, 5, 5, '#a09888', 1, 0.4);
      s.ellipse(c, c, 2, 2, '#6a6458');
      s.outline();
    });
  }

  function arrowUp() {
    return PIXEL.sprite('arrowUp', 12, 12, s => {
      s.rect(4, 5, 4, 6, '#f4ece0');
      for (let i = 0; i < 4; i++) s.rect(1 + i, 5 - i, 10 - i * 2, 1, '#f4ece0');
      s.rect(4, 9, 4, 2, '#d0c4ac');
      s.outline();
    });
  }

  function xIcon() {
    return PIXEL.sprite('xIcon', 12, 12, s => {
      for (let i = 0; i < 9; i++) {
        s.rect(1 + i, 1 + i, 2, 2, '#f4ece0');
        s.rect(9 - i, 1 + i, 2, 2, '#f4ece0');
      }
      s.outline();
    });
  }

  /** Rewarded-video icon: little screen with a play triangle. */
  function adPlay() {
    return PIXEL.sprite('adPlay', 16, 12, s => {
      s.rect(1, 1, 14, 10, '#f4ece0');   // screen frame
      s.rect(2, 2, 12, 8, '#4a4440');    // dark screen
      for (let i = 0; i < 3; i++) s.rect(6 + i, 3 + i, 1, 6 - i * 2, '#7dbb4a');
      s.outline();
    });
  }

  return {
    animal, ANIMAL_SIZES, poop, coin, mutant2, ufo, pigeon, tornado,
    tree, bush, flower, rock, barrel, crate, haystack, sign, fenceH,
    farmhouse, barn, shed,
    coop, nest, cottage, windmillTower, windmillBlades, silo, milkCan, woolBale,
    mapPin, lock, gear, arrowUp, xIcon, adPlay,
    P,
  };
})();
</script>
<script>
/**
 * ENVIRONMENT — pre-rendered backgrounds: the three farm pens (top view,
 * wooden fence perimeter, per-farm ground + decoration set) and the world map.
 * Each is drawn once into an offscreen canvas at virtual resolution.
 */
const ENVIRONMENT = (() => {
  const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
  const cache = {};

  // Per-farm ground palettes (bright green / darker green / brown dirt)
  const GROUNDS = [
    { base: '#79a848', dark: '#6a9840', light: '#8ab656', speck: '#5c8a36', edge: '#55803a' },
    { base: '#5f8c3e', dark: '#537e36', light: '#6f9c4a', speck: '#42682c', edge: '#41652f' },
    { base: '#9a7043', dark: '#8a6238', light: '#aa804f', speck: '#755232', edge: '#6b4d30' },
  ];

  // Playable area inside the fence (virtual px). Wider pen, pushed down a
  // little so the themed farmhouse sits above it as the focal point.
  const PLAY = { x: 22, y: 160, w: W - 44, h: H - 300 };

  /** The full PLAY rect scaled to a fence tier's footprint (top edge fixed,
   *  centered horizontally so the farmhouse path still meets the pen gate). */
  function rectForSize(size) {
    if (!(size < 1)) return PLAY;
    const w = Math.round(PLAY.w * size), h = Math.round(PLAY.h * size);
    return { x: PLAY.x + Math.round((PLAY.w - w) / 2), y: PLAY.y, w, h };
  }

  /**
   * The farm's CURRENT playable area: the full PLAY rect, shrunk to the
   * fence tier's footprint on construction farms. This is the single source
   * for spawn slots, walk bounds and fence rendering, so capacity gained
   * from a fence upgrade is always physically usable. Before the fence
   * exists the whole plot is walkable — that is the area animals escape from.
   */
  function playRect(farmId) {
    const def = Construction.levelDef(farmId);
    return def ? rectForSize(def.size) : PLAY;
  }

  /** Footprint the fence would have at a given tier (1-based) — ghost preview. */
  function rectForLevel(farmId, lv) {
    const def = Construction.levelDef(farmId, lv);
    return def ? rectForSize(def.size) : PLAY;
  }

  /** Screen rect of the farmhouse — also the ghost placeholder's spot. */
  function houseRect(id) {
    const building = [SPRITES.coop, SPRITES.cottage, SPRITES.barn][id]();
    const w = building.width * 3, h = building.height * 3;
    return { x: (W - w) / 2 | 0, y: PLAY.y - 16 - h, w, h, img: building };
  }

  /** Deterministic pseudo-random for stable decoration layouts. */
  function seededRand(seed) {
    let s = seed;
    return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }

  function noiseGround(g, pal, rnd, x0, y0, w, h) {
    g.fillStyle = pal.base;
    g.fillRect(x0, y0, w, h);
    const n = (w * h) / 90;
    for (let i = 0; i < n; i++) {
      const x = x0 + rnd() * w, y = y0 + rnd() * h;
      const r = rnd();
      g.fillStyle = r < 0.35 ? pal.dark : r < 0.7 ? pal.light : pal.speck;
      const sz = 2 + ((rnd() * 3) | 0) * 2;
      g.fillRect(x | 0, y | 0, sz, rnd() < 0.5 ? 2 : sz);
    }
  }

  /**
   * Fence art, one palette set per farm theme (a construction farm picks its
   * set with FENCE_THEME; a farm's FENCE_LEVELS[].art indexes into it). Each
   * tier tints the horizontal fence sprite and recolors posts + side rails,
   * so a farm's fence reads as its own material across the whole upgrade
   * path instead of every farm sharing one wood look. A `null` tier means
   * "untinted base sprite art with the standard wood palette" — that is what
   * every classic, non-construction farm renders.
   */
  const FENCE_THEMES = {
    // Farm 2 pasture wood: rough offcuts -> clean planks -> painted white
    wood: [
      { tint: 'rgba(52,34,16,0.38)', post: ['#7d5c33', '#8f6c3f', '#5a3d1e'], rail: ['#5a3d1e', '#7d5c33'] },
      null,
      { tint: 'rgba(240,236,226,0.42)', post: ['#e9e9e4', '#ffffff', '#c2c2ba'], rail: ['#c2c2ba', '#e9e9e4'] },
    ],
    // Farm 3 cattle ranch: sun-bleached rails -> barn-red stained timber ->
    // iron-reinforced posts. Cooler and heavier than Farm 2's wood, and
    // pitched against Farm 3's brown dirt ground rather than green pasture.
    ranch: [
      { tint: 'rgba(196,186,168,0.40)', post: ['#a89d88', '#c2b8a4', '#7d735f'], rail: ['#7d735f', '#a89d88'] },
      { tint: 'rgba(150,48,38,0.45)',   post: ['#9c3a2c', '#b8503c', '#6e2419'], rail: ['#6e2419', '#9c3a2c'] },
      { tint: 'rgba(84,92,104,0.48)',   post: ['#6b7480', '#8b95a2', '#454c56'], rail: ['#454c56', '#6b7480'] },
    ],
  };

  /** Palette for one tier of one theme, or null for the base wood look. */
  function fenceTier(theme, art) {
    const set = FENCE_THEMES[theme] || FENCE_THEMES.wood;
    return set[art] || null;
  }

  /**
   * Post colors [face, highlight, shadow] for a farm's fence at a given art
   * tier — shared by the baked fence and the live ghost preview so an
   * unbuilt fence previews in the material the farm is actually going to get.
   */
  function fencePalette(farmId, art = 0) {
    const tier = fenceTier(Construction.fenceTheme(farmId), art);
    return tier ? tier.post : [SPRITES.P.wood, SPRITES.P.woodHi, SPRITES.P.woodDk];
  }

  const fenceRowCache = {};
  function fenceRow(theme, art) {
    const tier = fenceTier(theme, art);
    const base = SPRITES.fenceH(24);
    if (!tier) return base;
    const key = theme + ':' + art;
    if (fenceRowCache[key]) return fenceRowCache[key];
    const c = document.createElement('canvas');
    c.width = base.width; c.height = base.height;
    const g = c.getContext('2d');
    g.drawImage(base, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = tier.tint;
    g.fillRect(0, 0, c.width, c.height);
    fenceRowCache[key] = c;
    return c;
  }

  /** Fence perimeter around a play rect, in the given theme's art tier. */
  function drawFence(g, rect, art = 1, theme = 'wood') {
    const tier = fenceTier(theme, art);
    const f = fenceRow(theme, art);
    const sc = 2;
    const { x, y, w, h } = rect;
    const top = y - 20, bot = y + h - 6;
    // back fence (behind animals visually)
    for (let fx = x - 14; fx < x + w + 14; fx += f.width * sc - 2) {
      g.drawImage(f, fx, top, f.width * sc, f.height * sc);
    }
    // side fences (vertical posts made from small segments)
    for (let fy = top + 16; fy < bot; fy += 22) {
      drawPost(g, x - 12, fy, tier); drawPost(g, x + w + 4, fy, tier);
    }
    // side rails
    const railDk = tier ? tier.rail[0] : SPRITES.P.woodDk;
    const railHi = tier ? tier.rail[1] : SPRITES.P.wood;
    g.fillStyle = railDk;
    g.fillRect(x - 8, top + 10, 3, bot - top - 4);
    g.fillRect(x + w + 8, top + 10, 3, bot - top - 4);
    g.fillStyle = railHi;
    g.fillRect(x - 9, top + 10, 1, bot - top - 4);
    g.fillRect(x + w + 7, top + 10, 1, bot - top - 4);
    // front fence
    for (let fx = x - 14; fx < x + w + 14; fx += f.width * sc - 2) {
      g.drawImage(f, fx, bot, f.width * sc, f.height * sc);
    }
  }
  function drawPost(g, x, y, tier) {
    const face = tier ? tier.post[0] : SPRITES.P.wood;
    const hi = tier ? tier.post[1] : SPRITES.P.woodHi;
    const dk = tier ? tier.post[2] : SPRITES.P.woodDk;
    g.fillStyle = PIXEL.OUTLINE; g.fillRect(x - 1, y - 1, 10, 18);
    g.fillStyle = face; g.fillRect(x, y, 8, 16);
    g.fillStyle = hi; g.fillRect(x, y, 2, 16);
    g.fillStyle = dk; g.fillRect(x + 6, y, 2, 16);
  }

  /** Small stack of planks — construction-site prop for the unbuilt farm. */
  function drawPlankPile(g, x, y) {
    g.fillStyle = PIXEL.OUTLINE;
    g.fillRect(x - 2, y - 2, 48, 20);
    for (let row = 0; row < 3; row++) {
      const px2 = x + (row % 2) * 3, py = y + row * 5;
      g.fillStyle = SPRITES.P.wood; g.fillRect(px2, py, 42, 4);
      g.fillStyle = SPRITES.P.woodHi; g.fillRect(px2, py, 42, 1);
      g.fillStyle = SPRITES.P.woodDk; g.fillRect(px2 + 39, py, 3, 4);
    }
  }

  /**
   * Build one farm background. Construction farms re-render (and re-cache)
   * per build stage: a bare plot has neither house nor pen, a housed-but-
   * unfenced plot is open pasture, and each fence tier bakes its own
   * footprint + art (see playRect / FENCE_THEMES).
   */
  function farm(id) {
    const house = Construction.houseBuilt(id);
    const built = Construction.fenceBuilt(id);
    const fenceLv = Construction.fenceLevel(id);
    const key = 'farm' + id + (!Construction.required(id) ? ''
      : built ? '-f' + fenceLv : house ? '-h' : '-l');
    if (cache[key]) return cache[key];
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const pal = GROUNDS[id];
    const rnd = seededRand(1234 + id * 999);
    const R = playRect(id);

    // outer ground (darker border grass/dirt)
    noiseGround(g, { ...pal, base: pal.edge, light: pal.dark, dark: pal.edge, speck: pal.speck }, rnd, 0, 0, W, H);
    if (house) {
      // inner pen ground
      noiseGround(g, pal, rnd, R.x - 16, R.y - 30, R.w + 32, R.h + 30);

      // dirt patches inside pen — just a couple, kept subtle for open grass
      for (let i = 0; i < 2; i++) {
        const px2 = R.x + 40 + rnd() * Math.max(20, R.w - 110), py = R.y + 50 + rnd() * Math.max(20, R.h - 120);
        g.fillStyle = id === 2 ? '#8a6238' : '#8a7a4a';
        g.globalAlpha = 0.4;
        g.beginPath(); g.ellipse(px2, py, 16 + rnd() * 10, 7 + rnd() * 4, 0, 0, 7); g.fill();
        g.globalAlpha = 1;
      }
    }

    // dirt path from the farmhouse door down to the pen gate, then the
    // themed farmhouse itself — the focal point, centered on the grass
    // above the pen (both only once the house has been built)
    if (house) {
      g.fillStyle = '#caa96a';
      g.fillRect(W / 2 - 11, R.y - 34, 22, 40);
      g.beginPath(); g.ellipse(W / 2, R.y + 8, 15, 7, 0, 0, 7); g.fill();
      g.fillStyle = '#b8935a';
      g.fillRect(W / 2 - 7, R.y - 34, 14, 38);
      g.beginPath(); g.ellipse(W / 2, R.y + 6, 10, 5, 0, 0, 7); g.fill();

      const hr = houseRect(id);
      g.drawImage(hr.img, hr.x, hr.y, hr.w, hr.h);
    }

    // trees: one flanking the farmhouse on the left, one on the
    // bottom-right grass — the upper-right corner is kept clear for the
    // UFO's permanent parking spot (see ufo.js spot())
    const treeV = id === 0 ? 0 : 1;
    const treeImg = SPRITES.tree(treeV);
    g.drawImage(treeImg, 6, R.y - 94, 60, 72);
    g.drawImage(treeImg, W - 68, PLAY.y + PLAY.h + 40, 60, 72);

    // flowers beside the path entrance
    g.drawImage(SPRITES.flower(id), W / 2 - 52, R.y - 40, 16, 20);
    g.drawImage(SPRITES.flower((id + 1) % 3), W / 2 + 38, R.y - 38, 16, 20);

    // tidy row of decorations on the grass below the front fence
    const botY = R.y + R.h + 32;
    g.drawImage(SPRITES.bush(id === 0 ? 2 : 1), 28, botY, 36, 24);
    // (kept left of x~250: the relocated tree stands on the bottom-right grass)
    g.drawImage(SPRITES.bush(1), 206, botY + 4, 36, 24);
    if (id === 2) {
      g.drawImage(SPRITES.haystack(), W / 2 - 20, botY - 2, 40, 32);
    } else {
      g.drawImage(SPRITES.rock(1), W / 2 - 16, botY + 8, 32, 20);
    }
    g.drawImage(SPRITES.flower((id + 2) % 3), 78, botY + 10, 16, 20);
    g.drawImage(SPRITES.flower(id), W - 88, botY + 12, 16, 20);

    if (!built) {
      // no fence yet: a construction site waiting for the player — a plank
      // pile and site rubble where the pen will go (the ghosted fence
      // footprint is drawn live, see FarmScene.drawHouse)
      drawPlankPile(g, W / 2 - 74, PLAY.y + PLAY.h - 24);
      g.drawImage(SPRITES.rock(0), W / 2 + 30, PLAY.y + PLAY.h - 34, 28, 20);
      g.drawImage(SPRITES.rock(1), W / 2 + 54, PLAY.y + PLAY.h - 20, 28, 20);
      cache[key] = c;
      return c;
    }

    const def = Construction.levelDef(id);
    drawFence(g, R, def ? def.art : 1, Construction.fenceTheme(id));

    // in-pen props tucked into the top corners, out of the walk area
    g.drawImage(SPRITES.barrel(), R.x + 6, R.y - 2, 28, 32);
    if (id === 2) {
      g.drawImage(SPRITES.haystack(), R.x + R.w - 48, R.y + 2, 40, 32);
    } else {
      g.drawImage(SPRITES.bush(id === 0 ? 2 : 1), R.x + R.w - 44, R.y + 4, 36, 24);
    }
    // a few accents pinned to the pen edges so the middle stays open
    const edge = [
      { x: R.x + 16, y: R.y + R.h - 42 },
      { x: R.x + R.w - 34, y: R.y + R.h - 52 },
      { x: R.x + 18, y: R.y + 64 },
    ];
    for (let i = 0; i < edge.length; i++) {
      const img = id === 2 ? SPRITES.rock(i % 2) : SPRITES.flower((id + i) % 3);
      g.drawImage(img, edge[i].x, edge[i].y, img.width * 2, img.height * 2);
    }

    cache[key] = c;
    return c;
  }

  // ---------------- WORLD MAP ----------------
  // Farm node positions on the map
  const MAP_NODES = [
    { x: 80,  y: 200 },
    { x: 250, y: 330 },
    { x: 110, y: 470 },
  ];

  /**
   * Per-farm themed map anchors: where the species mascot stands, where
   * chimney smoke rises, the windmill hub, and waving grass tufts.
   * All animated in MapScene; static art is baked into worldMap().
   */
  const THEME = [
    { // chicken
      animal: { x: 56, y: 232 },
      grass: [{ x: 38, y: 180 }, { x: 120, y: 184 }, { x: 46, y: 232 }],
    },
    { // sheep
      animal: { x: 278, y: 352 },
      windmill: { x: 188, y: 294 },
      chimney: { x: 266, y: 282 },
      grass: [{ x: 210, y: 302 }, { x: 292, y: 346 }, { x: 206, y: 354 }],
    },
    { // cow
      animal: { x: 140, y: 502 },
      chimney: { x: 96, y: 414 },
      grass: [{ x: 70, y: 444 }, { x: 150, y: 488 }, { x: 66, y: 498 }],
    },
  ];

  /** Road control path between nodes (list of points per segment). */
  const ROADS = [
    [{ x: 80, y: 200 }, { x: 150, y: 230 }, { x: 210, y: 280 }, { x: 250, y: 330 }],
    [{ x: 250, y: 330 }, { x: 230, y: 390 }, { x: 170, y: 440 }, { x: 110, y: 470 }],
  ];

  // Decorative striped flag planted roadside on the Farm 1 → Farm 2 stretch —
  // anchored to the road segment's middle control points so it tracks any
  // road re-routing. Offset perpendicular to the upper-right side of the
  // road, outside every node's tap radius and clear of the windmill blades.
  // Purely visual.
  const FLAG = (() => {
    const a = ROADS[0][1], b = ROADS[0][2];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    // unit perpendicular pointing away from the road's upper-right edge
    const px = (b.y - a.y) / len, py = -(b.x - a.x) / len;
    return {
      x: Math.round((a.x + b.x) / 2 + px * 14),
      y: Math.round((a.y + b.y) / 2 + py * 14),
    };
  })();

  function roadPoints(seg, step = 6) {
    // Catmull-rom-ish smooth sampling through control points
    const pts = [];
    const cp = ROADS[seg];
    for (let i = 0; i < cp.length - 1; i++) {
      const a = cp[i], b = cp[i + 1];
      const n = Math.ceil(U.dist(a.x, a.y, b.x, b.y) / step);
      for (let j = 0; j < n; j++) {
        const t = j / n;
        // slight sine wiggle for a hand-drawn curve
        const wig = Math.sin((i + t) * 5) * 6;
        pts.push({ x: U.lerp(a.x, b.x, t) + wig * 0.4, y: U.lerp(a.y, b.y, t) });
      }
    }
    pts.push(cp[cp.length - 1]);
    return pts;
  }

  /**
   * Construction stage of one farm for map rendering: 0 = empty, undeveloped
   * plot (land not bought, or bought but nothing built on it yet), 1 = house
   * standing but no fence, 2 = complete. Classic farms are always 2.
   */
  function mapStage(farmId) {
    if (!Construction.required(farmId)) return 2;
    if (!Construction.houseBuilt(farmId)) return 0;
    return Construction.fenceBuilt(farmId) ? 2 : 1;
  }

  function worldMap() {
    // the map re-bakes (and re-caches) whenever a construction farm's build
    // stage or fence tier changes, so plots develop visibly as the player
    // builds — including the fence ring taking on each new tier's material
    const mapKey = 'map-' + CONFIG.FARMS
      .map(f => mapStage(f.id) + '.' + Construction.fenceLevel(f.id)).join('');
    if (cache[mapKey]) return cache[mapKey];
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const rnd = seededRand(777);

    noiseGround(g, GROUNDS[1], rnd, 0, 0, W, H);

    // river on the right
    g.fillStyle = '#3d6f8e';
    g.beginPath();
    g.moveTo(W - 60, 0);
    for (let y = 0; y <= H; y += 20) g.lineTo(W - 55 + Math.sin(y * 0.02) * 16, y);
    g.lineTo(W, H); g.lineTo(W, 0); g.closePath(); g.fill();
    g.fillStyle = '#4d83a3';
    for (let y = 10; y < H; y += 26) {
      g.fillRect(W - 40 + Math.sin(y * 0.05) * 10, y, 10, 3);
    }
    g.fillStyle = '#6ea3bf';
    for (let y = 22; y < H; y += 34) g.fillRect(W - 30 + Math.sin(y * 0.07) * 8, y, 6, 2);

    // roads
    g.strokeStyle = '#caa96a';
    g.lineWidth = 12;
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let seg = 0; seg < 2; seg++) {
      const pts = roadPoints(seg);
      g.beginPath();
      g.moveTo(pts[0].x, pts[0].y);
      for (const p of pts) g.lineTo(p.x, p.y);
      g.stroke();
    }
    g.strokeStyle = '#b8935a';
    g.lineWidth = 8;
    for (let seg = 0; seg < 2; seg++) {
      const pts = roadPoints(seg);
      g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
      for (const p of pts) g.lineTo(p.x, p.y);
      g.stroke();
    }

    // farm plots: fenced circles with per-farm ground (an unpurchased
    // construction plot stays an open, unfenced patch of ground)
    for (let i = 0; i < 3; i++) {
      const n = MAP_NODES[i], pal = GROUNDS[i];
      const stage = mapStage(i);
      g.fillStyle = PIXEL.OUTLINE;
      g.beginPath(); g.ellipse(n.x, n.y, 47, 35, 0, 0, 7); g.fill();
      g.fillStyle = pal.base;
      g.beginPath(); g.ellipse(n.x, n.y, 45, 33, 0, 0, 7); g.fill();
      g.fillStyle = pal.dark;
      for (let k = 0; k < 14; k++) {
        g.fillRect(n.x - 40 + rnd() * 78, n.y - 26 + rnd() * 52, 3, 2);
      }
      if (stage < 2) continue; // no fence built yet: no fence ring on the plot
      // fence ring: posts around ellipse, in the tier the farm has actually
      // built so the map plot matches the material inside the farm
      const [face, hi] = fencePalette(i, Construction.fenceLevel(i)
        ? Construction.levelDef(i).art : 1);
      for (let a = 0; a < 14; a++) {
        const t = a / 14 * Math.PI * 2;
        const px2 = n.x + Math.cos(t) * 44, py = n.y + Math.sin(t) * 32;
        g.fillStyle = PIXEL.OUTLINE; g.fillRect(px2 - 2, py - 7, 6, 12);
        g.fillStyle = face; g.fillRect(px2 - 1, py - 6, 4, 10);
        g.fillStyle = hi; g.fillRect(px2 - 1, py - 6, 1, 10);
      }
    }

    // ---- ground details on the plots (kept procedural; part of the
    // terrain layers in the Figma "World Map — Props" scene) ----
    {
      const n = MAP_NODES[0];
      // scattered feed
      g.fillStyle = '#e0b656';
      for (let k = 0; k < 10; k++) {
        g.fillRect(n.x - 24 + rnd() * 48 | 0, n.y + 8 + rnd() * 18 | 0, 2, 2);
      }
    }
    {
      const n = MAP_NODES[1];
      // pasture tufts (lighter green)
      g.fillStyle = GROUNDS[1].light;
      for (let k = 0; k < 12; k++) {
        g.fillRect(n.x - 36 + rnd() * 72 | 0, n.y - 20 + rnd() * 42 | 0, 3, 2);
      }
    }
    {
      const n = MAP_NODES[2];
      // grazing patches on the dirt plot
      g.fillStyle = '#79a848'; g.globalAlpha = 0.7;
      g.beginPath(); g.ellipse(n.x - 26, n.y + 16, 14, 7, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(n.x + 30, n.y + 8, 11, 6, 0, 0, 7); g.fill();
      g.globalAlpha = 1;
    }

    // ---- props: fixed layout from the Figma "World Map — Props" scene
    // (50:3), Figma px / 2, trim offsets unfolded to full-sprite rects.
    // Layer order here mirrors the design's z-order. ----
    const SPR = {
      haystack: () => SPRITES.haystack(), coop: () => SPRITES.coop(), nest: () => SPRITES.nest(),
      windmillTower: () => SPRITES.windmillTower(), cottage: () => SPRITES.cottage(),
      woolBale: () => SPRITES.woolBale(), flower0: () => SPRITES.flower(0), flower2: () => SPRITES.flower(2),
      silo: () => SPRITES.silo(), barn: () => SPRITES.barn(), milkCan: () => SPRITES.milkCan(),
      tree0: () => SPRITES.tree(0), tree1: () => SPRITES.tree(1),
      bush1: () => SPRITES.bush(1), rock0: () => SPRITES.rock(0),
    };
