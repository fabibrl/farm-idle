    spawn({ x, y, vx: 0, vy: -28, g: 0, life: 1.0, kind: 'text', text, col });
  }

  function update(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.t += dt;
      if (p.kind === 'coin') {
        // brief hop then home to target
        if (p.t < 0.25) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
        } else {
          const d = U.dist(p.x, p.y, p.targetX, p.targetY);
          if (d < 14) {
            if (p.onArrive) p.onArrive();
            p.dead = true;
          } else {
            const sp = p.speed * dt;
            p.x += (p.targetX - p.x) / d * sp;
            p.y += (p.targetY - p.y) / d * sp;
          }
        }
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.g * dt;
      }
      if (p.t >= p.life || p.dead) {
        particles.splice(i, 1);
        pool.release(p);
      }
    }
  }

  function draw(ctx) {
    for (const p of particles) {
      if (p.delay > 0) continue;
      const a = U.clamp(1 - p.t / p.life, 0, 1);
      ctx.globalAlpha = a;
      if (p.kind === 'square') {
        ctx.fillStyle = p.col;
        ctx.fillRect(p.x - p.size / 2 | 0, p.y - p.size / 2 | 0, p.size, p.size);
      } else if (p.kind === 'circle') {
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + 1, 0, 7); ctx.fill();
      } else if (p.kind === 'star') {
        ctx.fillStyle = p.col;
        const s = p.size;
        ctx.fillRect(p.x - s, p.y, s * 2 + 1, 1);
        ctx.fillRect(p.x, p.y - s, 1, s * 2 + 1);
      } else if (p.kind === 'coin') {
        const wob = 1 + Math.sin(p.t * 20) * 0.12;
        ctx.globalAlpha = 1;
        ctx.drawImage(p.img, p.x - 12, p.y - 12 * wob, 24, 24 * wob);
      } else if (p.kind === 'text') {
        UI.drawText(ctx, p.text, p.x, p.y, UI.SIZE.BODY, p.col, 'center', true);
      }
      ctx.globalAlpha = 1;
    }
  }

  return { burst, dust, sparkle, flyCoin, coinPayout, floatText, update, draw };
})();
</script>
<script>
/**
 * Events — need-based director for the ambient reward events.
 *
 * The pigeon (Poop Rain) and the tornado (Auto Merge) used to run on fixed
 * countdowns. They don't any more: this module watches the session and
 * releases each offer at the moment it is actually worth something.
 *
 *   Pigeon  — a depleted wallet. The player just spent most of their coins,
 *             can't afford the cheapest upgrade, opened a panel where every
 *             row is disabled, or has been stalled for a while. The offer
 *             reads as relief, exactly when they are short.
 *   Tornado — a crowded pen. 75%+ full with pairs waiting, spawning about to
 *             be blocked, an animal about to hop the fence, a long manual
 *             merging grind, or a pen that filled up while they were away.
 *             The offer reads as a speed-up, exactly when it saves work.
 *
 * On top of the triggers sit frequency limits, counted independently per
 * feature: at most MAX_PER_WINDOW appearances inside a rolling
 * WINDOW_MINUTES (rolling, so quotas can't be stacked across a boundary),
 * a minimum gap between two appearances, and a cooldown that grows with
 * every dismissal until repeated dismissals suppress the feature for the
 * rest of the session. Only appearances that are actually shown consume
 * quota — a trigger that another rule suppresses costs nothing — and the
 * timestamps live in the save, so closing the game never resets the count.
 *
 * Shared rules: never both features at once, never over an open popup, a
 * celebration, a cinematic or a tutorial, never in the first minutes of a
 * new game, and no pigeon while the pen is crowded enough to be a tornado
 * case (the poop reward needs free space and attention to be worth taking).
 *
 * Every appearance is logged with the condition that fired and how the
 * player answered it, so acceptance rates can be compared per condition and
 * the weak ones dropped after launch: the last EVENTS.LOG_MAX records live
 * in the save (Events.history) and each one is also handed to an optional
 * window.EventAnalytics(record) hook.
 *
 * Every threshold, cooldown, cap and interval lives in CONFIG.EVENTS and can
 * be overridden at runtime through window.RemoteConfig.EVENTS.
 */
const Events = (() => {
  const base = () => CONFIG.EVENTS;
  const over = () => (window.RemoteConfig || {}).EVENTS || {};
  const C = () => Object.assign({}, base(), over());
  /** One config section, Remote-Config overlaid (LIMITS / PIGEON / TORNADO). */
  const sub = k => Object.assign({}, base()[k], over()[k]);

  const FEATURES = ['pigeon', 'tornado'];
  const data = () => SaveManager.data.events;
  const slot = f => data()[f];

  // ---------------- session state ----------------
  let clock = 0;                 // seconds of active farm play this session
  const session = {
    dismissals: { pigeon: 0, tornado: 0 },
    pending: null,               // one-shot trigger: {feature, cond, expires}
    wallet: [],                  // {t, coins} samples over the spend window
    stallT: 0,                   // seconds unable to afford any upgrade
    merges: [],                  // clock stamps of manual merges
    offlineT: 0,                 // seconds the "came back to a full pen" case stays live
  };

  const present = f => f === 'pigeon' ? Pigeon.present : Tornado.present;

  // ---------------- bookkeeping ----------------
  /**
   * One frame of signal tracking. Called from the main loop while the farm
   * is being played; `paused` covers the tutorial and an unbuilt farm, where
   * no signal means anything yet.
   */
  function update(dt, paused) {
    if (paused || !C().ENABLED) return;
    clock += dt;
    data().play += dt;
    trackWallet(dt);
    if (session.offlineT > 0) session.offlineT -= dt;
    const p = session.pending;
    if (p && clock >= p.expires) session.pending = null;
  }

  /** Cheapest unlocked, non-maxed upgrade on this farm (Infinity if none). */
  function cheapestCost(farmId) {
    let min = Infinity;
    for (const k of Upgrades.keys(farmId)) {
      if (Upgrades.unlocked(farmId, k) && !Upgrades.isMaxed(farmId, k)) {
        min = Math.min(min, Upgrades.cost(farmId, k));
      }
    }
    return min;
  }

  /**
   * Wallet history (sampled, not per frame) plus the stall timer: how long
   * the player has been unable to afford a single upgrade on this farm.
   */
  function trackWallet(dt) {
    const P = sub('PIGEON'), farmId = SaveManager.data.currentFarm;
    const w = session.wallet;
    if (!w.length || clock - w[w.length - 1].t >= P.SAMPLE_INTERVAL) {
      w.push({ t: clock, coins: SaveManager.data.coins });
    }
    while (w.length && w[0].t < clock - P.SPEND_WINDOW) w.shift();
    const broke = cheapestCost(farmId) < Infinity && !Upgrades.anyAffordable(farmId);
    session.stallT = broke ? session.stallT + dt : 0;
  }

  /** Highest balance seen inside the spend window. */
  function walletPeak() {
    let peak = 0;
    for (const s of session.wallet) peak = Math.max(peak, s.coins);
    return peak;
  }

  function recentMerges(window) {
    while (session.merges.length && session.merges[0] < clock - window) session.merges.shift();
    return session.merges.length;
  }

  // ---------------- pen state (tornado signals) ----------------
  /**
   * Live snapshot of the pen: how full it is and how many merges are waiting.
   * Mutant pairs only count where the UFO is unlocked (they can't merge
   * otherwise, matching the funnel's own rule). Null while there is no
   * playable pen (map, tutorial, farm still under construction).
   */
  function penStats() {
    const scene = Game.farm;
    if (!scene || scene.tutorial || Game.scene !== 'farm') return null;
    const farmId = scene.farmId;
    const cap = Construction.capacity(farmId);
    if (cap <= 0) return null;
    const top = CONFIG.topStage(CONFIG.FARMS[farmId].species);
    const landed = SaveManager.data.ufo[farmId].landed;
    const counts = {};
    let count = 0;
    for (const a of scene.animals) {
      if (a.state === 'merging' || a.escaping) continue;
      count++;
      if (a.stage === top && !landed) continue;
      const k = a.species + ':' + a.stage;
      counts[k] = (counts[k] || 0) + 1;
    }
    let pairs = 0;
    for (const k in counts) pairs += Math.floor(counts[k] / 2);
    return { scene, farmId, count, cap, fill: count / cap, pairs };
  }

  /** Is an animal about to hop the fence? (construction farms only) */
  function jumpRisk(s, T) {
    const J = Construction.jumpCfg(s.farmId);
    if (!J) return false;
    const at = s.scene.jumpAt || J.PRESSURE_TIME;
    if (s.scene.penPressure / at < T.JUMP_WARN) return false;
    return s.scene.animals.some(a => a.stage >= J.MIN_STAGE && !a.escaping && !a.dead);
  }

  // ---------------- trigger conditions ----------------
  /**
   * Which wallet condition (if any) is true right now, strongest first. A
   * farm with nothing left to buy has no shortage to relieve, so it never
   * triggers.
   */
  function pigeonCondition() {
    const P = sub('PIGEON'), farmId = SaveManager.data.currentFarm;
    const cheapest = cheapestCost(farmId);
    if (cheapest === Infinity) return null;
    const coins = SaveManager.data.coins;
    if (coins >= cheapest) return null;              // they can still buy something
    if (session.stallT >= P.STALL_TIME) return 'stalled';
    const peak = walletPeak();
    if (peak >= cheapest * P.MIN_PEAK_COSTS && coins <= peak * (1 - P.SPEND_FRACTION)) {
      return 'spend_burst';
    }
    if (session.stallT >= P.BROKE_TIME) return 'below_cheapest';
    return null;
  }

  /** Which pen condition (if any) is true right now, most specific first. */
  function tornadoCondition() {
    const T = sub('TORNADO');
    const s = penStats();
    if (!s || s.pairs < 1) return null;
    if (session.offlineT > 0 && s.fill >= T.RETURN_FILL_PCT) return 'offline_return';
    if (jumpRisk(s, T)) return 'fence_jump_risk';
    if (s.count >= s.cap - T.NEAR_CAP_SLOTS) return 'spawn_blocked';
    if (s.pairs >= T.MIN_PAIRS && s.fill >= T.FILL_PCT) return 'pen_crowded';
    if (s.pairs >= T.MIN_PAIRS && recentMerges(T.MERGE_WINDOW) >= T.MERGE_GRIND) return 'manual_grind';
    return null;
  }

  /**
   * Pen too busy for a poop rain: the reward needs free space and the
   * player's attention, and a crowded pen is the tornado's moment, not the
   * pigeon's.
   */
  function penBusy() {
    const s = penStats();
    if (!s) return false;
    return s.fill >= sub('TORNADO').FILL_PCT || tornadoCondition() !== null;
  }

  // ---------------- frequency limits ----------------
  /** Appearance stamps inside the rolling window (clock jumps are dropped). */
  function windowStamps(f) {
    const L = sub('LIMITS'), t = Date.now();
    const s = slot(f);
    s.shown = s.shown.filter(ts => ts <= t && t - ts < L.WINDOW_MINUTES * 60000);
    return s.shown;
  }

  /** Seconds that must pass between two appearances of this feature. */
  function requiredGap(f) {
    const L = sub('LIMITS'), s = slot(f);
    return L.MIN_INTERVAL_MINUTES * 60
         + session.dismissals[f] * L.DISMISS_COOLDOWN_MINUTES * 60
         + (s.extra || 0);
  }

  function quotaOk(f) {
    const L = sub('LIMITS'), s = slot(f), t = Date.now();
    if (windowStamps(f).length >= L.MAX_PER_WINDOW) return false;
    if (s.last && t >= s.last && t - s.last < requiredGap(f) * 1000) return false;
    return true;
  }

  // ---------------- shared gating ----------------
  /**
   * Everything that has to be true before ANY appearance: past the new-game
   * grace, on a farm, nothing else on screen that the offer could interrupt
   * or collide with, the feature not suppressed by dismissals, and inside
   * its own frequency budget.
   */
  function canShow(f) {
    const g = C();
    if (!g.ENABLED) return false;
    if (data().play < g.NEW_GAME_GRACE) return false;
    if (Game.scene !== 'farm' || Game.celebrating || Game.upgradeTutorialActive) return false;
    if (UI.popup || UFO.cinematicActive || Tornado.active) return false;
    // never two offers at once (nor a second one over a rain still falling)
    if (present('pigeon') || present('tornado')) return false;
    if (session.dismissals[f] >= sub('LIMITS').DISMISS_SUPPRESS) return false;
    if (f === 'pigeon' && penBusy()) return false;
    return quotaOk(f);
  }

  /**
   * The feature asks whether it may appear. Returns the condition that fired
   * (to be handed straight back to shown()), or null. A queued one-shot
   * condition wins over the continuous ones and survives CONDITION_TTL
   * seconds, so a trigger that lands while a popup is open still fires the
   * moment the screen is free.
   */
  function request(f) {
    if (!canShow(f)) return null;
    const p = session.pending;
    if (p && p.feature === f) { session.pending = null; return p.cond; }
    return f === 'pigeon' ? pigeonCondition() : tornadoCondition();
  }

  /** Queue a one-shot condition raised by a game action (purchase, panel). */
  function queue(f, cond) {
    if (!C().ENABLED || present(f)) return;
    session.pending = { feature: f, cond, expires: clock + C().CONDITION_TTL };
  }

  // ---------------- one-shot triggers ----------------
  /**
   * An upgrade was bought. A purchase that leaves the wallet unable to reach
   * the next cheapest upgrade is the classic "I just spent everything"
   * moment the poop rain answers.
   */
  function onPurchase(farmId) {
    const P = sub('PIGEON');
    const cheapest = cheapestCost(farmId);
    if (cheapest === Infinity) return;
    if (SaveManager.data.coins < cheapest * P.EMPTY_FRACTION) queue('pigeon', 'purchase_emptied');
  }

  /**
   * An upgrade panel was opened. Every row disabled — at least one thing
   * left to buy, none of it affordable — is the player looking straight at
   * their shortage.
   */
  function onUpgradesOpened(farmId, group) {
    const keys = Upgrades.keys(farmId, group)
      .filter(k => Upgrades.unlocked(farmId, k) && !Upgrades.isMaxed(farmId, k));
    if (!keys.length) return;
    if (keys.some(k => Upgrades.affordable(farmId, k))) return;
    queue('pigeon', 'upgrades_all_disabled');
  }

  /** A manual drag-merge (the tornado's grind signal; storm merges don't count). */
  function onManualMerge() { session.merges.push(clock); }

  /**
   * Boot-time offline report: a long absence makes a pen that filled up
   * while away a tornado case for the next few minutes of play.
   */
  function onOfflineReturn(awaySec) {
    const T = sub('TORNADO');
    if (awaySec >= T.RETURN_AWAY) session.offlineT = T.RETURN_WINDOW;
  }

  // ---------------- appearance log ----------------
  function emit(rec) {
    if (C().LOG) console.log('[event]', rec.feature, rec.condition, rec.outcome);
    const hook = window.EventAnalytics;
    if (typeof hook === 'function') { try { hook(Object.assign({}, rec)); } catch (e) {} }
  }

  /** The most recent record for this feature (the one still being answered). */
  function lastRecord(f) {
    const log = data().log;
    for (let i = log.length - 1; i >= 0; i--) if (log[i].feature === f) return log[i];
    return null;
  }

  function outcome(f, result) {
    const rec = lastRecord(f);
    if (!rec || rec.outcome !== 'shown') return;
    rec.outcome = result;
    SaveManager.save();
    emit(rec);
  }

  /**
   * The feature is now on screen: consume quota, stamp the appearance and
   * log which condition released it.
   */
  function shown(f, cond) {
    const s = slot(f), t = Date.now();
    s.shown.push(t);
    s.last = t;
    s.extra = 0;
    windowStamps(f);
    const rec = { feature: f, condition: cond, t, outcome: 'shown' };
    const log = data().log;
    log.push(rec);
    while (log.length > C().LOG_MAX) log.shift();
    SaveManager.save();
    emit(rec);
  }

  /** The offer was taken (the reward ad completed). */
  function accepted(f) {
    slot(f).extra = f === 'pigeon'
      ? (CONFIG.PIGEON.REWARD_COOLDOWN || 0)
      : (CONFIG.TORNADO.REWARD_COOLDOWN || 0);
    session.dismissals[f] = 0;   // a claim clears the dismissal streak
    outcome(f, 'accepted');
  }

  /**
   * The offer was ignored (it timed out) or actively dismissed (the popup
   * was closed without watching). Each dismissal extends the cooldown, and
   * DISMISS_SUPPRESS of them shelve the feature for the rest of the session.
   * Counted once per appearance: closing the popup and then letting the
   * offer time out is one dismissal, not two.
   */
  function dismissed(f) {
    const rec = lastRecord(f);
    if (!rec || rec.outcome !== 'shown') return;
    session.dismissals[f]++;
    outcome(f, 'dismissed');
  }

  /** Acceptance rate per condition over the saved log — for tuning. */
  function stats() {
    const out = {};
    for (const r of data().log) {
      const k = r.feature + ':' + r.condition;
      const e = out[k] || (out[k] = { shown: 0, accepted: 0, dismissed: 0 });
      e.shown++;
      if (r.outcome === 'accepted') e.accepted++;
      else if (r.outcome === 'dismissed') e.dismissed++;
    }
    return out;
  }

  /** Full reset (save wipe): drop every session signal. */
  function reset() {
    clock = 0;
    session.pending = null;
    session.wallet = [];
    session.merges = [];
    session.stallT = 0;
    session.offlineT = 0;
    for (const f of FEATURES) session.dismissals[f] = 0;
  }

  return {
    update, request, shown, accepted, dismissed, reset, stats,
    onPurchase, onUpgradesOpened, onManualMerge, onOfflineReturn,
    // introspection (debug / tuning)
    penStats, pigeonCondition, tornadoCondition,
    get history() { return data().log; },
  };
})();
</script>
<script>
/**
 * UFOManager — end-game final-form collection layer.
 *
 * Every farm unlocks its own UFO independently. The first time two of a
 * chain's LAST board stage are merged on a farm, the full abduction
 * cinematic plays (gameplay paused, input blocked): the pair becomes that
 * chain's final form — on Farm 1 the Final Chicken, the hyper mutation at
 * the peak of the seven-stage chain, and the only animal the UFO ever takes
 * — a UFO flies in, beams it up, then parks permanently beside the farmhouse
 * in the upper-right corner of the scene, outside the pen. Every later
 * top-stage merge there is a sub-second quick collect into the parked UFO.
 *
 * Each collected final form permanently raises the UFO's passive coin drip
 * (aliens * Upgrades.alienValue coins every INTERVAL seconds — the internal
 * `aliens` counter/config names are kept for save compatibility).
 */
const UFO = (() => {
  const C = () => CONFIG.UFO;
  // each farm has its own UFO: always operate on the current farm's slot
  const data = () => SaveManager.data.ufo[SaveManager.data.currentFarm];
  // the collected final form is the current farm's own species
  const species = () => CONFIG.FARMS[SaveManager.data.currentFarm].species;
  // its display name comes from that chain (Farm 1: 'FINAL')
  const finalName = () => CONFIG.finalStage(species()).name;

  let cine = null;       // first-time cinematic {phase, t, x, y, ufoX, ufoY, alien:{y, s}, fromX, fromY}
  let collects = [];     // quick collect anims: {x, y, t}
  let prodT = 0;         // production timer
  let bobT = 0;          // idle hover / light animation clock
  let flashT = 0;        // brief tractor-beam flash when an alien arrives

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Permanent parking spot: hovering beside the farmhouse in the upper-right
   * corner of the scene, anchored to the view's top/right edges (not the
   * pen). It fills the clear sky strip between the top HUD bar (backdrop
   * ends at y 56) and the pen's back fence (starts at y 140), to the right
   * of the farmhouse (widest building ends at x 234) — fully outside the
   * fenced animal area, never covering the house, and clear of the settings
   * button (ends at y 44). The right flanking tree was moved to the
   * bottom-right grass (environment.js) to keep this corner open. The whole
   * 360x640 virtual view is letterboxed on every device, so an edge anchor
   * inside it stays fully visible and tappable at any resolution or aspect
   * ratio. (Saucer is 88x52 px, bottom-anchored; counter extends ~30 px
   * below.)
   */
  function spot() {
    return {
      x: CONFIG.VIEW_W - 48,   // right-edge anchored: saucer spans x 268-356
      y: 110,                  // top-edge anchored: saucer spans y 58-110
    };
  }

  /** Entry point from FarmScene.merge for a top-stage pair. */
  function collect(x, y) {
    // record the final form as in-transit so a reload mid-animation can't lose it
    data().pending = (data().pending || 0) + 1;
    SaveManager.save();
    if (!data().landed) {
      if (cine) return; // already playing (shouldn't happen: input is blocked)
      cine = {
        phase: 'spawn', t: 0, x, y,
        ufoX: x, ufoY: -30,
        alien: { y, s: 0 },
      };
    } else {
      collects.push({ x, y, t: 0 });
      AudioManager.play('beam');
    }
  }

  /** One reached the UFO: bump the collection + production for good. */
  function addAlien() {
    const p = spot();
    data().aliens++;
    data().pending = Math.max(0, (data().pending || 0) - 1);
    SaveManager.save();
    AudioManager.play('alien');
    VFXManager.burst(p.x, p.y - 24, ['#7de87a', '#c4ffb8', '#ffe98a', '#ffffff'], 20, 120);
    VFXManager.sparkle(p.x, p.y - 26, 14, 26);
    VFXManager.floatText(p.x, p.y - 52, '+1 ' + finalName(), '#c4ffb8');
    VFXManager.floatText(p.x, p.y - 38, '+' + Upgrades.alienValue(SaveManager.data.currentFarm) + '/' + C().INTERVAL.toFixed(0) + 'S');
    flashT = 0.3;
  }

  // ---------------- update ----------------
  function update(dt) {
    bobT += dt;
    if (flashT > 0) flashT -= dt;
    if (cine) { updateCinematic(dt); return; }

    // recover final forms stranded by a reload mid-animation
    const stranded = (data().pending || 0) - collects.length;
    if (stranded > 0) {
      if (!data().landed) {
        // replay the abduction from the middle of the pen
        const cx = ENVIRONMENT.PLAY.x + ENVIRONMENT.PLAY.w / 2;
        const cy = ENVIRONMENT.PLAY.y + ENVIRONMENT.PLAY.h / 2;
        cine = { phase: 'spawn', t: 0, x: cx, y: cy, ufoX: cx, ufoY: -30, alien: { y: cy, s: 0 } };
        return;
      }
      for (let i = 0; i < stranded; i++) addAlien();
    }

    // quick collects (post-landing, < 1 s each)
    for (let i = collects.length - 1; i >= 0; i--) {
      const c = collects[i];
      c.t += dt;
      if (c.t >= C().QUICK_COLLECT_TIME) {
        collects.splice(i, 1);
        addAlien();
      }
    }

    // passive coin production, scaling with the collection
    if (data().landed && data().aliens > 0) {
      prodT += dt;
      if (prodT >= C().INTERVAL) {
        prodT = 0;
        const p = spot();
        const value = data().aliens * Upgrades.alienValue(SaveManager.data.currentFarm);
        const t = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 18, t.x, t.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 34, '+' + value);
      }
    }
  }

  function updateCinematic(dt) {
    const c = cine, D = C().CINEMATIC;
    c.t += dt;
    if (c.phase === 'spawn') {
      // the merged pair materializes as the final form
      c.alien.s = U.easeOutBack(Math.min(c.t / 0.5, 1));
      if (Math.random() < 0.3) VFXManager.sparkle(c.x, c.y - 12, 3, 14);
      if (c.t >= D.SPAWN) { c.phase = 'arrive'; c.t = 0; AudioManager.play('ufo'); }
    } else if (c.phase === 'arrive') {
      // UFO descends from the sky to hover over the final form
      const t = smooth(c.t / D.ARRIVE);
      c.ufoX = c.x + Math.sin(t * Math.PI * 3) * 12 * (1 - t);
      c.ufoY = U.lerp(-30, c.y - 92, t);
      if (c.t >= D.ARRIVE) { c.phase = 'beam'; c.t = 0; AudioManager.play('beam'); }
    } else if (c.phase === 'beam') {
      // tractor beam pulls the final form up into the saucer
      const t = U.clamp(c.t / D.BEAM, 0, 1);
      c.alien.y = U.lerp(c.y, c.ufoY + 14, t * t);
      c.alien.s = 1 - t * 0.7;
      if (Math.random() < 0.5) VFXManager.sparkle(c.x, U.lerp(c.y, c.ufoY + 20, Math.random()), 2, 8);
      if (c.t >= D.BEAM) {
        c.phase = 'fly'; c.t = 0;
        c.fromX = c.ufoX; c.fromY = c.ufoY;
        VFXManager.burst(c.ufoX, c.ufoY - 10, ['#7de87a', '#c4ffb8', '#ffffff'], 16, 100);
        AudioManager.play('ufo');
      }
    } else if (c.phase === 'fly') {
      // cruise to the permanent landing corner with a little arc
      const p = spot();
      const t = smooth(c.t / D.FLY);
      c.ufoX = U.lerp(c.fromX, p.x, t);
      c.ufoY = U.lerp(c.fromY, p.y - 26, t) - Math.sin(t * Math.PI) * 26;
      if (c.t >= D.FLY) { c.phase = 'land'; c.t = 0; }
    } else if (c.phase === 'land') {
      const p = spot();
      c.ufoX = p.x;
      c.ufoY = U.lerp(p.y - 26, p.y, smooth(c.t / D.LAND));
      if (c.t >= D.LAND) {
        cine = null;
        data().landed = true;
        addAlien();   // first alien joins the collection (also saves)
      }
    }
  }

  // ---------------- draw ----------------
  /** Soft tractor-beam cone from the saucer belly down to the ground. */
  function drawBeam(ctx, x, topY, groundY, alpha, wTop = 7, wBot = 24) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = '#c4ffb8';
    ctx.beginPath();
    ctx.moveTo(x - wTop, topY); ctx.lineTo(x + wTop, topY);
    ctx.lineTo(x + wBot, groundY); ctx.lineTo(x - wBot, groundY);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath(); ctx.ellipse(x, groundY, wBot, 6, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawSaucer(ctx, x, y, aliens, shadow = true) {
    if (shadow) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(x, spot().y + 6, 26, 6, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    const phase = Math.floor(bobT * 5) % 3;
    PIXEL.blit(ctx, SPRITES.ufo(phase, aliens), x, y, 2);
  }

  function draw(ctx) {
    if (cine) { drawCinematic(ctx); return; }
    if (!data().landed) return;
    const p = spot();
    const bob = Math.sin(bobT * 2) * 2;

    // arrival flash: short tractor beam under the parked saucer
    if (flashT > 0) drawBeam(ctx, p.x, p.y - 6 + bob, p.y + 8, Math.min(1, flashT * 4));

    // final forms being beamed in (quick collect)
    for (const c of collects) {
      const t = U.clamp(c.t / C().QUICK_COLLECT_TIME, 0, 1);
      const pop = U.easeOutBack(Math.min(c.t / 0.15, 1));
      const e = smooth(t);
      const ax = U.lerp(c.x, p.x, e);
      const ay = U.lerp(c.y, p.y - 12, e) - Math.sin(e * Math.PI) * 36;
      PIXEL.blit(ctx, SPRITES.mutant2(species()), ax, ay, 2 * pop * (1 - t * 0.55));
      if (Math.random() < 0.5) VFXManager.sparkle(ax, ay - 8, 1, 6);
    }

    drawSaucer(ctx, p.x, p.y + bob, data().aliens);

    // collection counter under the saucer, in the sky gap above the pen's
    // back fence (fence starts at y 140; the counter ends right there)
    if (data().aliens > 0) {
      PIXEL.blit(ctx, SPRITES.mutant2(species()), p.x - 2, p.y + 30, 1);
      UI.drawText(ctx, 'X' + data().aliens, p.x + 6, p.y + 16, UI.SIZE.BODY, '#c4ffb8', 'left', true);
    }
  }

  function drawCinematic(ctx) {
    const c = cine;
    // dim the farm for drama
    ctx.fillStyle = 'rgba(8, 12, 28, 0.35)';
    ctx.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);

    if (c.phase === 'beam') {
      const pulse = 0.7 + Math.sin(bobT * 16) * 0.3;
      drawBeam(ctx, c.ufoX, c.ufoY - 4, c.y + 6, pulse);
    }
    if (c.phase !== 'fly' && c.phase !== 'land') {
      PIXEL.blit(ctx, SPRITES.mutant2(species()), c.x, c.alien.y, 2 * c.alien.s);
    }
    if (c.phase !== 'spawn') {
      drawSaucer(ctx, c.ufoX, c.ufoY, 0, c.phase === 'land');
    }
  }

  return {
    collect, update, draw,
    get cinematicActive() { return !!cine; },
    /** Clear transient animation state (farm switch / full reset). */
    reset() { cine = null; collects = []; prodT = 0; flashT = 0; },
  };
})();
</script>
<script>
/**
 * PigeonManager — reward-ad event layer (Pigeon & Poop Rain).
 *
 * A pigeon flies across the screen and lands on the back fence of the
 * current farm, where it perches for STAY_TIME seconds playing idle
 * animations (blinking, looking around, the odd wing flap). It visits when
 * the player is short on cash and stalled — the director in js/events.js
 * owns that decision and the frequency limits behind it, so the offer lands
 * as relief rather than on a timer.
 * Tapping it opens the reward-ad popup; completing the ad removes
 * the pigeon and triggers a Poop Rain: poops (the same asset the animals
 * produce) fall over the pen and each one auto-collects into coins. The
 * whole rain is worth REWARD_MINUTES of the farm's current passive income
 * (see poopValue), so the offer scales with the player's economy forever.
 * Ignoring the pigeon for STAY_TIME loses the opportunity until the next
 * visit.
 *
 * Per-farm state (remaining perch time) lives in SaveManager.data.pigeon,
 * so a pigeon left perched on one farm is restored when returning to it.
 * Only one pigeon can exist at a time on a farm, and it never appears
 * during the merge tutorial, the upgrade tutorial, celebrations or the
 * UFO cinematic (Game only ticks this manager during normal gameplay).
 *
 * Balancing values live in CONFIG.PIGEON and can be overridden at runtime
 * through window.RemoteConfig.PIGEON (Remote Config hook).
 */
const Pigeon = (() => {
  const C = () => Object.assign({}, CONFIG.PIGEON, (window.RemoteConfig || {}).PIGEON);
  // each farm has its own pigeon slot: always operate on the current farm's
  const data = () => SaveManager.data.pigeon[SaveManager.data.currentFarm];

  let bird = null;      // {state:'fly'|'idle'|'leave', t, x, y, fromX, fromY, toX, toY, dir, ...}
  let poops = [];       // {x, y, vy, groundY, state:'fall'|'land', t}
  let rain = null;      // {t, spawned}
  let rainValue = 0;    // coins per poop, locked in when the ad completes
  let shakeT = 0;       // impact screen-shake time left

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /**
   * Random perch spot on the back fence rail — clear of the UFO corner on
   * the right and the farmhouse behind the fence center.
   */
  function perchSpot() {
    // the current fence footprint — the pigeon perches on the real rail
    const P = ENVIRONMENT.playRect(SaveManager.data.currentFarm), cx = CONFIG.VIEW_W / 2;
    const x = Math.random() < 0.5
      ? U.rand(P.x + 30, cx - 64)
      : U.rand(cx + 64, P.x + P.w - 90);
    return { x, y: P.y - 12 };
  }

  /**
   * Coins one poop pays out. Auto mode (COIN_PER_POOP = 0): the whole rain
   * is worth REWARD_MINUTES of the farm's CURRENT passive income, split
   * evenly across POOP_COUNT poops. Pricing the ad off the live income
   * rate keeps it a meaningful accelerator at every stage of the game —
   * "a few minutes of progress, right now" — without ever dwarfing normal
   * play or going stale late-game. MIN_PER_POOP floors a fresh farm.
   */
  function poopValue() {
    const cfg = C();
    if (cfg.COIN_PER_POOP > 0) return cfg.COIN_PER_POOP;
    const farm = Game.farm;
    const rate = Upgrades.incomeRate(SaveManager.data.currentFarm, farm ? farm.animals : []);
    return Math.max(cfg.MIN_PER_POOP, Math.round(rate * cfg.REWARD_MINUTES * 60 / cfg.POOP_COUNT));
  }

  function spawn(restore, cond) {
    const p = perchSpot();
    const dir = Math.random() < 0.5 ? 1 : -1;   // 1 = enters from the left
    bird = {
      state: restore ? 'idle' : 'fly', t: 0,
      x: p.x, y: p.y, toX: p.x, toY: p.y,
      fromX: dir === 1 ? -24 : CONFIG.VIEW_W + 24,
      fromY: p.y - 70,
      dir,
      blink: false, blinkT: U.rand(1, 3),
      look: false, lookT: U.rand(2, 4),
      flap: 0, flapT: U.rand(3, 6),
      attractT: 2.0,
    };
    if (!restore) {
      bird.x = bird.fromX; bird.y = bird.fromY;
      data().remaining = C().STAY_TIME;
      SaveManager.save();
      Events.shown('pigeon', cond);   // consumes quota, logs the trigger
      AudioManager.play('flap');
    }
  }

  // ---------------- update ----------------
  function update(dt, tutorialActive) {
    if (shakeT > 0) shakeT -= dt;
    const d = data();

    const enabled = C().ENABLED; // kill switch gates new visits only

    // restore a pigeon that was left perched on this farm
    if (!bird && enabled && d.remaining > 0 && !tutorialActive) spawn(true);

    // a new visit is entirely the director's call: it fires the moment the
    // player is short on money and stalled, within the frequency limits
    if (!bird && enabled && d.remaining <= 0 && !tutorialActive) {
      const cond = Events.request('pigeon');
      if (cond) spawn(false, cond);
    }

    if (bird) updateBird(dt);
    if (rain || poops.length) updateRain(dt);
  }

  function updateBird(dt) {
    const b = bird, d = data();
    b.t += dt;
    if (b.state === 'fly') {
      // swoop across the sky, then glide down onto the fence rail
      const t = smooth(b.t / C().FLY_TIME);
      b.x = U.lerp(b.fromX, b.toX, t);
      b.y = U.lerp(b.fromY, b.toY, t * t) - Math.sin(t * Math.PI) * 16;
      if (b.t >= C().FLY_TIME) {
        b.state = 'idle'; b.t = 0; b.x = b.toX; b.y = b.toY;
        VFXManager.dust(b.x, b.y, 4);
        AudioManager.play('coo');
      }
    } else if (b.state === 'idle') {
      // perch countdown (frozen while the reward popup / ad is open, so
      // closing the popup never eats the player's remaining window)
      const p = UI.popup;
      const frozen = p && (p.type === 'pigeonAd' || p.type === 'adPlaying');
      if (!frozen) {
        d.remaining -= dt;
        if (d.remaining <= 0) {
          // ignored: the opportunity is lost, and the miss extends the
          // cooldown before the next one (see Events.dismissed)
          d.remaining = 0;
          SaveManager.save();
          Events.dismissed('pigeon');
          b.state = 'leave'; b.t = 0;
          b.fromX = b.x; b.fromY = b.y;
          b.dir = b.x < CONFIG.VIEW_W / 2 ? -1 : 1;
          AudioManager.play('flap');
          return;
        }
      }
      // idle acting: blink, look around, occasional wing flap
      b.blinkT -= dt;
      if (b.blinkT <= 0) { b.blink = !b.blink; b.blinkT = b.blink ? 0.12 : U.rand(1.5, 4); }
      b.lookT -= dt;
      if (b.lookT <= 0) { b.look = !b.look; b.lookT = b.look ? U.rand(0.5, 1.1) : U.rand(2, 4.5); }
      if (b.flap > 0) b.flap -= dt;
      else {
        b.flapT -= dt;
        if (b.flapT <= 0) { b.flap = 0.4; b.flapT = U.rand(3.5, 7); AudioManager.play('flap'); }
      }
      // attention sparkle so the player spots the visitor
      b.attractT -= dt;
      if (b.attractT <= 0) { b.attractT = 3.2; VFXManager.sparkle(b.x, b.y - 28, 4, 10); }
    } else if (b.state === 'leave') {
      const t = b.t / C().LEAVE_TIME;
      b.x = b.fromX + b.dir * t * 260;
      b.y = b.fromY - smooth(t) * 180 + Math.sin(b.t * 14) * 2;
      if (b.t >= C().LEAVE_TIME) bird = null;
    }
  }

  function updateRain(dt) {
    if (rain) {
      rain.t += dt;
      const count = C().POOP_COUNT;
      const gap = C().RAIN_DURATION / count;
      while (rain.spawned < count && rain.t >= rain.spawned * gap) {
        const P = ENVIRONMENT.playRect(SaveManager.data.currentFarm);
        poops.push({
          x: U.rand(P.x + 14, P.x + P.w - 14),
          groundY: U.rand(P.y + 20, P.y + P.h - 8),
          y: -16 - U.rand(0, 30),
          vy: U.rand(120, 200),
          state: 'fall', t: 0,
        });
        rain.spawned++;
      }
      if (rain.spawned >= count) rain = null;
    }
    for (let i = poops.length - 1; i >= 0; i--) {
      const p = poops[i];
      p.t += dt;
      if (p.state === 'fall') {
        p.vy += 620 * dt;
        p.y += p.vy * dt;
        if (p.y >= p.groundY) {
          p.y = p.groundY; p.state = 'land'; p.t = 0;
          VFXManager.dust(p.x, p.y, 6);
          AudioManager.play('poop');
          shakeT = 0.18;
        }
      } else if (p.t >= 0.4) {
        // auto-collect: the poop turns into coins flying to the HUD
        const value = rainValue;
        const tgt = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 6, tgt.x, tgt.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 18, '+' + value);
        VFXManager.sparkle(p.x, p.y - 8, 5, 8);
        poops.splice(i, 1);
      }
    }
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the perched pigeon (opens the ad popup). */
  function tap(x, y) {
    if (!bird || bird.state !== 'idle') return false;
    if (U.dist(x, y, bird.x, bird.y - 12) > 22) return false;
    AudioManager.play('coo');
    UI.openPopup({ type: 'pigeonAd' });
    return true;
  }

  /** The reward ad finished successfully: pigeon leaves, poops fall. */
  function adCompleted() {
    const d = data();
    d.remaining = 0;
    SaveManager.save();
    Events.accepted('pigeon');   // applies REWARD_COOLDOWN on top of the gap
    if (bird) {
      VFXManager.burst(bird.x, bird.y - 12, ['#ffe98a', '#fff6d0', '#c6cfd8', '#ffffff'], 14, 100);
      VFXManager.sparkle(bird.x, bird.y - 16, 8, 14);
      bird = null;
    }
    rainValue = poopValue();
    rain = { t: 0, spawned: 0 };
    AudioManager.play('unlock');
  }

  // ---------------- draw ----------------
  function draw(ctx) {
    // ground shadows under falling poops
    for (const p of poops) {
      if (p.state !== 'fall') continue;
      const near = U.clamp(1 - (p.groundY - p.y) / 220, 0.15, 1);
      ctx.globalAlpha = 0.22 * near;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(p.x, p.groundY + 2, 8 * near + 2, 3 * near + 1, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (bird) {
      const b = bird;
      const flying = b.state !== 'idle';
      let frame = 'idle';
      if (flying) frame = Math.floor(b.t * 12) % 2 ? 'flapUp' : 'flapDn';
      else if (b.flap > 0) frame = Math.floor(b.t * 16) % 2 ? 'flapUp' : 'flapDn';
      else if (b.look) frame = 'look';
      const bob = b.state === 'idle' ? Math.sin(b.t * 2.2) * 0.8 : 0;
      const img = SPRITES.pigeon(frame, b.blink && !flying);
      PIXEL.blit(ctx, img, b.x, b.y + bob, 2, b.dir === -1);

      // golden "!" bubble while perched, so the offer reads as tappable
      if (b.state === 'idle') {
        const pulse = Math.sin(b.t * 5) * 2;
        const by = b.y - 40 + pulse;
        ctx.fillStyle = PIXEL.OUTLINE;
        ctx.beginPath(); ctx.arc(b.x, by, 8, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.gold;
        ctx.beginPath(); ctx.arc(b.x, by, 6, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.goldHi;
        ctx.beginPath(); ctx.arc(b.x - 1, by - 1, 4, 0, 7); ctx.fill();
        ctx.fillStyle = SPRITES.P.gold;
        ctx.beginPath(); ctx.arc(b.x, by + 1, 4, 0, 7); ctx.fill();
        UI.drawText(ctx, '!', b.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
      }
    }

    // falling poops (same asset the animals produce, squash bounce on impact)
    for (const p of poops) {
      const squash = p.state === 'land' && p.t < 0.18 ? 0.72 + (p.t / 0.18) * 0.28 : 1;
      PIXEL.blit(ctx, SPRITES.poop(0), p.x, p.y + 4, 2, false, squash, 1 + (1 - squash) * 0.8);
    }
  }

  /** Subtle screen offset while a poop impact shake is active. */
  function shakeOffset() {
    if (shakeT <= 0) return { x: 0, y: 0 };
    const a = (shakeT / 0.18) * 2.2;
    return { x: (Math.random() * 2 - 1) * a, y: (Math.random() * 2 - 1) * a };
  }

  /** Reward panel numbers for the popup. */
  function info() {
    return { count: C().POOP_COUNT, value: poopValue(), adDur: C().AD_DURATION };
  }

  /**
   * Clear transient animation state (farm switch / full reset). A rain in
   * progress pays out its remaining poops instantly so switching farms
   * never costs the player their reward; discard=true (save reset) skips it.
   */
  function reset(discard = false) {
    if (!discard) {
      const pending = poops.length + (rain ? C().POOP_COUNT - rain.spawned : 0);
      if (pending > 0) Game.addCoins(pending * rainValue);
    }
    bird = null; poops = []; rain = null; shakeT = 0;
  }

  return {
    update, draw, tap, adCompleted, shakeOffset, info, reset,
    /** Anything of this event on screen — a bird, or a rain still falling. */
    get present() { return !!bird || !!rain || poops.length > 0; },
  };
})();
</script>
<script>
/**
 * TornadoManager — reward-ad event layer (Tornado Auto Merge).
 *
 * Once the pen is crowded enough that the sweep saves real work — a backlog
 * of matchable animals, spawning about to be blocked, an animal about to hop
 * the fence — a tornado icon appears on the left side of the screen and
 * stays available for STAY_TIME seconds. The director in js/events.js owns
 * that decision and the frequency limits behind it. Tapping it opens
 * the reward-ad popup; completing the ad sends a large pixel tornado
 * sweeping across the farm. The tornado is pure quality-of-life: it
 * performs exactly the merges the player could make by hand, only much
 * faster. It sweeps the pen collecting every animal that will take part
 * in a merge and leaves everything else grazing untouched; then, once
 * collection is complete, the pooled animals resolve in one cascading
 * pass (2 x level N -> 1 x level N+1, repeated until fewer than 2 remain
 * at every level — e.g. 4 babies -> 2 adults -> 1 elder). Animals are
 * pooled and merged strictly per species, never across species, matching
 * the manual drag-merge rule. Odd leftovers survive unchanged, and
 * top-stage animals only pair off into the chain's final form on farms where the UFO
 * has already been unlocked — otherwise they are never even collected.
 * The evolved survivors are tossed back onto the farm and the tornado
 * leaves. Ignoring the icon loses the offer until the next cycle.
 *
 * Per-farm state (remaining availability of an offer already on screen)
 * lives in SaveManager.data.tornado.
 * Only one offer can be active at a time on a farm, and it never appears
 * during the merge tutorial (Game only ticks this manager during normal
 * gameplay). While the tornado is running all farm input is blocked and
 * spawning is paused; normal gameplay resumes the moment it leaves.
 *
 * Balancing values live in CONFIG.TORNADO and can be overridden at
 * runtime through window.RemoteConfig.TORNADO (Remote Config hook).
 */
const Tornado = (() => {
  const C = () => Object.assign({}, CONFIG.TORNADO, (window.RemoteConfig || {}).TORNADO);
  // each farm has its own tornado slot: always operate on the current farm's
  const data = () => SaveManager.data.tornado[SaveManager.data.currentFarm];

  const ICON = { x: 38, y: 132 };  // bottom-anchored icon spot, left side

  let icon = null;   // {t} the offer icon is visible / available
  let run = null;    // active tornado, see start()
  let clockT = 0;    // spin animation clock

  const smooth = t => { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  // ---------------- availability cycle ----------------
  function update(dt, tutorialActive) {
    clockT += dt;
    const d = data();
    if (!C().ENABLED) { icon = null; return; }

    // restore an offer that was left available on this farm
    if (!icon && d.remaining > 0 && !tutorialActive) icon = { t: 0 };

    // a new offer is entirely the director's call: it is released the moment
    // the pen backs up enough for the sweep to be worth it, within the
    // frequency limits (never during the tutorial, one offer at a time)
    if (!icon && d.remaining <= 0 && !tutorialActive) {
      const cond = Events.request('tornado');
      if (cond) {
        icon = { t: 0 };
        d.remaining = C().STAY_TIME;
        SaveManager.save();
        Events.shown('tornado', cond);   // consumes quota, logs the trigger
        VFXManager.sparkle(ICON.x, ICON.y - 20, 8, 16);
        AudioManager.play('pop');
      }
    }

    if (icon) {
      // availability countdown (frozen while the reward popup / ad is
      // open, so closing the popup never eats the player's window)
      const p = UI.popup;
      const frozen = p && (p.type === 'tornadoAd' || p.type === 'adPlaying');
      if (!frozen) {
        icon.t += dt;
        d.remaining -= dt;
        if (d.remaining <= 0) {
          // ignored: the opportunity is lost, and the miss extends the
          // cooldown before the next one (see Events.dismissed)
          d.remaining = 0;
          SaveManager.save();
          Events.dismissed('tornado');
          icon = null;
        }
      }
    }
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the tornado icon (opens the ad popup). */
  function tap(x, y) {
    if (!icon || run) return false;
    if (U.dist(x, y, ICON.x, ICON.y - 16) > 24) return false;
    AudioManager.play('click');
    UI.openPopup({ type: 'tornadoAd' });
    return true;
  }

  /** Reward panel numbers for the popup. */
  function info() {
    return { adDur: C().AD_DURATION };
  }

  /** The reward ad finished successfully: consume the offer, unleash it. */
  function adCompleted() {
    const d = data();
    d.remaining = 0;
    SaveManager.save();
    Events.accepted('tornado');   // applies REWARD_COOLDOWN on top of the gap
    if (icon) {
      VFXManager.burst(ICON.x, ICON.y - 16, ['#c8cdd4', '#eef2f6', '#ffe98a'], 12, 90);
      icon = null;
    }
    start();
  }

  // ---------------- active tornado ----------------
  function start() {
    const scene = Game.farm;
    scene.pointerUp(); // settle any in-progress drag defensively
    run = {
      phase: 'enter', t: 0,
      scene,
      x: -40,
      y: scene.bounds.y + scene.bounds.h * 0.55,
      held: [],      // animals spinning inside: {species, stage, angle, r, h, maxH, spin, pull, sx, sy}
      ejected: 0,    // eject-phase counter
      dustT: 0,
    };
    AudioManager.play('wind');
  }

  /**
   * Simulate the full merge cascade over ALL animals (farm + funnel),
   * pooled per species — never across species, matching the manual
   * drag-merge rule. Returns, per species, the set of stages that will
   * see at least one merge: exactly the animals worth collecting. A
   * stage with a single animal only becomes "active" when lower-stage
   * merges will produce it a partner, so untouched singles stay out.
   * Max-level Mutants only pair off where the UFO has been unlocked.
   */
  function mergePlan() {
    const top = CONFIG.topStage(CONFIG.FARMS[run.scene.farmId].species);
    const landed = SaveManager.data.ufo[run.scene.farmId].landed;
    const pools = {};
    const add = (sp, st) => {
      const c = pools[sp] = pools[sp] || [];
      c[st] = (c[st] || 0) + 1;
    };
    for (const a of run.scene.animals) if (a.state !== 'merging') add(a.species, a.stage);
    for (const h of run.held) add(h.species, h.stage);
    const active = {};
    for (const sp in pools) {
      const counts = pools[sp];
      active[sp] = new Set();
      for (let s = 0; s <= top; s++) {
        const canPair = s < top || landed;
        const pairs = canPair ? Math.floor((counts[s] || 0) / 2) : 0;
        if (pairs > 0) active[sp].add(s);
        if (s < top) counts[s + 1] = (counts[s + 1] || 0) + pairs;
      }
    }
    return active;
  }

  /** Will this animal take part in the cascade? (see mergePlan) */
  function collectible(a, active) {
    if (a.escaping) return false;   // already leaving: no longer matchable
    return !!active[a.species] && active[a.species].has(a.stage);
  }

  /** Pull one farm animal into the funnel. */
  function capture(a) {
    a.dead = true; // FarmScene.update would splice it, but we run instead
    const i = run.scene.animals.indexOf(a);
    if (i >= 0) run.scene.animals.splice(i, 1);
    run.held.push({
      species: a.species, stage: a.stage,
      angle: U.rand(0, Math.PI * 2),
      r: U.rand(12, 22),
      h: 6, maxH: U.rand(16, 48),
      spin: U.rand(0, 5),
      pull: 0, sx: a.x, sy: a.y,
    });
    VFXManager.dust(a.x, a.y, 5);
    AudioManager.play('flap');
  }

  /**
   * Suck in the collectible animals the sweeping funnel has passed or
   * come close to. Animals that won't merge are left grazing untouched.
   */
  function captureNear() {
    const active = mergePlan();
    for (let i = run.scene.animals.length - 1; i >= 0; i--) {
      const a = run.scene.animals[i];
      if (a.state === 'merging' || !collectible(a, active)) continue;
      if (a.x < run.x + 22 || U.dist(a.x, a.y, run.x, run.y) < 52) capture(a);
    }
  }

  /**
   * Magnet mode (gather phase): pull in every remaining collectible
   * animal regardless of distance, so the pool is complete before the
   * one-shot resolution.
   */
  function captureRemaining() {
    const active = mergePlan();
    for (let i = run.scene.animals.length - 1; i >= 0; i--) {
      const a = run.scene.animals[i];
      if (a.state === 'merging' || !collectible(a, active)) continue;
      capture(a);
    }
  }

  /** Toss one funnel animal back onto a free spot of the pen. */
  function eject(h) {
    const r = run;
    let p = r.scene.randomSpot(), tries = 0;
    while (tries++ < 12 && r.scene.animals.some(a => U.dist(a.x, a.y, p.x, p.y) < 40)) {
      p = r.scene.randomSpot();
    }
    const a = new Animal(h.species, h.stage, p.x, p.y);
    r.scene.animals.push(a);
    VFXManager.dust(p.x, p.y, 6);
    AudioManager.play('pop');
  }

  /**
   * Collection is complete: resolve the whole pool in one cascading pass.
   * Per species (never across species), from the lowest level up:
   * 2 x level N -> 1 x level N+1, newly created animals feeding straight
   * into the next level, until fewer than 2 remain at every level. Odd
   * leftovers survive unchanged. Top-stage pairs become the final form
   * only where the UFO is unlocked; otherwise Mutants pass through as-is.
   * The survivors replace the funnel contents for the eject phase.
   */
  function resolvePool() {
    const r = run;
    const top = CONFIG.topStage(CONFIG.FARMS[r.scene.farmId].species);
    const landed = SaveManager.data.ufo[r.scene.farmId].landed;
    const pools = {};
    for (const h of r.held) {
      const c = pools[h.species] = pools[h.species] || [];
      c[h.stage] = (c[h.stage] || 0) + 1;
    }
    const survivors = [];
    let aliens = 0, ty = r.y - 70;
    for (const sp in pools) {
      const counts = pools[sp];
      for (let s = 0; s <= top; s++) {
        let c = counts[s] || 0;
        if (s < top) {
          const pairs = Math.floor(c / 2);
          if (pairs > 0) {
            counts[s + 1] = (counts[s + 1] || 0) + pairs;
            c -= pairs * 2;
            // discoveries still count (no celebration mid-storm)
            Discovery.mark(sp, s + 1);
            VFXManager.floatText(r.x, ty, pairs + 'X ' + CONFIG.stageName(sp, s + 1) + '!');
            ty -= 14;
          }
        } else if (landed) {
          const pairs = Math.floor(c / 2);
          c -= pairs * 2;
          aliens += pairs;
        }
        // odd leftovers and unmergeable max-level animals survive as-is
        for (let i = 0; i < c; i++) survivors.push({ species: sp, stage: s });
      }
    }
    // one big satisfying blast as everything evolves at once
    AudioManager.play('merge');
    VFXManager.burst(r.x, r.y - 44, ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'], 26, 130);
    VFXManager.sparkle(r.x, r.y - 50, 16, 26);
    if (aliens > 0) {
      VFXManager.burst(r.x, r.y - 44, ['#7de87a', '#c4ffb8', '#a07cc0'], 14, 110);
      VFXManager.floatText(r.x, ty,
        aliens + 'X ' + CONFIG.finalStage(CONFIG.FARMS[r.scene.farmId].species).name + '!', '#c4ffb8');
      for (let i = 0; i < aliens; i++) UFO.collect(r.x + U.rand(-10, 10), r.y - 40);
    }
    // survivors keep spinning in the funnel until ejected one by one
    r.held = survivors.map(v => ({
      species: v.species, stage: v.stage,
      angle: U.rand(0, Math.PI * 2), r: U.rand(12, 22),
      h: U.rand(16, 40), maxH: U.rand(16, 48),
      spin: U.rand(0, 5), pull: 1, sx: r.x, sy: r.y,
    }));
  }

  /** Main tick while the tornado is on the farm (gameplay is paused). */
  function updateRun(dt) {
    const r = run, cfg = C();
    const speed = Math.max(0.2, cfg.TRAVEL_SPEED);
    clockT += dt;
    r.t += dt;

    // animals spiral around the funnel, rising as they get pulled in
    for (const h of r.held) {
      h.angle += dt * (7 + h.spin);
      if (h.pull < 1) h.pull = Math.min(1, h.pull + dt / 0.3);
      h.h = Math.min(h.maxH, h.h + dt * 40);
    }

    // constant dust, leaves and debris kicked up around the base
    r.dustT -= dt;
    if (r.dustT <= 0) {
      r.dustT = 0.07;
      VFXManager.dust(r.x + U.rand(-16, 16), r.y + U.rand(-2, 4), 2);
      if (Math.random() < 0.45) {
        VFXManager.burst(r.x + U.rand(-12, 12), r.y - U.rand(6, 56),
          ['#5e9c31', '#7dbb4a', '#c8b088', '#b09a72'], 2, 55);
      }
    }

    // untouched animals keep wandering and poops keep ripening while the
    // storm works (only spawning and player input are paused)
    for (let i = r.scene.animals.length - 1; i >= 0; i--) {
      const a = r.scene.animals[i];
      a.update(dt, r.scene.bounds, r.scene);
      if (a.dead) r.scene.animals.splice(i, 1);
    }
    r.scene.updatePoops(dt);

    if (r.phase === 'enter') {
      // roll in from the left edge
      const t = smooth(r.t / (0.7 / speed));
      r.x = U.lerp(-40, r.scene.bounds.x + 8, t);
      if (t >= 1) { r.phase = 'sweep'; r.t = 0; }
    } else if (r.phase === 'sweep') {
      // weave across the whole pen, collecting every animal that will
      // take part in the cascade — no merging yet, collection only
      const B = r.scene.bounds;
      const t = Math.min(r.t / (2.6 / speed), 1);
      r.x = U.lerp(B.x + 8, B.x + B.w - 8, t);
      r.y = B.y + B.h * 0.55 + Math.sin(t * Math.PI * 2.2) * B.h * 0.28;
      captureNear();
      if (t >= 1) { r.phase = 'gather'; r.t = 0; }
    } else if (r.phase === 'gather') {
      // drift to the pen center, magnet-pull any collectible stragglers,
      // then — with the pool complete — resolve every merge at once
      const B = r.scene.bounds;
      r.x = U.lerp(r.x, B.x + B.w / 2, Math.min(1, dt * 2.5));
      r.y = U.lerp(r.y, B.y + B.h * 0.5, Math.min(1, dt * 2.5));
      captureRemaining();
      if (r.t >= 0.5 / speed) {
        resolvePool();
        r.phase = 'eject'; r.t = 0; r.ejected = 0;
      }
    } else if (r.phase === 'eject') {
      // toss the evolved survivors back out, one animal at a time
      while (r.held.length && r.t >= r.ejected * C().MERGE_INTERVAL) {
        eject(r.held.shift());
        r.ejected++;
      }
      if (!r.held.length) {
        r.scene.persist();
        r.phase = 'exit'; r.t = 0; r.exitX = r.x;
        AudioManager.play('wind');
      }
    } else if (r.phase === 'exit') {
      // spin away past the right edge; normal gameplay resumes right after
      const t = r.t / (0.8 / speed);
      r.x = U.lerp(r.exitX, CONFIG.VIEW_W + 50, t * t);
      if (t >= 1) { run = null; }
    }
  }

  // ---------------- draw ----------------
  function drawIcon(ctx) {
    const t = icon.t;
    const bob = Math.sin(t * 3) * 1.5;
    // pulsing golden ring so the offer reads as tappable
    const pulse = (Math.sin(t * 5) + 1) / 2;
    ctx.save();
    ctx.globalAlpha = 0.35 + pulse * 0.3;
    ctx.strokeStyle = '#ffe98a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ICON.x, ICON.y - 16, 20 + pulse * 2, 0, 7); ctx.stroke();
    ctx.restore();
    const frame = Math.floor(clockT * 10) % 3;
    PIXEL.blit(ctx, SPRITES.tornado(frame), ICON.x, ICON.y + bob, 1.2);
    // golden "!" bubble, matching the pigeon offer style
    const by = ICON.y - 44 + Math.sin(t * 5) * 2;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.beginPath(); ctx.arc(ICON.x, by, 8, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.gold;
    ctx.beginPath(); ctx.arc(ICON.x, by, 6, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.goldHi;
    ctx.beginPath(); ctx.arc(ICON.x - 1, by - 1, 4, 0, 7); ctx.fill();
    ctx.fillStyle = SPRITES.P.gold;
    ctx.beginPath(); ctx.arc(ICON.x, by + 1, 4, 0, 7); ctx.fill();
    UI.drawText(ctx, '!', ICON.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
    // remaining availability bar under the icon
    const frac = U.clamp(data().remaining / C().STAY_TIME, 0, 1);
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(ICON.x - 14, ICON.y + 5, 28, 5);
    ctx.fillStyle = '#3a2817';     ctx.fillRect(ICON.x - 13, ICON.y + 6, 26, 3);
    ctx.fillStyle = '#ffe98a';     ctx.fillRect(ICON.x - 13, ICON.y + 6, Math.round(26 * frac), 3);
  }

  function drawRun(ctx) {
    const r = run;
    // ground shadow
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath(); ctx.ellipse(r.x, r.y + 5, 26, 7, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;

    // orbit position of a held animal (pull-in lerps from its old spot)
    const pos = h => {
      const ox = r.x + Math.cos(h.angle) * h.r;
      const oy = r.y - h.h + Math.sin(h.angle) * h.r * 0.35;
      const e = smooth(h.pull);
      return { x: U.lerp(h.sx, ox, e), y: U.lerp(h.sy, oy, e) };
    };
    const back = r.held.filter(h => Math.sin(h.angle) < 0);
    const front = r.held.filter(h => Math.sin(h.angle) >= 0);
    const drawHeld = h => {
      const p = pos(h);
      const img = SPRITES.animal(h.species, h.stage, 'idle', false);
      PIXEL.blit(ctx, img, p.x, p.y, 1.25, Math.cos(h.angle) < 0);
    };
    // behind the funnel, then the funnel, then the front arc
    for (const h of back) drawHeld(h);
    const frame = Math.floor(clockT * 14) % 3;
    const wob = Math.sin(clockT * 9) * 2;
    PIXEL.blit(ctx, SPRITES.tornado(frame), r.x + wob, r.y + 6, 2.2, false, 1, 1 + Math.sin(clockT * 13) * 0.05);
    for (const h of front) drawHeld(h);
  }

  function draw(ctx) {
    if (icon && !run) drawIcon(ctx);
    if (run) drawRun(ctx);
  }

  /**
   * Animals currently held inside the funnel, as save-format entries.
   * FarmScene.persist appends this so an autosave / reload mid-tornado
   * can never lose the herd (they come back unmerged, nothing worse).
   */
  function heldSnapshot(farmId) {
    if (!run || run.scene.farmId !== farmId) return [];
    return run.held.map(h => ({ stage: h.stage }));
  }

  /** Clear transient animation state (farm switch / full reset). */
  function reset() { icon = null; run = null; }

  return {
    update, updateRun, draw, tap, adCompleted, info, heldSnapshot, reset,
    get active() { return !!run; },
    /** Anything of this event on screen — the offer icon or the storm itself. */
    get present() { return !!icon || !!run; },
  };
})();
</script>
<script>
/**
 * Crate — the parachute surprise box (Farm 1 for now, see CONFIG.CRATE).
 *
 * Every COOLDOWN seconds a wooden crate drifts down under a parachute and
 * lands on a free slot inside the pen. It rests there with a gentle idle
 * animation and NEVER expires: the offer is only consumed when the player
 * taps it, which opens the reveal popup (UI 'crateReveal'). From there they
 * either COLLECT the animal inside, or watch a rewarded ad to get the next
 * evolution up instead. Dismissing the popup leaves the crate on the ground,
 * still tappable — the reward can't be lost by accident.
 *
 * What's inside is rolled once, when the crate spawns, and persisted, so the
 * reveal shows the same animal across a reopen or a relaunch. The pool comes
 * from the farm's own chain via CONFIG.cratePool (a rule, not a list: the
 * first entry and the last two are excluded), filtered down to stages the
 * player has already discovered so the box never spoils an unseen animal.
 * Because the top two chain entries are excluded, the ad upgrade — always
 * roll + 1 — can never produce the chain's final form.
 *
 * Per-farm state lives in SaveManager.data.crate: the cooldown, whether a
 * crate is currently resting in the pen, the stage rolled inside it, and a
 * granted animal still waiting for a free slot. The cooldown only runs while
 * there is nothing waiting for the player (no crate on the ground, no
 * pending animal), so an ignored crate never queues up a second one; it
 * keeps running while the game is closed, through Idle.reconcile, under the
 * same offline cap as every other system.
 *
 * Balancing values live in CONFIG.CRATE and can be overridden at runtime
 * through window.RemoteConfig.CRATE (Remote Config hook).
 */
const Crate = (() => {
  const C = () => Object.assign({}, CONFIG.CRATE, (window.RemoteConfig || {}).CRATE);
  const data = (id = SaveManager.data.currentFarm) => SaveManager.data.crate[id];
  const speciesOf = id => CONFIG.FARMS[id].species;

  /** Does this farm run the surprise box at all? (per-farm opt-in) */
  function enabledFor(farmId) {
    const cfg = C();
    return !!cfg.ENABLED && !!(cfg.ENABLED_FARMS || [])[farmId];
  }

  /**
   * Is the feature live on this farm yet? It stays completely dormant — no
   * crates, no cooldown, nothing shown anywhere — until the player has
   * discovered that farm's ENTIRE chain, the final abducted form included.
   * The box is an end-of-collection reward, so before that point it does not
   * exist as far as the rest of the game is concerned.
   *
   * Completion is latched into the save the first time it is seen, so the
   * feature can never switch itself back off. The latch frame deliberately
   * returns false and (re)starts the cooldown from that moment: the first
   * crate arrives one full cooldown after the collection is finished, and
   * offline time from before the unlock can't be spent on it.
   */
  function unlocked(farmId) {
    if (!enabledFor(farmId)) return false;
    const d = SaveManager.data;
    if (d.crateUnlocked[farmId]) return true;
    if (!Discovery.chainComplete(farmId)) return false;
    d.crateUnlocked[farmId] = true;
    data(farmId).next = C().COOLDOWN;
    SaveManager.save();
    return false;
  }

  /** Pure read of that latch, for draw paths that must not mutate state. */
  function isLive(farmId) {
    return enabledFor(farmId) && !!SaveManager.data.crateUnlocked[farmId];
  }

  let box = null;        // {state:'drop'|'land'|'idle', t, x, y, fromY, groundY, sway, chute, sparkleT}
  let opening = null;    // in-scene opening sequence, see startOpening()
  let retryT = 0;        // seconds until the next landing-spot attempt while the pen is full
  let claiming = false;  // re-entrancy guard around a grant

  // ---------------- contents ----------------
  /**
   * The stages this farm's box may contain: simply the chain's eligible pool
   * (CONFIG.cratePool — the chain minus its first entry and its last two).
   * No discovery filter is needed on top of that: the feature only runs once
   * the whole chain has been discovered (see `unlocked`), so every entry in
   * the pool is by definition an animal the player has already seen.
   */
  function pool(farmId) {
    return CONFIG.cratePool(speciesOf(farmId));
  }

  /**
   * Weighted pick from that pool. WEIGHTS maps onto the chain's eligible
   * entries lowest-tier-first (so weights stay meaningful whichever stages
   * are currently discovered); a pool longer than the list reuses its last
   * weight. Returns -1 when nothing is eligible yet.
   */
  function roll(farmId) {
    const avail = pool(farmId);
    if (!avail.length) return -1;
    const w = C().WEIGHTS || [];
    const base = CONFIG.cratePool(speciesOf(farmId));
    const weightOf = stage => {
      const i = base.indexOf(stage);
      return (w.length ? (w[i] !== undefined ? w[i] : w[w.length - 1]) : 1) || 0;
    };
    const total = avail.reduce((a, s) => a + weightOf(s), 0);
    if (total <= 0) return U.pick(avail);
    let r = Math.random() * total;
    for (const s of avail) {
      r -= weightOf(s);
      if (r <= 0) return s;
    }
    return avail[avail.length - 1];
  }

  /** The stage a rewarded ad upgrades a roll to — never past the top board stage. */
  function upgradeOf(farmId, stage) {
    return Math.min(stage + 1, CONFIG.topStage(speciesOf(farmId)));
  }

  // ---------------- spawning ----------------
  /**
   * A landing spot inside the pen that is clear of every animal — a crate
   * must never come down on top of one, or outside the fence. Returns null
   * when the board is too crowded to find one (the drop is then delayed).
   */
  function landingSpot(scene) {
    const b = scene.bounds, clear = C().CLEAR_RADIUS;
    for (let i = 0; i < 24; i++) {
      const p = {
        x: U.rand(b.x + 12, b.x + b.w - 12),
        y: U.rand(b.y + 14, b.y + b.h - 6),
      };
      if (!scene.animals.some(a => U.dist(a.x, a.y, p.x, p.y) < clear)) return p;
    }
    return null;
  }

  /** Is there physically room for the crate's animal once it is opened? */
  function penHasRoom(farmId) {
    const scene = Game.farm;
    if (!scene || scene.farmId !== farmId) return false;
    return scene.animals.length < Construction.capacity(farmId);
  }

  /**
   * Try to start a drop. Fails (and is retried on RETRY_INTERVAL) while the
   * pen is full or too crowded for a clear landing slot — the cooldown has
   * already elapsed, so the crate arrives the moment a slot opens up.
   */
  function trySpawn(farmId) {
    const scene = Game.farm;
    if (!scene || scene.farmId !== farmId) return false;
    if (!penHasRoom(farmId)) return false;
    const stage = roll(farmId);
    if (stage < 0) return false;          // nothing discovered in the pool yet
    const p = landingSpot(scene);
    if (!p) return false;
    const d = data(farmId);
    d.active = 1;
    d.stage = stage;
    SaveManager.save();
    open(p, false);
    return true;
  }

  /** Build the in-scene crate. `restore` skips the descent (reload / re-entry). */
  function open(p, restore) {
    box = {
      state: restore ? 'idle' : 'drop', t: 0,
      x: p.x, y: restore ? p.y : -24,
      groundY: p.y,
      sway: U.rand(0, Math.PI * 2),
      swayDir: Math.random() < 0.5 ? 1 : -1,
      chute: restore ? 0 : 1,
      sparkleT: 1.0,
    };
    if (!restore) AudioManager.play('flap');
  }

  // ---------------- update ----------------
  function update(dt, paused) {
    const id = SaveManager.data.currentFarm;
    if (!unlocked(id)) return;
    const d = data(id);

    // the opening sequence owns its reward until it lands
    if (opening) { updateOpening(dt); return; }

    // a granted animal that had nowhere to go takes the first free slot
    if (d.pending >= 0) placePending(id);

    if (!box) {
      if (paused) return;
      retryT -= dt;
      if (d.active) {
        // a crate was left resting here: put it back on a clear slot
        if (retryT > 0) return;
        const scene = Game.farm;
        const p = scene ? landingSpot(scene) : null;
        if (p) open(p, true);
        else retryT = C().RETRY_INTERVAL;
        return;
      }
      // the cooldown only runs while nothing is already waiting for the
      // player — an ignored crate must never accumulate a queue
      if (d.pending >= 0) return;
      d.next -= dt;
      if (d.next > 0 || retryT > 0) return;
      if (!trySpawn(id)) retryT = C().RETRY_INTERVAL;
      return;
    }
    // the saved offer went away underneath the animation (a reset, a farm
    // rebuilt beneath us): drop the orphan rather than leave a crate on the
    // ground that no longer has anything to give
    if (!d.active || d.stage < 0) { box = null; return; }
    updateBox(dt);
  }

  function updateBox(dt) {
    const cfg = C(), b = box;
    b.t += dt;
    if (b.state === 'drop') {
      const t = U.clamp(b.t / cfg.DROP_TIME, 0, 1);
      b.y = U.lerp(-24, b.groundY, t);
      // the crate swings under the canopy the whole way down
      b.sway += dt * 1.6;
      if (t >= 1) {
        b.state = 'land'; b.t = 0;
        b.y = b.groundY;
        VFXManager.dust(b.x, b.y, 8);
        AudioManager.play('pop');
      }
    } else if (b.state === 'land') {
      b.chute = Math.max(0, 1 - b.t / cfg.CHUTE_FADE);
      if (b.t >= cfg.BOUNCE_TIME && b.chute <= 0) { b.state = 'idle'; b.t = 0; }
    } else {
      // resting: gentle bob + the occasional attention sparkle
      b.sparkleT -= dt;
      if (b.sparkleT <= 0) {
        b.sparkleT = cfg.SPARKLE_RATE;
        VFXManager.sparkle(b.x, b.y - 14, 5, 12);
      }
    }
  }

  /** Horizontal drift under the canopy (drop phase only). */
  function swayX() {
    return box.state === 'drop'
      ? Math.sin(box.sway) * C().DROP_SWAY * box.swayDir * (1 - box.t / C().DROP_TIME)
      : 0;
  }

  /**
   * Background/offline cooldown, driven by Idle.reconcile with its already
   * capped elapsed window (CONFIG.IDLE.OFFLINE_CAP_HOURS) — so time away
   * counts toward the next crate exactly like every other system, and never
   * more than the cap. A crate already on the ground or a reward already
   * waiting for a slot freezes the timer, so nothing queues up.
   */
  function offlineTick(farmId, elapsed) {
    if (!unlocked(farmId)) return;
    const d = data(farmId);
    if (d.active || d.pending >= 0) return;
    d.next = Math.max(0, d.next - elapsed);
  }

  // ---------------- interaction ----------------
  /** Returns true if the tap hit the resting crate (opens the reveal popup). */
  function tap(x, y) {
    if (!box || box.state === 'drop') return false;
    const d = data();
    if (d.stage < 0) return false;
    if (U.dist(x, y, box.x, box.y - 12) > C().TAP_RADIUS) return false;
    AudioManager.play('click');
    const id = SaveManager.data.currentFarm;
    // only the animal that was found is passed in — what EVOLVE turns it
    // into is deliberately not available to the popup, so it cannot be
    // previewed there; the upgrade is resolved by claim() after the ad
    UI.openPopup({
      type: 'crateReveal', farmId: id, stage: d.stage,
      fxT: 0, sparks: [], adLoading: false,
      origin: { x: box.x, y: box.y - 12 },
    });
    return true;
  }

  /**
   * Reveal-popup numbers. Deliberately does NOT expose the upgraded stage:
   * what the ad pays out is only revealed once it has been watched.
   */
  function info() {
    const id = SaveManager.data.currentFarm;
    return { species: speciesOf(id), stage: data(id).stage, adDur: C().AD_DURATION };
  }

  // ---------------- claiming ----------------
  /**
   * Take the reward. `upgraded` grants the next evolution (rewarded ad),
   * otherwise the animal as rolled.
   *
   * Idempotent by construction: the crate's `active` flag is cleared before
   * anything is granted, so a second call — a double tap, a stray ad
   * callback firing after a manual collect — is a no-op and one ad view can
   * never be claimed twice.
   */
  function claim(upgraded) {
    const id = SaveManager.data.currentFarm;
    const d = data(id);
    if (claiming || !d.active || d.stage < 0) return;
    claiming = true;
    try {
      const stage = upgraded ? upgradeOf(id, d.stage) : d.stage;
      // Consume the offer first: from here the reward is owed exactly once.
      // It is parked in `pending` — the same persisted slot a reward waiting
      // for space uses — for the whole opening sequence, so a crash or a
      // kill mid-animation can never swallow it; finishOpening clears it
      // once the animal is actually standing in the pen.
      d.active = 0;
      d.stage = -1;
      d.pending = stage;
      // the cooldown starts on COLLECTION, not on the spawn
      d.next = C().COOLDOWN;
      SaveManager.save();
      const at = box ? { x: box.x, y: box.y } : null;
      box = null;
      retryT = 0;
      startOpening(id, stage, upgraded, at);
    } finally {
      claiming = false;
    }
  }

  // ---------------- in-scene opening sequence ----------------
  /**
   * The payoff, played in the pen rather than in a popup: the crate bursts
   * open where it stood and the animal hops out of it, landing in the slot
   * that was reserved for it before any of this started.
   *
   * Non-blocking on purpose — the farm keeps updating and the player keeps
   * dragging and merging while it runs. The animal only becomes a real
   * Animal at the end (finishOpening); until then it is a drawing, so it
   * can't be picked up half-emerged.
   */
  function startOpening(farmId, stage, evolved, at) {
    const scene = Game.farm;
    const p = at || (scene && scene.farmId === farmId ? landingSpot(scene) : null);
    if (!scene || scene.farmId !== farmId || !p) {
      // nowhere to play it (left the farm mid-ad): grant it straight away
      finishOpening(farmId, stage, p);
      return;
    }
    // hold the slot for the whole animation: spawns can't take it now
    scene.reserveSlot();
    const cfg = C().OPEN;
    opening = {
      farmId, stage, evolved, t: 0,
      x: p.x, y: p.y,
      dur: evolved ? cfg.EVOLVE_DURATION : cfg.DURATION,
      popped: false, landed: false,
    };
    AudioManager.play('unlock');
  }

  function updateOpening(dt) {
    const o = opening, cfg = C().OPEN;
    o.t += dt;
    // the lid lets go: light burst, dust at the base, particles
    if (!o.popped && o.t >= cfg.POP) {
      o.popped = true;
      const cols = o.evolved
        ? ['#ffffff', '#fff6d0', '#ffe98a', '#7de87a', '#c4ffb8']
        : ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'];
      VFXManager.burst(o.x, o.y - 14, cols, o.evolved ? 26 : 18, o.evolved ? 140 : 110);
      VFXManager.sparkle(o.x, o.y - 18, o.evolved ? 12 : 8, 18);
      VFXManager.dust(o.x, o.y, 8);
      AudioManager.play('pop');
    }
    // touchdown: squash-and-stretch bounce, plus an energy flourish on an
    // evolved arrival (this landing is the reveal, so it gets extra weight)
    if (!o.landed && o.t >= cfg.LAND) {
      o.landed = true;
      VFXManager.dust(o.x, o.y, 7);
      if (o.evolved) {
        VFXManager.sparkle(o.x, o.y - 16, 14, 22);
        VFXManager.burst(o.x, o.y - 12, ['#c4ffb8', '#7de87a', '#fff6d0', '#ffffff'], 14, 90);
        AudioManager.play('merge');
      }
    }
    if (o.t >= o.dur) {
      const { farmId, stage } = o;
      const at = { x: o.x, y: o.y };
      endOpening();
      finishOpening(farmId, stage, at);
    }
  }

  /** Drop the sequence and give its reserved slot back. */
  function endOpening() {
    const scene = Game.farm;
    if (opening && scene && scene.farmId === opening.farmId) scene.releaseSlot();
    opening = null;
  }

  /**
   * The animal arrives for real. On success the persisted `pending` marker
   * is cleared; if the pen somehow has no room after all (the farm changed
   * underneath the animation) the marker stays and the waiting indicator
   * takes over, so the reward is still never lost.
   */
  function finishOpening(farmId, stage, at) {
    if (place(farmId, stage, at, true)) {
      data(farmId).pending = -1;
      SaveManager.save();
      return;
    }
    UI.showToast('PEN FULL - ANIMAL IS WAITING!');
  }

  /** The rewarded ad completed: the player gets the next evolution up. */
  function adCompleted() { claim(true); }

  /**
   * The rewarded ad failed, was unavailable, or was skipped. An ad problem
   * must never cost the player the reward: the base animal is granted with a
   * short non-blocking note. A real ad SDK should call this from its
   * failure/skip callbacks (the built-in simulated ad always completes).
   */
  function adFailed() {
    UI.showToast('AD NOT AVAILABLE - ANIMAL COLLECTED!');
    claim(false);
  }

  /**
   * Spawn the reward, or return false when the pen has no room for it.
   * `quiet` skips the arrival flourish: the opening sequence has just played
   * its own landing effects on this exact spot and must not double them up.
   */
  function place(farmId, stage, at, quiet = false) {
    const scene = Game.farm;
    if (!scene || scene.farmId !== farmId) return false;
    const sp = speciesOf(farmId);
    // a stage the player has never seen (an ad upgrade past their best) is a
    // real first-time evolution and earns the full discovery celebration
    const fresh = !Discovery.isDiscovered(sp, stage);
    const a = scene.spawnAnimal(stage, false, at);
    if (!a) return false;
    if (!quiet) {
      VFXManager.burst(a.x, a.y - 12, ['#ffe98a', '#f4c437', '#fff6d0'], 14, 100);
      VFXManager.sparkle(a.x, a.y - 16, 8, 16);
      AudioManager.play('pop');
    }
    if (fresh) Game.startCelebration(a, a.x, a.y);
    return true;
  }

  /** A held reward waits for a slot; the indicator stays up until it lands. */
  function placePending(farmId) {
    const d = data(farmId);
    if (!penHasRoom(farmId)) return;
    const stage = d.pending;
    d.pending = -1;
    SaveManager.save();
    place(farmId, stage, null);
  }

  // ---------------- draw ----------------
  function draw(ctx) {
    const id = SaveManager.data.currentFarm;
    if (!isLive(id)) return;
    if (box) drawBox(ctx);
    if (opening) drawOpening(ctx);
    // the badge means "waiting for space" — an arrival that is mid-animation
    // already has its slot, so it must never show one
    else drawPendingBadge(ctx, id);
  }

  /**
   * The opening sequence: the crate splits open and shrinks away while the
   * animal arcs out of it and lands with a squash-and-stretch bounce. Drawn
   * with the same blit scale and ground shadow the real animals use, so the
   * hand-off at the end is invisible.
   */
  function drawOpening(ctx) {
    const o = opening, cfg = C().OPEN;
    const t = o.t;

    // --- the crate: anticipation squash, then blown open and shrinking away
    const crateA = t < cfg.POP ? 1 : U.clamp(1 - (t - cfg.POP) / cfg.CRATE_FADE, 0, 1);
    if (crateA > 0) {
      const anticip = t < cfg.POP ? 1 - Math.sin((t / cfg.POP) * Math.PI) * 0.16 : 1;
      ctx.globalAlpha = crateA;
      PIXEL.blit(ctx, SPRITES.giftCrate(t >= cfg.POP), o.x, o.y, 2,
                 false, anticip * crateA, (2 - anticip) * (0.6 + crateA * 0.4));
      if (t >= cfg.POP) {
        // the lid tumbling up and off to the side
        const lt = t - cfg.POP;
        ctx.save();
        ctx.translate(o.x + lt * 46, o.y - 30 - lt * 150 + lt * lt * 240);
        ctx.rotate(lt * 8);
        PIXEL.blit(ctx, SPRITES.crateLid(), 0, 0, 2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // --- burst of light out of the open crate, brighter for an evolution
    if (t >= cfg.POP) {
      const bt = U.clamp((t - cfg.POP) / (cfg.LAND - cfg.POP), 0, 1);
      ctx.globalAlpha = (o.evolved ? 0.55 : 0.34) * (1 - bt) * (1 - bt);
      ctx.fillStyle = o.evolved ? '#e8ffdd' : '#fff6d0';
      ctx.beginPath();
      ctx.arc(o.x, o.y - 14, 18 + bt * (o.evolved ? 60 : 42), 0, 7);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // --- expanding energy ring on an evolved landing (this IS the reveal)
    if (o.evolved && o.landed) {
      const rt = U.clamp((t - cfg.LAND) / cfg.EVOLVE_RING, 0, 1);
      if (rt < 1) {
        ctx.globalAlpha = (1 - rt) * 0.75;
        ctx.strokeStyle = '#c4ffb8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(o.x, o.y, 8 + rt * 46, (8 + rt * 46) * 0.45, 0, 0, 7);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // --- the animal, arcing out of the crate and settling where it lands
    const at = U.clamp((t - cfg.EMERGE) / (cfg.LAND - cfg.EMERGE), 0, 1);
    if (at <= 0) return;
    const img = SPRITES.animal(speciesOf(o.farmId), o.stage, 'idle', false);
    // ballistic arc up and back down to the ground
    const hop = at < 1 ? Math.sin(at * Math.PI) * cfg.HOP_H : 0;
    // squash-and-stretch: stretched while flying, squashed on impact, settled
    let sx = 1, sy = 1;
    if (at < 1) {
      const stretch = Math.abs(Math.cos(at * Math.PI)) * 0.14;
      sx = 1 - stretch; sy = 1 + stretch;
    } else {
