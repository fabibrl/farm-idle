      const bt = U.clamp((t - cfg.LAND) / cfg.BOUNCE, 0, 1);
      const s = Math.sin(bt * Math.PI * 2) * (1 - bt) * 0.26;
      sx = 1 + s; sy = 1 - s;
    }
    const pop = Math.min(1, U.easeOutBack(U.clamp(at * 2.2, 0, 1)));
    // ground shadow, matching Animal.draw's
    const airborne = U.clamp(1 - hop / cfg.HOP_H, 0.45, 1);
    ctx.globalAlpha = 0.28 * airborne;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + 2, img.width * CONFIG.ANIMAL_VISUAL_SCALE * 0.3 * airborne, 4 * airborne, 0, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;
    PIXEL.blit(ctx, img, o.x, o.y - hop, CONFIG.ANIMAL_VISUAL_SCALE * pop, false, sy, sx);
  }

  function drawBox(ctx) {
    const b = box, cfg = C();
    const x = b.x + swayX();

    // ground shadow, tightening as the crate comes down
    if (b.state === 'drop') {
      const near = U.clamp(1 - (b.groundY - b.y) / 320, 0.15, 1);
      ctx.globalAlpha = 0.22 * near;
      ctx.fillStyle = '#1c2b12';
      ctx.beginPath(); ctx.ellipse(b.x, b.groundY + 2, 10 * near + 3, 4 * near + 1, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // landing squash, then a gentle idle bob so it reads as interactive
    let squashY = 1, squashX = 1, bob = 0;
    if (b.state === 'land' && b.t < cfg.BOUNCE_TIME) {
      const t = b.t / cfg.BOUNCE_TIME;
      const s = Math.sin(t * Math.PI * 2) * (1 - t) * 0.22;
      squashY = 1 - s; squashX = 1 + s;
    } else if (b.state === 'idle') {
      bob = Math.sin(b.t * 2.4) * 1.2;
    }

    // parachute above, with its cords, while it is still inflated
    if (b.chute > 0) {
      const img = SPRITES.parachute();
      const cy = b.y - 44;
      ctx.globalAlpha = b.chute;
      const collapse = b.state === 'land' ? 0.4 + b.chute * 0.6 : 1;
      PIXEL.blit(ctx, img, x, cy, 2, false, collapse, collapse);
      ctx.strokeStyle = '#e8d8b4';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const dx of [-15, -5, 5, 15]) {
        ctx.moveTo(Math.round(x + dx * collapse), Math.round(cy - 2));
        ctx.lineTo(Math.round(b.x + (dx > 0 ? 7 : -7)), Math.round(b.y - 18));
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // the crate itself
    PIXEL.blit(ctx, SPRITES.giftCrate(false), x, b.y + bob, 2, false, squashY, squashX);

    // golden "!" bubble while it rests, matching the pigeon's tappable cue
    if (b.state === 'idle') {
      const pulse = Math.sin(b.t * 5) * 2;
      const by = b.y - 46 + pulse;
      ctx.fillStyle = PIXEL.OUTLINE;
      ctx.beginPath(); ctx.arc(b.x, by, 8, 0, 7); ctx.fill();
      ctx.fillStyle = SPRITES.P.gold;
      ctx.beginPath(); ctx.arc(b.x, by, 6, 0, 7); ctx.fill();
      ctx.fillStyle = SPRITES.P.goldHi;
      ctx.beginPath(); ctx.arc(b.x - 1, by - 1, 4, 0, 7); ctx.fill();
      ctx.fillStyle = SPRITES.P.gold;
      ctx.beginPath(); ctx.arc(b.x, by + 1, 4, 0, 7); ctx.fill();
      UI.drawText(ctx, '!', b.x, by - 5, UI.SIZE.BODY, '#5c3a1d', 'center');
    }
  }

  /**
   * A reward that couldn't be placed yet: a small chip in the corner of the
   * pen showing the animal that is waiting, so the player can see the reward
   * is held rather than lost.
   */
  function drawPendingBadge(ctx, farmId) {
    const stage = data(farmId).pending;
    if (stage < 0) return;
    const R = ENVIRONMENT.playRect(farmId);
    const x = R.x + 42, y = R.y + 46;
    const t = performance.now() / 1000;
    ctx.globalAlpha = 0.85 + Math.sin(t * 4) * 0.15;
    UI.woodPanel(ctx, x - 27, y - 25, 54, 50, { gold: true, flecks: false, seams: false });
    ctx.globalAlpha = 1;
    const img = SPRITES.animal(speciesOf(farmId), stage, 'idle', false);
    PIXEL.blit(ctx, img, x, y + 9, Math.min(1.5, 30 / img.height));
    UI.drawText(ctx, 'PEN FULL', x, y + 13, 4.5, '#ffe98a', 'center', false, false, 48);
  }

  /**
   * Clear transient animation state (farm switch / reset). The crate itself
   * is saved state, so a crate left resting is rebuilt on return; nothing is
   * paid out or lost here.
   */
  function reset() {
    // an opening caught mid-flight resolves instantly rather than being
    // thrown away: the animal lands right now, on the farm it belongs to,
    // and the persisted `pending` marker covers it if that farm is gone
    if (opening) {
      const { farmId, stage, x, y } = opening;
      endOpening();
      finishOpening(farmId, stage, { x, y });
    }
    box = null; retryT = 0; claiming = false;
  }

  return { update, draw, tap, info, claim, adCompleted, adFailed, reset,
           offlineTick, enabledFor, isLive };
})();

<script>
/**
 * AnimalController — one instance per animal on the farm.
 * State machine: idle / walk / peck(graze) / drag / merging / spawning /
 * escape (walking off an unfenced farm, or jumping a full pen's fence —
 * see startEscape; an escaping animal is locked out of all interaction and
 * says goodbye in a speech bubble on its way out).
 * Handles blinking, breathing squash, walk bounce, poop production.
 */
/**
 * Farewell — the line an escaping animal says on its way out. Draws from a
 * reshuffled bag of CONFIG.ESCAPE.LINES rather than picking blind, so a
 * burst of escapes cycles the whole pool and never repeats back to back.
 */
const Farewell = (() => {
  let bag = [];
  let last = null;

  function next() {
    const pool = CONFIG.ESCAPE.LINES;
    if (!pool || !pool.length) return null;
    if (!bag.length) {
      bag = pool.slice();
      for (let i = bag.length - 1; i > 0; i--) {
        const j = U.randInt(0, i);
        const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      // guard the seam between two bags: the next line out must differ
      // from the one the previous bag ended on
      if (bag.length > 1 && bag[bag.length - 1] === last) {
        const t = bag[bag.length - 1]; bag[bag.length - 1] = bag[0]; bag[0] = t;
      }
    }
    last = bag.pop();
    return last;
  }

  return { next };
})();

class Animal {
  constructor(species, stage, x, y) {
    this.init(species, stage, x, y);
  }

  init(species, stage, x, y) {
    this.species = species;
    this.stage = stage;
    this.x = x; this.y = y;
    this.homeX = x; this.homeY = y;
    this.facing = Math.random() < 0.5 ? 1 : -1;
    this.state = 'spawning';
    this.stateT = 0;
    this.stateDur = CONFIG.SPAWN_POP_TIME;
    this.walkDx = 0; this.walkDy = 0;
    this.speed = U.rand(CONFIG.WALK_SPEED_MIN, CONFIG.WALK_SPEED_MAX);
    this.blinkT = U.rand(CONFIG.BLINK_INTERVAL_MIN, CONFIG.BLINK_INTERVAL_MAX);
    this.blinking = 0;
    this.bob = Math.random() * Math.PI * 2;
    this.poopT = U.rand(1, CONFIG.POOP_INTERVAL + CONFIG.POOP_INTERVAL_JITTER);
    this.dragging = false;
    this.dead = false;
    this.scaleX = 1; this.scaleY = 1;
    this.alpha = 1;
    // escape (house built, no fence): own countdown per animal so they
    // leave staggered — set by FarmScene, see Construction.escapeDelay()
    this.escapeT = Infinity;
    this.escaping = false;
    this.escapeCfg = null;
    this.escapeMode = null;
    this.escPhase = null;
    this.arcY = 0;       // hop/jump height offset (visual only)
    this.cueT = 0;       // time since the escape tell started
    this.farewell = null;   // goodbye line + which side its bubble sits on
    this.bubbleSide = 1;
    this.shadowW = SPRITES.ANIMAL_SIZES[species][stage][0] * CONFIG.ANIMAL_VISUAL_SCALE * 0.6;
    return this;
  }

  get frameName() {
    if (this.state === 'peck') {
      // dip down during middle of the peck
      const t = this.stateT / this.stateDur;
      return (t % 0.5) > 0.22 ? 'peck' : 'idle';
    }
    if (this.state === 'escape' && this.escPhase === 'hop') return 'walk';
    const walking = this.state === 'walk' || (this.state === 'escape' && this.escPhase === 'go');
    if (walking && !this.dragging) return (this.bob % (Math.PI * 2)) < Math.PI ? 'walk' : 'idle';
    return 'idle';
  }

  setState(state, dur) {
    this.state = state;
    this.stateT = 0;
    this.stateDur = dur;
  }

  /**
   * Leave the farm for good. The animal is locked out of interaction from
   * this moment (it can no longer be picked up or matched), so the sequence
   * opens with a readable tell — a startled hop, the "!" cue popping in and
   * a brief opacity blink — before it sets off:
   *   mode 'walk' — wanders out through the nearest open edge (unfenced farm)
   *   mode 'jump' — hops the fence in an arc, then trots away (full pen);
   *                 `jump` carries that farm's Construction.jumpCfg()
   * Either way it produces nothing on the way out and never comes back.
   * Only the constructed farm ever calls this — see FarmScene.
   */
  startEscape(bounds, mode = 'walk', jump = null) {
    if (this.escaping) return;
    const cfg = CONFIG.ESCAPE;
    this.escaping = true;
    this.escapeCfg = cfg;
    this.escapeMode = mode === 'jump' && jump ? 'jump' : 'walk';
    this.dragging = false;
    // nearest open edge — left, right or bottom (the house sits at the top)
    const dl = this.x - bounds.x;
    const dr = bounds.x + bounds.w - this.x;
    const db = bounds.y + bounds.h - this.y;
    const m = Math.min(dl, dr, db);
    if (m === dl)      { this.exitX = bounds.x - 60; this.exitY = this.y + U.rand(-20, 30); }
    else if (m === dr) { this.exitX = bounds.x + bounds.w + 60; this.exitY = this.y + U.rand(-20, 30); }
    else               { this.exitX = this.x + U.rand(-40, 40); this.exitY = bounds.y + bounds.h + 70; }
    // the jump clears the fence line itself before the walk-away leg
    if (mode === 'jump' && jump) {
      const J = jump;
      this.jumpFromX = this.x; this.jumpFromY = this.y;
      if (m === dl)      { this.jumpToX = bounds.x - 30; this.jumpToY = this.y; }
      else if (m === dr) { this.jumpToX = bounds.x + bounds.w + 30; this.jumpToY = this.y; }
      else               { this.jumpToX = this.x; this.jumpToY = bounds.y + bounds.h + 34; }
      this.jumpDur = J.HOP_TIME;
      this.jumpH = J.HOP_HEIGHT;
    }
    this.escPhase = 'tell';
    this.arcY = 0;
    this.legT = 0;
    this.wobble = 0;
    this.cueT = 0;
    // the goodbye bubble opens on the same beat as the tell; it sits on the
    // side the animal is leaving *from*, so it trails rather than covering
    // the ground ahead (bubbleBox flips it back at the view edges)
    this.farewell = Farewell.next();
    this.bubbleSide = this.exitX > this.x ? -1 : 1;
    this.setState('escape', U.rand(cfg.TELL_MIN, cfg.TELL_MAX));
  }

  chooseNext(bounds) {
    // an animal already on its way out never returns to normal wandering
    if (this.escaping) { this.escPhase = 'go'; this.setState('escape', 1e9); return; }
    if (Math.random() < CONFIG.PECK_CHANCE) {
      this.setState('peck', U.rand(1.0, 2.0));
    } else if (Math.random() < 0.55) {
      // pick a wander target direction
      const a = Math.random() * Math.PI * 2;
      this.walkDx = Math.cos(a); this.walkDy = Math.sin(a) * 0.6;
      if (this.walkDx !== 0) this.facing = this.walkDx > 0 ? 1 : -1;
      this.setState('walk', U.rand(CONFIG.WALK_TIME_MIN, CONFIG.WALK_TIME_MAX));
    } else {
      this.setState('idle', U.rand(CONFIG.IDLE_TIME_MIN, CONFIG.IDLE_TIME_MAX));
    }
  }

  update(dt, bounds, farm) {
    this.stateT += dt;
    this.bob += dt * (this.state === 'walk' ? 10 : 3);

    // blinking
    this.blinkT -= dt;
    if (this.blinkT <= 0) {
      this.blinking = 0.12;
      this.blinkT = U.rand(CONFIG.BLINK_INTERVAL_MIN, CONFIG.BLINK_INTERVAL_MAX);
    }
    if (this.blinking > 0) this.blinking -= dt;

    if (this.dragging) {
      // slight lift wobble while dragged
      this.scaleX = U.lerp(this.scaleX, 1.06, dt * 10);
      this.scaleY = U.lerp(this.scaleY, 1.06, dt * 10);
      return;
    }

    switch (this.state) {
      case 'spawning': {
        const t = U.clamp(this.stateT / this.stateDur, 0, 1);
        const s = U.easeOutBack(t);
        this.scaleX = s; this.scaleY = s;
        if (t >= 1) { this.scaleX = this.scaleY = 1; this.chooseNext(bounds); }
        break;
      }
      case 'merging': {
        // shrink into the merge point
        const t = U.clamp(this.stateT / this.stateDur, 0, 1);
        this.x = U.lerp(this.x, this.mergeX, dt * 14);
        this.y = U.lerp(this.y, this.mergeY, dt * 14);
        this.scaleX = this.scaleY = 1 - U.easeInCubic(t) * 0.9;
        if (t >= 1) this.dead = true;
        break;
      }
      case 'return': {
        const d = U.dist(this.x, this.y, this.homeX, this.homeY);
        if (d < 3) { this.x = this.homeX; this.y = this.homeY; this.chooseNext(bounds); }
        else {
          this.x += (this.homeX - this.x) / d * 220 * dt;
          this.y += (this.homeY - this.y) / d * 220 * dt;
        }
        break;
      }
      case 'walk': {
        this.x += this.walkDx * this.speed * dt;
        this.y += this.walkDy * this.speed * dt;
        // clamp to pen; bounce off edges
        if (this.x < bounds.x) { this.x = bounds.x; this.walkDx *= -1; this.facing *= -1; }
        if (this.x > bounds.x + bounds.w) { this.x = bounds.x + bounds.w; this.walkDx *= -1; this.facing *= -1; }
        if (this.y < bounds.y) { this.y = bounds.y; this.walkDy *= -1; }
        if (this.y > bounds.y + bounds.h) { this.y = bounds.y + bounds.h; this.walkDy *= -1; }
        if (this.stateT >= this.stateDur) this.chooseNext(bounds);
        break;
      }
      case 'escape': {
        const cfg = this.escapeCfg;
        this.cueT += dt;
        if (this.escPhase === 'tell') {
          // the tell: startled hops in place + a brief opacity blink, so the
          // player sees why this animal has stopped responding
          const k = U.clamp(this.stateT / this.stateDur, 0, 1);
          this.arcY = -Math.abs(Math.sin(k * Math.PI * cfg.TELL_HOPS)) * cfg.TELL_HOP_H;
          this.alpha = 0.72 + Math.abs(Math.sin(k * Math.PI * 4)) * 0.28;
          if (this.stateT >= this.stateDur) {
            this.arcY = 0;
            this.alpha = 1;
            this.escPhase = this.escapeMode === 'jump' ? 'hop' : 'go';
            this.setState('escape', this.escapeMode === 'jump' ? this.jumpDur : 1e9);
          }
          break;
        }
        if (this.escPhase === 'hop') {
          // deliberate arc over the fence, with a takeoff/landing squash
          const k = U.clamp(this.stateT / this.stateDur, 0, 1);
          this.x = U.lerp(this.jumpFromX, this.jumpToX, k);
          this.y = U.lerp(this.jumpFromY, this.jumpToY, k);
          this.arcY = -Math.sin(k * Math.PI) * this.jumpH;
          const stretch = Math.sin(k * Math.PI);
          this.scaleY = 1 + stretch * 0.16;
          this.scaleX = 1 - stretch * 0.10;
          if (this.jumpToX !== this.jumpFromX) this.facing = this.jumpToX > this.jumpFromX ? 1 : -1;
          if (k >= 1) {
            this.arcY = 0;
            this.scaleX = this.scaleY = 1;
            this.escPhase = 'go';
            this.setState('escape', 1e9);
          }
          break;
        }
        // drift toward the exit, re-aiming every leg with a random angle
        // offset so the walk reads as wandering, not a scripted straight line
        this.legT -= dt;
        if (this.legT <= 0) {
          this.legT = U.rand(0.5, 1.2);
          this.wobble = U.rand(-0.55, 0.55);
        }
        const ang = Math.atan2(this.exitY - this.y, this.exitX - this.x) + this.wobble;
        this.x += Math.cos(ang) * cfg.SPEED * dt;
        this.y += Math.sin(ang) * cfg.SPEED * 0.7 * dt;
        this.facing = Math.cos(ang) > 0 ? 1 : -1;
        // fade out once past the boundary, then leave the board for good
        const out = this.x < bounds.x - 10 || this.x > bounds.x + bounds.w + 10 ||
                    this.y > bounds.y + bounds.h + 12;
        if (out) {
          this.alpha -= dt / cfg.FADE;
          if (this.alpha <= 0) { this.alpha = 0; this.dead = true; this.escaped = true; }
        }
        break;
      }
      case 'peck':
      case 'idle': {
        if (this.stateT >= this.stateDur) this.chooseNext(bounds);
        break;
      }
    }

    // breathing squash (idle) / bounce (walk)
    if (this.state === 'idle' || this.state === 'peck') {
      this.scaleY = 1 + Math.sin(this.bob) * 0.02;
      this.scaleX = 1 - Math.sin(this.bob) * 0.015;
    } else if (this.state === 'walk' || (this.state === 'escape' && this.escPhase === 'go')) {
      this.scaleY = 1 + Math.abs(Math.sin(this.bob)) * 0.05;
    }

    // poop production (not while spawning/merging, and never once an animal
    // has started walking off the farm — an escapee produces nothing)
    if (this.state !== 'spawning' && this.state !== 'merging' && !this.escaping) {
      this.poopT -= dt;
      if (this.poopT <= 0) {
        this.poopT = Upgrades.poopInterval(farm.farmId, this.stage) + U.rand(0, CONFIG.POOP_INTERVAL_JITTER);
        farm.dropPoop(this);
      }
    }
  }

  /** Visual bounce offset while walking. */
  get hopY() {
    const walking = this.state === 'walk' || (this.state === 'escape' && this.escPhase === 'go');
    return walking && !this.dragging ? -Math.abs(Math.sin(this.bob)) * 3 : 0;
  }

  get img() {
    return SPRITES.animal(this.species, this.stage, this.frameName, this.blinking > 0);
  }

  /** Approximate radius for hit tests. */
  get radius() {
    return SPRITES.ANIMAL_SIZES[this.species][this.stage][0] * CONFIG.PIXEL_SCALE * 0.5;
  }

  draw(ctx) {
    const img = this.img;
    const sc = CONFIG.ANIMAL_VISUAL_SCALE;
    // arcY lifts the sprite off the ground for the startled hops and the
    // fence jump; the shadow stays on the ground and shrinks with the height
    const arc = this.arcY || 0;
    const lift = (this.dragging ? -10 : 0) + arc;
    const airborne = U.clamp(1 - Math.abs(arc) / 46, 0.45, 1);
    // soft shadow
    ctx.globalAlpha = (this.dragging ? 0.18 : 0.28) * this.alpha * airborne;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + 2, this.shadowW / 2 * this.scaleX * airborne, 4 * airborne, 0, 0, 7);
    ctx.fill();
    ctx.globalAlpha = this.alpha;
    PIXEL.blit(ctx, img, this.x, this.y + this.hopY + lift, sc, this.facing < 0, this.scaleY, this.scaleX);
    ctx.globalAlpha = 1;
    // the tell / fleeing cue: an alarm bubble for as long as it is leaving
    if (this.escaping && this.alpha > 0.15) this.drawFleeCue(ctx);
  }

  /**
   * Alarm bubble over an animal that is leaving: pops in on the first beat
   * of the tell (the moment it stops responding to input) and rides along
   * until it is gone.
   */
  drawFleeCue(ctx) {
    const t = performance.now() / 1000;
    const pop = U.easeOutBack(U.clamp(this.cueT / 0.22, 0, 1));
    if (pop <= 0) return;
    const y = this.y + (this.arcY || 0) - this.radius * 1.7 - 16 + Math.sin(t * 6) * 2;
    ctx.save();
    ctx.translate(this.x, y);
    ctx.scale(pop, pop);
    ctx.translate(-this.x, -y);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(this.x - 6, y - 8, 12, 16);
    ctx.fillStyle = '#c0453a';
    ctx.fillRect(this.x - 4, y - 6, 8, 12);
    ctx.fillStyle = '#fff6e8';
    ctx.fillRect(this.x - 1, y - 4, 2, 6);
    ctx.fillRect(this.x - 1, y + 3, 2, 2);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /**
   * Opacity of the farewell bubble: it tracks the animal's own fade but
   * bottoms out early (FADE_FLOOR), so the words are gone slightly before
   * the animal is — never a bubble hanging over empty ground.
   */
  get bubbleAlpha() {
    const f = CONFIG.ESCAPE.BUBBLE.FADE_FLOOR;
    return U.clamp((this.alpha - f) / (1 - f), 0, 1);
  }

  /**
   * Where the farewell bubble sits this frame (null if it has nothing to
   * say). Anchored above the "!" tell cue and offset to one side; the side
   * flips, then the whole box clamps, if it would run off the view.
   * FarmScene owns the drawing so it can de-overlap several at once.
   */
  bubbleBox() {
    if (!this.escaping || !this.farewell || this.bubbleAlpha <= 0) return null;
    const B = CONFIG.ESCAPE.BUBBLE;
    const w = Math.round(PixelFont.measure(this.farewell, B.TEXT)) + B.PAD_X * 2;
    const h = Math.round(PixelFont.snap(B.TEXT)) + B.PAD_Y * 2;
    // top of the "!" cue (see drawFleeCue) — the bubble stacks above it, so
    // neither one ever covers the animal's body or the fence line
    const cueTop = this.y + (this.arcY || 0) - this.radius * 1.7 - 24;
    const half = w / 2;
    let cx = this.x + this.bubbleSide * B.DX;
    if (cx - half < B.MARGIN) cx = this.x + B.DX;
    else if (cx + half > CONFIG.VIEW_W - B.MARGIN) cx = this.x - B.DX;
    cx = U.clamp(cx, B.MARGIN + half, CONFIG.VIEW_W - B.MARGIN - half);
    const bottom = cueTop - B.DY;
    return { x: Math.round(cx - half), y: Math.round(bottom - h), w, h, tailX: this.x };
  }

  /**
   * Cartoon speech bubble with a tail pointing down at the animal: cream
   * face, the art bible's dark outline, game font inside, and a short
   * scale-up pop so it reads as playful rather than as an error message.
   */
  drawSpeechBubble(ctx, box) {
    const B = CONFIG.ESCAPE.BUBBLE;
    const pop = U.easeOutBack(U.clamp(this.cueT / B.POP, 0, 1));
    if (pop <= 0) return;
    const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    const tailX = Math.round(U.clamp(box.tailX, box.x + 6, box.x + box.w - 6));
    ctx.save();
    ctx.globalAlpha = this.bubbleAlpha;
    ctx.translate(cx, cy);
    ctx.scale(pop, pop);
    ctx.translate(-cx, -cy);
    // outline pass (box + tail), then the cream face inset by 1px
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(box.x, box.y, box.w, box.h);
    for (let i = 0; i < 4; i++) ctx.fillRect(tailX - 3 + i, box.y + box.h + i, 4 - i, 1);
    ctx.fillStyle = '#fff6e8';
    ctx.fillRect(box.x + 1, box.y + 1, box.w - 2, box.h - 2);
    for (let i = 0; i < 3; i++) ctx.fillRect(tailX - 3 + i, box.y + box.h - 1 + i, 3 - i, 1);
    UI.drawText(ctx, this.farewell, cx, box.y + B.PAD_Y, B.TEXT, PIXEL.OUTLINE, 'center');
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}
</script>
<script>
/**
 * FarmScene — gameplay scene for one farm.
 * Owns: SpawnManager (auto baby spawns), MergeManager (drag & merge),
 * EconomyManager hooks (poop -> coin lifecycle).
 */
class FarmScene {
  constructor(farmId) {
    this.farmId = farmId;
    this.def = CONFIG.FARMS[farmId];
    this.animals = [];
    this.poops = [];       // {x, y, t, stage, phase}
    this.spawnT = 1.0;
    this.dragged = null;
    this.dragOffX = 0; this.dragOffY = 0;
    this.mergeTarget = null;
    this.bg = ENVIRONMENT.farm(farmId);
    this.ghosts = [];      // in-scene hit rects (the farmhouse), see drawHouse()
    // fence jumping (construction farms only): pressure builds while spawns
    // bounce off a full pen — see updateFenceJump()
    this.penPressure = 0;
    this.jumpCooldown = 0;
    // slots held for an animal that is mid-arrival (the surprise box's
    // opening sequence): counted against capacity so a spawn can't take the
    // spot while the animation plays. See reserveSlot/releaseSlot.
    this.reserved = 0;
    const J = Construction.jumpCfg(farmId);
    this.jumpAt = J ? Math.max(1, J.PRESSURE_TIME + U.rand(-J.VARIANCE, J.VARIANCE)) : Infinity;
    this.setBounds();
    this.tutorial = null;
    if (Construction.capacity(farmId) <= 0) {
      // nothing has been built here yet: no animals, no tutorial — the scene
      // is just the plot plus its build call-to-action
    } else if (!SaveManager.data.tutorialDone[farmId]) {
      // first visit: exactly two babies pre-placed, spawning paused until they merge
      this.startTutorial();
    } else {
      // restore saved animals (incl. offline-spawned ones) on free spots
      const saved = SaveManager.data.animals[farmId] || [];
      const cap = Construction.capacity(farmId);
      for (const a of saved.slice(0, cap)) {
        const p = this.freeSpot();
        const an = new Animal(this.def.species, a.stage, p.x, p.y);
        an.setState('idle', U.rand(0.5, 2));
        an.scaleX = an.scaleY = 1;
        this.armEscape(an);
        this.animals.push(an);
      }
    }
  }

  /** Walk/spawn area: the current fence footprint (or the whole plot). */
  setBounds() {
    const R = ENVIRONMENT.playRect(this.farmId);
    this.bounds = { x: R.x + 18, y: R.y + 26, w: R.w - 36, h: R.h - 46 };
  }

  /**
   * A build step completed: re-bake the background, recalculate the playable
   * area for the new fence footprint (so added capacity is physically
   * usable), pull existing animals back inside it and start the first-merge
   * tutorial if the house has only just made spawning possible.
   */
  refresh() {
    this.bg = ENVIRONMENT.farm(this.farmId);
    this.setBounds();
    const b = this.bounds;
    for (const a of this.animals) {
      a.x = U.clamp(a.x, b.x, b.x + b.w);
      a.y = U.clamp(a.y, b.y, b.y + b.h);
      a.homeX = a.x; a.homeY = a.y;
      if (!Construction.escapesActive(this.farmId)) {
        // the fence is up: escape logic is off for good
        a.escaping = false;
        a.escapeT = Infinity;
        a.farewell = null;
        a.alpha = 1;
        a.arcY = 0;
        if (a.state === 'escape') a.setState('idle', U.rand(0.5, 2));
      }
    }
    if (!this.tutorial && Construction.capacity(this.farmId) > 0 &&
        !SaveManager.data.tutorialDone[this.farmId]) {
      this.startTutorial();
    }
    this.spawnT = Math.min(this.spawnT, Upgrades.spawnInterval(this.farmId));
  }

  /**
   * Fence jumping — construction farms only (Construction.jumpCfg is null
   * everywhere else, so no other farm ever runs this): while the pen sits at
   * capacity and spawns keep getting blocked, pressure builds; when it runs
   * out, one eligible animal hops the fence and is lost, making room instead
   * of hard-blocking spawning forever. Babies (below MIN_STAGE) never jump.
   * A cooldown keeps it to an occasional event, not a drain.
   */
  updateFenceJump(dt) {
    const J = Construction.jumpCfg(this.farmId);
    if (!J) return;   // not a construction farm: animals are never lost here
    this.jumpCooldown = Math.max(0, this.jumpCooldown - dt);
    // pressure only builds while the pen is full and spawns are bouncing off
    // it; it bleeds away as soon as a merge or a jump has freed a slot
    if (this.animals.length < Construction.capacity(this.farmId)) {
      this.penPressure = Math.max(0, this.penPressure - dt);
      return;
    }
    // no fence yet: the walk-off escape covers this stage instead
    if (Construction.escapesActive(this.farmId)) return;
    this.penPressure += dt;
    if (this.penPressure < this.jumpAt || this.jumpCooldown > 0) return;
    const victim = this.pickJumper(J);
    if (!victim) return;      // only babies in the pen: nothing jumps
    this.penPressure = 0;
    this.jumpAt = Math.max(1, J.PRESSURE_TIME + U.rand(-J.VARIANCE, J.VARIANCE));
    this.jumpCooldown = J.COOLDOWN;
    victim.startEscape(this.bounds, 'jump', J);
    AudioManager.play('pop');
  }

  /**
   * Which animal hops the fence: the cheapest eligible tier present (tier 2
   * and up), picked at random within it — a full pen costs the player its
   * most redundant animal, never its best.
   */
  pickJumper(J = Construction.jumpCfg(this.farmId)) {
    if (!J) return null;
    const min = J.MIN_STAGE;
    const eligible = this.animals.filter(a =>
      a.stage >= min && !a.escaping && !a.dragging && !a.dead &&
      a.state !== 'merging' && a.state !== 'spawning');
    if (!eligible.length) return null;
    const lowest = Math.min(...eligible.map(a => a.stage));
    return U.pick(eligible.filter(a => a.stage === lowest));
  }

  /** Give one animal its own escape countdown (no fence = animals wander off). */
  armEscape(animal) {
    animal.escapeT = Construction.escapesActive(this.farmId)
      ? Construction.escapeDelay(this.farmId) : Infinity;
  }

  /** TutorialManager: seed the guaranteed first merge and show the drag hint. */
  startTutorial() {
    const cx = this.bounds.x + this.bounds.w / 2;
    const cy = this.bounds.y + this.bounds.h * 0.45;
    const gap = CONFIG.TUTORIAL.GAP / 2;
    const a = new Animal(this.def.species, 0, cx - gap, cy);
    const b = new Animal(this.def.species, 0, cx + gap, cy);
    for (const an of [a, b]) {
      an.setState('idle', 1e9); // hold still so the merge stays obvious
      an.scaleX = an.scaleY = 1;
      this.animals.push(an);
      Discovery.mark(this.def.species, 0);
    }
    this.tutorial = { a, b, t: 0 };
  }

  randomSpot() {
    return {
      x: U.rand(this.bounds.x, this.bounds.x + this.bounds.w),
      y: U.rand(this.bounds.y, this.bounds.y + this.bounds.h),
    };
  }

  /**
   * Is there room for one more animal right now? Reserved slots count as
   * taken, so an arrival that is still animating keeps its place.
   */
  hasRoom() {
    return this.animals.length + this.reserved < Construction.capacity(this.farmId);
  }

  /** Hold a slot for an animal that is on its way in. */
  reserveSlot() { this.reserved++; }

  /** Give it back — either the animal landed, or its arrival was abandoned. */
  releaseSlot() { this.reserved = Math.max(0, this.reserved - 1); }

  /** Random pen position kept clear of existing animals (best effort). */
  freeSpot() {
    let p = this.randomSpot(), tries = 0;
    while (tries++ < 12 && this.animals.some(a => U.dist(a.x, a.y, p.x, p.y) < 40)) {
      p = this.randomSpot();
    }
    return p;
  }

  /**
   * SpawnManager: place a new animal at a free spot, or at `pos` when the
   * caller has one (a surprise-box reward lands where the crate stood).
   */
  spawnAnimal(stage = 0, sfx = true, pos = null) {
    // hard cap: the fence tier's capacity on construction farms, minus any
    // slot already promised to an animal that is mid-arrival
    if (!this.hasRoom()) return null;
    const b = this.bounds;
    const p = pos
      ? { x: U.clamp(pos.x, b.x, b.x + b.w), y: U.clamp(pos.y, b.y, b.y + b.h) }
      : this.freeSpot();
    const a = new Animal(this.def.species, stage, p.x, p.y);
    this.armEscape(a);
    this.animals.push(a);
    Discovery.mark(this.def.species, stage); // babies count for the collection, no celebration
    VFXManager.dust(p.x, p.y, 6);
    if (sfx) AudioManager.play('pop');
    this.persist();
    return a;
  }

  /** EconomyManager: animal drops a poop that later becomes a coin. */
  dropPoop(animal) {
    this.poops.push({
      x: animal.x - animal.facing * 8,
      y: animal.y + 2,
      t: 0,
      stage: animal.stage,
      phase: 'poop',
    });
    AudioManager.play('poop');
  }

  updatePoops(dt) {
    for (let i = this.poops.length - 1; i >= 0; i--) {
      const p = this.poops[i];
      p.t += dt;
      if (p.phase === 'poop' && p.t >= CONFIG.POOP_TO_COIN_DELAY) {
        p.phase = 'glow';
        p.t = 0;
        VFXManager.sparkle(p.x, p.y - 6, 10, 10);
      } else if (p.phase === 'glow' && p.t >= 0.5) {
        // transform: launch flying coin toward the HUD counter
        const value = Upgrades.coinValue(this.farmId, p.stage);
        const target = UI.coinTarget();
        VFXManager.flyCoin(p.x, p.y - 6, target.x, target.y, () => {
          Game.addCoins(value);
          AudioManager.play('coin');
        });
        VFXManager.floatText(p.x, p.y - 18, '+' + value);
        this.poops.splice(i, 1);
      }
    }
  }

  /**
   * Tap the farmhouse — the farm's build / farm-upgrade menu (see drawHouse
   * for the hit rect). Split out from pointerDown so the first-upgrade
   * tutorial can allow this one tap while the rest of the scene is frozen.
   */
  tapHouse(x, y) {
    const hit = this.ghosts.some(gh => x >= gh.x && x <= gh.x + gh.w && y >= gh.y && y <= gh.y + gh.h);
    if (!hit) return false;
    AudioManager.play('click');
    Game.openBuild(this.farmId);
    return true;
  }

  // ---------------- MergeManager: input ----------------
  pointerDown(x, y) {
    // the farmhouse is the entry point for the build/farm-upgrade menu
    if (this.tapHouse(x, y)) return true;
    // topmost animal under pointer — an animal that has started leaving is
    // locked out of interaction (the tell shows the player why)
    for (let i = this.animals.length - 1; i >= 0; i--) {
      const a = this.animals[i];
      if (a.state === 'merging' || a.state === 'spawning' || a.escaping) continue;
      if (U.dist(x, y, a.x, a.y - a.radius * 0.6) < a.radius + 8) {
        this.dragged = a;
        a.dragging = true;
        a.homeX = a.x; a.homeY = a.y;
        this.dragOffX = a.x - x; this.dragOffY = a.y - y;
        // draw on top
        this.animals.splice(i, 1);
        this.animals.push(a);
        AudioManager.play('click');
        return true;
      }
    }
    return false;
  }

  pointerMove(x, y) {
    if (!this.dragged) return;
    this.dragged.x = U.clamp(x + this.dragOffX, this.bounds.x - 10, this.bounds.x + this.bounds.w + 10);
    this.dragged.y = U.clamp(y + this.dragOffY, this.bounds.y - 10, this.bounds.y + this.bounds.h + 10);
    this.mergeTarget = this.findMergeTarget();
  }

  findMergeTarget() {
    const d = this.dragged;
    if (!d) return null;
    let best = null, bestDist = CONFIG.MERGE_RADIUS + d.radius * 0.5;
    for (const a of this.animals) {
      if (a === d || a.dead || a.state === 'merging' || a.state === 'spawning') continue;
      if (a.escaping) continue;   // on its way out: no longer matchable
      // the chain's top stage can still pair up — it becomes the final form
      if (a.species !== d.species || a.stage !== d.stage) continue;
      const dist = U.dist(a.x, a.y, d.x, d.y);
      if (dist < bestDist) { best = a; bestDist = dist; }
    }
    return best;
  }

  pointerUp() {
    const d = this.dragged;
    if (!d) return;
    d.dragging = false;
    this.dragged = null;
    const target = this.mergeTarget;
    this.mergeTarget = null;
    if (target) {
      this.merge(d, target);
    } else {
      d.setState('return', 1);
    }
  }

  /** Merge two identical animals into one evolved animal (instant swap, no animation). */
  merge(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const species = a.species, newStage = a.stage + 1;
    Events.onManualMerge();   // a long grind of these is a tornado trigger
    // remove both source animals immediately
    a.dead = b.dead = true;
    this.animals = this.animals.filter(an => !an.dead);
    AudioManager.play('merge');
    // Two of the chain's last board stage: the pair never lands as an animal
    // — it permanently becomes the chain's final form (Farm 1: the Final
    // Chicken), collected by the UFO (full cinematic first time, quick beam
    // after). This is the only animal the UFO ever abducts.
    if (newStage >= CONFIG.stageCount(species)) {
      VFXManager.burst(mx, my - 14, ['#7de87a', '#c4ffb8', '#a07cc0', '#ffffff'], 20, 120);
      VFXManager.sparkle(mx, my - 20, 12, 22);
      this.persist();
      UFO.collect(mx, my);
      return;
    }
    // replace with the evolved asset at the merge position, full size right away
    const evolved = new Animal(species, newStage, mx, my);
    evolved.setState('idle', U.rand(1, 2));
    evolved.scaleX = evolved.scaleY = 1;
    // a successful match cancels both escapes; the evolved animal starts a
    // fresh countdown of its own
    this.armEscape(evolved);
    this.animals.push(evolved);
    const cols = ['#ffe98a', '#f4c437', '#fff6d0', '#ffffff'];
    VFXManager.burst(mx, my - 14, cols, 18, 110);
    VFXManager.sparkle(mx, my - 20, 12, 22);
    // first successful merge completes the tutorial and starts normal spawning
    if (this.tutorial) {
      this.tutorial = null;
      SaveManager.data.tutorialDone[this.farmId] = true;
      this.spawnT = 1.0;
    }
    this.persist();
    // first time this species+stage is ever created -> celebration!
    if (Discovery.mark(species, newStage)) {
      Game.startCelebration(evolved, mx, my);
    }
  }

  persist() {
    // animals spinning inside an active tornado are appended so an
    // autosave / reload mid-event can never lose them
    SaveManager.data.animals[this.farmId] =
      this.animals.filter(a => !a.dead && a.state !== 'merging').map(a => ({ stage: a.stage }))
        .concat(Tornado.heldSnapshot(this.farmId));
    SaveManager.save();
  }

  update(dt) {
    // SpawnManager tick (paused until the tutorial merge is done, and
    // silent while nothing has been built that could hold animals)
    if (Construction.capacity(this.farmId) <= 0) {
      this.updatePoops(dt);
      return;
    }
    if (!this.tutorial) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) {
        this.spawnT = Upgrades.spawnInterval(this.farmId);
        this.spawnAnimal(0);   // returns null while the pen is full
      }
      this.updateFenceJump(dt);
    } else {
      this.tutorial.t += dt;
    }

    // no fence: every animal counts down its own escape timer and then
    // wanders off the plot (staggered, never all at once)
    const escapes = Construction.escapesActive(this.farmId) && !this.tutorial;

    let lost = false;
    for (let i = this.animals.length - 1; i >= 0; i--) {
      const a = this.animals[i];
      if (escapes && !a.escaping && !a.dragging && a.state !== 'merging') {
        a.escapeT -= dt;
        if (a.escapeT <= 0) a.startEscape(this.bounds, 'walk');
      }
      a.update(dt, this.bounds, this);
      // keep the tutorial pair in place so the merge stays obvious
      if (this.tutorial && a.state === 'walk') a.setState('idle', 1e9);
      if (a.dead) {
        if (a.escaped) lost = true;
        this.animals.splice(i, 1);
      }
    }
    // an animal that walked off is gone for good — keep the save in step
    if (lost) {
      if (this.dragged && this.dragged.dead) { this.dragged = null; this.mergeTarget = null; }
      this.persist();
    }
    this.updatePoops(dt);
  }

  /**
   * Render order (back to front): background, the farmhouse layer (ghost
   * placeholder + call-to-action indicator), poops, animals, UFO/pigeon/
   * tornado, then the tutorial overlay. Tutorial content always draws last,
   * so nothing in the scene can cover it — and the house indicator is
   * suppressed entirely while the tutorial runs.
   */
  draw(ctx) {
    ctx.drawImage(this.bg, 0, 0);
    this.drawHouse(ctx);

    // poops (under animals)
    for (const p of this.poops) {
      const img = SPRITES.poop(p.stage);
      if (p.phase === 'glow') {
        // pulsing golden aura
        const pulse = 0.5 + Math.sin(p.t * 20) * 0.2;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#ffe98a';
        ctx.beginPath(); ctx.arc(p.x, p.y - 5, 14, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      const pop = p.phase === 'poop' && p.t < 0.25 ? U.easeOutBack(p.t / 0.25) : 1;
      PIXEL.blit(ctx, img, p.x, p.y + 4, 2 * pop);
    }

    // merge target highlight ring
    if (this.mergeTarget) {
      const t = this.mergeTarget;
      ctx.strokeStyle = '#ffe98a';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 + Math.sin(performance.now() / 90) * 0.3;
      ctx.beginPath();
      ctx.ellipse(t.x, t.y, t.radius + 6, (t.radius + 6) * 0.6, 0, 0, 7);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // animals sorted by y for correct overlap; babies (stage 0) always render
    // above evolved animals so they stay easy to find and merge
    const layer = a => a.dragging ? 2 : a.stage === 0 ? 1 : 0;
    const sorted = this.animals.slice().sort((a, b) => layer(a) - layer(b) || a.y - b.y);
    for (const a of sorted) a.draw(ctx);

    // farewell bubbles of everything on its way out, above every animal
    this.drawFarewells(ctx, sorted);

    // parked UFO / abduction cinematic (above the animals)
    UFO.draw(ctx);

    // pigeon on the fence + falling poops (above the animals)
    Pigeon.draw(ctx);

    // parachute surprise box drifting down / resting in the pen
    Crate.draw(ctx);

    // tornado offer icon / active tornado (above everything)
    Tornado.draw(ctx);

    if (this.tutorial) this.drawTutorial(ctx);
  }

  /**
   * Goodbye bubbles (see Animal.bubbleBox): drawn here, after every animal,
   * so they always sit on top — and so several animals leaving at once can
   * be de-overlapped against each other. Each bubble is lifted above any
   * already-placed one it would collide with, never into an unreadable
   * cluster; the tail keeps pointing at its own animal.
   */
  drawFarewells(ctx, sorted) {
    const gap = CONFIG.ESCAPE.BUBBLE.GAP;
    const placed = [];
    for (const a of sorted) {
      const box = a.bubbleBox();
      if (!box) continue;
      for (let pass = 0; pass < placed.length; pass++) {
        let hit = false;
        for (const p of placed) {
          if (box.x < p.x + p.w + gap && p.x < box.x + box.w + gap &&
              box.y < p.y + p.h + gap && p.y < box.y + box.h + gap) {
            box.y = p.y - gap - box.h;
            hit = true;
          }
        }
        if (!hit) break;
      }
      placed.push(box);
      a.drawSpeechBubble(ctx, box);
    }
  }

  // ---------------- construction: in-scene call to action ----------------
  /**
   * The farmhouse is the farm's build / farm-upgrade entry point: tapping it
   * opens that menu (Game.openBuild). There are no loose in-scene build or
   * farm-upgrade buttons — this draws the house layer only:
   *   - the ghosted placeholder while the house itself is unbuilt (the built
   *     house is baked into the background, see ENVIRONMENT.farm)
   *   - the ghosted fence footprint, so "you need a fence" still reads in
   *     the scene (a hint, not a button — it is not tappable)
   *   - the call-to-action indicator when a purchase is actually affordable
   * Registers the house's hit rect on this.ghosts. A farm that neither builds
   * (Construction.required) nor splits its upgrade menu
   * (CONFIG.splitUpgrades) has no house menu at all, so nothing is registered.
   */
  drawHouse(ctx) {
    this.ghosts = [];
    if (!Construction.required(this.farmId) && !CONFIG.splitUpgrades(this.farmId)) return;
    const stage = Construction.stage(this.farmId);
    const hr = ENVIRONMENT.houseRect(this.farmId);
    const pulse = 0.55 + Math.sin(performance.now() / 380) * 0.2;

    if (stage === 'house') {
      // not built yet: a plain translucent ghost right where it will stand —
      // no outline or highlight around it, the badge is the only indicator
      ctx.globalAlpha = 0.45;
      ctx.drawImage(hr.img, hr.x, hr.y, hr.w, hr.h);
      ctx.globalAlpha = 1;
    } else if (stage === 'fence') {
      // outline the footprint the first fence tier will enclose
      const R = ENVIRONMENT.rectForLevel(this.farmId, 1);
      const gx = R.x - 12, gy = R.y - 20, gw = R.w + 24, gh = R.h + 14;
      this.dashedRect(ctx, gx, gy, gw, gh, pulse);
      // ghost posts at the corners so it reads as a fence, not a UI box
      const [face, hi] = ENVIRONMENT.fencePalette();
      ctx.globalAlpha = pulse * 0.55;
      for (const [px, py] of [[gx, gy], [gx + gw - 8, gy], [gx, gy + gh - 16], [gx + gw - 8, gy + gh - 16]]) {
        ctx.fillStyle = face; ctx.fillRect(px, py, 8, 16);
        ctx.fillStyle = hi; ctx.fillRect(px, py, 2, 16);
      }
      ctx.globalAlpha = 1;
    }

    // hit rect: the sprite plus a finger-friendly margin, kept out of the HUD
    // bar above it so the top bar's own controls always win a tap
    const top = Math.max(hr.y - 8, UI.safeArea().y);
    this.ghosts.push({ id: 'house', x: hr.x - 8, y: top, w: hr.w + 16, h: hr.y + hr.h + 8 - top });
    this.drawHouseCTA(ctx, hr);
  }

  /**
   * Is there a purchase the player can actually afford right now? While the
   * farm is still going up that means the next build step; once everything
   * is built the house is the way into the upgrade menu instead, so it
   * badges for an affordable upgrade — and only for the rows it actually
   * opens, which on a split farm is the FARM group (the animal rows badge on
   * their own button). An undiscovered (locked) upgrade never counts — the
   * badge only ever signals a purchase that can be made (see
   * Upgrades.anyAffordable).
   */
  buildActionReady() {
    if (!Construction.required(this.farmId) && !CONFIG.splitUpgrades(this.farmId)) return false;
    if (Construction.stage(this.farmId) === 'max') {
      const group = CONFIG.splitUpgrades(this.farmId) ? 'farm' : null;
      return SaveManager.data.upgradeTutorialDone && Upgrades.anyAffordable(this.farmId, group);
    }
    const inf = Construction.info(this.farmId);
    return !inf.maxed && SaveManager.data.coins >= inf.cost;
  }

  /**
   * Call-to-action on the house: the game's standard red "!" notification
   * badge (UI.drawBadge — the same component the UPGRADE button uses), and
   * nothing else. Pinned to the house sprite's top-right corner so it holds
   * at any resolution, clamped into UI.safeArea() to stay clear of the HUD.
   * Shown only when a real purchase is affordable, and suppressed while the
   * first-merge tutorial is running.
   */
  drawHouseCTA(ctx, hr) {
    if (this.tutorial || !this.buildActionReady()) return;
    const safe = UI.safeArea();
    const bx = U.clamp(hr.x + hr.w - 2, safe.x + 10, safe.x + safe.w - 10);
    const by = U.clamp(hr.y + 2, safe.y + 10, safe.y + safe.h - 10);
    UI.drawBadge(ctx, bx, by);
  }

  dashedRect(ctx, x, y, w, h, pulse) {
    ctx.save();
    ctx.globalAlpha = 0.45 + pulse * 0.4;
    ctx.strokeStyle = '#fff6e8';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }

  /** Drag hint: dashed guide + hand sweeping from one baby onto the other. */
  drawTutorial(ctx) {
    const { a, b, t } = this.tutorial;
    if (this.dragged) return; // hide while the player is already dragging
    const cycle = (t % CONFIG.TUTORIAL.HAND_CYCLE) / CONFIG.TUTORIAL.HAND_CYCLE;
    const move = U.clamp(cycle / 0.7, 0, 1);          // 70% travel, 30% hold
    const e = move * move * (3 - 2 * move);           // smoothstep
    const hx = U.lerp(a.x, b.x, e);
    const hy = U.lerp(a.y, b.y, e);
    const alpha = cycle > 0.85 ? (1 - cycle) / 0.15 : 1;

    // dashed guide line between the two animals
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - 6);
    ctx.lineTo(b.x, b.y - 6);
    ctx.stroke();
    ctx.setLineDash([]);

    // hand pointer
    ctx.globalAlpha = alpha;
    UI.drawHand(ctx, hx + 4, hy - 4);
    ctx.restore();

    // hint label above the pair
    ctx.save();
    ctx.globalAlpha = 0.85 + Math.sin(t * 4) * 0.15;
    const lx = (a.x + b.x) / 2, ly = Math.min(a.y, b.y) - 48;
    UI.drawText(ctx, 'DRAG TO MERGE!', lx, ly, 8.5, '#fff6e8', 'center');
    ctx.restore();
  }
}
</script>
<script>
/**
 * MapScene — world map with three farm nodes, locked icons, map pins,
 * wooden name signs, and the rewarding golden unlock-path animation.
 */
class MapScene {
  constructor() {
    this.bg = ENVIRONMENT.worldMap();
    this.unlockAnim = null;   // {seg, t, farmId, phase}
    this.pinBob = 0;
    this.time = 0;
    this.smoke = [];          // rising chimney puffs {x,y,age,life,drift}
    this.smokeT = 0;
    this.collectQueue = [];   // staggered pending-coin collections {farmId, amount, delay}
  }

  /**
   * Auto-collect every farm's accumulated background earnings: queue one
   * coins-fly-to-wallet burst per farm, staggered so they don't all fire
   * at once. Each farm's pending balance resets as it is queued.
   */
  queuePendingCollect() {
    let delay = 0.25;
    for (const f of CONFIG.FARMS) {
      const amt = Idle.collect(f.id);
      if (amt <= 0) continue;
      this.queueBurst(f.id, amt, delay);
      delay += CONFIG.IDLE.MAP_STAGGER;
    }
  }

  /** Queue one coins-fly-to-wallet burst from a farm's map node. */
  queueBurst(farmId, amount, delay = 0.25) {
    this.collectQueue.push({ farmId, amount, delay });
  }

  /** Begin glowing-path unlock animation toward farmId. */
  playUnlock(farmId) {
    this.unlockAnim = {
      farmId,
      seg: farmId - 1,          // path segment leading to this farm
      t: 0,
      phase: 'pause',           // pause -> path -> burst -> done
      pauseT: CONFIG.UNLOCK_CAMERA_PAUSE,
    };
    AudioManager.play('unlock');
  }

  update(dt) {
    this.pinBob += dt * 4;
    this.time += dt;

    // chimney smoke from unlocked farms
    this.smokeT -= dt;
    if (this.smokeT <= 0) {
      this.smokeT = 0.9 + Math.random() * 0.5;
      for (let i = 0; i < 3; i++) {
        const ch = ENVIRONMENT.THEME[i].chimney;
        // no house on the plot yet: no chimney, no smoke
        if (ch && SaveManager.data.unlocked[i] && Construction.houseBuilt(i)) {
          this.smoke.push({ x: ch.x, y: ch.y, age: 0, life: 2.2 + Math.random(), drift: 4 + Math.random() * 6 });
        }
      }
    }
    for (const p of this.smoke) { p.age += dt; }
    this.smoke = this.smoke.filter(p => p.age < p.life);

    // fire queued pending-coin collections once their stagger delay elapses
    for (let i = this.collectQueue.length - 1; i >= 0; i--) {
      const c = this.collectQueue[i];
      c.delay -= dt;
      if (c.delay > 0) continue;
      this.collectQueue.splice(i, 1);
      const n = ENVIRONMENT.MAP_NODES[c.farmId];
      VFXManager.coinPayout(n.x, n.y - 6, c.amount);
      AudioManager.play('pop');
    }

    const a = this.unlockAnim;
    if (!a) return;
    if (a.phase === 'pause') {
      a.pauseT -= dt;
      if (a.pauseT <= 0) a.phase = 'path';
    } else if (a.phase === 'path') {
      a.t += dt / CONFIG.UNLOCK_PATH_TIME;
      // sprinkle sparkles along the advancing head of the path
      const pts = ENVIRONMENT.roadPoints(a.seg);
      const head = pts[Math.min(pts.length - 1, Math.floor(a.t * pts.length))];
      if (Math.random() < 0.8) VFXManager.sparkle(head.x, head.y, 2, 8);
      if (a.t >= 1) {
        a.phase = 'burst';
        a.burstT = 0;
        const n = ENVIRONMENT.MAP_NODES[a.farmId];
        VFXManager.burst(n.x, n.y - 10, ['#ffe98a', '#f4c437', '#ffffff', '#a07cc0'], 26, 130);
        VFXManager.sparkle(n.x, n.y - 16, 16, 34);
      }
    } else if (a.phase === 'burst') {
      a.burstT += dt;
      if (a.burstT > 1.1) {
        this.unlockAnim = null;
        Game.onUnlockAnimDone(a.farmId);
      }
    }
  }

  /**
   * Decorative striped flag (blue/black/white) on a wooden pole planted
   * roadside between Farm 1 and Farm 2. Purely cosmetic: not tappable, no
   * gameplay effect. The cloth flies left of the pole (over open grass,
   * above the road) and waves in vertical slices with a slow, low-amplitude
   * ripple; the slice at the pole stays fixed.
   */
  drawFlag(ctx) {
    // anchor + scale from the Figma "World Map — Props" scene (flag_gremio,
    // top-left 316,367 at 53x87 Figma px): art's local top-left is
    // (f.x-18, f.y-34), so the transform maps that corner to the design spot
    ctx.save();
    ctx.translate(158, 183.5);
    ctx.scale(53 / 44, 87 / 72);
    const f = { x: 18, y: 34 };
    // pole with tiny knob
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(f.x - 1, f.y - 33, 4, 34);
    ctx.fillStyle = SPRITES.P.wood;
    ctx.fillRect(f.x, f.y - 32, 2, 32);
    ctx.fillStyle = SPRITES.P.woodHi;
    ctx.fillRect(f.x, f.y - 32, 1, 32);
    ctx.fillRect(f.x - 1, f.y - 34, 4, 2);
    // cloth: three horizontal stripes in 3px vertical slices, rippling
    // toward the free end (leftmost slices)
    const stripes = ['#2a6db4', '#23232b', '#e9e9e4'];
    for (let sx = 0; sx < 18; sx += 3) {
      const wave = sx === 0 ? 0 : Math.round(Math.sin(this.time * 1.4 + sx * 0.5));
      for (let s = 0; s < 3; s++) {
        ctx.fillStyle = stripes[s];
        ctx.fillRect(f.x - 3 - sx, f.y - 31 + s * 4 + wave, 3, 4);
      }
    }
    ctx.restore();
  }

  draw(ctx) {
    // the background re-bakes itself whenever a plot's build stage changes
    this.bg = ENVIRONMENT.worldMap();
    ctx.drawImage(this.bg, 0, 0);
    const save = SaveManager.data;
    this.drawFlag(ctx);
    const a = this.unlockAnim;

    // glowing unlock path
    if (a && (a.phase === 'path' || a.phase === 'burst')) {
      const pts = ENVIRONMENT.roadPoints(a.seg);
      const upTo = a.phase === 'burst' ? pts.length : Math.floor(a.t * pts.length);
      ctx.save();
      ctx.strokeStyle = '#ffe98a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#f4c437';
      ctx.shadowBlur = 12;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < upTo; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.restore();
      // dotted gold core
      ctx.fillStyle = '#fff6d0';
      for (let i = 0; i < upTo; i += 4) ctx.fillRect(pts[i].x - 1, pts[i].y - 1, 3, 3);
    }

    // nodes: themed idle animations, pin (unlocked) or chains+lock (locked), sign
    for (let i = 0; i < 3; i++) {
      const n = ENVIRONMENT.MAP_NODES[i];
      const theme = ENVIRONMENT.THEME[i];
      const unlocked = save.unlocked[i];
      const hideLock = a && a.farmId === i && (a.phase === 'burst');
      // 'owned-unbuilt': bought, but a build step is still waiting there
      const unbuilt = unlocked && !Construction.isComplete(i);
      const stage = ENVIRONMENT.mapStage(i);

      // waving grass tufts (static when locked)
      for (let t = 0; t < theme.grass.length; t++) {
        const gp = theme.grass[t];
        const sway = unlocked ? Math.round(Math.sin(this.time * 2.2 + t * 1.7 + i) * 2) : 0;
        ctx.fillStyle = '#8ab656';
        ctx.fillRect(gp.x + sway, gp.y - 8, 2, 4); ctx.fillRect(gp.x, gp.y - 4, 2, 4);
        ctx.fillRect(gp.x + 5, gp.y - 5, 2, 5);
        ctx.fillStyle = '#6a9840';
        ctx.fillRect(gp.x + 9 + sway, gp.y - 7, 2, 3); ctx.fillRect(gp.x + 9, gp.y - 4, 2, 4);
      }

      // spinning windmill blades (frozen when locked, absent until the plot
      // is finished — the tower itself only appears with the fence)
      if (theme.windmill && stage >= 2) {
        const frame = unlocked ? Math.floor(this.time * 7) % 4 : 0;
        const bl = SPRITES.windmillBlades(frame);
        ctx.drawImage(bl, theme.windmill.x - 28, theme.windmill.y - 28, 56, 56);
      }

      // species mascot next to the farmhouse — readable before entering
      // (animated when unlocked, standing still on locked previews)
      const species = CONFIG.FARMS[i].species;
      const frame = unlocked && Math.sin(this.time * 1.6 + i * 2.1) > 0.55 ? 'peck' : 'idle';
      const blink = unlocked && Math.sin(this.time * 3 + i) > 0.96;
      // an undeveloped plot has no animals on it at all
      if (stage >= 1) {
        PIXEL.blit(ctx, SPRITES.animal(species, CONFIG.showcaseStage(species), frame, blink), theme.animal.x, theme.animal.y, 2, i === 1);
      }

      if (unlocked) {
        const pin = SPRITES.mapPin();
        const bob = Math.sin(this.pinBob + i) * 3;
        const isCurrent = save.currentFarm === i;
        PIXEL.blit(ctx, pin, n.x, n.y - 8 + bob, isCurrent ? 2.4 : 2);
        if (isCurrent) {
          ctx.globalAlpha = 0.5 + Math.sin(this.pinBob * 1.5) * 0.25;
          ctx.strokeStyle = '#ffe98a'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(n.x, n.y + 4, 18, 8, 0, 0, 7); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else if (!hideLock) {
        // locked: just a lock icon centered over the themed plot — the farm
        // itself stays fully visible as a preview
        PIXEL.blit(ctx, SPRITES.lock(), n.x, n.y + 16, 2);
      }

      // construction-pending indicator: a bought plot with a build step
      // still waiting on it gets the standard red "!" badge over its pin
      if (unbuilt) UI.drawBadge(ctx, n.x + 20, n.y - 16);

      // wooden sign: one board whose title renames itself from the generic
      // farm number to the themed name the moment the house is bought (which
      // is what starts animal spawning) — so a fenceless, still-escaping farm
      // already reads as e.g. SHEEP FARM. Price shows while locked; a pending
      // build step is signalled only by the red badge above.
      const farm = CONFIG.FARMS[i];
      const named = Construction.houseBuilt(i);
      UI.woodSign(ctx, n.x, n.y + 40, named ? farm.themedName : farm.name, farm.label,
        unlocked ? null : U.fmtCost(Construction.landCost(i)),
        named ? farm.name : farm.themedName);
    }

    // chimney smoke puffs (spawned only for unlocked farms)
    for (const p of this.smoke) {
      const k = p.age / p.life;
      const size = 4 + k * 8;
      ctx.globalAlpha = 0.45 * (1 - k);
      ctx.fillStyle = '#d8d2c8';
      ctx.fillRect(
        Math.round(p.x + Math.sin(p.age * 3) * 2 + k * p.drift - size / 2),
        Math.round(p.y - k * 26 - size / 2),
        Math.round(size), Math.round(size));
    }
    ctx.globalAlpha = 1;
  }

  /** Hit-test: returns farm id or -1. */
  tappedFarm(x, y) {
    for (let i = 0; i < 3; i++) {
      const n = ENVIRONMENT.MAP_NODES[i];
      if (U.dist(x, y, n.x, n.y) < 52) return i;
    }
    return -1;
  }
}
</script>
<script>
/**
 * UIManager — HUD, buttons, popups and wooden panels. All typography
 * renders through the global 'pixel-art-font' engine (js/font.js).
 */
const UI = (() => {
  const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
  const P = () => SPRITES.P;

  // ---------------- typography ('pixel-art-font') ----------------
  // SIZE is the hierarchy scale (TITLE 20 / SUBTITLE 15 / BUTTON+BODY 10 /
  // CAPTION 5). drawText/measure keep the historical signature so every
  // module (farm, ufo, pigeon, tornado, vfx) shares this one text path.
  const SIZE = PixelFont.SIZE;

  function measure(text, size) { return PixelFont.measure(text, size); }

  function drawText(ctx, text, x, y, size = SIZE.BODY, col = '#fff', align = 'left', outline = false, shadow = false, maxWidth = 0) {
    return PixelFont.draw(ctx, text, x, y, size, col, align, outline, shadow, maxWidth);
  }

  /**
   * Popup title bar + centered title, geometry from Figma E04 (19:72/19:78):
   * outline at (px+8, py-15) w pw-16 h 33, dark wood face, 3.5px bevels,
   * seam at py+0.5; title 13px #ffe98a with em-top at py-5.
   */
  function popupTitle(ctx, text, px, py, pw, opts = {}) {
    const p = P();
    // E04's bar (19:72) is 33 tall with 3.5px bevels; the others (20:70 etc.)
    // use the 30-tall bar with 3px bevels
    const tall = !!opts.tall;
    const bt = tall ? py - 15 : py - 12;      // outline top
    const bh = tall ? 33 : 30;
    const ft = bt + 2, fh = bh - 4;           // face
    const bev = tall ? 3.5 : 3;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(px + 8, bt, pw - 16, bh);
    ctx.fillStyle = p.woodDk;
    ctx.fillRect(px + 10, ft, pw - 20, fh);
    ctx.fillStyle = p.wood;
    ctx.fillRect(px + 10, ft, pw - 20, bev);
    ctx.fillStyle = p.woodDkr;
    ctx.fillRect(px + 10, ft + fh - bev, pw - 20, bev);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(px + 10, ft + fh / 2 - 1, pw - 20, 1);
    const maxW = pw - 76;
    const base = opts.size || 13;
    const ts = PixelFont.fit(text, base, maxW);
    const top = opts.top !== undefined ? opts.top : (tall ? py - 5 : py - 3);
    drawText(ctx, text, px + pw / 2, top + (base - ts) / 2, ts, '#ffe98a', 'center', false, false, maxW);
  }

  // ---------------- wooden panels ----------------
  function woodPanel(ctx, x, y, w, h, opts = {}) {
    const p = P();
    // outline
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    // base
    ctx.fillStyle = opts.dark ? p.woodDk : p.wood;
    ctx.fillRect(x, y, w, h);
    // top light bevel, bottom dark bevel
    ctx.fillStyle = opts.dark ? p.wood : p.woodHi;
    ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = p.woodDkr;
    ctx.fillRect(x, y + h - 3, w, 3);
    // plank seams
    if (opts.seams !== false) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      for (let py = y + 12; py < y + h - 6; py += 14) ctx.fillRect(x, py, w, 1);
    }
    // wood grain flecks (Figma panels without them pass flecks: false)
    if (opts.flecks !== false) {
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      for (let i = 0; i < w * h / 260; i++) {
        ctx.fillRect(x + ((i * 53) % (w - 8)) + 4, y + ((i * 37) % (h - 10)) + 5, 4, 1);
      }
    }
    if (opts.gold) {
      // gold corner studs
      ctx.fillStyle = p.gold;
      for (const [cx, cy] of [[x + 4, y + 4], [x + w - 7, y + 4], [x + 4, y + h - 7], [x + w - 7, y + h - 7]]) {
        ctx.fillRect(cx, cy, 3, 3);
        ctx.fillStyle = p.goldHi; ctx.fillRect(cx, cy, 1, 1); ctx.fillStyle = p.gold;
      }
    }
  }

  /** Dark inset capsule (coin counter background). */
  function inset(ctx, x, y, w, h) {
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#3a2817';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#2e1f10';
    ctx.fillRect(x, y, w, 2);
  }

  /**
   * Figma upgrade-button component (46:67, "Upgrades — States" page):
   * seven `state` variants sharing one geometry — only fills, opacity,
   * icons and label change. All values are Figma px / 2, offsets relative
   * to the outer rect (b.x-2, b.y-2).
   */
  const BTN_STATES = {
    'default':   { face: '#5e9c31', bevel: '#7dbb4a', drop: '#41701f' },
    'pressed':   { face: '#41701f', bevel: '#5e9c31', drop: '#41701f' },
    'disabled':  { face: '#8c8678', bevel: '#aaa596', drop: '#635e52', dim: true },
    'max-level': { face: '#f4c437', bevel: '#ffe98a', drop: '#c88f1e', label: 'MAX', labelCol: '#5c3a1d' },
    'locked':    { face: '#7d5027', bevel: '#a9743f', drop: '#5c3a1d', labelCol: '#e0cfa8' },
    'ad-unlock': { face: '#5e9c31', bevel: '#7dbb4a', drop: '#41701f', label: 'WATCH AD', labelCx: 55.5 },
    'loading':   { face: '#8c8678', bevel: '#aaa596', drop: '#635e52', dim: true, label: 'LOADING', labelCol: '#e0cfa8', labelCx: 54.5 },
  };

  function drawStateButton(ctx, b) {
    const st = BTN_STATES[b.state];
    const ox = b.x - 2, oy = b.y - 2;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(ox, oy, b.w + 4, b.h + 4);
    ctx.fillStyle = st.drop;
    ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
    ctx.fillStyle = st.face;
    ctx.fillRect(b.x, b.y, b.w, b.h - 2);
    ctx.fillStyle = st.bevel;
    ctx.fillRect(b.x, b.y, b.w, 3);
    ctx.fillRect(b.x, b.y, 3, b.h - 6);
    if (b.state === 'locked') {
      // pixel lock (cream/300) + face-colored keyhole
      ctx.fillStyle = '#e0cfa8';
      ctx.fillRect(ox + 13.5, oy + 9.5, 2, 4);
      ctx.fillRect(ox + 19.5, oy + 9.5, 2, 4);
      ctx.fillRect(ox + 13.5, oy + 7.5, 8, 2);
      ctx.fillRect(ox + 11.5, oy + 13.5, 12, 9);
      ctx.fillStyle = st.face;
      ctx.fillRect(ox + 16.5, oy + 16.5, 2, 3);
    } else if (b.state === 'ad-unlock') {
      // play plate + stepped triangle
      ctx.fillStyle = PIXEL.OUTLINE;
      ctx.fillRect(ox + 6.5, oy + 11, 12, 10);
      ctx.fillStyle = '#fff6e8';
      ctx.fillRect(ox + 10, oy + 13, 2, 6);
      ctx.fillRect(ox + 12, oy + 14, 2, 4);
      ctx.fillRect(ox + 14, oy + 15, 2, 2);
    }
    if (st.dim) {
      ctx.fillStyle = 'rgba(40,30,20,0.45)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    if (b.state === 'loading') {
      // 4-dot pixel spinner, stepped opacity, rotating with time
      const step = Math.floor(performance.now() / 150) % 4;
      const dots = [[13.5, 10.5], [17.5, 14.5], [13.5, 18.5], [9.5, 14.5]];
      for (let i = 0; i < 4; i++) {
        ctx.globalAlpha = [1, 0.7, 0.45, 0.2][(i - step + 4) % 4];
        ctx.fillStyle = '#fff6e8';
        ctx.fillRect(ox + dots[i][0], oy + dots[i][1], 3, 3);
      }
      ctx.globalAlpha = 1;
    }
    const label = st.label !== undefined ? st.label : b.label;
    if (label) {
      drawText(ctx, label, ox + (st.labelCx || 50), oy + 11.75, 8.5, st.labelCol || '#fff6e8', 'center', false, false, 92);
    }
  }

  /** Colored button (green/gray/red) with bevel + icon + label. */
  function drawButton(ctx, b) {
    if (b.state) { drawStateButton(ctx, b); return; }
    const p = P();
    const cols = {
      green: ['#5e9c31', '#7dbb4a', '#41701f'],
      gray: ['#8c8678', '#aaa596', '#635e52'],
      red: ['#c0453a', '#dd6a56', '#8e2f27'],
      wood: [p.wood, p.woodHi, p.woodDk],
    }[b.color];
    const pr = b.pressed ? 2 : 0;
    const y = b.y + pr;
    // outline + drop
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
    ctx.fillStyle = cols[2];
    ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
    // face
    ctx.fillStyle = cols[0];
    ctx.fillRect(b.x, y, b.w, b.h - 4 - pr + 2);
    ctx.fillStyle = cols[1];
    ctx.fillRect(b.x, y, b.w, 3);
    ctx.fillRect(b.x, y, 3, b.h - 6);
    if (b.disabled) {
      ctx.fillStyle = 'rgba(40,30,20,0.45)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    // content
    if (b.layout) {
      // exact icon/label placement from Figma (offsets from the outer rect)
      const ox = b.x - 2, oy = b.y - 2 + pr;
      if (b.icon) {
        const img = b.icon();
        ctx.drawImage(img, ox + b.layout.iconX, oy + b.layout.iconY, b.layout.iconW, b.layout.iconH);
      }
      if (b.label) {
        if (b.layout.center) {
          drawText(ctx, b.label, b.x + b.w / 2, oy + b.layout.labelY, b.layout.labelPx, '#fff6e8', 'center');
        } else {
          drawText(ctx, b.label, ox + b.layout.labelX, oy + b.layout.labelY, b.layout.labelPx, '#fff6e8', 'left');
        }
      }
      return;
    }
    let tx = b.x + b.w / 2;
    const ty = y + (b.h - 4) / 2;
    if (b.icon) {
      const img = b.icon();
      const isc = b.iconScale || 2;
      const iw = img.width * isc, ih = img.height * isc;
      if (b.label) {
        const availW = b.w - iw - 8;
        const fs = PixelFont.fit(b.label, b.labelSize || SIZE.BUTTON, availW);
        const lw = Math.min(measure(b.label, fs), availW);
        const total = iw + 6 + lw;
        ctx.drawImage(img, Math.round(tx - total / 2), Math.round(ty - ih / 2), iw, ih);
        drawText(ctx, b.label, tx - total / 2 + iw + 6, ty - fs / 2, fs, '#fff6e8', 'left', true, false, availW);
      } else {
        ctx.drawImage(img, Math.round(tx - iw / 2), Math.round(ty - ih / 2), iw, ih);
      }
    } else if (b.label) {
      const availW = b.w - 8;
      const fs = PixelFont.fit(b.label, b.labelSize || SIZE.BUTTON, availW);
      drawText(ctx, b.label, tx, ty - fs / 2, fs, '#fff6e8', 'center', true, false, availW);
    }
  }

  /** Small wooden sign with 1-2 lines (used on world map). `altLine1` is the
   *  other title this sign can show (a farm swaps its generic name for its
   *  themed one once the house is up): it is never drawn, only measured, so
   *  the board keeps one width and the swap reads as a rename. */
  function woodSign(ctx, cx, cy, line1, line2, cost, altLine1) {
    const w = Math.max(measure(line1, SIZE.BUTTON),
                       altLine1 ? measure(altLine1, SIZE.BUTTON) : 0,
                       line2 ? measure(line2, SIZE.CAPTION) : 0,
                       cost ? measure(cost, SIZE.CAPTION) + 12 : 0) + 18;
    const h = 18 + (line2 ? 9 : 0) + (cost ? 11 : 0);
    woodPanel(ctx, cx - w / 2, cy, w, h, {});
    drawText(ctx, line1, cx, cy + 5, SIZE.BUTTON, '#f4e8cc', 'center', true);
    let yy = cy + 17;
    if (line2) { drawText(ctx, line2, cx, yy, SIZE.CAPTION, '#e0cfa8', 'center'); yy += 10; }
    if (cost) {
      const img = SPRITES.coin(1);
      const tw = measure(cost, SIZE.CAPTION);
      ctx.drawImage(img, cx - tw / 2 - 12, yy - 3, 10, 10);
      drawText(ctx, cost, cx - tw / 2, yy, SIZE.CAPTION, '#ffe98a', 'left');
    }
    // legs
    ctx.fillStyle = P().woodDk;
    ctx.fillRect(cx - w / 2 + 4, cy + h, 3, 5);
    ctx.fillRect(cx + w / 2 - 7, cy + h, 3, 5);
  }

  // ---------------- upgrade panel cards ----------------
  /**
   * One parchment card in the upgrade panel, laid out COST > BENEFIT > ACTION:
   * the right column leads with a big coin+cost (gold when affordable, red
   * with a NEED hint when not) above the UPGRADE button; the left column has
   * the upgrade name and per-stat "cur > next" improvement rows. Registers
   * its hit rect on popup.cards and applies the purchase flash from popup.fx.
   * Returns the card's bottom y.
   */
  // ---------------- upgrade panel ----------------
  /**
   * The panel lists ONLY discovered upgrades: an undiscovered animal has no
   * row, no placeholder and no gap, so the player is never shown that
   * anything else exists (see Upgrades.unlocked). The panel is pinned to the
   * top it has at full height and grows downwards, so rows never shift.
   *
   * A long chain (Farm 1 fully discovered is eight rows) grows past what the
   * stage can show, so once the content exceeds UPGRADES_MAX_PH the panel
   * stops growing and scrolls inside itself instead — see drawUpgrades.
   */
  const UPGRADES_TOP = 56;       // (H - 528) / 2: the full-height panel's top
  const UPGRADES_MAX_PH = 528;   // panel height ceiling — beyond this it scrolls
  const CARD_H = { spawn: 76, stage: 88 };
  // A row discovered since the panel was last open slides in and fades up
  // while the rows below it make room, then a shine sweeps across it.
  const REVEAL = { DUR: 0.36, STAGGER: 0.1, SLIDE: 22, SHINE: 0.5 };
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  /** Seconds this row has been revealing for, or null if it is at rest. */
  function revealT(popup, key) {
    const d = popup.reveal && popup.reveal[key];
    return d === undefined ? null : popup.revealT - d;
  }

  /** 0..1 entry progress (1 = settled in its resting state). */
  function revealP(popup, key) {
    const t = revealT(popup, key);
    return t === null ? 1 : U.clamp(t / REVEAL.DUR, 0, 1);
  }

  /** 0..1 shine-sweep progress, or null when no sweep is running. */
  function revealShine(popup, key) {
    const t = revealT(popup, key);
    if (t === null) return null;
    const s = (t - REVEAL.DUR) / REVEAL.SHINE;
    return s >= 0 && s <= 1 ? s : null;
  }

  /**
   * Row layout: every discovered upgrade in progression order, each taking
   * only the fraction of its height it has grown to, plus the panel height
   * that fits them. Pure metrics — called for the panel frame and again to
   * draw, so both always agree.
   */
  function upgradeLayout(popup) {
    const rows = [];
    let dy = 32, first = true, stageSection = false;
    for (const key of Upgrades.keys(popup.farmId, popup.group)) {
      if (!Upgrades.unlocked(popup.farmId, key)) continue;
      const spawn = key === 'spawn';
      const p = easeOut(revealP(popup, key));
      // 'FARM' heads the spawn row, the animal's name the first stage row
      const caption = spawn ? 'FARM' : stageSection ? null
                    : CONFIG.FARMS[popup.farmId].label;
      if (!first) dy += (caption ? 22 : 10) * p;
      if (caption && !spawn) stageSection = true;
      const h = spawn ? CARD_H.spawn : CARD_H.stage;
      rows.push({ key, dy, h, p, caption, shine: revealShine(popup, key) });
      dy += h * p;
      first = false;
    }
    // 16px of panel below the last row; an empty list keeps a small plaque.
    // The panel takes the content's height until it hits the ceiling, after
    // which it stays put and the rows scroll inside it.
    const ch = rows.length ? dy + 16 : 96;
    return { rows, ch, ph: Math.min(ch, UPGRADES_MAX_PH) };
  }

  /**
   * The scrollable row list. Rows are drawn into a clipped viewport shifted
   * by popup.scroll, and only the BUY buttons actually inside that viewport
   * are registered as hit rects — a row scrolled out of sight can't be
   * tapped through the panel frame.
   */
  // A split farm opens this panel through two entry points, each showing only
  // its own rows — the title says which one the player is in.
  const UPGRADE_TITLE = { farm: 'FARM UPGRADES', animals: 'ANIMAL UPGRADES' };

  function drawUpgrades(ctx, px, py, pw, ph) {
    popupTitle(ctx, UPGRADE_TITLE[popup.group] || 'UPGRADES!', px, py, pw, { tall: true });
    popup.cards = [];
    const { rows, ch } = upgradeLayout(popup);
    const view = { x: px + 4, y: py + 24, w: pw - 8, h: ph - 32 };
    popup.maxScroll = Math.max(0, ch - ph);
    popup.scroll = U.clamp(popup.scroll || 0, 0, popup.maxScroll);
    followReveal(popup, rows, view.y - py, view.h);
    const sc = popup.scroll;

    ctx.save();
    ctx.beginPath();
    ctx.rect(view.x, view.y, view.w, view.h);
    ctx.clip();
    for (const r of rows) {
      const ry = py + r.dy - sc;
      if (ry > view.y + view.h || ry + r.h < view.y) continue;   // fully off-view
      if (r.caption) {
        ctx.globalAlpha = r.p;
        drawText(ctx, r.caption, px + 10, ry - 10.25, SIZE.CAPTION, '#e0cfa8');
        ctx.globalAlpha = 1;
      }
      const inf = Upgrades.info(popup.farmId, r.key);
      if (r.p >= 1 && r.shine === null) {
        upgradeCard(ctx, popup, px + 12, ry, pw - 24, r.h, inf, view);
      } else {
        drawRevealingCard(ctx, px + 12, ry, pw - 24, r.h, inf, r, view);
      }
    }
    ctx.restore();

    if (popup.maxScroll > 0) drawScrollbar(ctx, px, pw, view, sc, popup.maxScroll, ch);
    if (!rows.length) {
      drawText(ctx, 'NOTHING TO UPGRADE YET', px + pw / 2, py + 40, 7, '#e0cfa8', 'center', false, false, pw - 28);
    }
    drawPanelFx(ctx);
  }

  /**
   * On a long chain the row that just unlocked can be below the fold, where
   * its entry animation would play unseen — so while rows are still coming
   * in, the list scrolls to keep the newest one on screen. The moment the
   * player scrolls by hand it stops following and leaves them in control.
   */
  function followReveal(popup, rows, viewTop, viewH) {
    if (popup.userScrolled || !popup.reveal) return;
    const fresh = rows.filter(r => revealT(popup, r.key) !== null);
    if (!fresh.length) return;
    const last = fresh[fresh.length - 1];
    if (revealT(popup, last.key) > REVEAL.DUR + REVEAL.SHINE) return;   // settled
    const want = last.dy + last.h - viewTop - viewH;
    popup.scroll = U.clamp(Math.max(popup.scroll, want), 0, popup.maxScroll);
  }

  /** Slim thumb on the panel's right edge showing how far down the list is. */
  function drawScrollbar(ctx, px, pw, view, scroll, maxScroll, contentH) {
    const x = px + pw - 6, top = view.y + 2, h = view.h - 4;
    const th = Math.max(24, h * (view.h / contentH));
    const ty = top + (h - th) * (scroll / maxScroll);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = PIXEL.OUTLINE;
    ctx.fillRect(x, top, 3, h);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#e0cfa8';
    ctx.fillRect(x, ty, 3, th);
    ctx.globalAlpha = 1;
  }

  /**
   * One row mid-entry: clipped to the height it has grown to (so it never
   * spills onto the row below), slid in from the right, faded up, then lit
   * by a diagonal shine. Its BUY button is registered at its resting rect,
   * so the row stays tappable the whole way in.
   */
  function drawRevealingCard(ctx, x, y, w, h, inf, r, view) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - 4, y - 4, w + 8, Math.max(0, r.h * r.p) + 8);
    ctx.clip();
    ctx.globalAlpha = r.p;
    ctx.translate((1 - r.p) * REVEAL.SLIDE, 0);
    upgradeCard(ctx, popup, x, y, w, h, inf, view);
    ctx.globalAlpha = 1;
    if (r.shine !== null) {
      const sx = x - 44 + (w + 88) * r.shine;
      ctx.globalAlpha = 0.4 * Math.sin(r.shine * Math.PI);
      ctx.fillStyle = '#fff6e8';
      ctx.beginPath();
      ctx.moveTo(sx, y + h); ctx.lineTo(sx + 18, y + h);
      ctx.lineTo(sx + 40, y); ctx.lineTo(sx + 22, y);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function upgradeCard(ctx, popup, x, y, w, h, inf, view) {
    // parchment card (x,y,w,h = inner face rect; all values Figma E04 / 2)
    ctx.fillStyle = PIXEL.OUTLINE; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#e8d8b4'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#f2e6c8'; ctx.fillRect(x, y, w, 3);

    const afford = !inf.maxed && SaveManager.data.coins >= inf.cost;
    const spawn = h === 76;   // the shorter spawn-speed card has its own offsets

    // ---- right column: cost (coin 19:90, text 19:91), UPGRADE button (19:93) ----
    if (!inf.maxed) {
      const costTxt = U.fmt(inf.cost);
      const costSize = PixelFont.fit(costTxt, 13, 51);
      ctx.drawImage(SPRITES.coin(2), x + (spawn ? 196 : 195.5), y + (spawn ? 12.5 : 18.5), 16, 16);
      drawText(ctx, costTxt, x + (spawn ? 216 : 215.5), y + (spawn ? 14.5 : 20.5) + (13 - costSize) / 2,
               costSize, afford ? '#58972a' : '#b0442f', 'left');
    }
    const fx = popup.fx[inf.key] || 0;
    const btn = { x: x + 200, y: y + (spawn ? 40 : 52), w: 96, h: 28 };
    // state mapping per the Figma upgrade-button component (46:67)
    const state = inf.maxed ? 'max-level'
                : fx > 0.85 ? 'pressed'
                : afford ? 'default' : 'disabled';
    drawButton(ctx, { ...btn, state, label: 'UPGRADE' });

    // ---- left column: name, then per-stat label line + "cur > next" line ----
    const textW = 190;
    drawText(ctx, inf.label + ' LV ' + inf.level, x + 10, y + (spawn ? 8.75 : 8), spawn ? 8.5 : 10, '#000000', 'left', false, false, textW);
    let ly = y + (spawn ? 27.75 : 29.25);
    const ox = x - 2;   // Figma offsets in the cards are relative to the outer rect
    let row = 0;
    for (const st of inf.stats) {
      drawText(ctx, st.name, x + 10, ly, 6.5, '#8a6a3c');
      const vy = ly + (!spawn && row === 0 ? 9.5 : 10);
      drawText(ctx, st.cur, ox + 12, vy, 8.5, '#7d5027');
      if (st.next && st.next !== st.cur) {
        let vx = Math.ceil((12 + measure(st.cur, 8.5) + 4) / 2) * 2;
        drawText(ctx, '>', ox + vx, vy, 8.5, '#4a8f2c');
        vx = Math.ceil((vx + measure('>', 8.5) + 2) / 2) * 2;
        drawText(ctx, st.next, ox + vx, vy, 8.5, '#3f7d1e');
      }
      ly += 29.5;
      row++;
    }

    // purchase highlight flash
    if (fx > 0) {
      popup.fx[inf.key] = Math.max(0, fx - Game.dt * 2);
      ctx.globalAlpha = fx * 0.45;
      ctx.fillStyle = '#ffe98a';
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = 1;
    }

    // only a button fully inside the scroll viewport is tappable
    if (!view || (btn.y >= view.y && btn.y + btn.h <= view.y + view.h)) {
      popup.cards.push({ key: inf.key, btn });
    }
    return y + h;
  }

  // sparkle particles drawn above the popup (VFXManager renders below it)
  let panelFx = [];
  function spawnPanelFx(x, y) {
    for (let i = 0; i < 12; i++) {
      panelFx.push({
        x: x + U.rand(-16, 16), y: y + U.rand(-8, 8),
        vx: U.rand(-30, 30), vy: U.rand(-70, -20),
        t: U.rand(0.35, 0.6), max: 0.6,
        col: U.pick(['#ffe98a', '#f4c437', '#fff6d0', '#ffffff']),
      });
    }
  }
  function drawPanelFx(ctx) {
    for (let i = panelFx.length - 1; i >= 0; i--) {
      const p = panelFx[i];
      p.t -= Game.dt;
      if (p.t <= 0) { panelFx.splice(i, 1); continue; }
      p.x += p.vx * Game.dt; p.y += p.vy * Game.dt;
      ctx.globalAlpha = Math.min(1, p.t / p.max * 2);
      ctx.fillStyle = p.col;
      const s = p.t > p.max * 0.5 ? 3 : 2;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s);
      ctx.globalAlpha = 1;
    }
  }

  // ---------------- state ----------------
  let buttons = [];
  let popup = null;         // {type:'unlock'|'settings'|'confirm-reset', ...}
  let toast = null;         // {text, t}
  let displayedCoins = 0;
  let coinPulse = 0;

  const COIN_POS = { x: 30, y: 27 };
  function coinTarget() { return { x: COIN_POS.x, y: COIN_POS.y }; }

  // Height of the HUD's top bar backdrop (Figma 30:3, 112/2).
  const HUD_H = 56;

  /**
   * The band of the scene that in-scene UI may occupy: below the HUD bar,
   * above the bottom button row, inset from the stage edges. Derived from
   * the live HUD geometry rather than fixed coordinates, so anything
   * anchored through it stays clear of both bars — the 360x640 stage itself
   * is letterboxed to fit the device, which keeps it inside notches and
   * rounded corners at every resolution and aspect ratio.
   */
  function safeArea() {
