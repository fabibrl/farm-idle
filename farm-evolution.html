<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
</div>
<!-- Core -->
<script>
/**
 * CONFIG — every tunable value in the game lives here.
 * No gameplay numbers should be hardcoded elsewhere.
 */
const CONFIG = {
  // Virtual resolution (portrait, mobile). Canvas scales to fit screen.
  VIEW_W: 360,
  VIEW_H: 640,
  PIXEL_SCALE: 2,          // native art pixels -> screen pixels multiplier baseline
  ANIMAL_VISUAL_SCALE: 1.7, // animals render ~15% smaller than props (visual only;
                            // hit/merge radii still use PIXEL_SCALE)

  // Spawning
  SPAWN_INTERVAL: 3.0,     // seconds between automatic baby spawns
  MAX_ANIMALS: 14,         // default max simultaneous animals per farm
                           // (a farm may raise its own ceiling: FARMS[].maxAnimals)
  SPAWN_POP_TIME: 0.35,

  // ---------------- Economy ----------------
  // Poop is the primary income source. Per-animal passive rate (coins/sec)
  // = coins-per-poop / (interval + jitter/2). Every per-stage economy number
  // now lives on that stage's entry in CHAINS below — one merge chain per
  // species, each free to be as long as its farm needs. Each merge tier
  // roughly doubles per-poop value without going fully exponential, and the
  // animal cap means every merge frees a pen slot that a free spawn refills
  // — so merging always grows the idle rate, and the idle rate is never zero.
  POOP_INTERVAL: 4.0,                   // fallback seconds between poops per animal
  POOP_INTERVAL_JITTER: 2.0,     // random extra seconds
  POOP_TO_COIN_DELAY: 1.4,       // poop sits, then transforms
  COIN_FLY_SPEED: 620,           // px/sec toward HUD
  // Per-farm upgrade system (see js/upgrades.js). All values data-driven.
  //
  // Pacing targets (farm 1 baseline; later farms scale via costMult):
  //   short-term  (30-90s): early-tier levels, SPAWN level, another merge
  //   medium-term (3-8min): mid-tier levels, the next stage discovered
  //   long-term  (10-20m+): top-tier levels, farm unlock, the first abduction
  // Each tier has its own cost growth (no single global curve): cheap tiers
  // grow slowest so there is always a small purchase within reach, while
  // rising income keeps time-to-next-upgrade roughly flat instead of
  // walling. Every level adds a visible +coinStep per poop.
  UPGRADES: {
    COST_GROWTH: 1.18,           // fallback cost multiplier per level
    FARM: {
      SPAWN: {
        label: 'SPAWN SPEED',
        baseCost: 100,
        costGrowth: 1.3,         // strong effect (more animals = more merges), few levels
        maxLevel: 10,            // levels until minInterval is reached
        intervalStep: 0.2,       // seconds removed from spawn interval per level
        minInterval: 1.0,        // spawn interval floor
      },
    },
    // Per-stage upgrade definitions now live on each stage in CHAINS (`up`).
  },

  // ---------------- Merge chains ----------------
  // One chain per species — the single source of truth for that farm's whole
  // evolution ladder: how many board stages it has, what each is called, what
  // it earns, and what its upgrade costs. Chains are independent, so a farm
  // can be deepened without touching any other farm.
  //
  //   stages[] — the animals that live in the pen. Merging two of stage i
  //              produces stage i+1; merging two of the LAST board stage
  //              produces `final` instead.
  //   final    — the abducted form: it never walks the pen. The pair that
  //              creates it is taken by the UFO on the spot (full cinematic
  //              the first time, quick beam after) and from then on it pays a
  //              passive drip. `up` gives it an upgrade row of its own; a
  //              chain that omits `up` simply has no row for it.
  //
  // Per stage:
  //   name       label in the upgrade panel / tornado popups
  //   title      discovery-popup name (defaults to "<name> <SPECIES>")
  //   income     coins per poop at level 0
  //   poop       seconds between poops at level 0
  //   flavor     discovery-popup one-liner
  //   up         { baseCost, costGrowth, maxLevel, poopStep, minPoop, coinStep }
  //              — one upgrade row; every level improves poop speed AND value.
  //
  // Cost curve: baseCost climbs by a steady ~2.6x per tier and costGrowth
  // ramps gently (1.16 -> 1.19) instead of stepping at the top, so the ladder
  // scales smoothly end to end and time-to-next-upgrade stays roughly flat.
  CHAINS: {
    // Farm 1 — the full seven-stage chicken chain: three stages of ordinary
    // growing up (baby -> teen -> adult), then four of an experiment going
    // progressively wrong (strange -> mutant -> mutant 2 -> final).
    chicken: {
      stages: [
        { name: 'BABY',     income: 2,  poop: 4.0, flavor: 'A TINY PUFF OF FLUFF!',
          up: { baseCost: 30,   costGrowth: 1.16, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 1 } },
        { name: 'TEEN',     income: 4,  poop: 4.0, flavor: 'ALL LEGS AND ATTITUDE!',
          up: { baseCost: 80,   costGrowth: 1.16, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 2 } },
        { name: 'ADULT',    income: 8,  poop: 4.0, flavor: 'CLUCKS WITH GREAT PRIDE!',
          up: { baseCost: 210,  costGrowth: 1.17, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 3 } },
        { name: 'STRANGE',  income: 16, poop: 3.6, flavor: 'SOMETHING IS OFF HERE...',
          up: { baseCost: 550,  costGrowth: 1.17, maxLevel: 30, poopStep: 0.2,  minPoop: 1.4, coinStep: 6 } },
        { name: 'MUTANT',   income: 32, poop: 3.2, flavor: 'SCIENCE WENT TOO FAR!',
          up: { baseCost: 1400, costGrowth: 1.18, maxLevel: 30, poopStep: 0.25, minPoop: 1.2, coinStep: 11 } },
        { name: 'MUTANT 2', income: 64, poop: 2.6, flavor: 'TWO HEADS, ZERO ANSWERS!',
          title: 'MUTANT CHICKEN 2',
          up: { baseCost: 3600, costGrowth: 1.19, maxLevel: 30, poopStep: 0.25, minPoop: 0.8, coinStep: 20 } },
      ],
      // the stage that represents this farm outside the pen (map sign, unlock
      // popup, loading screen): the ordinary adult, never a mutation
      showcase: 2,
      // Hyper mutation: the peak of the chain and the only chicken the UFO
      // abducts. Its upgrade row raises what every collected one pays.
      final: {
        name: 'FINAL', title: 'FINAL CHICKEN', flavor: 'PEAK HYPER MUTATION!',
        up: { baseCost: 9000, costGrowth: 1.20, maxLevel: 30, incomeStep: 10 },
      },
    },

    // Farms 2 and 3 keep their original four-stage chains untouched.
    sheep: {
      stages: [
        { name: 'BABY',   income: 2,  poop: 4.0, flavor: 'SOFT, SLEEPY AND SMALL.',
          up: { baseCost: 30,   costGrowth: 1.16, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 1 } },
        { name: 'ADULT',  income: 4,  poop: 4.0, flavor: 'WOOL FOR DAYS!',
          up: { baseCost: 120,  costGrowth: 1.17, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 2 } },
        { name: 'ELDER',  income: 10, poop: 4.0, flavor: 'ANCIENT FLUFF WISDOM.',
          up: { baseCost: 500,  costGrowth: 1.18, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 4 } },
        { name: 'MUTANT', income: 24, poop: 2.6, flavor: 'THE WOOL HAS AWAKENED!',
          up: { baseCost: 2500, costGrowth: 1.20, maxLevel: 30, poopStep: 0.25, minPoop: 0.8, coinStep: 8 } },
      ],
      showcase: 1,
      final: { name: 'MUTANT 2', title: 'MUTANT 2 SHEEP', flavor: 'ABDUCTED AND IMPROVED!' },
    },
    cow: {
      stages: [
        { name: 'BABY',   income: 2,  poop: 4.0, flavor: 'SMALL MOO, BIG DREAMS.',
          up: { baseCost: 30,   costGrowth: 1.16, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 1 } },
        { name: 'ADULT',  income: 4,  poop: 4.0, flavor: 'PRODUCES PREMIUM MOO.',
          up: { baseCost: 120,  costGrowth: 1.17, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 2 } },
        { name: 'ELDER',  income: 10, poop: 4.0, flavor: 'HORNS OF THE ANCIENTS.',
          up: { baseCost: 500,  costGrowth: 1.18, maxLevel: 30, poopStep: 0.2,  minPoop: 1.5, coinStep: 4 } },
        { name: 'MUTANT', income: 24, poop: 2.6, flavor: 'UDDERLY MUTATED!',
          up: { baseCost: 2500, costGrowth: 1.20, maxLevel: 30, poopStep: 0.25, minPoop: 0.8, coinStep: 8 } },
      ],
      showcase: 1,
      final: { name: 'MUTANT 2', title: 'MUTANT 2 COW', flavor: 'ABDUCTED AND IMPROVED!' },
    },
  },

  // Discovery celebration (first time a species+stage is created)
  DISCOVERY: {
    ZOOM_TIME: 0.7,          // camera zoom-in duration (s)
    ZOOM_AMOUNT: 0.35,       // extra scale toward the merge point
    FLASH_TIME: 0.45,        // bright flash duration (s)
    PRE_POPUP_TIME: 2.4,     // total sequence length before popup opens (s)
    SPARKLE_RATE: 0.12,      // seconds between golden sparkle bursts
    // Flavor text lives on each stage in CHAINS (see `flavor`).
  },

  // UFO final-form collection layer (end-game, see js/ufo.js).
  // Merging two of a chain's LAST board stage produces that chain's `final`
  // form (Farm 1: the Final Chicken) and feeds it straight to a permanently
  // parked UFO. Internal ALIEN key names are kept for save compatibility.
  UFO: {
    INCOME_PER_ALIEN: 25,      // coins per production drop, per collected final form
    INTERVAL: 5.0,             // seconds between automatic UFO coin drops
    QUICK_COLLECT_TIME: 0.7,   // fast tractor-beam collection after landing (s)
    CINEMATIC: {               // first-abduction cinematic phase durations (s)
      SPAWN: 0.9,              // Mutant 2 materializes at the merge point
      ARRIVE: 1.5,             // UFO flies in from the sky
      BEAM: 1.5,               // tractor beam pulls the Mutant 2 up
      FLY: 1.6,                // UFO travels to its landing corner
      LAND: 0.7,               // touchdown settle
    },
  },

  // Need-based reward-event director (see js/events.js). The pigeon and the
  // tornado do not run on timers: each is released at the moment it actually
  // helps — an emptied wallet for the cash boost, a crowded pen for the
  // auto-merge — under frequency limits counted separately per feature so
  // neither can turn into spam. Every value here is a Remote Config default:
  // override at runtime via window.RemoteConfig = { EVENTS: { ... } }.
  EVENTS: {
    ENABLED: true,              // director on/off (kill switch for both events)
    LOG: true,                  // console-log every appearance and its outcome
    LOG_MAX: 30,                // appearance records kept in the save
    NEW_GAME_GRACE: 240,        // seconds of active play before any event may fire
    CONDITION_TTL: 20,          // seconds a one-shot trigger waits for a free screen

    // Frequency limits, applied independently to each feature.
    LIMITS: {
      WINDOW_MINUTES: 120,          // rolling window the cap is measured over
      MAX_PER_WINDOW: 5,            // appearances allowed inside that window
      MIN_INTERVAL_MINUTES: 12,     // minimum gap between two appearances
      DISMISS_COOLDOWN_MINUTES: 10, // added to that gap per dismissal this session
      DISMISS_SUPPRESS: 3,          // dismissals that shelve the feature for the session
    },

    // Poop rain triggers — a depleted wallet (see Events.pigeonCondition).
    PIGEON: {
      SAMPLE_INTERVAL: 0.5,   // seconds between wallet samples
      SPEND_WINDOW: 180,      // seconds the spending burst is measured over
      SPEND_FRACTION: 0.7,    // 70%+ of the wallet gone inside that window
      MIN_PEAK_COSTS: 1,      // ...off a wallet worth at least this many cheapest upgrades
      BROKE_TIME: 15,         // seconds below the cheapest upgrade before offering
      STALL_TIME: 150,        // seconds unable to afford anything = a real stall
      EMPTY_FRACTION: 0.5,    // post-purchase wallet under half the next cheapest = emptied
    },

    // Tornado triggers — a crowded pen (see Events.tornadoCondition).
    TORNADO: {
      FILL_PCT: 0.75,         // pen at 75%+ of its capacity
      MIN_PAIRS: 2,           // ...with this many merges waiting
      NEAR_CAP_SLOTS: 1,      // free slots left = spawning about to be blocked
      JUMP_WARN: 0.6,         // fence-jump pressure ratio that makes it a rescue
      MERGE_WINDOW: 300,      // seconds manual merges are counted over
      MERGE_GRIND: 6,         // manual merges in that window = real effort saved
      RETURN_AWAY: 900,       // seconds away that make a filled pen a welcome-back case
      RETURN_WINDOW: 300,     // seconds that case stays live after returning
      RETURN_FILL_PCT: 0.6,   // ...and the pen came back at least this full
    },
  },

  // Pigeon reward-ad event (see js/pigeon.js). Timing is not here: the
  // director in js/events.js decides WHEN a pigeon visits (CONFIG.EVENTS).
  // Every value here is a Remote Config default: override at runtime via
  // window.RemoteConfig = { PIGEON: { STAY_TIME: 30, ... } }.
  // Reward = REWARD_MINUTES of the farm's CURRENT passive income, split
  // across the rain — the ad scales with the player's economy forever
  // (meaningful acceleration, never mandatory, never game-breaking).
  PIGEON: {
    ENABLED: true,         // reward ad offer on/off (kill switch)
    STAY_TIME: 120,        // seconds the pigeon waits on the fence
    FLY_TIME: 2.6,         // fly-across-and-land duration (s)
    LEAVE_TIME: 1.6,       // fly-away duration when ignored (s)
    POOP_COUNT: 10,        // poops per Poop Rain
    COIN_PER_POOP: 0,      // 0 = auto: income-based (see REWARD_MINUTES); >0 = fixed override
    REWARD_MINUTES: 4,     // rain total = this many minutes of current passive income
    MIN_PER_POOP: 5,       // reward floor per poop (fresh-farm early game)
    RAIN_DURATION: 3.5,    // seconds over which the poops spawn
    REWARD_COOLDOWN: 0,    // extra seconds before the next visit after a claim
    AD_DURATION: 3.0,      // simulated reward-ad length (s)
  },

  // Tornado Auto Merge reward-ad event (see js/tornado.js). Timing is not
  // here: the director in js/events.js decides WHEN the offer appears — a
  // pen crowded enough that the sweep saves real work (CONFIG.EVENTS).
  // Every value here is a Remote Config default: override at runtime via
  // window.RemoteConfig = { TORNADO: { STAY_TIME: 30, ... } }.
  TORNADO: {
    ENABLED: true,         // reward ad offer on/off (kill switch)
    STAY_TIME: 60,         // seconds the icon stays available once it appears
    TRAVEL_SPEED: 1.0,     // tornado animation speed multiplier
    MERGE_INTERVAL: 0.12,  // seconds between survivors tossed back out after the merge blast
    REWARD_COOLDOWN: 0,    // extra seconds before the next offer after a claim
    AD_DURATION: 3.0,      // simulated reward-ad length (s)
  },

  // Parachute surprise box (see js/crate.js). Every COOLDOWN seconds a crate
  // drifts down under a parachute and lands on a free slot in the pen. It
  // rests there until tapped — it never expires — and tapping it opens a
  // reveal popup offering the animal inside, or (rewarded ad) the next
  // evolution up. Every value here is a Remote Config default: override at
  // runtime via window.RemoteConfig = { CRATE: { COOLDOWN: 60, ... } }.
  //
  // The contents pool is derived from the farm's own chain, never hardcoded:
  // see CONFIG.cratePool — index 0 and the last two entries of the chain
  // (board stages + the final form) are excluded, so the box can never hand
  // out a baby, and the ad upgrade can never reach the final form. On Farm
  // 1's seven-entry chicken chain that leaves TEEN, ADULT, STRANGE and
  // MUTANT, whose ad upgrade tops out at MUTANT 2. Enabling another farm is
  // one flag in ENABLED_FARMS — its pool follows from its own chain.
  CRATE: {
    ENABLED: true,               // reward event on/off (kill switch)
    ENABLED_FARMS: [true, false, false],  // per-farm opt-in, index = farm id
    COOLDOWN: 300,               // seconds between crates; the timer starts
                                 // when the previous crate is COLLECTED, so
                                 // ignoring one never queues up more
    SKIP_FIRST: 1,               // chain entries excluded from the front (the baby)
    SKIP_LAST: 2,                // ...and from the back (final form + the one below it)
    // Relative draw weights over the eligible pool, lowest tier first. Extra
    // entries are ignored; a pool longer than this list reuses the last
    // weight. Mid-tier animals are the common outcome, top-tier the rare one.
    WEIGHTS: [8, 5, 3, 2],
    DROP_TIME: 4.0,              // parachute descent duration (s)
    DROP_SWAY: 16,               // horizontal drift amplitude while falling (px)
    BOUNCE_TIME: 0.45,           // landing squash + settle (s)
    CHUTE_FADE: 0.8,             // parachute collapse/fade after touchdown (s)
    SPARKLE_RATE: 2.4,           // seconds between attention sparkles while resting
    TAP_RADIUS: 26,              // tap hit radius around the resting crate (px)
    CLEAR_RADIUS: 34,            // keep the landing spot this far from animals (px)
    RETRY_INTERVAL: 0.5,         // seconds between landing-spot retries when the pen is full
    REVEAL_TIME: 1.15,           // popup crate-burst animation before the choices appear (s)
    AD_DURATION: 3.0,            // simulated reward-ad length (s)

    // In-scene opening sequence, played after the popup closes: the crate
    // bursts open in the pen and the animal hops out of it. Non-blocking —
    // the farm keeps running and stays fully interactive throughout — and
    // its pen slot is reserved before it starts, so a spawn can never take
    // the spot out from under it. Offsets are seconds from the start.
    OPEN: {
      DURATION: 0.85,            // total sequence length after COLLECT (s)
      EVOLVE_DURATION: 1.10,     // ...after an ad: same beats, longer hold at the end
      POP: 0.12,                 // anticipation squash, then the lid lets go
      EMERGE: 0.20,              // the animal starts coming out
      LAND: 0.55,                // it touches down
      BOUNCE: 0.22,              // squash-and-stretch settle after landing
      HOP_H: 34,                 // peak of its arc above the ground (px) — low
                                 // enough that a crate resting against the
                                 // back fence still hops entirely inside the pen
      CRATE_FADE: 0.38,          // remnants shrink away over this, from POP (s)
      EVOLVE_RING: 0.45,         // expanding energy ring on an evolved landing (s)
    },
  },

  // Background / offline production (see js/idle.js). Every unlocked farm
  // keeps spawning animals and earning coins while the player is elsewhere
  // (another farm, the map, or with the game closed).
  IDLE: {
    OFFLINE_CAP_HOURS: 2,    // max hours of production applied after being away
    TICK_INTERVAL: 5,        // seconds between background reconcile ticks
    MAP_STAGGER: 0.5,        // seconds between each farm's coin-collect burst on the map
    COINS_PER_COLLECT: 5,    // max flying coins used to deliver one pending balance
    // offline spawning stops at this fraction of the farm's animal cap
    // (default; each farm can override via its offlinePenFill) so the board
    // comes back playable, never merged-locked at the 100% active-play cap
    OFFLINE_PEN_FILL: 0.65,
    // ...but never below this many animals per stage in that farm's chain:
    // a longer chain needs more raw material on the board to climb it, so
    // the floor scales with chain depth instead of with the pen (see
    // Idle.offlineFillCap). Still clamped to the farm's real capacity.
    OFFLINE_PER_STAGE: 2,
    // welcome-back popup: summarizes offline earnings on launch with an
    // optional rewarded-ad 2x. Only shown after a real absence so quick
    // app switches don't trigger it.
    WELCOME_MIN_AWAY: 60,      // seconds away required before the popup shows
    WELCOME_AD_DURATION: 3.0,  // simulated reward-ad length (s)
  },

  // Farm unlock costs — the long-term goals. Tuned to ~15-25 min of the
  // previous farm's mature income (goal windows stretch as the player
  // progresses, but never wall).
  UNLOCK_COSTS: [0, 12000, 120000],

  // ---------------- Farm construction ----------------
  // Step-by-step build progression, keyed by farm id (see js/construction.js).
  // The system is fully data-driven: adding a farm to this map is all it takes
  // to put that farm on the staged build flow — every consumer (scene, map,
  // build panel, idle, escapes) reads its numbers, art tier and copy from
  // here. Farms without an entry keep the classic one-shot unlock, untouched.
  //   1. LAND_COST buys the plot on the map (replaces UNLOCK_COSTS for this
  //      farm) — the scene opens but the plot is bare and produces nothing.
  //   2. HOUSE_COST builds the farmhouse: this is what starts animal
  //      spawning. Without the house there are no animals at all.
  //   3. FENCE_LEVELS[0] builds the pen. Until it exists, spawned animals
  //      wander off the plot and are lost (see the ESCAPE_* values below),
  //      and the farm is excluded from background/offline production —
  //      the idle clock is stamped the moment the fence completes.
  //      Both ways of losing an animal (that walk-off and FENCE_JUMP) are
  //      exclusive to farms listed here: on every other farm animals stay
  //      contained and spawning simply stops at the capacity limit.
  //   4. Later levels upgrade the fence: a higher hard animal cap and a
  //      physically bigger pen footprint. The fence art never changes — every
  //      farm and every tier renders Farm 1's wood fence (see
  //      ENVIRONMENT.drawFence); an upgrade grows the enclosure, not its look.
  // On every construction farm, land + house + first fence together add up to
  // that farm's old UNLOCK_COSTS lump sum, so reaching an operational farm
  // costs exactly what it did before; the fence upgrades are new, optional
  // capacity growth beyond that. Every farm's final tier caps at
  // MAX_ANIMALS — the pen is a fixed physical size, so the top tier is the
  // point where a constructed farm plays exactly like a classic one, and
  // later farms scale up by *starting* more generous rather than by ending
  // higher. All values are balance-tunable.
  CONSTRUCTION: {
    1: {
      LAND_COST: 4000,
      HOUSE_COST: 3000,
      FENCE_LEVELS: [
        { cost: 5000,  capacity: 6,  size: 0.62 },
        { cost: 14000, capacity: 10, size: 0.82 },
        { cost: 40000, capacity: 14, size: 1.00 },
      ],
      // House built, no fence: animals still spawn (up to this cap) but each
      // one walks off the plot when its own escape timer runs out. The timer
      // starts at spawn and is staggered by +/- ESCAPE_VARIANCE seconds so
      // they never leave all at once. Shared leaving animation values (the
      // tell, walk speed, fade) live in CONFIG.ESCAPE.
      UNFENCED_CAPACITY: 5,
      ESCAPE_TIME: 14,        // seconds on the board before an animal leaves
      ESCAPE_VARIANCE: 5,     // +/- random seconds on that timer

      // Fence jumping — the constructed farm's second way of losing an
      // animal. Once the pen is fenced and full, spawn pressure keeps
      // building until an older animal hops the fence and is lost, so the
      // board makes room instead of hard-blocking spawns. Tier 1 (babies)
      // never jump — only MIN_STAGE and above, and the cheapest eligible
      // tier goes first, so a full pen costs the player its most redundant
      // animal, never its best.
      FENCE_JUMP: {
        ENABLED: true,
        MIN_STAGE: 1,          // stage index: 1 = tier 2 (ADULT) and above
        PRESSURE_TIME: 8,      // seconds of blocked spawns before one jumps
        VARIANCE: 3,           // +/- random seconds on that pressure timer
        COOLDOWN: 18,          // minimum seconds between jumps on this farm
        HOP_TIME: 0.95,        // arc over the fence (s)
        HOP_HEIGHT: 40,        // peak of the arc above the ground line (px)
      },
    },

    // Farm 3 (cows) — same build sequence as Farm 2, scaled to its slot in
    // the progression. Costs are 10x Farm 2's throughout, matching the 10x
    // step between the two farms' old lump-sum unlocks (12000 -> 120000), so
    // land + house + first fence still total exactly UNLOCK_COSTS[2].
    // Production scales on top of that through FARMS[2].incomeMult (12 vs
    // Farm 2's 4), so a built Farm 3 out-earns Farm 2 without needing any
    // per-farm income values here.
    2: {
      LAND_COST: 40000,
      HOUSE_COST: 30000,
      // Capacities start higher than Farm 2's (8/11 vs 6/10) and still land
      // on MAX_ANIMALS at the top tier — the pen footprint is the same
      // physical rect on every farm, so the ceiling is shared and the
      // scaling shows up as a roomier farm from the very first fence.
      FENCE_LEVELS: [
        { cost: 50000,  capacity: 8,  size: 0.70 },
        { cost: 140000, capacity: 11, size: 0.86 },
        { cost: 400000, capacity: 14, size: 1.00 },
      ],
      // Cows are slower and heavier than sheep: a bigger unfenced herd, a
      // touch longer on the board before wandering off, and a lower, slower
      // hop when one does clear the fence.
      UNFENCED_CAPACITY: 7,
      ESCAPE_TIME: 16,
      ESCAPE_VARIANCE: 5,
      FENCE_JUMP: {
        ENABLED: true,
        MIN_STAGE: 1,          // stage index: 1 = tier 2 (ADULT) and above
        PRESSURE_TIME: 9,
        VARIANCE: 3,
        COOLDOWN: 20,
        HOP_TIME: 1.05,
        HOP_HEIGHT: 34,
      },
    },
  },

  // ---------------- Leaving the farm ----------------
  // Animation values shared by both ways an animal leaves for good (see
  // js/animal.js 'escape'): the unfenced walk-off and the fence jump. Both
  // belong to the construction farms above — a farm without a CONSTRUCTION
  // entry never escapes, so nothing here is ever reached from Farm 1.
  // An animal that has started leaving is locked out of interaction — it
  // can't be picked up or matched — so the sequence opens with a readable
  // tell (startled hop + "!" + a brief opacity blink) before it sets off.
  ESCAPE: {
    TELL_MIN: 0.55,        // shortest startled beat before setting off (s)
    TELL_MAX: 1.20,        // longest
    TELL_HOPS: 2,          // startled hops during the tell
    TELL_HOP_H: 7,         // startled hop height (px)
    SPEED: 22,             // px/sec while walking out (normal walk anim)
    FADE: 0.8,             // seconds to fade out past the boundary
    // Farewell speech bubble — pops in on the same beat as the tell (so it
    // doubles as the "this one no longer responds" signal) and rides along
    // above the animal until it is gone. LINES is a plain tunable pool:
    // add, edit or reorder freely, no code change needed. Lines are drawn
    // from a reshuffled bag, so the same one never comes up twice in a row.
    LINES: ['GOODBYE!', 'BYE!', 'SO LONG!', "I'M OUT!", 'LATER!', 'ADIOS!'],
    BUBBLE: {
      POP: 0.15,           // scale-up pop-in (s)
      TEXT: 6.5,           // text size (px)
      PAD_X: 5,            // text padding inside the bubble (px)
      PAD_Y: 4,
      DX: 14,              // sideways offset from the animal (flips at edges)
      DY: 6,               // gap above the "!" tell cue
      MARGIN: 4,           // keep this far inside the view edges
      GAP: 3,              // min spacing between two bubbles
      FADE_FLOOR: 0.4,     // bubble is fully gone while the animal is still
                           // this visible (it never lingers over empty ground)
    },
  },

  // Animal behaviour
  WALK_SPEED_MIN: 14,
  WALK_SPEED_MAX: 26,
  IDLE_TIME_MIN: 1.2,
  IDLE_TIME_MAX: 3.4,
  WALK_TIME_MIN: 0.8,
  WALK_TIME_MAX: 2.4,
  PECK_CHANCE: 0.45,       // chance an idle becomes a peck/graze
  BLINK_INTERVAL_MIN: 2.0,
  BLINK_INTERVAL_MAX: 5.0,

  // Merge
  MERGE_RADIUS: 26,        // px distance to count as a merge drop
  MERGE_ANIM_TIME: 0.45,

  // First-time tutorial (per farm): two pre-placed babies + drag hint
  TUTORIAL: {
    GAP: 70,               // px between the two starting babies
    HAND_CYCLE: 1.8,       // seconds per drag-hint loop
  },

  // Animation durations
  UNLOCK_PATH_TIME: 2.2,
  UNLOCK_CAMERA_PAUSE: 0.8,
  COIN_COUNT_LERP: 8,      // HUD money counter easing speed

  // Audio
  MUSIC_VOLUME: 0.35,
  SFX_VOLUME: 0.8,

  // Save
  SAVE_KEY: 'farm-evolution-save-v1',
  AUTOSAVE_INTERVAL: 10,   // seconds

  // Farms. Dynamic balance: each farm scales the whole economy up —
  // incomeMult multiplies every coin payout (poops, aliens) and costMult
  // multiplies every upgrade cost, so the curve keeps its early-game shape
  // while numbers, goals and ad rewards grow with the player.
  // offlinePenFill: fraction of the farm's animal cap that offline spawning
  // may fill (per-farm balance knob; falls back to IDLE.OFFLINE_PEN_FILL).
  // maxAnimals: that farm's own pen ceiling (falls back to MAX_ANIMALS) —
  // a longer merge chain needs more raw material on the board to climb, so
  // Farm 1's six-stage chicken chain runs a roomier pen than the four-stage
  // farms; babies are the smallest sprites in the game, so the extra head-
  // count still fits the same physical pen rect.
  // themedName is the map sign's title once the plot's house is bought (the
  // moment animals start spawning there); before that the sign shows `name`.
  //
  // splitUpgrades splits the farm's upgrade menu across two entry points —
  // the farmhouse opens the FARM rows, a dedicated on-screen button opens the
  // animal chain (see CONFIG.splitUpgrades and js/upgrades.js `keyGroup`).
  // A farm without the flag keeps the single UPGRADE button holding both.
  FARMS: [
    { id: 0, name: 'FARM 1', themedName: 'CHICKEN FARM', species: 'chicken', label: 'CHICKENS', incomeMult: 1,  costMult: 1,  offlinePenFill: 0.72, maxAnimals: 18, splitUpgrades: true },
    { id: 1, name: 'FARM 2', themedName: 'SHEEP FARM',   species: 'sheep',   label: 'SHEEP',    incomeMult: 4,  costMult: 4,  offlinePenFill: 0.65 },
    { id: 2, name: 'FARM 3', themedName: 'COW FARM',     species: 'cow',     label: 'COWS',     incomeMult: 12, costMult: 12, offlinePenFill: 0.65 },
  ],
};

// ---------------- chain accessors ----------------
// Every consumer reads a species' ladder through these, so nothing outside
// this file needs to know how long any chain is.
Object.assign(CONFIG, {
  /** The whole chain definition for a species. */
  chain(species) { return CONFIG.CHAINS[species]; },
  /** Board stages only (the animals that live in the pen). */
  stages(species) { return CONFIG.CHAINS[species].stages; },
  /** How many board stages this species has (merging tops out one below). */
  stageCount(species) { return CONFIG.CHAINS[species].stages.length; },
  /** Index of the last board stage — merging two of these feeds the UFO. */
  topStage(species) { return CONFIG.CHAINS[species].stages.length - 1; },
  stage(species, i) { return CONFIG.CHAINS[species].stages[i]; },
  /** Upgrade-panel label of one board stage, e.g. 'MUTANT 2'. */
  stageName(species, i) {
    const s = CONFIG.CHAINS[species].stages[i];
    return s ? s.name : '';
  },
  /** The stage that represents a farm outside the pen (map, popups, loading). */
  showcaseStage(species) { return CONFIG.CHAINS[species].showcase ?? 1; },
  /** The abducted final form (never on the board). */
  finalStage(species) { return CONFIG.CHAINS[species].final; },
  /** Chain entry by upgrade key: a stage index, or 'et' for the final form. */
  entry(species, key) {
    return key === 'et' ? CONFIG.finalStage(species) : CONFIG.stage(species, key);
  },
  /**
   * Board stages a parachute surprise box may contain, for one species.
   *
   * The exclusion is a RULE, not a list, so it stays correct if a chain is
   * ever extended or shortened and applies automatically to any farm that
   * enables the feature. It is measured against the WHOLE chain — the board
   * stages plus the final, abducted form — and drops CRATE.SKIP_FIRST
   * entries from the front and CRATE.SKIP_LAST from the back:
   *
   *   chicken (6 board stages + final = 7): 1..4 -> TEEN, ADULT, STRANGE, MUTANT
   *   sheep / cow (4 + final = 5):          1..2 -> ADULT, ELDER
   *
   * Because the last two entries are always excluded, the highest possible
   * roll is one below the top board stage — so the ad upgrade (roll + 1) can
   * reach the top board stage at most, and NEVER the final form.
   */
  cratePool(species) {
    const len = CONFIG.stageCount(species) + 1;   // board stages + the final form
    const last = len - 1 - CONFIG.CRATE.SKIP_LAST;
    const out = [];
    for (let i = CONFIG.CRATE.SKIP_FIRST; i <= last; i++) out.push(i);
    return out;
  },
  /** This farm's hard animal cap before construction/fence limits apply. */
  farmMaxAnimals(farmId) {
    return CONFIG.FARMS[farmId].maxAnimals ?? CONFIG.MAX_ANIMALS;
  },
  /**
   * Does this farm split its upgrade entry points? House = farm upgrades,
   * dedicated button = animal upgrades. Off means one UPGRADE button holds
   * the whole menu — flip the flag in FARMS to enable it on another farm.
   */
  splitUpgrades(farmId) { return !!CONFIG.FARMS[farmId].splitUpgrades; },
});

<script>
/** Small shared helpers. */
const U = {
  rand(a, b) { return a + Math.random() * (b - a); },
  randInt(a, b) { return Math.floor(U.rand(a, b + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); },
  // Smooth ease helpers for juicy animation
  easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); },
  easeInCubic(t) { return t * t * t; },
  easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
  // Format 12450 -> "12,450"
  fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); },
  // Compact 250000 -> "250,000" (kept full per reference HUD style)
  fmtCost(n) { return U.fmt(n); },
  // Format seconds -> "1H 47M" / "12M" / "45S"
  fmtDur(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    if (h > 0) return h + 'H ' + m + 'M';
    if (m > 0) return m + 'M';
    return sec + 'S';
  },
};

/** Simple object pool to avoid per-frame allocations. */
class Pool {
  constructor(factory, reset) {
    this.factory = factory;
    this.reset = reset;
    this.items = [];
  }
  get() {
    const it = this.items.pop() || this.factory();
    this.reset(it);
    return it;
  }
  release(it) { this.items.push(it); }
}
</script>
<script>
/**
 * PIXEL — tiny pixel-art authoring engine.
 * Sprites are drawn once at native resolution onto offscreen canvases,
 * auto-outlined in the reference sheet's dark warm-brown line color,
 * cached, and blitted scaled-up with crisp rendering.
 */
const PIXEL = (() => {
  const OUTLINE = '#2a1c12';       // warm dark outline used across the whole art bible
  const cache = new Map();

  /** A tiny drawing surface with pixel-level ops. */
  class Surface {
    constructor(w, h) {
      this.w = w; this.h = h;
      this.c = document.createElement('canvas');
      this.c.width = w; this.c.height = h;
      this.g = this.c.getContext('2d');
      this.g.imageSmoothingEnabled = false;
    }
    px(x, y, col) { this.g.fillStyle = col; this.g.fillRect(x | 0, y | 0, 1, 1); }
    rect(x, y, w, h, col) { this.g.fillStyle = col; this.g.fillRect(x | 0, y | 0, w, h); }
    /** Filled pixel ellipse (cx,cy center; rx,ry radii). */
    ellipse(cx, cy, rx, ry, col) {
      this.g.fillStyle = col;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / (rx + 0.5), dy = (y + 0.5 - cy) / (ry + 0.5);
          if (dx * dx + dy * dy <= 1) this.g.fillRect(x, y, 1, 1);
        }
      }
    }
    /** Ellipse ring segment used for shading crescents. */
    shadeEllipse(cx, cy, rx, ry, col, side = 1, thickness = 0.35) {
      this.g.fillStyle = col;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / (rx + 0.5), dy = (y + 0.5 - cy) / (ry + 0.5);
          const d = dx * dx + dy * dy;
          if (d <= 1 && d >= 1 - thickness && (side > 0 ? (dx + dy) > 0.15 : (dx + dy) < -0.15)) {
            this.g.fillRect(x, y, 1, 1);
          }
        }
      }
    }
    line(x1, y1, x2, y2, col) {
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) || 1;
      for (let i = 0; i <= steps; i++) {
        this.px(Math.round(U.lerp(x1, x2, i / steps)), Math.round(U.lerp(y1, y2, i / steps)), col);
      }
    }
    /** Auto-trace: adds a 1px outline around every opaque region. */
    outline(col = OUTLINE) {
      const img = this.g.getImageData(0, 0, this.w, this.h);
      const d = img.data;
      const solid = (x, y) => x >= 0 && y >= 0 && x < this.w && y < this.h && d[(y * this.w + x) * 4 + 3] > 40;
      const out = [];
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          if (!solid(x, y) && (solid(x + 1, y) || solid(x - 1, y) || solid(x, y + 1) || solid(x, y - 1))) {
            out.push([x, y]);
          }
        }
      }
      for (const [x, y] of out) this.px(x, y, col);
    }
  }

  /** Build (or fetch cached) sprite. key must be unique per variant. */
  function sprite(key, w, h, drawFn) {
    if (cache.has(key)) return cache.get(key);
    const s = new Surface(w, h);
    drawFn(s);
    cache.set(key, s.c);
    return s.c;
  }

  /** Blit a cached sprite scaled, centered on (x, y-bottom anchored). */
  function blit(ctx, img, x, y, scale = CONFIG.PIXEL_SCALE, flipX = false, squashY = 1, squashX = 1) {
    const w = img.width * scale * squashX, h = img.height * scale * squashY;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flipX) ctx.scale(-1, 1);
    ctx.drawImage(img, Math.round(-w / 2), Math.round(-h), Math.round(w), Math.round(h));
    ctx.restore();
  }

  return { Surface, sprite, blit, OUTLINE, cache };
})();
</script>
<script>
/**
 * PixelFont — the game's global text engine, rendering the embedded
 * "Press Start 2P" typeface (assets/fonts/PressStart2P-Regular.ttf), the
 * exact font used by the Figma designs (single source of truth).
 *
 * Font metrics (parsed from the TTF): unitsPerEm 1000, ascent 1000,
 * descent 0 — the baseline sits exactly 1em below the glyph-box top, and
 * the font is strictly monospaced with advance = 1em. This makes layout
 * fully deterministic: measure(text, size) = text.length * size, and
 * draw(x, y, size) places the glyph em-box top at y (baseline at y + size),
 * mirroring how Figma positions text nodes.
 *
 * - Sizes are in canvas px and may be fractional (Figma px / 2), snapped
 *   to 0.5 so they land on whole device pixels at the 2x render scale.
 * - SIZE tiers define the visual hierarchy: TITLE > SUBTITLE > BUTTON/BODY > CAPTION.
 * - fit / truncate / wrap keep text inside fixed-width containers: fitting
 *   first steps the size down, then falls back to an '…' ellipsis.
 */
const PixelFont = (() => {
  const FAMILY = 'Press Start 2P';

  // Typography scale (canvas px = Figma px / 2, from the Figma file).
  const SIZE = {
    TITLE: 17,      // screen titles (loading, discovery, reward ad) — Figma 34px
    SUBTITLE: 15,   // popup / panel titles
    BUTTON: 10,     // interactive button labels — Figma 20px
    BODY: 10,       // primary inline text (names, values, counters)
    CAPTION: 7.5,   // secondary text (stat lines, flavor, hints) — Figma 15px
  };

  // ---------------- font loading ----------------
  let loaded = false;
  const ready = (typeof FontFace !== 'undefined' && typeof document !== 'undefined')
    ? new FontFace(FAMILY, "url('assets/fonts/PressStart2P-Regular.ttf')")
        .load()
        .then(face => { document.fonts.add(face); loaded = true; })
        .catch(() => { loaded = true; })
    : Promise.resolve();

  // ---------------- sizing ----------------
  /** Snap any requested size to the 0.5px grid (whole device pixels at 2x). */
  function snap(size) {
    return Math.max(2, Math.round(size * 2) / 2);
  }

  /** Pixel width of text at this size (monospace: advance = 1em). */
  function measure(text, size) {
    return String(text).length * snap(size);
  }

  /** Line advance for stacked lines of this size. */
  function lineHeight(size) { return Math.round(snap(size) * 1.4); }

  /**
   * Largest 0.5-snapped size <= `size` whose text fits in maxWidth
   * (never below 5px — beyond that, truncate instead).
   */
  function fit(text, size, maxWidth) {
    const n = String(text).length || 1;
    const px = Math.min(snap(size), Math.floor((maxWidth / n) * 2) / 2);
    return Math.max(5, px);
  }

  /** Truncate with an '…' ellipsis so text fits in maxWidth at this size. */
  function truncate(text, size, maxWidth) {
    let t = String(text);
    if (measure(t, size) <= maxWidth) return t;
    while (t.length > 1 && measure(t + '…', size) > maxWidth) t = t.slice(0, -1);
    return t.trimEnd() + '…';
  }

  /** Word-wrap text into lines that each fit maxWidth at this size. */
  function wrap(text, size, maxWidth) {
    const words = String(text).split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const cand = line ? line + ' ' + word : word;
      if (line && measure(cand, size) > maxWidth) {
        lines.push(line);
        line = word;
      } else {
        line = cand;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------------- rendering ----------------
  function setFont(ctx, px) {
    ctx.font = px + 'px "' + FAMILY + '"';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  /**
   * Draw one line of text. (x, y) is the glyph em-box top-left (baseline is
   * at y + size, matching Figma's text node top + half-leading).
   * align: 'left' | 'center' | 'right'; outline adds a dark border,
   * shadow a soft drop. maxWidth (optional) is the container safety net:
   * the size steps down to fit, then the text is ellipsis-truncated.
   * Returns the rendered width.
   */
  function draw(ctx, text, x, y, size = SIZE.BODY, col = '#fff', align = 'left',
                outline = false, shadow = false, maxWidth = 0) {
    let t = String(text).toUpperCase();
    let px = snap(size);
    if (maxWidth > 0) {
      px = fit(t, px, maxWidth);
      if (measure(t, px) > maxWidth) t = truncate(t, px, maxWidth);
    }
    const w = measure(t, px);
    let dx = x;
    if (align === 'center') dx = x - w / 2;
    if (align === 'right') dx = x - w;
    dx = Math.round(dx * 2) / 2;
    const by = Math.round((y + px) * 2) / 2;   // baseline
    setFont(ctx, px);
    if (outline) {
      const o = Math.max(1, Math.round(px / 8));
      ctx.fillStyle = PIXEL.OUTLINE;
      for (const [ox, oy] of [[-o, 0], [o, 0], [0, -o], [0, o], [-o, -o], [o, -o], [-o, o], [o, o]]) {
        ctx.fillText(t, dx + ox, by + oy);
      }
    } else if (shadow) {
      const o = Math.max(1, Math.round(px / 8));
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(t, dx + o, by + o);
    }
    ctx.fillStyle = col;
    ctx.fillText(t, dx, by);
    return w;
  }

  /**
   * Draw auto-wrapped text (up to maxLines, last line ellipsis-truncated).
   * Returns the y just below the last rendered line.
   */
  function drawWrapped(ctx, text, x, y, size, col, align, maxWidth, maxLines = 2,
                       outline = false, shadow = false) {
    const px = snap(size);
    let lines = wrap(text, px, maxWidth);
    if (lines.length > maxLines) {
      const rest = lines.slice(maxLines - 1).join(' ');
      lines = lines.slice(0, maxLines - 1);
      lines.push(truncate(rest, px, maxWidth));
    }
    const lh = lineHeight(px);
    for (let i = 0; i < lines.length; i++) {
      draw(ctx, lines[i], x, y + i * lh, px, col, align, outline, shadow);
    }
    return y + lines.length * lh;
  }

  return { FAMILY, SIZE, ready, snap, measure, lineHeight, fit, truncate, wrap, draw, drawWrapped,
           get loaded() { return loaded; } };
})();
</script>

    alienCow: '#b2e9dd', alienCowShade: '#7cbcab', alienHoof: '#4d8878',

  // ============================================================
  //  ANIMALS
  // ============================================================

  /** Eye helper: white + pupil (+ optional blink). */
  function eye(s, x, y, blink) {
    if (blink) { s.rect(x, y + 1, 2, 1, P.pupil); return; }
    s.rect(x, y, 2, 2, P.eyeWhite);
    s.px(x + 1, y + 1, P.pupil);
    s.px(x + 1, y, P.pupil);
  }
  function smallEye(s, x, y, blink) {
    if (blink) { s.px(x, y, P.pupil); return; }
    s.px(x, y, P.eyeWhite); s.px(x + 1, y, P.pupil);
  }
  /** Mutant glowing eye: toxic-green iris with bright core. */
  function glowEye(s, x, y, blink) {
    if (blink) { s.rect(x, y + 1, 2, 1, P.glowDk); return; }
    s.rect(x, y, 2, 2, P.glow);
    s.px(x + 1, y, P.glowHi);
    s.px(x, y + 1, P.glowDk);
  }
  function smallGlowEye(s, x, y, blink) {
    if (blink) { s.px(x, y, P.glowDk); return; }
    s.px(x, y, P.glowHi); s.px(x + 1, y, P.glow);
  }
  /** Bulging oversized eye: the first thing that goes wrong on a chicken. */
  function bigEye(s, x, y, blink) {
    if (blink) { s.rect(x + 1, y + 2, 3, 1, P.pupil); return; }
    s.ellipse(x + 1.5, y + 1.5, 2, 2, P.eyeWhite);
    s.rect(x + 2, y + 1, 2, 2, P.pupil);
    s.px(x + 1, y + 1, P.eyeWhite);
  }

  // ----------------- CHICKEN -----------------
  /**
   * Farm 1's six board stages, one continuous lineage:
   *   0 BABY     round yellow puff
   *   1 TEEN     the same chick grown gangly — long legs, oversized feet,
   *              half-grown feathers coming in white over the yellow
   *   2 ADULT    the standard farm hen the teen was heading towards
   *   3 STRANGE  that hen, subtly wrong: bulging eyes, a giraffe neck,
   *              mismatched legs, plumage drifted off-color
   *   4 MUTANT   openly mutated: eyes budding where they shouldn't, an extra
   *              wing, a toothy grin, discolored patches, warped proportions
   *   5 MUTANT 2 chaos: a second head, four spindly legs, duplicated wings,
   *              tumor growths, the first glowing details
   * Every stage keeps the one before it readable inside it — comb, beak,
   * wattle and wing never leave, they only warp.
   */
  function drawChicken(s, stage, frame, blink) {
    const walk = frame === 'walk', peck = frame === 'peck';
    if (stage === 0) {
      // BABY CHICK 18x16 — round yellow puff, big eyes
      const hy = peck ? 2 : 0;
      // legs
      s.line(7, 13, 7, 15, P.leg); s.line(11 + (walk ? 1 : 0), 13, 11 + (walk ? 1 : 0), 15, P.leg);
      s.px(6, 15, P.leg); s.px(12 + (walk ? 1 : 0), 15, P.leg);
      // body+head blob
      s.ellipse(9, 8 + hy * 0.4, 6, 6, P.chickBody);
      s.shadeEllipse(9, 8 + hy * 0.4, 6, 6, P.chickShade, 1, 0.4);
      s.ellipse(7, 5 + hy * 0.3, 2.5, 2, P.chickLight);
      // tail nub
      s.px(3, 7, P.chickShade); s.px(2, 8, P.chickShade);
      // wing
      s.ellipse(7, 10 + hy * 0.4, 2.5, 2, P.chickShade);
      // beak
      s.px(15, 7 + hy, P.beak); s.px(16, 7 + hy, P.beak); s.px(15, 8 + hy, P.beakShade);
      // comb tuft
      s.px(9, 1 + hy, P.chickShade); s.px(10, 1 + hy, P.chickShade);
      eye(s, 11, 5 + hy, blink);
      s.px(13, 8 + hy, P.blush);
    } else if (stage === 1) {
      // TEEN 21x19 — the chick stretched out: gangly legs, oversized feet,
      // a small comb starting and white adult feathers patching in
      const hy = peck ? 3 : 0;
      // long thin legs with big clumsy feet
      s.line(8, 12, 8, 16, P.leg); s.line(13 + (walk ? 1 : 0), 12, 13 + (walk ? 1 : 0), 16, P.leg);
      s.rect(6, 17, 4, 1, P.leg); s.rect(12 + (walk ? 1 : 0), 17, 4, 1, P.leg);
      // stray half-grown tail feathers
      s.px(3, 7, P.henShade); s.px(2, 6, P.henBody); s.px(3, 9, P.chickShade);
      // body — chick yellow with adult white coming in unevenly
      s.ellipse(9, 9, 5.5, 5, P.chickBody);
      s.shadeEllipse(9, 9, 5.5, 5, P.chickShade, 1, 0.38);
      s.ellipse(7, 7, 2.2, 1.8, P.henBody);
      s.px(11, 11, P.henBody); s.px(10, 12, P.henLight);
      // stubby wing, half feathered
      s.ellipse(8, 11, 2.6, 2, P.chickShade);
      s.px(9, 10, P.henBody);
      // head on a thin new neck
      s.rect(12, 7 + hy, 3, 3, P.chickBody);
      s.ellipse(14, 5 + hy, 3.2, 3, P.chickBody);
      s.ellipse(13, 4 + hy, 1.4, 1.2, P.chickLight);
      // the comb, only just started
      s.px(13, 1 + hy, P.comb); s.px(14, 1 + hy, P.comb); s.px(14, 2 + hy, P.combShade);
      // beak
      s.rect(17, 5 + hy, 2, 1, P.beak); s.px(17, 6 + hy, P.beakShade);
      eye(s, 15, 4 + hy, blink);
    } else if (stage === 2) {
      // ADULT HEN 24x22 — white body, red comb, tail feathers
      const hy = peck ? 3 : 0;
      s.line(9, 18, 9, 21, P.leg); s.line(14 + (walk ? 1 : 0), 18, 14 + (walk ? 1 : 0), 21, P.leg);
      s.px(8, 21, P.leg); s.px(10, 21, P.leg); s.px(13 + (walk ? 1 : 0), 21, P.leg); s.px(15 + (walk ? 1 : 0), 21, P.leg);
      // tail
      s.ellipse(4, 8, 3, 4, P.henShade);
      s.ellipse(4, 6, 2, 2.5, P.henBody);
      // body
      s.ellipse(11, 13, 7, 6, P.henBody);
      s.shadeEllipse(11, 13, 7, 6, P.henShade, 1, 0.38);
      // head
      s.ellipse(17, 6 + hy, 4, 4, P.henBody);
      s.ellipse(15.5, 4.5 + hy, 1.8, 1.5, P.henLight);
      s.rect(14, 8 + hy, 5, 5, P.henBody); // neck join
      // wing
      s.ellipse(10, 14, 4, 3, P.henShade);
      s.ellipse(10, 13, 3, 2, P.henBody);
      // comb
      s.px(16, 1 + hy, P.comb); s.px(17, 0 + hy, P.comb); s.px(18, 1 + hy, P.comb);
      s.rect(16, 2 + hy, 3, 1, P.comb); s.px(17, 2 + hy, P.combShade);
      // beak + wattle
      s.rect(21, 6 + hy, 2, 1, P.beak); s.px(21, 7 + hy, P.beakShade);
      s.px(20, 8 + hy, P.comb); s.px(20, 9 + hy, P.combShade);
      eye(s, 18, 4 + hy, blink);
    } else if (stage === 3) {
      // STRANGE 28x26 — still plainly the adult hen, but every proportion is
      // slightly wrong: an absurd neck, mismatched legs, bulging eyes and
      // plumage that has drifted off-color. Nothing is duplicated yet.
      const hy = peck ? 4 : 0;
      // mismatched legs: one long and thin, one short and thick
      s.line(10, 19, 10, 24, P.leg); s.rect(9, 25, 3, 1, P.leg);
      s.rect(15 + (walk ? 1 : 0), 21, 2, 4, P.leg); s.rect(15 + (walk ? 1 : 0), 25, 3, 1, P.leg);
      // limp off-color tail plume, clear of the body behind it
      s.ellipse(3, 14, 3, 4, P.strangeShade);
      s.ellipse(2, 11, 2, 2.4, P.strangeBody);
      // body
      s.ellipse(11, 17, 7, 6, P.strangeBody);
      s.shadeEllipse(11, 17, 7, 6, P.strangeShade, 1, 0.36);
      // wing
      s.ellipse(10, 18, 4, 3, P.strangeShade);
      s.ellipse(10, 17, 3, 2, P.strangeBody);
      // giraffe neck
      s.rect(15, 5 + hy, 4, 12 - hy, P.strangeBody);
      s.rect(18, 5 + hy, 1, 12 - hy, P.strangeShade);
      // small head perched on top of it
      s.ellipse(19, 5 + hy, 4, 3.5, P.strangeBody);
      s.ellipse(18, 3.5 + hy, 1.6, 1.2, P.strangeLight);
      // comb, beak, wattle — all still the hen's
      s.px(15, 1 + hy, P.comb); s.px(16, 0 + hy, P.comb); s.px(17, 1 + hy, P.comb);
      s.rect(15, 2 + hy, 3, 1, P.comb); s.px(16, 2 + hy, P.combShade);
      s.rect(23, 5 + hy, 3, 1, P.beak); s.px(23, 6 + hy, P.beakShade);
      s.px(22, 7 + hy, P.comb); s.px(22, 8 + hy, P.combShade);
      // one enormous bulging eye, swollen straight out of the head
      bigEye(s, 19, 1 + hy, blink);
    } else if (stage === 4) {
      // MUTANT 32x30 — openly wrong: eyes budding off the head, an extra
      // wing sprouting over the back, a toothy grin under the beak and
      // discolored patches across warped proportions. Still one head.
      const hy = peck ? 4 : 0;
      // legs, still mismatched — the short one has thickened further
      s.line(11, 22, 11, 28, P.leg); s.rect(10, 29, 3, 1, P.leg);
      s.rect(17 + (walk ? 1 : 0), 24, 3, 5, P.leg); s.rect(17 + (walk ? 1 : 0), 29, 3, 1, P.leg);
      // tail plume behind the body, with the first purple growth on it
      s.ellipse(3, 16, 3.5, 4.5, P.strangeShade);
      s.ellipse(2, 11, 2.2, 2.6, P.purple);
      s.px(2, 9, P.purpleHi);
      // body, patchy and discolored
      s.ellipse(13, 20, 8, 7, P.strangeBody);
      s.shadeEllipse(13, 20, 8, 7, P.strangeShade, 1, 0.34);
      s.ellipse(15, 22, 2.6, 2, P.purpleDk);
      s.ellipse(10, 18, 2, 1.6, P.henBody);
      // the EXTRA wing, sprouted over the back, above the normal one
      s.ellipse(16, 16, 3.4, 2.6, P.strangeShade);
      s.ellipse(16, 15.5, 2.6, 1.8, P.strangeBody);
      s.ellipse(11, 21, 4.5, 3.4, P.strangeShade);
      s.ellipse(11, 20, 3.6, 2.6, P.strangeBody);
      // thick warped neck
      s.rect(18, 7 + hy, 5, 12 - hy, P.strangeBody);
      s.rect(22, 7 + hy, 1, 12 - hy, P.strangeShade);
      // oversized head
      s.ellipse(22, 7 + hy, 5, 4.5, P.strangeBody);
      s.ellipse(20.5, 5 + hy, 2, 1.5, P.strangeLight);
      // the comb has gone purple
      s.px(18, 1 + hy, P.purple); s.px(20, 0 + hy, P.purple); s.px(22, 1 + hy, P.purple);
      s.rect(18, 2 + hy, 5, 2, P.purple);
      s.px(19, 2 + hy, P.purpleHi); s.px(21, 2 + hy, P.purpleHi);
      s.rect(19, 4 + hy, 3, 1, P.purpleDk);
      // beak, and an unsettling grin under it
      s.rect(27, 7 + hy, 3, 2, P.beak); s.px(27, 9 + hy, P.beakShade);
      s.rect(23, 10 + hy, 5, 1, P.combShade);
      s.px(24, 11 + hy, P.eyeWhite); s.px(26, 11 + hy, P.eyeWhite);
      // eyes in the wrong places: bulging off the head, then one down the
      // neck and one budding on the back
      bigEye(s, 23, 2 + hy, blink);
      eye(s, 19, 8 + hy, blink);
      eye(s, 18, 13 + hy, blink);
      smallEye(s, 12, 17, blink);
    } else {
      // MUTANT 2 36x34 — chaos: a SECOND head on its own crooked neck, FOUR
      // spindly legs (one already a tentacle), duplicated wings, tumor
      // growths and the first bioluminescence. Every feature of the stage
      // before it is still here, just doubled or distorted.
      const hy = peck ? 4 : 0;
      // four spindly legs, no two alike
      s.line(9, 25, 9, 32, P.leg); s.rect(8, 33, 3, 1, P.leg);
      s.line(14, 27, 14, 32, P.leg); s.rect(13, 33, 3, 1, P.leg);
      s.line(19 + (walk ? 1 : 0), 24, 19 + (walk ? 1 : 0), 32, P.leg);
      s.rect(18 + (walk ? 1 : 0), 33, 3, 1, P.leg);
      s.line(23, 27, 24, 32, P.tentacle); s.px(25, 33, P.tentacleHi);
      // tail plume behind the body, now lumpy
      s.ellipse(3, 19, 3.5, 4.5, P.strangeShade);
      s.ellipse(2, 14, 2.4, 2.8, P.purple); s.px(2, 12, P.purpleHi);
      s.ellipse(6, 24, 2, 1.8, P.purpleDk);
      // asymmetric body with tumor patches
      s.ellipse(14, 22, 9, 8, P.strangeBody);
      s.shadeEllipse(14, 22, 9, 8, P.strangeShade, 1, 0.34);
      s.ellipse(17, 25, 3, 2.2, P.purpleDk);
      s.ellipse(9, 19, 2.4, 1.8, P.henBody);
      // glowing chest blotch
      s.ellipse(17, 27, 2.4, 1.8, P.glowDk);
      s.px(17, 26, P.glow);
      // THREE wings where there should be one
      s.ellipse(11, 23, 4.6, 3.4, P.strangeShade); s.ellipse(11, 22, 3.6, 2.6, P.strangeBody);
      s.ellipse(16, 24, 3.4, 2.6, P.strangeShade); s.ellipse(16, 23.5, 2.6, 1.8, P.strangeBody);
      s.ellipse(17, 17, 3.4, 2.4, P.strangeShade); s.ellipse(17, 16.5, 2.6, 1.6, P.strangeBody);
      // SECOND head — smaller, crooked neck, beak pointing backwards
      s.rect(8, 12, 3, 6, P.strangeBody);
      s.ellipse(8, 10, 3.4, 3, P.strangeBody);
      s.px(4, 10, P.beak); s.px(3, 10, P.beak); s.px(4, 11, P.beakShade);
      s.px(7, 6, P.purple); s.px(9, 5, P.purple); s.rect(7, 7, 3, 1, P.purpleDk);
      glowEye(s, 6, 9, blink);
      // MAIN head, on the long neck
      s.rect(20, 8 + hy, 5, 12 - hy, P.strangeBody);
      s.rect(24, 8 + hy, 1, 12 - hy, P.strangeShade);
      s.ellipse(24, 8 + hy, 5.5, 5, P.strangeBody);
      s.ellipse(22, 5.5 + hy, 2, 1.6, P.strangeLight);
      // tall purple crest
      s.px(22, 1 + hy, P.purple); s.px(24, 0 + hy, P.purple); s.px(26, 1 + hy, P.purple);
      s.rect(22, 2 + hy, 6, 2, P.purple);
      s.px(23, 2 + hy, P.purpleHi); s.px(25, 2 + hy, P.purpleHi);
      s.rect(23, 4 + hy, 4, 1, P.purpleDk);
      // beak + the grin, both grown
      s.rect(29, 8 + hy, 3, 2, P.beak); s.px(29, 10 + hy, P.beakShade);
      s.rect(25, 11 + hy, 5, 1, P.combShade);
      s.px(26, 12 + hy, P.eyeWhite); s.px(28, 12 + hy, P.eyeWhite);
      // glowing eyes, on and off the head
      glowEye(s, 25, 5 + hy, blink);
      glowEye(s, 21, 8 + hy, blink);
      glowEye(s, 20, 14 + hy, blink);
      smallGlowEye(s, 12, 18, blink);
    }
  }

  // ----------------- SHEEP -----------------
  /** Wool cloud made of overlapping bumps. */
  function woolCloud(s, cx, cy, rx, ry, light, mid, shade) {
    s.ellipse(cx, cy, rx, ry, mid);
    const bumps = 7;
    for (let i = 0; i < bumps; i++) {
      const a = (i / bumps) * Math.PI * 2;
      s.ellipse(cx + Math.cos(a) * rx * 0.8, cy + Math.sin(a) * ry * 0.8, rx * 0.32, ry * 0.34, mid);
    }
    s.shadeEllipse(cx, cy + 1, rx + 1, ry + 1, shade, 1, 0.32);
    s.ellipse(cx - rx * 0.35, cy - ry * 0.4, rx * 0.4, ry * 0.35, light);
  }

  function drawSheep(s, stage, frame, blink) {
    const walk = frame === 'walk', graze = frame === 'peck';
    if (stage === 0) {
      // BABY 18x16 — dark little lamb with pale wool cap
      const hy = graze ? 2 : 0;
      s.line(7, 13, 7, 15, P.sheepFace); s.line(12 + (walk ? 1 : 0), 13, 12 + (walk ? 1 : 0), 15, P.sheepFace);
      woolCloud(s, 8, 9, 5, 4.5, P.woolDarkHi, P.woolDark, '#332619');
      // pale head
      s.ellipse(13, 7 + hy, 3.5, 3.5, P.woolMid);
      s.ellipse(12, 5.5 + hy, 1.5, 1.3, P.woolLight);
      // ears
      s.rect(10, 6 + hy, 2, 1, P.woolShade); s.px(15, 9 + hy, P.woolShade);
      eye(s, 13, 6 + hy, blink);
      s.px(15, 9 + hy, P.pupil); // nose
    } else if (stage === 1) {
      // ADULT 24x20 — cream wool cloud, dark face
      const hy = graze ? 3 : 0;
      s.line(8, 16, 8, 19, P.sheepFace); s.line(15 + (walk ? 1 : 0), 16, 15 + (walk ? 1 : 0), 19, P.sheepFace);
      woolCloud(s, 11, 10, 7.5, 6, P.woolLight, P.woolMid, P.woolShade);
      // dark face
      s.ellipse(19, 8 + hy, 4, 4, P.sheepFace);
      s.ellipse(18, 6.5 + hy, 1.6, 1.4, P.sheepFaceHi);
      // wool tuft on head
      s.ellipse(17, 4 + hy, 2.5, 1.8, P.woolLight);
      // ears
      s.rect(15, 7 + hy, 2, 2, P.sheepFaceHi);
      eye(s, 19, 7 + hy, blink);
      s.px(22, 10 + hy, P.pupil);
    } else if (stage === 2) {
      // ELDER 30x26 — mega fluff, purple curly horns, extra eyes
      const hy = graze ? 3 : 0;
      s.line(10, 21, 10, 25, P.sheepFace); s.line(19 + (walk ? 1 : 0), 21, 19 + (walk ? 1 : 0), 25, P.sheepFace);
      woolCloud(s, 14, 13, 10, 8.5, P.woolLight, P.woolMid, P.woolShade);
      // face
      s.ellipse(23, 10 + hy, 5, 5, P.sheepFace);
      s.ellipse(21.5, 8 + hy, 2, 1.8, P.sheepFaceHi);
      // wool crown
      s.ellipse(21, 4.5 + hy, 3.5, 2.4, P.woolLight);
      // purple curly horns
      s.ellipse(17, 5 + hy, 2.2, 2.2, P.purple);
      s.ellipse(17, 5 + hy, 1, 1, P.purpleDk);
      s.px(16, 3 + hy, P.purpleHi);
      s.ellipse(26, 4 + hy, 2.2, 2.2, P.purple);
      s.ellipse(26, 4 + hy, 1, 1, P.purpleDk);
      s.px(27, 2 + hy, P.purpleHi);
      // THREE eyes
      eye(s, 21, 9 + hy, blink);
      eye(s, 25, 9 + hy, blink);
      smallEye(s, 23, 12 + hy, blink);
      s.px(27, 13 + hy, P.pupil);
    } else {
      // MUTANT 36x32 — colossal fluff, FOUR horns, second face in the wool,
      // glowing eyes, tentacles poking out underneath
      const hy = graze ? 3 : 0;
      // five legs
      s.line(9, 26, 9, 31, P.sheepFace); s.line(15 + (walk ? 1 : 0), 26, 15 + (walk ? 1 : 0), 31, P.sheepFace);
      s.line(21, 26, 21, 31, P.sheepFace); s.line(26 + (walk ? 1 : 0), 26, 26 + (walk ? 1 : 0), 31, P.sheepFace);
      s.line(12, 27, 12, 31, P.sheepFace);
      // tentacles peeking from under the wool
      s.line(6, 25, 3, 22, P.tentacle); s.px(2, 21, P.tentacleHi);
      s.line(30, 26, 33, 24, P.tentacle); s.px(34, 23, P.tentacleHi);
      // colossal wool cloud
      woolCloud(s, 16, 16, 12, 10, P.woolLight, P.woolMid, P.woolShade);
      // strange glowing wool tufts
      s.px(9, 9, P.glow); s.px(10, 10, P.glowDk);
      s.px(22, 22, P.glow); s.px(14, 20, P.glowDk);
      // SECOND tiny face embedded in the wool
      s.ellipse(9, 14, 3, 3, P.sheepFace);
      s.px(8, 12.5, P.sheepFaceHi);
      glowEye(s, 8, 13, blink);
      s.px(11, 15, P.pupil);
      // main face
      s.ellipse(27, 12 + hy, 5.5, 5.5, P.sheepFace);
      s.ellipse(25, 9.5 + hy, 2.2, 2, P.sheepFaceHi);
      // wool crown
      s.ellipse(25, 5 + hy, 4, 2.6, P.woolLight);
      // FOUR purple curly horns
      s.ellipse(20, 6 + hy, 2.4, 2.4, P.purple);
      s.ellipse(20, 6 + hy, 1, 1, P.purpleDk); s.px(19, 4 + hy, P.purpleHi);
      s.ellipse(31, 5 + hy, 2.4, 2.4, P.purple);
      s.ellipse(31, 5 + hy, 1, 1, P.purpleDk); s.px(32, 3 + hy, P.purpleHi);
      s.ellipse(15, 4, 1.8, 1.8, P.purple);
      s.ellipse(15, 4, 0.8, 0.8, P.purpleDk);
      s.ellipse(34, 9 + hy, 1.6, 1.6, P.purple);
      s.px(34, 8 + hy, P.purpleHi);
      // THREE glowing eyes + nose
      glowEye(s, 25, 11 + hy, blink);
      glowEye(s, 29, 11 + hy, blink);
      smallGlowEye(s, 27, 14 + hy, blink);
      s.px(31, 15 + hy, P.pupil);

  }

  // ----------------- COW -----------------
  function cowPatches(s, spots) {
    for (const [x, y, rx, ry] of spots) {
      s.ellipse(x, y, rx, ry, P.cowPatch);
      s.px(x - 1, y - 1, P.cowPatchHi);
    }
  }
  function drawCow(s, stage, frame, blink) {
    const walk = frame === 'walk', graze = frame === 'peck';
    if (stage === 0) {
      // BABY CALF 18x16 — big head, tiny body
      const hy = graze ? 2 : 0;
      s.line(6, 13, 6, 15, P.cowShade); s.line(10 + (walk ? 1 : 0), 13, 10 + (walk ? 1 : 0), 15, P.cowShade);
      s.ellipse(8, 10, 5, 4, P.cowBody);
      s.shadeEllipse(8, 10, 5, 4, P.cowShade, 1, 0.4);
      cowPatches(s, [[6, 9, 1.6, 1.2]]);
      // big head
      s.ellipse(12, 6 + hy, 4.5, 4, P.cowBody);
      s.ellipse(11, 4.5 + hy, 1.8, 1.4, '#fbf0e0');
      cowPatches(s, [[10, 3.5 + hy, 1.4, 1]]);
      // ears
      s.rect(8, 4 + hy, 2, 2, P.cowShade); s.px(16, 5 + hy, P.cowShade);
      // muzzle
      s.ellipse(14, 8.5 + hy, 2.4, 1.6, P.muzzle);
      s.px(14, 8 + hy, P.pupil); s.px(16, 8 + hy, P.pupil);
      eye(s, 12, 4 + hy, blink);
      // tail
      s.px(3, 9, P.cowShade); s.px(2, 10, P.cowPatch);
    } else if (stage === 1) {
      // ADULT 26x22
      const hy = graze ? 3 : 0;
      s.line(9, 17, 9, 21, P.cowShade); s.line(16 + (walk ? 1 : 0), 17, 16 + (walk ? 1 : 0), 21, P.cowShade);
      s.rect(8, 21, 3, 1, P.cowShade); s.rect(15 + (walk ? 1 : 0), 21, 3, 1, P.cowShade);
      s.ellipse(12, 13, 8, 6, P.cowBody);
      s.shadeEllipse(12, 13, 8, 6, P.cowShade, 1, 0.36);
      cowPatches(s, [[8, 11, 2.4, 2], [15, 16, 2, 1.6]]);
      // head
      s.ellipse(19, 7 + hy, 5, 4.5, P.cowBody);
      s.ellipse(17.5, 5 + hy, 2, 1.6, '#fbf0e0');
      cowPatches(s, [[17, 4 + hy, 1.6, 1.2]]);
      // horns
      s.rect(15, 2 + hy, 2, 2, P.horn); s.px(15, 2 + hy, P.hornShade);
      s.rect(22, 2 + hy, 2, 2, P.horn); s.px(23, 2 + hy, P.hornShade);
      // ears
      s.rect(13, 6 + hy, 2, 2, P.cowShade);
      // muzzle
      s.ellipse(21.5, 10 + hy, 3, 2, P.muzzle);
      s.shadeEllipse(21.5, 10 + hy, 3, 2, P.muzzleShade, 1, 0.5);
      s.px(20, 10 + hy, P.pupil); s.px(23, 10 + hy, P.pupil);
      eye(s, 19, 5 + hy, blink);
      // tail
      s.px(4, 11, P.cowShade); s.px(3, 12, P.cowShade); s.px(3, 13, P.cowPatch);
    } else if (stage === 2) {
      // ELDER 32x28 — big horns, extra eyes, chaotic patches
      const hy = graze ? 3 : 0;
      s.line(11, 22, 11, 27, P.cowShade); s.line(20 + (walk ? 1 : 0), 22, 20 + (walk ? 1 : 0), 27, P.cowShade);
      s.rect(10, 27, 3, 1, P.cowShade); s.rect(19 + (walk ? 1 : 0), 27, 3, 1, P.cowShade);
      s.ellipse(14, 17, 10, 7.5, P.cowBody);
      s.shadeEllipse(14, 17, 10, 7.5, P.cowShade, 1, 0.34);
      cowPatches(s, [[8, 14, 3, 2.4], [18, 21, 2.6, 2], [14, 12, 2, 1.6]]);
      // head
      s.ellipse(23, 9 + hy, 6.5, 5.5, P.cowBody);
      s.ellipse(21, 6.5 + hy, 2.5, 2, '#fbf0e0');
      cowPatches(s, [[21, 5 + hy, 2, 1.4]]);
      // BIG curved horns
      s.rect(17, 3 + hy, 2, 3, P.horn); s.rect(16, 1 + hy, 2, 3, P.horn); s.px(16, 1 + hy, P.hornShade);
      s.rect(28, 3 + hy, 2, 3, P.horn); s.rect(29, 1 + hy, 2, 3, P.horn); s.px(30, 1 + hy, P.hornShade);
      // third tiny horn
      s.rect(23, 0 + hy, 1, 3, P.horn);
      // muzzle
      s.ellipse(26, 12.5 + hy, 3.6, 2.4, P.muzzle);
      s.shadeEllipse(26, 12.5 + hy, 3.6, 2.4, P.muzzleShade, 1, 0.5);
      s.px(24, 12 + hy, P.pupil); s.px(28, 12 + hy, P.pupil);
      // THREE eyes
      eye(s, 20, 7 + hy, blink);
      eye(s, 25, 7 + hy, blink);
      smallEye(s, 23, 10 + hy, blink);
      // tail
      s.px(4, 14, P.cowShade); s.px(3, 15, P.cowShade); s.px(3, 16, P.cowPatch);
    } else {
      // MUTANT 40x34 — FIVE horns, FOUR glowing eyes, purple mutant patches,
      // tentacle tail, an extra little leg
      const hy = graze ? 3 : 0;
      // legs (plus a stubby extra one in the middle)
      s.line(13, 27, 13, 33, P.cowShade); s.line(24 + (walk ? 1 : 0), 27, 24 + (walk ? 1 : 0), 33, P.cowShade);
      s.rect(12, 33, 3, 1, P.cowShade); s.rect(23 + (walk ? 1 : 0), 33, 3, 1, P.cowShade);
      s.line(18, 29, 18, 33, P.cowShade); s.rect(17, 33, 3, 1, P.cowShade);
      // tentacle tail
      s.line(6, 18, 3, 13, P.tentacle); s.line(3, 13, 5, 9, P.tentacle);
      s.px(5, 8, P.tentacleHi); s.px(3, 12, P.tentacleDk);
      s.px(6, 21, P.tentacle); s.px(5, 22, P.tentacleDk);
      // huge body
      s.ellipse(17, 21, 12, 9, P.cowBody);
      s.shadeEllipse(17, 21, 12, 9, P.cowShade, 1, 0.32);
      // chaotic patches — brown plus PURPLE mutant patches
      cowPatches(s, [[10, 17, 3.2, 2.6], [22, 26, 2.8, 2.2]]);
      s.ellipse(17, 15, 2.6, 2, P.purple); s.px(16, 14, P.purpleHi);
      s.ellipse(12, 24, 2.2, 1.8, P.purple); s.px(11, 23, P.purpleHi);
      // glowing patch
      s.ellipse(24, 17, 2, 1.6, P.glowDk); s.px(24, 16, P.glow);
      // head
      s.ellipse(29, 11 + hy, 7.5, 6.5, P.cowBody);
      s.ellipse(26.5, 8 + hy, 3, 2.4, '#fbf0e0');
      cowPatches(s, [[26, 6.5 + hy, 2.2, 1.6]]);
      // FIVE horns: two big curved pairs + tiny center horn
      s.rect(21, 4 + hy, 2, 4, P.horn); s.rect(20, 1 + hy, 2, 4, P.horn); s.px(20, 1 + hy, P.hornShade);
      s.rect(35, 4 + hy, 2, 4, P.horn); s.rect(36, 1 + hy, 2, 4, P.horn); s.px(37, 1 + hy, P.hornShade);
      s.rect(24, 2 + hy, 2, 3, P.horn); s.px(24, 2 + hy, P.hornShade);
      s.rect(32, 2 + hy, 2, 3, P.horn); s.px(33, 2 + hy, P.hornShade);
      s.rect(28, 0 + hy, 2, 3, P.horn);
      // ears
      s.rect(20, 8 + hy, 2, 2, P.cowShade);
      // muzzle with little fangs
      s.ellipse(32.5, 15 + hy, 4.2, 2.8, P.muzzle);
      s.shadeEllipse(32.5, 15 + hy, 4.2, 2.8, P.muzzleShade, 1, 0.5);
      s.px(30, 14.5 + hy, P.pupil); s.px(35, 14.5 + hy, P.pupil);
      s.px(30, 17 + hy, P.eyeWhite); s.px(34, 17 + hy, P.eyeWhite);
      // FOUR glowing eyes
      glowEye(s, 25, 9 + hy, blink);
      glowEye(s, 31, 9 + hy, blink);
      smallGlowEye(s, 28, 12 + hy, blink);
      smallGlowEye(s, 23, 12 + hy, blink);
    }
  }

  // One entry per BOARD stage of that species' chain (CONFIG.CHAINS), growing
  // steadily so each merge reads as a step up. The abducted final form is not
  // here — it has its own sprite (see mutant2()).
  const ANIMAL_SIZES = {
    chicken: [[18, 16], [21, 19], [24, 22], [28, 26], [32, 30], [36, 34]],
    sheep:   [[18, 16], [24, 20], [30, 26], [36, 32]],
    cow:     [[18, 16], [26, 22], [32, 28], [40, 34]],
  };
  const DRAWERS = { chicken: drawChicken, sheep: drawSheep, cow: drawCow };

  /** Get animal sprite canvas: species, board stage index, frame, blink. */
  function animal(species, stage, frame = 'idle', blink = false) {
    const [w, h] = ANIMAL_SIZES[species][stage];
    return PIXEL.sprite(`a:${species}:${stage}:${frame}:${blink ? 1 : 0}`, w + 2, h + 2, s => {
      s.g.translate(1, 1);
      DRAWERS[species](s, stage, frame, blink);
      s.g.translate(-1, -1);
      s.outline();
    });
  }

  // ============================================================
  //  ECONOMY SPRITES
  // ============================================================

  function poop(size = 0) {
    const d = 10 + size * 2;
    return PIXEL.sprite(`poop:${size}`, d + 2, d + 2, s => {
      const c = d / 2 + 1;
      s.ellipse(c, d - 2, d / 2 - 1, 2.4, P.poo);
      s.ellipse(c, d - 4.5, d / 2 - 2.5, 2.2, P.poo);
      s.ellipse(c, d - 6.5, d / 2 - 4, 1.8, P.poo);
      s.px(c, d - 8, P.poo);
      s.shadeEllipse(c, d - 2, d / 2 - 1, 2.4, P.pooDk, 1, 0.5);
      s.px(c - 2, d - 5, P.pooHi); s.px(c - 1, d - 7, P.pooHi);
      s.outline();
    });
  }

  function coin(size = 2) {  // size 0..3 like reference "coin assets"
    const d = [6, 8, 12, 16][size];
    return PIXEL.sprite(`coin:${size}`, d + 2, d + 2, s => {
      const c = d / 2 + 1, r = d / 2;
      s.ellipse(c, c, r, r, P.gold);
      s.shadeEllipse(c, c, r, r, P.goldDk, 1, 0.42);
      s.ellipse(c - r * 0.3, c - r * 0.35, r * 0.35, r * 0.3, P.goldHi);
      if (size >= 2) {
        s.ellipse(c, c, r - 2, r - 2, P.gold);
        // inner ring + face mark
        for (let a = 0; a < 16; a++) {
          const t = a / 16 * Math.PI * 2;
          s.px(Math.round(c + Math.cos(t) * (r - 1.6)), Math.round(c + Math.sin(t) * (r - 1.6)), P.goldDk);
        }
        s.rect(c - 1, c - r + 3, 2, d - 6, P.goldDk);
        s.px(c - r * 0.3 | 0, c - r * 0.35 | 0, P.goldHi);
      }
      s.outline();
    });
  }

  // ============================================================
  //  UFO / MUTANT 2 (end-game collection layer)
  // ============================================================

  /**
   * The chain's FINAL form — born from merging two of the last board stage
   * (Farm 1: the Final Chicken, hyper mutation). Built from scratch, sharing
   * no silhouette, pose, or feature set with the board stage below it: the
   * escalation is structural chaos — extra heads,
   * extra legs, eyes budding where they shouldn't, duplicated and
   * mismatched anatomy — while each still reads as the farm's animal.
   * On top of the chaos, the abduction changed them: every species swaps
   * its natural farm palette for its own alien skin (P.alien*) — sickly
   * bioluminescent green feathers, irradiated violet wool, spectral pale
   * hide — plus antennae with glowing tips. Earlier stages are untouched.
   * Bottom-anchored 30x28, blitted by the UFO exactly like the old alien.
   */
  function mutant2(species) {
    return PIXEL.sprite(`mut2:${species}`, 30, 28, s => {
      if (species === 'chicken') {
        // ABDUCTEE HYDRA CHICK — no yellow left on it: sickly biolumin-
        // escent green feathers, violet beaks, antennae with glowing tips.
        // THREE heads on necks of different heights, FOUR mismatched legs
        // (one is a tentacle), eyes budding on the body, one feathered
        // wing and one tentacle wing
        // four legs, no two alike
        s.line(8, 23, 8, 25, P.alienLeg); s.px(7, 26, P.alienLeg); s.px(9, 26, P.alienLeg);
        s.line(12, 23, 12, 27, P.alienLeg); s.px(11, 27, P.alienLeg); s.px(13, 27, P.alienLeg);
        s.line(18, 23, 18, 26, P.alienLeg); s.px(17, 27, P.alienLeg); s.px(19, 27, P.alienLeg);
        s.line(22, 23, 24, 26, P.tentacle); s.px(25, 27, P.tentacleHi); // tentacle leg
        // round body — irradiated speckles on the flank
        s.ellipse(15, 18, 8, 6, P.alienChick);
        s.shadeEllipse(15, 18, 8, 6, P.alienChickShade, 1, 0.36);
        s.ellipse(11, 15, 3, 2.2, P.alienChickHi);
        s.px(14, 16, P.alienChickHi); s.px(19, 18, P.alienChickHi);
        // one FEATHERED wing (left) ...
        s.ellipse(8, 18, 3, 4, P.alienChickShade);
        s.ellipse(8, 17, 2.2, 3, P.alienChick);
        // ... and one TENTACLE wing (right)
        s.line(22, 16, 26, 13, P.tentacle); s.line(26, 13, 27, 10, P.tentacle);
        s.px(27, 9, P.tentacleHi); s.px(25, 14, P.tentacleDk);
        // stray eyes budding on the body
        smallGlowEye(s, 12, 20, false);
        smallGlowEye(s, 18, 19, false);
        s.px(15, 22, P.glowDk); s.px(16, 22, P.glow);
        // CENTER head — big, tall neck, TWIN ANTENNAE, two glowing eyes
        s.rect(13, 8, 4, 5, P.alienChick);
        s.ellipse(15, 5, 4.5, 4, P.alienChick);
        s.shadeEllipse(15, 5, 4.5, 4, P.alienChickShade, 1, 0.3);
        s.px(13, 1, P.purple); s.px(13, 0, P.glowHi);   // left antenna, glowing tip
        s.px(17, 1, P.purple); s.px(17, 0, P.glowHi);   // right antenna, glowing tip
        s.rect(13, 6, 4, 2, P.alienBeak); s.px(14, 7, P.alienBeakShade);
        glowEye(s, 12, 4, false); glowEye(s, 16, 4, false);
        // LEFT head — small, low neck, beak points left, ONE eye
        s.rect(7, 12, 3, 3, P.alienChick);
        s.ellipse(6, 10, 3.2, 2.8, P.alienChick);
        s.shadeEllipse(6, 10, 3.2, 2.8, P.alienChickShade, 1, 0.35);
        s.px(2, 10, P.alienBeak); s.px(1, 10, P.alienBeak); s.px(2, 11, P.alienBeakShade);
        s.px(5, 7, P.purpleDk); s.px(5, 6, P.glow);     // bent antenna
        glowEye(s, 5, 9, false);
        // RIGHT head — tiny, high crooked neck, THREE stacked eyes
        s.rect(21, 8, 2, 6, P.alienChick); s.rect(22, 6, 2, 4, P.alienChick);
        s.ellipse(24, 4, 3, 2.6, P.alienChick);
        s.shadeEllipse(24, 4, 3, 2.6, P.alienChickShade, 1, 0.35);
        s.px(28, 4, P.alienBeak); s.px(28, 5, P.alienBeakShade);
        s.px(24, 1, P.purple); s.px(24, 0, P.glowHi);   // antenna, glowing tip
        smallGlowEye(s, 22, 3, false); smallGlowEye(s, 25, 3, false);
        s.px(24, 5, P.glow);
      } else if (species === 'sheep') {
        // ABDUCTEE WOOL TOTEM WORM — irradiated violet wool over deep
        // teal skin, antennae on the top face. Three wool blobs stacked
        // askew, a face on EVERY segment, SIX caterpillar legs, one
        // giant oversized horn
        // six stubby legs in a row
        for (let i = 0; i < 6; i++) {
          const lx = 5 + i * 4;
          s.line(lx, 24, lx, 27, P.alienFace); s.px(lx - 1, 27, P.alienFace);
        }
        // BOTTOM segment — widest blob, face on its right side
        woolCloud(s, 15, 21, 10, 4.5, P.alienWoolLight, P.alienWoolMid, P.alienWoolShade);
        s.ellipse(23, 20, 3.2, 2.8, P.alienFace);
        s.px(22, 18.5, P.alienFaceHi);
        glowEye(s, 22, 19.5, false);
        s.px(25, 21, P.pupil); // nose
        // MIDDLE segment — shoved left, one big lonely eye
        woolCloud(s, 11, 14, 7.5, 4, P.alienWoolLight, P.alienWoolMid, P.alienWoolShade);
        s.ellipse(6, 13, 2.8, 2.6, P.alienFace);
        s.rect(5, 12, 3, 2, P.glow); s.px(6, 12, P.glowHi); s.px(6, 13, P.pupil);
        // TOP segment — shoved right, the "real" two-eyed face, twin
        // antennae with glowing tips
        woolCloud(s, 18, 7, 6, 3.6, P.alienWoolLight, P.alienWoolMid, P.alienWoolShade);
        s.ellipse(19, 7, 3.4, 2.8, P.alienFace);
        s.px(17.5, 5.5, P.alienFaceHi);
        s.px(17, 2, P.purple); s.px(17, 1, P.glowHi);   // left antenna
        s.px(21, 2, P.purpleDk); s.px(21, 1, P.glow);   // right antenna
        smallGlowEye(s, 17, 6.5, false); smallGlowEye(s, 21, 6.5, false);
        s.px(19, 9, P.pupil); // mouth
        // GIANT oversized curled horn bursting from the top-left
        s.ellipse(10, 4, 3.6, 3.6, P.purple);
        s.ellipse(10, 4, 1.8, 1.8, P.purpleDk);
        s.px(8, 1, P.purpleHi); s.px(12, 6, P.purple);
        // tiny mismatched nub horn top-right
        s.px(24, 3, P.purple); s.px(25, 4, P.purpleDk);
        // stray eyes + glowing tufts buried in the wool
        s.px(15, 16, P.glow); s.px(16, 16, P.pupil);
        s.px(9, 22, P.glowDk); s.px(4, 17, P.glow);
        s.px(21, 12, P.glowHi);
      } else {
        // ABDUCTEE TWIN-HEAD STAMPEDE — spectral pale-teal hide with an
        // irradiated green patch, ice-blue horns, antennae with glowing
        // tips. TWO unequal heads, an eye-stalk sprouting between them,
        // SIX legs, twin tentacle tails, and eyes budding on the flank
        // six legs with hooves
        for (let i = 0; i < 6; i++) {
          const lx = 6 + i * 3.6;
          s.line(lx, 22, lx, 26, P.alienCowShade);
          s.rect(lx - 1, 26, 3, 1, P.alienHoof);
        }

        s.ellipse(15, 18, 11, 5.5, P.alienCow);
        s.shadeEllipse(15, 18, 11, 5.5, P.alienCowShade, 1, 0.34);
        // patches: irradiated green left, one BIG purple blotch right
        s.ellipse(11, 17, 2.4, 1.8, P.glowDk); s.px(10, 16, P.glow);
        s.ellipse(20, 18, 3, 2.2, P.purple); s.px(19, 17, P.purpleHi);
        // eyes budding on the flank

        s.px(17, 21, P.glow); s.px(18, 21, P.pupil);
        // twin tentacle tails, curling apart
        s.line(4, 16, 1, 12, P.tentacle); s.px(1, 11, P.tentacleHi);
        s.line(5, 18, 2, 19, P.tentacleDk); s.px(1, 18, P.tentacle);
        // BIG head (left) — one huge up-swept horn, an antenna where the
        // other horn broke off
        s.rect(7, 9, 5, 6, P.alienCow);
        s.ellipse(9, 7, 5, 4.5, P.alienCow);
        s.shadeEllipse(9, 7, 5, 4.5, P.alienCowShade, 1, 0.3);
        s.rect(3, 2, 2, 4, P.alienHorn); s.rect(5, 1, 2, 3, P.alienHorn); s.px(4, 1, P.alienHornShade); // huge horn
        s.px(13, 3, P.purple); s.px(13, 2, P.glowHi); // antenna, glowing tip
        glowEye(s, 6, 6, false); glowEye(s, 10, 6, false);
        s.px(8, 4, P.glow); // third pinprick eye
        s.ellipse(9, 10, 3.4, 2, P.alienMuzzle);
        s.shadeEllipse(9, 10, 3.4, 2, P.alienMuzzleShade, 1, 0.5);
        s.px(8, 10, P.pupil); s.px(11, 10, P.pupil);
        // SMALL head (right) — half size, one tiny horn + one antenna
        s.rect(21, 11, 4, 4, P.alienCow);
        s.ellipse(23, 9, 3.4, 3, P.alienCow);
        s.shadeEllipse(23, 9, 3.4, 3, P.alienCowShade, 1, 0.35);
        s.px(20, 5, P.alienHorn); s.px(26, 5, P.purple); s.px(26, 4, P.glowHi);
        glowEye(s, 22, 8, false);
        s.ellipse(23, 11, 2, 1.4, P.alienMuzzle);
        s.px(22, 11, P.pupil); s.px(24, 11, P.pupil);
        // eye-stalk sprouting between the heads
        s.line(16, 10, 16, 4, P.tentacle); s.px(16, 5, P.tentacleDk);
        s.rect(15, 2, 3, 2, P.glow); s.px(16, 2, P.glowHi); s.px(16, 3, P.pupil);
      }
      s.outline();
    });
  }

  /**
   * Pixel UFO saucer. phase (0-2) animates the rim lights; aliens (capped
   * at 3 shown) puts collected passengers behind the glass dome.
   */
  function ufo(phase = 0, aliens = 0) {
    const shown = Math.min(aliens, 3);
    return PIXEL.sprite(`ufo:${phase}:${shown}`, 44, 26, s => {
      // glass dome
      s.ellipse(22, 10, 9, 7.5, '#9adcf0');
      s.shadeEllipse(22, 10, 9, 7.5, '#5aa8c8', 1, 0.35);
      s.ellipse(18, 6.5, 3.5, 2.5, '#d8f4fc');
      // collected aliens peeking through the dome
      if (shown >= 1) {
        s.ellipse(21, 9, 2.4, 2.2, P.glow);
        s.px(20, 9, P.pupil); s.px(22, 9, P.pupil);
      }
      if (shown >= 2) {
        s.ellipse(26, 10.5, 2, 1.8, P.glow);
        s.px(25, 10, P.pupil); s.px(27, 10, P.pupil);
